# A6000 (48GB) budget-sweep train — scene 00c1e4eb, 10M gaussians / 160000 steps.
# Public us-west A6000 (10M/12M gaussians OOM a 24GB 3090; A6000 has 48GB).
# Base recipe = /avl-west/nre_overlays/car2sim_6cam_static.yaml (car2sim static layers);
# budget set via CLI overrides. T_max scaled to full steps. Jitter fix is baked at
# convert (ncore already reref'd: nurec_origin_offset.json present in the clip).
apiVersion: batch/v1
kind: Job
metadata: { name: navsafe-20s-tr-a6000-10m-160k-00c1e4eb, namespace: cogrob, labels: { batch: navsafe-20s, stage: train-budget-a6000 } }
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 259200
  template:
    metadata: { labels: { batch: navsafe-20s, stage: train-budget-a6000 } }
    spec:
      restartPolicy: Never
      imagePullSecrets: [{ name: ngc-pull }]
      containers:
        - name: train
          image: nvcr.io/nvidia/nre/nre-ga@sha256:6e0caa70a9148490552520c3dde9ee665c8d094ca10b814601cb8bb306567c90
          imagePullPolicy: IfNotPresent
          command: ["/opt/nvidia/nvidia_entrypoint.sh", "bash", "-c"]
          args:
            - |
              set -e
              C=00c1e4eb4a045f20; ROOT=/avl-west/navsafe-20s
              STEPS=160000; GAUSS=10000000; ENDDEN=140000; OUT=$ROOT/training-a6000-10M-160k
              nvidia-smi --query-gpu=name,memory.total --format=csv,noheader || true
              CLIPDIR=$ROOT/ncore/$C/clips/$C
              CFGDIR=/app/internal/scripts/pycena/runtime/pycena_nrm_full.runfiles/_main/configs/apps/prod/Hyperion-8.1
              cp /avl-west/nre_overlays/car2sim_6cam_static.yaml "$CFGDIR/"
              ( cd "$CLIPDIR" && for f in $C.aux.*.zarr.itar; do ln -sf "$f" "pai_$f"; done )
              OV="dataset.n_samples_per_epoch=$STEPS                 model.strategy.add.max_n_gaussians=$GAUSS                 model.strategy.add.end_iteration=$ENDDEN                 model.strategy.relocate.end_iteration=$ENDDEN                 model.strategy.perturb.end_iteration=$STEPS                 system.optimizers.0.scheduler.args.T_max=$STEPS                 checkpoint.every_n_train_steps=40000"
              COMMON="--config-name=configs/apps/prod/Hyperion-8.1/car2sim_6cam_static.yaml mode=train logger=dummy                 dataset.path=$CLIPDIR/pai_$C.json out_dir=$OUT logger.run_id=$C dataset.aux_data=True                 dataset.camera_ids=[camera_pcam_f0,camera_pcam_b0,camera_pcam_l0,camera_pcam_l1,camera_pcam_l2,camera_pcam_r0,camera_pcam_r1,camera_pcam_r2]                 dataset.train_camera_ids=[camera_pcam_f0,camera_pcam_b0,camera_pcam_l0,camera_pcam_l1,camera_pcam_l2,camera_pcam_r0,camera_pcam_r1,camera_pcam_r2]                 dataset.val_camera_ids=[camera_pcam_f0,camera_pcam_b0,camera_pcam_l0,camera_pcam_l1,camera_pcam_l2,camera_pcam_r0,camera_pcam_r1,camera_pcam_r2]                 dataset.lidar_ids=[lidar_top_360fov] dataset.train_lidar_ids=[lidar_top_360fov] dataset.val_lidar_ids=[lidar_top_360fov]                 dataset.n_train_sample_lidar_rays=0 dataset.cuboid_tracks_params.track_label_sources=[GT_ANNOTATION]                 model.layers.dynamic_rigids.tracks.label_classes=[NuPlanBoxDetectionLabel.VEHICLE,NuPlanBoxDetectionLabel.BICYCLE]                 model.layers.dynamic_deformables.tracks.label_classes=[NuPlanBoxDetectionLabel.PEDESTRIAN]                 model.layers.dynamic_rigids.initialization.name=camera-dynamic-tracks +model.layers.dynamic_rigids.initialization.camera_ids=null +model.layers.dynamic_rigids.initialization.step_frame=1 +model.layers.dynamic_rigids.initialization.fill_with_random_points=true                 model.layers.dynamic_deformables.initialization.name=camera-dynamic-tracks +model.layers.dynamic_deformables.initialization.camera_ids=null +model.layers.dynamic_deformables.initialization.step_frame=1 +model.layers.dynamic_deformables.initialization.fill_with_random_points=true                 model.layers.road.initialization.name=lidar-rig-trajectory model.layers.road.initialization.default_scale=0.1                 +model.layers.road.initialization.num_near_points=100000 +model.layers.road.initialization.num_far_points=100000 +model.layers.road.initialization.far_radius_factor=20 +model.layers.road.initialization.observation_scale_factor=0.01                 +model.layers.road.initialization.lidar_ids=null +model.layers.road.initialization.camera_ids=null +model.layers.road.initialization.non_dynamic_points_only=true                 checkpoint.artifact.mesh.ground.enabled=false"
              echo "=== A6000 train STEPS=$STEPS GAUSS=$GAUSS ==="
              /app/run $COMMON $OV 2>&1 | tee /tmp/train.log | grep -iE "psnr|ssim|lpips|Epoch 0:.*100%|new count|Train elapsed|Relocated|error|OutOfMemory|CUDA out of memory" | tail -400
              test -f $OUT/$C/checkpoints/last.ckpt
              echo "TRAIN_DONE $C STEPS=$STEPS GAUSS=$GAUSS"
              echo "=== VAL METRICS ==="; grep -iE "psnr|ssim|lpips" /tmp/train.log | tail -25
              cp /tmp/train.log $OUT/$C/train.tail.log 2>/dev/null || true
          env:
            - { name: NGC_API_KEY, valueFrom: { secretKeyRef: { name: ngc-api-key, key: NGC_API_KEY } } }
            - { name: HYDRA_FULL_ERROR, value: "1" }
          resources:
            requests: { cpu: "2", memory: 32Gi, nvidia.com/gpu: "1", ephemeral-storage: 90Gi }
            limits:   { cpu: "2", memory: 32Gi, nvidia.com/gpu: "1", ephemeral-storage: 90Gi }
          volumeMounts:
            - { name: dshm, mountPath: /dev/shm }
            - { name: avl-west-vol, mountPath: /avl-west }
            - { name: hugsim-storage, mountPath: /hugsim-storage }
      volumes:
        - { name: dshm, emptyDir: { medium: Memory, sizeLimit: 32Gi } }
        - { name: avl-west-vol, persistentVolumeClaim: { claimName: avl-west-vol } }
        - { name: hugsim-storage, persistentVolumeClaim: { claimName: horuan-hugsim-vol } }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: nvidia.com/gpu.product, operator: In, values: ["NVIDIA-A100-80GB-PCIe","NVIDIA-A100-SXM4-80GB","NVIDIA-L40","NVIDIA-L40S","NVIDIA-A40","NVIDIA-RTX-A6000","NVIDIA-RTX-PRO-6000-Blackwell-Max-Q-Workstation-Edition"] }
                  - { key: topology.kubernetes.io/region, operator: In, values: ["us-west"] }
      tolerations:
        - { effect: NoSchedule, key: nautilus.io/hardware, operator: Equal, value: large-gpu }
