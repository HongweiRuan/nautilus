# STAGE 3/6 arrow — py123d Arrow scenario source (ego/boxes/map/route/TL) for eval.
# CPU-only (metabench image + persisted nuplan-conv venv). NavhardNuplanParser windows
# the log to [t0,t1] and renames it to the scene token (arrow log_name == recon clip id).
# Registered config: <hugsim py123d>/config/conversion/dataset/nuplan-navhard.yaml (seeded once);
# scenes overridden per-job. Writes /avl-west/navsafe/arrow/logs/nuplan_test/<token> + maps/.
# Placeholders: __SCENE__ token, __LOG__ db name, __T0__ __T1__ window µs.
apiVersion: batch/v1
kind: Job
metadata: { name: navsafe-arrow-__SCENE__, namespace: cogrob, labels: { batch: navsafe, stage: arrow } }
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 259200
  template:
    metadata: { labels: { batch: navsafe, stage: arrow } }
    spec:
      restartPolicy: Never
      containers:
        - name: arrow
          image: robinwangucsd/metabench:latest
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c"]
          args:
            - |
              set -ex
              C=__SCENE__; LOG=__LOG__; T0=__T0__; T1=__T1__
              # build the nuplan-conv venv into container-local storage each job (same
              # as convert; let pip resolve numpy 2 — nuplan-devkit 2.0.0 is numpy-2 clean).
              VENV=/root/cv
              python3 -m venv "$VENV"
              "$VENV/bin/pip" install -q --upgrade pip
              # build py123d from a container-LOCAL copy (concurrent jobs must not share
              # the PVC source build/ dir — that races).
              cp -a /hugsim-storage/py123d /root/py123d && rm -rf /root/py123d/build /root/py123d/*.egg-info
              "$VENV/bin/pip" install -q nuplan-devkit nvidia-ncore "/root/py123d[nuplan]"
              DST=/tmp/nuplan_local/nuplan-v1.1/splits/test; mkdir -p "$DST"
              cp -n /avl-west/nuplan/nuplan-v1.1/splits/test/$LOG.db "$DST/"
              PYTHONPATH=/hugsim-storage/NexusSim \
              PY123D_DATA_ROOT=/avl-west/navsafe/arrow \
                "$VENV/bin/py123d-conversion" dataset=nuplan-navhard \
                "dataset.parser.scenes=[[$LOG, $C, $T0, $T1]]"
              test -d /avl-west/navsafe/arrow/logs/nuplan_test/$C
              echo "ARROW_DONE $C"
          resources:
            requests: { cpu: "8", memory: "32Gi", ephemeral-storage: 40Gi }
            limits:   { cpu: "8", memory: "32Gi", ephemeral-storage: 40Gi }
          volumeMounts:
            - { name: avl-west-vol, mountPath: /avl-west }
            - { name: hugsim-storage, mountPath: /hugsim-storage }
      volumes:
        - { name: avl-west-vol, persistentVolumeClaim: { claimName: avl-west-vol } }
        - { name: hugsim-storage, persistentVolumeClaim: { claimName: horuan-hugsim-vol } }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - { matchExpressions: [{ key: topology.kubernetes.io/region, operator: In, values: ["us-west"] }] }
      tolerations:
        - { effect: NoSchedule, key: nautilus.io/reservation, operator: Equal, value: cogrob }
        - { effect: NoSchedule, key: nautilus.io/cogrob, operator: Exists }
