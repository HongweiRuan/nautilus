# STAGE 1/6 convert — raw nuPlan .db (10Hz) -> NCore V4 store, as a k8s Job.
# CPU-only (metabench image + the persisted /avl-west/navsafe/tools/nuplan-conv-venv).
# Writes /avl-west/navsafe/ncore/<token>/clips/<token>/pai_<token>.json + 8 cam + 1 lidar shard.
# Placeholders: __SCENE__ token, __LOG__ nuplan db name, __T0__ __T1__ window µs.
apiVersion: batch/v1
kind: Job
metadata: { name: navsafe-convert-__SCENE__, namespace: cogrob, labels: { batch: navsafe, stage: convert } }
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 259200
  template:
    metadata: { labels: { batch: navsafe, stage: convert } }
    spec:
      restartPolicy: Never
      containers:
        - name: convert
          image: robinwangucsd/metabench:latest
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c"]
          args:
            - |
              set -ex
              C=__SCENE__; LOG=__LOG__; T0=__T0__; T1=__T1__
              # build the nuplan-conv venv into CONTAINER-LOCAL storage each job (fast
              # overlay fs; NFS venv ops are pathologically slow). py123d non-editable
              # to avoid concurrent egg-info races on the shared source. Let pip resolve
              # a consistent set — nuplan-devkit 2.0.0 is numpy-2 clean (do NOT pin
              # numpy<2: it drags in a numpy-1.26 that lacks np.long, breaking scipy).
              VENV=/root/cv
              python3 -m venv "$VENV"
              "$VENV/bin/pip" install -q --upgrade pip
              # build py123d from a container-LOCAL copy: concurrent jobs must NOT share
              # the PVC source build/ dir (races: "could not delete build/lib/...").
              cp -a /hugsim-storage/py123d /root/py123d && rm -rf /root/py123d/build /root/py123d/*.egg-info
              "$VENV/bin/pip" install -q nuplan-devkit nvidia-ncore "/root/py123d[nuplan]"
              # network PVC read is ~8x slower — stage the db on local disk first.
              DST=/tmp/nuplan_local/nuplan-v1.1/splits/test; mkdir -p "$DST"
              cp -n /avl-west/nuplan/nuplan-v1.1/splits/test/$LOG.db "$DST/"
              NAVSAFE_NCORE_ROOT=/avl-west/navsafe/ncore \
              NUPLAN_DATA_ROOT=/tmp/nuplan_local \
              PYTHONPATH=/hugsim-storage/NexusSim \
                "$VENV/bin/python" /avl-west/navsafe/tools/scripts/1-convert_nuplan10hz.py "$C" "$LOG" "$T0" "$T1"
              test -f /avl-west/navsafe/ncore/$C/clips/$C/pai_$C.json
              echo "CONVERT_DONE $C"
          resources:
            requests: { cpu: "8", memory: "32Gi", ephemeral-storage: 40Gi }
            limits:   { cpu: "8", memory: "32Gi", ephemeral-storage: 40Gi }
          volumeMounts:
            - { name: avl-west-vol, mountPath: /avl-west }
            - { name: hugsim-storage, mountPath: /hugsim-storage }
      volumes:
        - { name: avl-west-vol, persistentVolumeClaim: { claimName: avl-west-vol } }
        - { name: hugsim-storage, persistentVolumeClaim: { claimName: horuan-hugsim-vol } }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - { matchExpressions: [{ key: topology.kubernetes.io/region, operator: In, values: ["us-west"] }] }
      tolerations:
        - { effect: NoSchedule, key: nautilus.io/reservation, operator: Equal, value: cogrob }
        - { effect: NoSchedule, key: nautilus.io/cogrob, operator: Exists }
