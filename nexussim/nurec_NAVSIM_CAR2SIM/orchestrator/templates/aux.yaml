# STAGE 2/6 aux — NuRec aux-data (sseg + ego-mask + lidar-camvis + lidar-sseg).
# GPU (nre-tools). Writes <token>.aux.*.zarr.itar beside the NCore shards.
# The aux->manifest symlink (pai_<token>.aux.*) is done in the train preamble.
# Placeholder: __SCENE__ token.
apiVersion: batch/v1
kind: Job
metadata: { name: navsafe-aux-__SCENE__, namespace: cogrob, labels: { batch: navsafe, stage: aux } }
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 259200
  template:
    metadata: { labels: { batch: navsafe, stage: aux } }
    spec:
      restartPolicy: Never
      imagePullSecrets: [{ name: ngc-pull }]
      containers:
        - name: nre-aux
          image: nvcr.io/nvidia/nre/nre-tools-ga@sha256:46d78256219a6541601fd16517c7edca3e7a6ec9634f1858f7977279bd98f9ff
          imagePullPolicy: IfNotPresent
          args:
            - ncore-aux-data
            - --dataset-path=/avl-west/navsafe/ncore/__SCENE__/clips/__SCENE__/pai___SCENE__.json
            - --output-dir=/avl-west/navsafe/ncore/__SCENE__/clips/__SCENE__
            - --segmentation-backend=mask2former
            - --zarr-store-type=itar
            - --store-meta
            - --lidar-seg-camvis
            - --ego-mask
          env:
            - { name: NGC_API_KEY, valueFrom: { secretKeyRef: { name: ngc-api-key, key: NGC_API_KEY } } }
            - { name: HYDRA_FULL_ERROR, value: "1" }
          resources:
            requests: { cpu: "2", memory: "12Gi", nvidia.com/gpu: "1", ephemeral-storage: 40Gi }
            limits:   { cpu: "2", memory: "12Gi", nvidia.com/gpu: "1", ephemeral-storage: 40Gi }
          volumeMounts:
            - { name: dshm, mountPath: /dev/shm }
            - { name: avl-west-vol, mountPath: /avl-west }
      volumes:
        - { name: dshm, emptyDir: { medium: Memory, sizeLimit: 4Gi } }
        - { name: avl-west-vol, persistentVolumeClaim: { claimName: avl-west-vol } }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: kubernetes.io/hostname, operator: In, values: ["ry-gpu-04.sdsc.optiputer.net","ry-gpu-06.sdsc.optiputer.net","ry-gpu-07.sdsc.optiputer.net","ry-gpu-11.sdsc.optiputer.net","ry-gpu-12.sdsc.optiputer.net","ry-gpu-13.sdsc.optiputer.net","ry-gpu-14.sdsc.optiputer.net"] }
                  - { key: nvidia.com/gpu.product, operator: In, values: ["NVIDIA-GeForce-RTX-3090"] }
      tolerations:
        - { effect: NoSchedule, key: nautilus.io/reservation, operator: Equal, value: cogrob }
        - { effect: NoSchedule, key: nautilus.io/cogrob, operator: Exists }
