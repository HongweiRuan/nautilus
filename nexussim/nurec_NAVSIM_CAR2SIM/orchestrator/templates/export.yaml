# STAGE 5/6 export — gaussian PLYs + per-frame actor tracks + usd-out/*.usdz
# (the artifact serve-grpc serves). Reads the trained run dir under training/<token>,
# writes usdz to /avl-west/navsafe/export/<token>/usd-out. GPU, ~10 min.
# Placeholder: __SCENE__ token.
apiVersion: batch/v1
kind: Job
metadata: { name: navsafe-export-__SCENE__, namespace: cogrob, labels: { batch: navsafe, stage: export } }
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 259200
  template:
    metadata: { labels: { batch: navsafe, stage: export } }
    spec:
      restartPolicy: Never
      imagePullSecrets: [{ name: ngc-pull }]
      containers:
        - name: nre-export
          image: nvcr.io/nvidia/nre/nre-ga@sha256:6e0caa70a9148490552520c3dde9ee665c8d094ca10b814601cb8bb306567c90
          imagePullPolicy: IfNotPresent
          command: ["/opt/nvidia/nvidia_entrypoint.sh", "bash", "-c"]
          args:
            - |
              set -e
              C=__SCENE__
              RD=/avl-west/navsafe/training/$C/$C
              OUT=/avl-west/navsafe/export/$C
              mkdir -p "$OUT"
              # Only usd-out/*.usdz is needed for serve/eval. plys + sequence-tracks
              # are auxiliary; a track re-assembly mismatch (NRE re-classifies ~2
              # borderline-speed tracks vs the checkpoint) shouldn't waste the whole
              # trained scene — keep them non-fatal, require only the usdz.
              /app/run export-gaussian-plys   --config-name $RD/config/parsed.yaml --checkpoint-name last.ckpt --output-dir $OUT/plys --format _3DGS || echo "WARN plys export failed (non-fatal)"
              /app/run export-sequence-tracks  --config-name $RD/config/parsed.yaml --checkpoint-path $RD/checkpoints/last.ckpt --output-dir $OUT --world-frame --format json || echo "WARN sequence-tracks export failed (non-fatal)"
              /app/run export-usdz-artifact    --config-name $RD/config/parsed.yaml --checkpoint-name last.ckpt --output-dir $OUT/usd-out
              test -n "$(ls $OUT/usd-out/*.usdz 2>/dev/null)"
              echo "EXPORT_DONE $C"; ls -la $OUT/usd-out/
          env:
            - { name: NGC_API_KEY, valueFrom: { secretKeyRef: { name: ngc-api-key, key: NGC_API_KEY } } }
            - { name: HYDRA_FULL_ERROR, value: "1" }
          resources:
            requests: { cpu: "2", memory: "16Gi", nvidia.com/gpu: "1", ephemeral-storage: 40Gi }
            limits:   { cpu: "2", memory: "16Gi", nvidia.com/gpu: "1", ephemeral-storage: 40Gi }
          volumeMounts:
            - { name: dshm, mountPath: /dev/shm }
            - { name: avl-west-vol, mountPath: /avl-west }
      volumes:
        - { name: dshm, emptyDir: { medium: Memory, sizeLimit: 24Gi } }
        - { name: avl-west-vol, persistentVolumeClaim: { claimName: avl-west-vol } }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: kubernetes.io/hostname, operator: In, values: ["ry-gpu-04.sdsc.optiputer.net","ry-gpu-06.sdsc.optiputer.net","ry-gpu-07.sdsc.optiputer.net","ry-gpu-11.sdsc.optiputer.net","ry-gpu-12.sdsc.optiputer.net","ry-gpu-13.sdsc.optiputer.net","ry-gpu-14.sdsc.optiputer.net"] }
                  - { key: nvidia.com/gpu.product, operator: In, values: ["NVIDIA-GeForce-RTX-3090"] }
      tolerations:
        - { effect: NoSchedule, key: nautilus.io/reservation, operator: Equal, value: cogrob }
        - { effect: NoSchedule, key: nautilus.io/cogrob, operator: Exists }
