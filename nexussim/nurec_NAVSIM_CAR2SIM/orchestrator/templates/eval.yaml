# STAGE 6/6 eval — closed-loop DrivoR eval, CO-LOCATED serve+eval on ONE 3090
# (NuRec serve-grpc in the background + IsaacSim/DrivoR rollout foreground, ~6.7GB
# combined VRAM). serve-grpc serves ONLY this scene's usdz. Scenario = py123d Arrow
# (nuplan_test 10Hz + nuPlan HD map). Writes /avl-west/navsafe/eval/<token>/out.
# Placeholder: __SCENE__ token.
#
# ns-venv: built per-job here (proven pattern). For the 421-scale run a persisted
# /avl-west/navsafe/tools/ns-venv (build-ns-venv.yaml) removes the ~20min uv-sync.
apiVersion: batch/v1
kind: Job
metadata: { name: navsafe-eval-__SCENE__, namespace: cogrob, labels: { batch: navsafe, stage: eval } }
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 259200
  template:
    metadata: { labels: { batch: navsafe, stage: eval } }
    spec:
      restartPolicy: Never
      imagePullSecrets: [{ name: ngc-pull }]
      containers:
        - name: eval
          image: nvcr.io/nvidia/nre/nre-ga@sha256:6e0caa70a9148490552520c3dde9ee665c8d094ca10b814601cb8bb306567c90
          imagePullPolicy: IfNotPresent
          command: ["/opt/nvidia/nvidia_entrypoint.sh", "bash", "-c"]
          args:
            - |
              set -e
              trap 'echo "=== serve-grpc log tail ==="; tail -50 /tmp/serve.log 2>/dev/null || true' EXIT
              C=__SCENE__
              # ---- 0) nre-ga is minimal: add git/curl + IsaacSim X11/GL libs + venv ----
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq && apt-get install -y -qq git curl python3-venv \
                libglu1-mesa libxt6 libgl1 libglx0 libegl1 libglib2.0-0 \
                libxrandr2 libxinerama1 libxcursor1 libxi6 libxext6 libxrender1 \
                libx11-6 libxfixes3 libxdamage1 libsm6 libice6 libgomp1
              # ---- 1) rollout venv on top of nre-ga (reuse persisted PVC venv if present) ----
              export PATH=$HOME/.local/bin:$HOME/.cargo/bin:$PATH UV_CACHE_DIR=/root/.cache/uv \
                     UV_PROJECT_ENVIRONMENT=/root/ns-venv VIRTUAL_ENV=/root/ns-venv
              export PYTHONPATH=/avl-west/nre_stubs:$PYTHONPATH
              # uv install is a fragile transient (pip/curl to PyPI+astral). Retry with
              # verification — a bare "uv: command not found" wastes the whole eval + its
              # ~20min IsaacSim setup on the retry.
              for i in 1 2 3 4; do
                command -v uv >/dev/null && break
                python -m pip install --quiet --user uv 2>/dev/null || pip install --quiet --user uv 2>/dev/null || curl -LsSf https://astral.sh/uv/install.sh | sh
                hash -r; command -v uv >/dev/null && break; sleep 15
              done
              command -v uv >/dev/null || { echo "FATAL: uv install failed after retries"; exit 1; }
              rm -rf /root/ns; git clone --quiet --no-hardlinks /hugsim-storage/NexusSim /root/ns
              # overlay UNCOMMITTED working-tree edits (navsim/nuplan integration lives there)
              ( cd /hugsim-storage/NexusSim && git ls-files -mo --exclude-standard ) | \
                while IFS= read -r f; do mkdir -p "/root/ns/$(dirname "$f")"; cp -a "/hugsim-storage/NexusSim/$f" "/root/ns/$f"; done
              cd /root/ns && echo "on: $(git log --oneline -1) + $( ( cd /hugsim-storage/NexusSim && git ls-files -mo --exclude-standard | wc -l ) ) dirty"
              if ! /root/ns-venv/bin/python -c "import isaacsim, isaaclab, nexussim" 2>/dev/null; then
                uv sync --all-extras --python 3.12
                [ -d /root/IsaacLab/.git ] || git clone --depth 1 --branch v3.0.0-beta https://github.com/isaac-sim/IsaacLab.git /root/IsaacLab
                for ext in isaaclab isaaclab_assets isaaclab_tasks isaaclab_rl isaaclab_mimic; do d=/root/IsaacLab/source/$ext; [ -d "$d" ] && uv pip install --python /root/ns-venv/bin/python --no-deps -e "$d"; done
                uv pip install --python /root/ns-venv/bin/python lazy_loader einops
              fi
              /root/ns-venv/bin/pip install --quiet grpcio protobuf 2>&1 | tail -1 || true
              # ---- 2) serve-grpc in the BACKGROUND, serving this scene's TRAIN-produced
              #    usdz. Training emits artifacts/last.usdz in-process (correct track
              #    count); the separate export stage re-reads the store and re-classifies
              #    ~2 borderline dynamic tracks differently => state_dict size mismatch on
              #    busy scenes. The train usdz is byte-equivalent and always present. ----
              CUDA_VISIBLE_DEVICES=0 /app/run serve-grpc --host 0.0.0.0 --enable-editing-actors --renderer default \
                --artifact-glob "/avl-west/navsafe/training/$C/$C/artifacts/last.usdz" > /tmp/serve.log 2>&1 &
              SERVE_PID=$!
              echo "waiting for serve-grpc on localhost:8080 ..."
              for i in $(seq 1 120); do
                if ! kill -0 $SERVE_PID 2>/dev/null; then echo "serve-grpc exited early"; tail -50 /tmp/serve.log; exit 1; fi
                if (exec 3<>/dev/tcp/localhost/8080) 2>/dev/null; then echo "serve-grpc up (after ${i}0s)"; break; fi
                sleep 10
              done
              # ---- 3) lean single-clip arrow data root, then the rollout ----
              DR=/tmp/py123d_arrow_$C
              rm -rf $DR; mkdir -p $DR/logs/nuplan_test
              ln -s /avl-west/navsafe/arrow/logs/nuplan_test/$C $DR/logs/nuplan_test/$C
              ln -s /avl-west/navsafe/arrow/maps $DR/maps
              OUT=/avl-west/navsafe/eval/$C/out; mkdir -p "$OUT"
              LD_PRELOAD=/usr/lib/x86_64-linux-gnu/libstdc++.so.6 CUDA_VISIBLE_DEVICES=0 ACCEPT_EULA=Y OMNI_KIT_ACCEPT_EULA=YES \
                NUREC_GRPC_HOST=localhost \
                /root/ns-venv/bin/python scripts/tools/eval_py123d.py \
                  --scenario-source py123d --py123d-data-root $DR --py123d-scene-index 0 \
                  --render-backend nurec_grpc --model-type drivor \
                  --checkpoint /closed-loop-e2e/weights/navsimv2/DrivoR/drivor_Nav1_25epochs.pth \
                  --cam-height navsim --traffic-mode log_replay --controller pure_pursuit \
                  --eval-frames 190 --ego-replay-frames 190 --replan-rate 5 --camera-resolution-scale 1.0 \
                  --output-dir "$OUT"
              kill $SERVE_PID 2>/dev/null || true
              test -n "$(find $OUT -name metrics.json | head -1)"
              echo "EVAL_DONE $C"; find $OUT -name "*.json" -o -name "*.gif" | head
          env:
            - { name: NGC_API_KEY, valueFrom: { secretKeyRef: { name: ngc-api-key, key: NGC_API_KEY } } }
            - { name: HYDRA_FULL_ERROR, value: "1" }
            - { name: OMNI_KIT_ACCEPT_EULA, value: "Y" }
            - { name: ACCEPT_EULA, value: "Y" }
          resources:
            requests: { cpu: "4", memory: "32Gi", nvidia.com/gpu: "1", ephemeral-storage: 120Gi }
            limits:   { cpu: "4", memory: "32Gi", nvidia.com/gpu: "1", ephemeral-storage: 120Gi }
          volumeMounts:
            - { name: dshm, mountPath: /dev/shm }
            - { name: avl-west-vol, mountPath: /avl-west }
            - { name: closed-loop-e2e, mountPath: /closed-loop-e2e }
            - { name: hugsim-storage, mountPath: /hugsim-storage }
      volumes:
        - { name: dshm, emptyDir: { medium: Memory, sizeLimit: 24Gi } }
        - { name: avl-west-vol, persistentVolumeClaim: { claimName: avl-west-vol } }
        - { name: closed-loop-e2e, persistentVolumeClaim: { claimName: closed-loop-e2e } }
        - { name: hugsim-storage, persistentVolumeClaim: { claimName: horuan-hugsim-vol } }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: kubernetes.io/hostname, operator: In, values: ["ry-gpu-04.sdsc.optiputer.net","ry-gpu-06.sdsc.optiputer.net","ry-gpu-07.sdsc.optiputer.net","ry-gpu-11.sdsc.optiputer.net","ry-gpu-12.sdsc.optiputer.net","ry-gpu-13.sdsc.optiputer.net","ry-gpu-14.sdsc.optiputer.net"] }
                  - { key: nvidia.com/gpu.product, operator: In, values: ["NVIDIA-GeForce-RTX-3090"] }
      tolerations:
        - { effect: NoSchedule, key: nautilus.io/reservation, operator: Equal, value: cogrob }
        - { effect: NoSchedule, key: nautilus.io/cogrob, operator: Exists }
