# Train with the Hyperion prod car2sim_6cam recipe (DYNAMIC recipe: extends
# _base_3dgut_dynamic_road_semantic -> dynamic_rigids + dynamic_deformables +
# road, plus MCMC densification, temporal appearance, 40k iters) + our nuPlan
# sensor/label overrides. Road init swapped to lidar-rig-trajectory (the
# ground-mesh init fails on our flattened nuPlan lidar). out_dir=output_car2sim.
# NOTE: this separates only MOVING objects; parked/static boxed objects bake into
# background. For every boxed object as its own editable layer, use the
# car2sim_6cam_static variant (4b-train-car2sim-static.yaml).
apiVersion: batch/v1
kind: Job
metadata: { name: navhard-traincar2sim-__SCENE__, namespace: cogrob }
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 172800
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets: [{ name: ngc-pull }]
      containers:
        - name: nre-train
          image: nvcr.io/nvidia/nre/nre-ga@sha256:6e0caa70a9148490552520c3dde9ee665c8d094ca10b814601cb8bb306567c90
          command: ["/opt/nvidia/nvidia_entrypoint.sh", "bash", "-c"]
          args:
            - |
              set -ex
              CLIP=__SCENE__
              /app/run --config-name=configs/apps/prod/Hyperion-8.1/car2sim_6cam.yaml \
                mode=train logger=dummy \
                dataset.path=/avl-west/r2s_work/$CLIP/clips/$CLIP/pai_$CLIP.json \
                out_dir=/avl-west/r2s_work/$CLIP/output_car2sim \
                logger.run_id="$CLIP" \
                dataset.aux_data=True \
                dataset.camera_ids=[camera_pcam_f0,camera_pcam_b0,camera_pcam_l0,camera_pcam_l1,camera_pcam_l2,camera_pcam_r0,camera_pcam_r1,camera_pcam_r2] \
                dataset.train_camera_ids=[camera_pcam_f0,camera_pcam_b0,camera_pcam_l0,camera_pcam_l1,camera_pcam_l2,camera_pcam_r0,camera_pcam_r1,camera_pcam_r2] \
                dataset.val_camera_ids=[camera_pcam_f0,camera_pcam_b0,camera_pcam_l0,camera_pcam_l1,camera_pcam_l2,camera_pcam_r0,camera_pcam_r1,camera_pcam_r2] \
                dataset.lidar_ids=[lidar_top_360fov] \
                dataset.train_lidar_ids=[lidar_top_360fov] \
                dataset.val_lidar_ids=[lidar_top_360fov] \
                dataset.n_train_sample_lidar_rays=0 \
                dataset.cuboid_tracks_params.track_label_sources=[GT_ANNOTATION] \
                model.layers.dynamic_rigids.tracks.label_classes=[NuPlanBoxDetectionLabel.VEHICLE,NuPlanBoxDetectionLabel.BICYCLE] \
                model.layers.dynamic_deformables.tracks.label_classes=[NuPlanBoxDetectionLabel.PEDESTRIAN] \
                model.layers.dynamic_rigids.initialization.name=camera-dynamic-tracks \
                +model.layers.dynamic_rigids.initialization.camera_ids=null \
                +model.layers.dynamic_rigids.initialization.step_frame=1 \
                +model.layers.dynamic_rigids.initialization.fill_with_random_points=true \
                model.layers.dynamic_deformables.initialization.name=camera-dynamic-tracks \
                +model.layers.dynamic_deformables.initialization.camera_ids=null \
                +model.layers.dynamic_deformables.initialization.step_frame=1 \
                +model.layers.dynamic_deformables.initialization.fill_with_random_points=true \
                model.layers.road.initialization.name=lidar-rig-trajectory \
                model.layers.road.initialization.default_scale=0.1 \
                +model.layers.road.initialization.num_near_points=100000 \
                +model.layers.road.initialization.num_far_points=100000 \
                +model.layers.road.initialization.far_radius_factor=20 \
                +model.layers.road.initialization.observation_scale_factor=0.01 \
                +model.layers.road.initialization.lidar_ids=null \
                +model.layers.road.initialization.camera_ids=null \
                +model.layers.road.initialization.non_dynamic_points_only=true \
                checkpoint.artifact.mesh.ground.enabled=false
          env:
            - { name: NGC_API_KEY, valueFrom: { secretKeyRef: { name: ngc-api-key, key: NGC_API_KEY } } }
            - { name: HYDRA_FULL_ERROR, value: "1" }
          resources:
            requests: { cpu: "12", memory: "64Gi", nvidia.com/gpu: "1", ephemeral-storage: 60Gi }
            limits:   { cpu: "12", memory: "64Gi", nvidia.com/gpu: "1", ephemeral-storage: 60Gi }
          volumeMounts:
            - { name: dshm, mountPath: /dev/shm }
            - { name: avl-west-vol, mountPath: /avl-west }
      volumes:
        - { name: dshm, emptyDir: { medium: Memory, sizeLimit: 24Gi } }
        - { name: avl-west-vol, persistentVolumeClaim: { claimName: avl-west-vol } }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: topology.kubernetes.io/region, operator: In, values: ["us-west"] }
                  - { key: nvidia.com/gpu.product, operator: In, values: ["NVIDIA-GeForce-RTX-3090"] }
                  - { key: kubernetes.io/hostname, operator: NotIn, values: ["ry-gpu-05.sdsc.optiputer.net"] }
      tolerations:
        - { effect: NoSchedule, key: nautilus.io/reservation, operator: Equal, value: cogrob }
