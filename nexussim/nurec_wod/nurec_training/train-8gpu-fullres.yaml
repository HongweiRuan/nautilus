# NuRec 3DGS training — 8-GPU, FULL-RESOLUTION (subsample=1)
# ---------------------------------------------------------------------------
# High-quality recon: sharp edges, more gaussians. Much more expensive.
#   * camera_pixel_sampler.subsample = 1  -> full-resolution supervision
#     (4x the pixels of subsample=2). This is THE knob that removes the blur.
#   * n_*_image_subsample = 1             -> use every frame (~2x more views).
#     NOTE: the three subsample params MUST be equal (NRE Waymo sqa_default
#     comment). Full res => all three = 1.
#   * max_n_gaussians = 6M                -> the 2.5M default cap was hit.
#   * 8x RTX 3090, DDP (device_count=world_size=8). The car2sim relative
#     schedule auto-scales steps by device count, so 8 GPUs = ~1/8 the steps
#     with 8x effective batch => wall-time is the fair speed comparison.
# Measured wall time (clip 10203..7625): ~3h32m; ckpt ~7.06 GB.
# Cost note: ~20x the GPU-minutes of the 1-GPU half-res run.
#
# USAGE: replace __CLIP__ (underscore) and __CLIPNAME__ (dashes), then apply.
# The 8-GPU pod needs ONE node with 8 free 3090s (node list pinned below to
# ry-gpu-04..07,11-14). Prereqs identical to the 1-GPU job (NGC secrets + aux).
apiVersion: batch/v1
kind: Job
metadata: { name: nre-train-8gpu-__CLIPNAME__, namespace: cogrob }
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 259200
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets: [{ name: ngc-pull }]
      containers:
        - name: nre-train-hq
          image: nvcr.io/nvidia/nre/nre-ga@sha256:6e0caa70a9148490552520c3dde9ee665c8d094ca10b814601cb8bb306567c90
          args:
            - --config-name=configs/apps/prod/Hyperion-8.1/car2sim_6cam.yaml
            - mode=train
            - dataset.path=/avl-west/r2s_work/__CLIP__/clips/__CLIP__/pai___CLIP__.json
            - out_dir=/avl-west/r2s_work/__CLIP__/output_hq
            - logger.run_id='__CLIP__'
            - dataset.aux_data=True
            - dataset.lidar_ids=[lidar_top_360fov]
            - dataset.train_lidar_ids=[lidar_top_360fov]
            - dataset.val_lidar_ids=[lidar_top_360fov]
            - dataset.n_train_sample_lidar_rays=0
            - dataset.cuboid_tracks_params.track_label_sources=[GT_ANNOTATION]
            # --- FULL RES: subsample=1 (three subsample params must stay equal) ---
            - dataset.samplers.batch_sampler.camera_pixel_sampler.subsample=1
            - dataset.n_val_image_subsample=1
            - dataset.n_train_sequential_image_subsample=1
            # --- raise gaussian cap (2.5M default was hit) ---
            - model.strategy.add.max_n_gaussians=6000000
            # --- 8-GPU DDP ---
            - ++trainer.device_count=8
            - ++trainer.world_size=8
            - dataset.camera_ids=[camera_pcam_f0,camera_pcam_l0,camera_pcam_l1,camera_pcam_r0,camera_pcam_r1]
            - dataset.train_camera_ids=[camera_pcam_f0,camera_pcam_l0,camera_pcam_l1,camera_pcam_r0,camera_pcam_r1]
            - dataset.val_camera_ids=[camera_pcam_f0,camera_pcam_l0,camera_pcam_l1,camera_pcam_r0,camera_pcam_r1]
            - model.layers.road.initialization.name=lidar-rig-trajectory
            - model.layers.road.initialization.default_scale=0.1
            - +model.layers.road.initialization.num_near_points=100000
            - +model.layers.road.initialization.num_far_points=100000
            - +model.layers.road.initialization.far_radius_factor=20
            - +model.layers.road.initialization.observation_scale_factor=0.01
            - +model.layers.road.initialization.lidar_ids=null
            - +model.layers.road.initialization.camera_ids=null
            - +model.layers.road.initialization.non_dynamic_points_only=true
          env:
            - { name: NGC_API_KEY, valueFrom: { secretKeyRef: { name: ngc-api-key, key: NGC_API_KEY } } }
            - { name: HYDRA_FULL_ERROR, value: "1" }
          resources:
            requests: { cpu: "24", memory: "160Gi", nvidia.com/gpu: "8", ephemeral-storage: 100Gi }
            limits:   { cpu: "24", memory: "160Gi", nvidia.com/gpu: "8", ephemeral-storage: 100Gi }
          volumeMounts:
            - { name: dshm, mountPath: /dev/shm }
            - { name: avl-west-vol, mountPath: /avl-west }
      volumes:
        - { name: dshm, emptyDir: { medium: Memory, sizeLimit: 64Gi } }
        - { name: avl-west-vol, persistentVolumeClaim: { claimName: avl-west-vol } }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: topology.kubernetes.io/region, operator: In, values: ["us-west"] }
                  - { key: nvidia.com/gpu.product, operator: In, values: ["NVIDIA-GeForce-RTX-3090"] }
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["ry-gpu-04.sdsc.optiputer.net","ry-gpu-05.sdsc.optiputer.net","ry-gpu-06.sdsc.optiputer.net","ry-gpu-07.sdsc.optiputer.net","ry-gpu-11.sdsc.optiputer.net","ry-gpu-12.sdsc.optiputer.net","ry-gpu-13.sdsc.optiputer.net","ry-gpu-14.sdsc.optiputer.net"]
      tolerations:
        - { effect: NoSchedule, key: nautilus.io/reservation, operator: Equal, value: cogrob }
