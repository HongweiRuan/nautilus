# py123d-conversion dataset config for a navhard scene from RAW nuPlan (native
# 10Hz), driving nexussim.NavhardNuplanParser (windows the log to [t0,t1] and
# renames the log to the scene token so the arrow log_name == the recon clip id).
# Cameras + lidar EXCLUDED (grpc supplies pixels; scenario source only needs
# ego + boxes + traffic lights + map). Clip windows are hardcoded per run.
parser:
  _target_: nexussim.gs3d_converter.navsim_parser.NavhardNuplanParser
  _convert_: 'all'
  nuplan_data_root: /tmp/nuplan_local
  nuplan_sensor_root: /avl-west/nuplan/nuplan-v1.1/sensor_blobs
  nuplan_maps_root: /avl-west/nuplan/maps
  split: nuplan_test
  scenes:
    - ["2021.05.25.14.16.10_veh-35_02482_02649", "7c56367f5b9b55a0", 1621969131501024, 1621969151000144]

log_writer_config:
  _target_: py123d.api.scene.arrow.utils.log_writer_config.LogWriterConfig
  _convert_: 'all'
  force_log_conversion: ${force_log_conversion}
  force_map_conversion: ${force_map_conversion}
  async_conversion: ${async_conversion}
  exclude_modality_types: [lidar, camera]
  camera_store_option: "path"
  lidar_store_option: "path"
  infer_ego_dynamics: false
  infer_box_dynamics: false

log_writer:
  _target_: py123d.api.scene.arrow.arrow_log_writer.ArrowLogWriter
  _convert_: 'all'
  log_writer_config: ${dataset.log_writer_config}
  logs_root: ${dataset_paths.py123d_logs_root}
  sensors_root: ${dataset_paths.py123d_sensors_root}
  ipc_compression: null
  ipc_compression_level: null
  sync_config:
    _target_: py123d.api.scene.arrow.arrow_log_writer.SyncConfig
    _convert_: 'all'
    reference_column: box_detections_se3.timestamp_us
    direction: "forward"
    target_iteration_duration_s: 0.1

map_writer:
  _target_: py123d.api.map.arrow.arrow_map_writer.ArrowMapWriter
  _convert_: 'all'
  force_map_conversion: ${force_map_conversion}
  maps_root: ${dataset_paths.py123d_maps_root}
  logs_root: ${dataset_paths.py123d_logs_root}
