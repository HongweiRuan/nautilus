# CPU-only (finding 1 pilot): NuRec USDZ + real sensor data for 10 NuRec clips. Original header: copy the PhysicalAI-AV clips that have human reasoning labels (val split, 290 clips; 7 cameras + egomotion
# + calibration) to /avl-west/PhysicalAI-AV-subset, member by member (no whole chunks). Size cap 140 GB.
apiVersion: batch/v1
kind: Job
metadata: {name: horuan-a15-f1-fetch, namespace: cogrob}
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 172800
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - {key: kubernetes.io/hostname, operator: In, values: [ry-gpu-13.sdsc.optiputer.net, ry-gpu-14.sdsc.optiputer.net]}
      tolerations:
      - {effect: NoSchedule, key: nautilus.io/reservation, operator: Equal, value: cogrob}
      - {effect: NoSchedule, key: nautilus.io/cogrob, operator: Exists}
      containers:
      - name: fetch
        image: python:3.11-slim
        command: [bash, -lc]
        args:
        - |
          pip -q install "huggingface_hub>=0.34" pandas pyarrow
          python /hugsim-storage/alpamayo/a15/scripts/f1_fetch.py --n 10 --out-pai /avl-west/PhysicalAI-AV-f1 --out-nurec /avl-west/f1_nurec
        env:
        - name: HF_TOKEN
          valueFrom: {secretKeyRef: {name: hf-token-a15, key: HF_TOKEN}}
        - {name: HF_HOME, value: /root/hf}
        resources:
          requests: {cpu: "4", memory: 16Gi}
          limits: {cpu: "4", memory: 16Gi}
        volumeMounts:
        - {mountPath: /hugsim-storage, name: hugsim-storage}
        - {mountPath: /avl-west, name: avl-west}
      volumes:
      - name: hugsim-storage
        persistentVolumeClaim: {claimName: horuan-hugsim-vol}
      - name: avl-west
        persistentVolumeClaim: {claimName: avl-west-vol}

