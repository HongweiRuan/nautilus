apiVersion: batch/v1
kind: Job
metadata:
  name: horuan-m1-diag-best-pilot
  namespace: cogrob
  labels: {app: horuan-a15, exp: method1-verif}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 28800
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels: {app: horuan-a15, exp: method1-verif}
    spec:
      restartPolicy: Never
      imagePullSecrets: [{name: ngc-pull}]
      initContainers:
      - name: renderer
        restartPolicy: Always
        image: nvcr.io/nvidia/nre/nre-ga@sha256:6e0caa70a9148490552520c3dde9ee665c8d094ca10b814601cb8bb306567c90
        command: ["/opt/nvidia/nvidia_entrypoint.sh", "bash", "-c"]
        args:
        - |
          set -e
          mkdir -p /tmp/shard
          for t in $TOKENS; do ln -sf $BUNDLES/$t/$t.usdz /tmp/shard/$t.usdz; done
          ls -la /tmp/shard
          exec /app/run serve-grpc --host 0.0.0.0 --port 8080 --enable-editing-actors --renderer default --cache-size 2 \
            --enable-harmonizer --harmonizer-cache /avl-west/navsafe/navsafe_eval/readme_verify_20261007/harmonizer-cache \
            --artifact-glob "/tmp/shard/*.usdz"
        env:
        - {name: NGC_API_KEY, valueFrom: {secretKeyRef: {name: ngc-api-key, key: NGC_API_KEY}}}
        - {name: PYTORCH_CUDA_ALLOC_CONF, value: "expandable_segments:True"}
        - {name: TOKENS, value: "00185dab0ba153b9 112db94505025ec5"}
        - {name: BUNDLES, value: /avl-west/navsafe/20261101-method1-verifications/best}
        resources:
          requests: {cpu: 500m, memory: 8Gi, ephemeral-storage: 20Gi, nvidia.com/gpu: "1"}
          limits: {cpu: 600m, memory: 9Gi, ephemeral-storage: 20Gi, nvidia.com/gpu: "1"}
        volumeMounts:
        - {name: avl-west, mountPath: /avl-west}
        - {name: dshm, mountPath: /dev/shm}
      containers:
      - name: eval
        image: nvcr.io/nvidia/nre/nre-ga@sha256:6e0caa70a9148490552520c3dde9ee665c8d094ca10b814601cb8bb306567c90
        command: ["bash", "-c"]
        args: ["bash /hugsim-storage/alpamayo/a15/scripts/method1/run_m1_diag.sh 2>&1 | tee -a $OUT_ROOT/eval.log; exit ${PIPESTATUS[0]}"]
        env:
        - {name: NVIDIA_DRIVER_CAPABILITIES, value: all}
        - {name: TOKENS, value: "00185dab0ba153b9 112db94505025ec5"}
        - {name: BUNDLES, value: /avl-west/navsafe/20261101-method1-verifications/best}
        - {name: RECIPES, value: /hugsim-storage/alpamayo/a15/method1/recipes}
        - {name: OUT_ROOT, value: /hugsim-storage/alpamayo/a15/method1/runs_best}
        - {name: DIAG_DIR, value: /hugsim-storage/alpamayo/a15/method1/diag_best}
        - {name: EXPECT_SHA, value: 137e1e0a6fdd4ac55555bd6d4ce2988412e573fa}
        - {name: A15_PORT, value: "7788"}
        - {name: A15_SHM, value: /dev/shm/a15}
        - {name: NAVSAFE_ENABLE_VIS, value: "0"}
        - {name: PYTHONUNBUFFERED, value: "1"}
        - {name: VARIANTS, value: "hazard_0 hazard_3 control hazard_1 hazard_2 hazard_4 log"}
        resources:
          requests: {cpu: "4", memory: 26Gi, ephemeral-storage: 150Gi, nvidia.com/gpu: "1"}
          limits: {cpu: 4800m, memory: 30Gi, ephemeral-storage: 150Gi, nvidia.com/gpu: "1"}
        volumeMounts:
        - {name: avl-west, mountPath: /avl-west}
        - {name: hugsim, mountPath: /hugsim-storage}
        - {name: dshm, mountPath: /dev/shm}
        - {name: sync, mountPath: /sync}
      - name: vla
        image: pytorch/pytorch:2.8.0-cuda12.8-cudnn9-devel
        command: ["bash", "-c"]
        args:
        - |
          set -x
          export HF_HOME=/hugsim-storage/alpamayo/hf_home PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True PYTHONUNBUFFERED=1
          export A15_REVISION=7aba8293c09993f2e125c6819df05d7fa3e873ea
          mkdir -p $A15_DIAG_DIR
          bash /hugsim-storage/alpamayo/a15/scripts/setup_env_a15.sh || exit 1
          cd /hugsim-storage/alpamayo/a15/scripts && /root/a15/bin/python use_cosmos_config.py
          HF_HUB_OFFLINE=1 /root/a15/bin/python navsafe/a15_diag_server.py > $A15_DIAG_DIR/vla_server.log 2>&1 &
          pid=$!
          while kill -0 $pid 2>/dev/null; do
            if [[ -e /sync/EVAL_DONE ]]; then kill $pid; echo VLA_FINISHED; exit 0; fi
            sleep 5
          done
          echo 'ERROR: vla server exited early' >&2; exit 7
        env:
        - {name: A15_PORT, value: "7788"}
        - {name: A15_DIAG_DIR, value: /hugsim-storage/alpamayo/a15/method1/diag_best}
        - {name: A15_DIAG_NOISE, value: "4"}
        resources:
          requests: {cpu: "1", memory: 40Gi, ephemeral-storage: 100Gi, nvidia.com/gpu: "1"}
          limits: {cpu: 1200m, memory: 48Gi, ephemeral-storage: 100Gi, nvidia.com/gpu: "1"}
        volumeMounts:
        - {name: hugsim, mountPath: /hugsim-storage}
        - {name: dshm, mountPath: /dev/shm}
        - {name: sync, mountPath: /sync}
      volumes:
      - {name: hugsim, persistentVolumeClaim: {claimName: horuan-hugsim-vol}}
      - {name: avl-west, persistentVolumeClaim: {claimName: avl-west-vol}}
      - {name: dshm, emptyDir: {medium: Memory, sizeLimit: 16Gi}}
      - {name: sync, emptyDir: {}}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - {key: kubernetes.io/hostname, operator: In, values: [ry-gpu-11.sdsc.optiputer.net, ry-gpu-12.sdsc.optiputer.net]}
      tolerations:
      - {effect: NoSchedule, key: nautilus.io/reservation, operator: Equal, value: cogrob}
      - {effect: NoSchedule, key: nautilus.io/cogrob, operator: Exists}
