apiVersion: batch/v1
kind: Job
metadata:
  name: horuan-a15-alens-r1-s2
  namespace: cogrob
  labels:
    app: horuan-a15
    exp: alens
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels:
        app: horuan-a15
        exp: alens
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - ry-gpu-11.sdsc.optiputer.net
                - ry-gpu-12.sdsc.optiputer.net
      tolerations:
      - effect: NoSchedule
        key: nautilus.io/reservation
        operator: Equal
        value: cogrob
      - effect: NoSchedule
        key: nautilus.io/cogrob
        operator: Exists
      containers:
      - name: dc
        image: pytorch/pytorch:2.8.0-cuda12.8-cudnn9-devel
        command:
        - bash
        - -lc
        - mkdir -p /hugsim-storage/alpamayo/a15/logs /hugsim-storage/alpamayo/a15/outputs_alens/r1 && (set -x; export HF_HOME=/hugsim-storage/alpamayo/hf_home PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True PYTHONUNBUFFERED=1; bash /hugsim-storage/alpamayo/a15/scripts/r1/setup_env_r1.sh || exit 1; PY=/root/ar1/bin/python;
          $PY -m pip install -q --no-deps physical-ai-av==0.2.0; $PY -m pip install -q av pyarrow; cd /hugsim-storage/alpamayo/a15/scripts && MODEL=r1 SHARD=2/3 HF_HUB_OFFLINE=1 $PY alens_a1.py --nr-scenes /hugsim-storage/alpamayo/a15/data/scenes.json --pai-clips /hugsim-storage/alpamayo/a15/data/dc_clips_pai.json
          --out /hugsim-storage/alpamayo/a15/outputs_alens/r1 --n-noise 4) > /hugsim-storage/alpamayo/a15/logs/alens_r1_s2.log 2>&1
        env:
        - name: HF_HOME
          value: /hugsim-storage/alpamayo/hf_home
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token-a15
              key: HF_TOKEN
        resources:
          requests:
            cpu: '5'
            memory: 96Gi
            nvidia.com/gpu: '2'
            ephemeral-storage: 100Gi
          limits:
            cpu: '5'
            memory: 96Gi
            nvidia.com/gpu: '2'
            ephemeral-storage: 100Gi
        volumeMounts:
        - mountPath: /dev/shm
          name: dshm
        - mountPath: /hugsim-storage
          name: hugsim
        - mountPath: /avl-west
          name: avl-west
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 16Gi
      - name: hugsim
        persistentVolumeClaim:
          claimName: horuan-hugsim-vol
      - name: avl-west
        persistentVolumeClaim:
          claimName: avl-west-vol
          readOnly: true
