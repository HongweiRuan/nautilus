apiVersion: batch/v1
kind: Job
metadata:
  name: horuan-a15-peekjob
  namespace: cogrob
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: [ry-gpu-13.sdsc.optiputer.net, ry-gpu-14.sdsc.optiputer.net]
      containers:
      - name: peek
        image: python:3.11-slim
        command: [bash, -lc, "sleep 28800"]
        resources:
          requests: {cpu: "2", memory: 4Gi}
          limits: {cpu: "2", memory: 4Gi}
        volumeMounts:
        - {name: hugsim, mountPath: /hugsim-storage}
      volumes:
      - name: hugsim
        persistentVolumeClaim: {claimName: horuan-hugsim-vol}
