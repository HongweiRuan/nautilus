# CPU-only, submit ONLY after all 150 v2 scenes exist (Nautilus rejects Jobs when the account's utilization is low, so no
# idle wait loops): (a) exact same-scene equivalence v2 vs v1 on the full set, (b) v2 stability (n-curves, halves, spectrum)
# with k=2 and k=4 on all 20 coordinates, (c) lateral direction by scene type. Scripts from ConfigMap horuan-alens-v2-final.
apiVersion: batch/v1
kind: Job
metadata:
  name: horuan-clvla-alens-v2-final
  namespace: cogrob
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 14400
  ttlSecondsAfterFinished: 172800
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - {key: kubernetes.io/hostname, operator: In, values: [ry-gpu-14.sdsc.optiputer.net, ry-gpu-13.sdsc.optiputer.net]}
      tolerations:
      - {effect: NoSchedule, key: nautilus.io/reservation, operator: Equal, value: cogrob}
      - {effect: NoSchedule, key: nautilus.io/cogrob, operator: Exists}
      containers:
      - name: final
        image: python:3.11-slim
        command: [bash, -lc]
        args:
        - |
          set -uo pipefail; pip install -q numpy 2>&1 | tail -1
          R=/hugsim-storage/alpamayo/a15; V2=$R/outputs_alens_v2/a15_eq; OUT=$R/outputs_alens_v2
          echo "=== $(ls $V2/*.npz | wc -l) v2 scenes at $(date -u +%T)"; cp /cm/*.py /tmp/ && cd /tmp
          python -I alens_v2_equiv.py $V2 $R/outputs_alens/analysis_a15/dirs.npz $OUT/equiv_a15_eq_full.json --v1-dir $R/outputs_alens/a15 2>&1 | tail -70; echo "=== rc equiv ${PIPESTATUS[0]}"
          python -I alens_v2_lateral_split.py $V2 $OUT/lateral_split_a15_eq.json --reps 20 2>&1 | tail -12; echo "=== rc lat ${PIPESTATUS[0]}"
          for k in 2 4; do
            python -I alens_stability.py $V2 $OUT/stability_v2_a15_k$k.json --k $k --reps 10 --keep-groups img cot_start --concepts all 2>&1 | tail -8; echo "=== rc stab k$k ${PIPESTATUS[0]}"
          done
          echo FINAL_DONE
        resources:
          requests: {cpu: "4", memory: 20Gi}
          limits: {cpu: "4", memory: 24Gi}
        volumeMounts:
        - {name: hugsim, mountPath: /hugsim-storage}
        - {name: cm, mountPath: /cm}
      volumes:
      - name: hugsim
        persistentVolumeClaim: {claimName: horuan-hugsim-vol}
      - name: cm
        configMap: {name: horuan-alens-v2-final}
