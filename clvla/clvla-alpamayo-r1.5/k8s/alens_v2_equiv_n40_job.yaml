# CPU-only: exact same-scene equivalence check of A-lens v2 vs v1 once >= 40 v2 scenes exist (early read-out while the
# GPU shards continue). Script from ConfigMap horuan-alens-v2-equiv. Output outputs_alens_v2/equiv_a15_eq_n40.json.
apiVersion: batch/v1
kind: Job
metadata:
  name: horuan-clvla-alens-v2-equiv-n40
  namespace: cogrob
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 21600
  ttlSecondsAfterFinished: 172800
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - {key: kubernetes.io/hostname, operator: In, values: [ry-gpu-13.sdsc.optiputer.net, ry-gpu-14.sdsc.optiputer.net]}
      tolerations:
      - {effect: NoSchedule, key: nautilus.io/reservation, operator: Equal, value: cogrob}
      - {effect: NoSchedule, key: nautilus.io/cogrob, operator: Exists}
      containers:
      - name: equiv
        image: python:3.11-slim
        command: [bash, -lc]
        args:
        - |
          set -uo pipefail; pip install -q numpy 2>&1 | tail -1
          R=/hugsim-storage/alpamayo/a15; V2=$R/outputs_alens_v2/a15_eq
          until [ "$(ls $V2/*.npz 2>/dev/null | wc -l)" -ge 40 ]; do sleep 120; done
          echo "=== $(ls $V2/*.npz | wc -l) v2 scenes at $(date -u +%T)"
          cp /cm/alens_v2_coords.py /tmp/ && cp /cm/alens_v2_equiv.py /tmp/ && cd /tmp
          python -I alens_v2_equiv.py $V2 $R/outputs_alens/analysis_a15/dirs.npz $R/outputs_alens_v2/equiv_a15_eq_n40.json --v1-dir $R/outputs_alens/a15 2>&1 | tail -60
          echo "=== rc ${PIPESTATUS[0]}"; echo EQUIV_DONE
        resources:
          requests: {cpu: "2", memory: 12Gi}
          limits: {cpu: "2", memory: 14Gi}
        volumeMounts:
        - {name: hugsim, mountPath: /hugsim-storage}
        - {name: cm, mountPath: /cm}
      volumes:
      - name: hugsim
        persistentVolumeClaim: {claimName: horuan-hugsim-vol}
      - name: cm
        configMap: {name: horuan-alens-v2-equiv}
