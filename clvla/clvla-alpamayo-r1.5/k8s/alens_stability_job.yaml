# CPU-only: A-lens direction / A-space stability vs number of scenes, halves and nuReasoning-vs-PhysicalAI-AV overlap.
# Script comes from ConfigMap horuan-alens-stability (scripts/alens_stability.py); reads outputs_alens/<model>/*.npz.
apiVersion: batch/v1
kind: Job
metadata:
  name: horuan-clvla-alens-stability
  namespace: cogrob
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 14400
  ttlSecondsAfterFinished: 172800
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - {key: kubernetes.io/hostname, operator: In, values: [ry-gpu-13.sdsc.optiputer.net, ry-gpu-14.sdsc.optiputer.net]}
      tolerations:
      - {effect: NoSchedule, key: nautilus.io/reservation, operator: Equal, value: cogrob}
      - {effect: NoSchedule, key: nautilus.io/cogrob, operator: Exists}
      containers:
      - name: stab
        image: python:3.11-slim
        command: [bash, -lc]
        args:
        - |
          set -uo pipefail
          pip install -q numpy 2>&1 | tail -2
          R=/hugsim-storage/alpamayo/a15; OUT=$R/outputs_alens/stability; mkdir -p $OUT
          for m in a15 r1; do
            echo "=== $m $(date -u +%T)"; ls $R/outputs_alens/$m/*.npz | wc -l
            python -I /cm/alens_stability.py $R/outputs_alens/$m $OUT/stability_$m.json --k 8 --reps 20 2>&1 | tail -30
            echo "=== rc $m ${PIPESTATUS[0]}"
          done
          echo STAB_DONE
        resources:
          requests: {cpu: "4", memory: 14Gi}
          limits: {cpu: "4", memory: 16Gi}
        volumeMounts:
        - {name: hugsim, mountPath: /hugsim-storage}
        - {name: cm, mountPath: /cm}
      volumes:
      - name: hugsim
        persistentVolumeClaim: {claimName: horuan-hugsim-vol}
      - name: cm
        configMap: {name: horuan-alens-stability}
