apiVersion: v1
kind: Pod
metadata: {name: horuan-pvc-peek, namespace: cogrob}
spec:
  restartPolicy: Never
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - {key: kubernetes.io/hostname, operator: In, values: [ry-gpu-12.sdsc.optiputer.net, ry-gpu-13.sdsc.optiputer.net, ry-gpu-14.sdsc.optiputer.net]}
  tolerations:
  - {effect: NoSchedule, key: nautilus.io/reservation, operator: Equal, value: cogrob}
  - {effect: NoSchedule, key: nautilus.io/cogrob, operator: Exists}
  containers:
  - name: peek
    image: python:3.11-slim
    command: [sh, -c, "sleep 1800"]
    resources: {requests: {cpu: "1", memory: 2Gi}, limits: {cpu: "1", memory: 2Gi}}
    volumeMounts: [{mountPath: /hugsim-storage, name: hugsim-storage}]
  volumes:
  - {name: hugsim-storage, persistentVolumeClaim: {claimName: horuan-hugsim-vol}}
