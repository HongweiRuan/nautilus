apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-eval-navhard-ddv2-rr-${REPLAN_RATE}-ef-${EVAL_FRAMES}-${SPLIT}
  namespace: cogrob
spec:
  replicas: 1
  selector:
    matchLabels:
      k8s-app: deployment-eval-navhard-ddv2-rr-${REPLAN_RATE}-ef-${EVAL_FRAMES}-${SPLIT}
  template:
    metadata:
      labels:
        k8s-app: deployment-eval-navhard-ddv2-rr-${REPLAN_RATE}-ef-${EVAL_FRAMES}-${SPLIT}
    spec:
      restartPolicy: Always
      containers:
        - name: gpu-container
          image: robinwangucsd/metabench:latest
          imagePullPolicy: Always
          env:
            - name: SPLIT
              value: "${SPLIT}"
            - name: REPLAN_RATE
              value: "${REPLAN_RATE}"
            - name: EVAL_FRAMES
              value: "${EVAL_FRAMES}"
          command: ["sleep", "infinity"]
          resources:
            requests:
              cpu: "3"
              memory: "20Gi"
              nvidia.com/gpu: "1"
              ephemeral-storage: 100Gi
            limits:
              cpu: "4"
              memory: "24Gi"
              nvidia.com/gpu: "1"
              ephemeral-storage: 100Gi
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: avl-west-vol
              mountPath: /avl-west
            - name: closed-loop-e2e
              mountPath: /closed-loop-e2e
            - name: hugsim-storage
              mountPath: /hugsim-storage
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
        - name: avl-west-vol
          persistentVolumeClaim:
            claimName: avl-west-vol
        - name: closed-loop-e2e
          persistentVolumeClaim:
            claimName: closed-loop-e2e
        - name: hugsim-storage
          persistentVolumeClaim:
            claimName: horuan-hugsim-vol
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/region
                    operator: In
                    values:
                      - us-west
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-GeForce-RTX-4090
                      - NVIDIA-GeForce-RTX-3090
                    # - NVIDIA-RTX-A5000
                    # - Quadro-RTX-6000
                    # - NVIDIA-TITAN-RTX
                    # - NVIDIA-A10
                    # - Tesla-V130-SXM2-32GB
                    # - NVIDIA-A40
                    # - NVIDIA-RTX-A6000
                    # - Quadro-RTX-8000
                # - key: kubernetes.io/hostname
                #   operator: NotIn
                #   values:
                #   - ry-gpu-13.sdsc.optiputer.net
      tolerations:
        - effect: NoSchedule
          key: nautilus.io/reservation
          operator: Equal
          value: cogrob
