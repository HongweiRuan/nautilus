apiVersion: v1
kind: Pod
metadata:
  name: horuan-nuplan
  namespace: cogrob
  labels:
    k8s-app: horuan-nuplan
spec:
  restartPolicy: Never
  containers:
    - image: robinwangucsd/metabench:latest
      name: nuplan-container
      imagePullPolicy: Always
      command:
        - "bash"
        - "-lc"
      args:
        - |
          set -euo pipefail

          echo "=== Preparing Diffusion Planner / nuPlan repos ==="
          cd /hugsim-storage

          if [ ! -d /hugsim-storage/nuplan-devkit/.git ]; then
            git clone https://github.com/motional/nuplan-devkit.git /hugsim-storage/nuplan-devkit
          fi

          if [ ! -d /hugsim-storage/Diffusion-Planner/.git ]; then
            git clone https://github.com/ZhengYinan-AIR/Diffusion-Planner.git /hugsim-storage/Diffusion-Planner
          fi

          echo "=== Checking Diffusion Planner conda env ==="
          source /opt/conda/etc/profile.d/conda.sh

          ENV_READY=0
          if conda env list | awk '{print $1}' | grep -qx diffusion_planner; then
            if conda run -n diffusion_planner python -c "import torch, nuplan, diffusion_planner, timm, pytorch_lightning; assert torch.cuda.is_available()" >/dev/null 2>&1; then
              ENV_READY=1
            fi
          fi

          if [ "${ENV_READY}" -eq 0 ]; then
            echo "=== Creating diffusion_planner conda env if needed ==="
            if ! conda env list | awk '{print $1}' | grep -qx diffusion_planner; then
              conda create -y -n diffusion_planner python=3.9
            fi

            conda activate diffusion_planner

            echo "=== Installing pip compatible with nuPlan legacy pins ==="
            python -m pip install --progress-bar off "pip<24.1"

            echo "=== Installing nuPlan devkit ==="
            cd /hugsim-storage/nuplan-devkit
            python -m pip install --progress-bar off -e .
            python -m pip install --progress-bar off -r requirements.txt

            echo "=== Installing Diffusion Planner ==="
            cd /hugsim-storage/Diffusion-Planner
            python -m pip install --progress-bar off -e .

            echo "=== Installing Diffusion Planner torch/runtime requirements ==="
            python -m pip install --progress-bar off "huggingface_hub==0.24.7" -r requirements_torch.txt

            echo "=== Restoring nuPlan-compatible Hugging Face / fsspec pins ==="
            python -m pip install --progress-bar off "huggingface_hub==0.17.3" "fsspec==2023.3.0"

            echo "=== Checking Python package consistency ==="
            python -m pip check
          else
            echo "=== diffusion_planner env already passes smoke check; skipping reinstall ==="
            conda activate diffusion_planner
          fi

          echo "=== Writing default nuPlan / Diffusion Planner shell environment ==="
          cat >/etc/profile.d/nuplan_diffusion_planner.sh <<'EOF'
          export CONDA_DEFAULT_ENV=diffusion_planner
          export PATH=/opt/conda/envs/diffusion_planner/bin:/opt/conda/bin:$PATH
          export PYTHONPATH=/hugsim-storage/Diffusion-Planner:/hugsim-storage/nuplan-devkit:${PYTHONPATH:-}
          export HYDRA_FULL_ERROR=1
          export NUPLAN_DEVKIT_ROOT=/hugsim-storage/nuplan-devkit
          export NUPLAN_DATA_ROOT=/avl-west/nuplan
          export NUPLAN_MAPS_ROOT=/avl-west/nuplan/maps
          export NUPLAN_EXP_ROOT=/hugsim-storage/diffusion_planner_exp
          export DIFFUSION_PLANNER_ARGS=/closed-loop-e2e/weights/nuplan/diffusionplanner/args.json
          export DIFFUSION_PLANNER_CKPT=/closed-loop-e2e/weights/nuplan/diffusionplanner/model.pth
          EOF
          source /etc/profile.d/nuplan_diffusion_planner.sh

          echo "=== Diffusion Planner env smoke check ==="
          cd /hugsim-storage/Diffusion-Planner
          python - <<'PY'
          import json
          import torch
          import nuplan
          import diffusion_planner
          import timm
          import pytorch_lightning

          args_path = "/closed-loop-e2e/weights/nuplan/diffusionplanner/args.json"
          ckpt_path = "/closed-loop-e2e/weights/nuplan/diffusionplanner/model.pth"

          print("python_env", "/opt/conda/envs/diffusion_planner")
          print("torch", torch.__version__, "cuda_available", torch.cuda.is_available(), "cuda", torch.version.cuda)
          if torch.cuda.is_available():
              print("gpu", torch.cuda.get_device_name(0))

          with open(args_path) as f:
              args = json.load(f)
          print("args future_len", args.get("future_len"), "hidden_dim", args.get("hidden_dim"), "diffusion_model_type", args.get("diffusion_model_type"))

          ckpt = torch.load(ckpt_path, map_location="cpu")
          print("ckpt top keys", list(ckpt.keys())[:20])
          PY

          echo "=== nuPlan Diffusion Planner pod ready; keeping container alive ==="
          sleep infinity
      env:
        - name: CONDA_DEFAULT_ENV
          value: diffusion_planner
        - name: PATH
          value: /opt/conda/envs/diffusion_planner/bin:/opt/conda/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        - name: PYTHONPATH
          value: /hugsim-storage/Diffusion-Planner:/hugsim-storage/nuplan-devkit
        - name: HYDRA_FULL_ERROR
          value: "1"
        - name: NUPLAN_DEVKIT_ROOT
          value: /hugsim-storage/nuplan-devkit
        - name: NUPLAN_DATA_ROOT
          value: /avl-west/nuplan
        - name: NUPLAN_MAPS_ROOT
          value: /avl-west/nuplan/maps
        - name: NUPLAN_EXP_ROOT
          value: /hugsim-storage/diffusion_planner_exp
        - name: DIFFUSION_PLANNER_ARGS
          value: /closed-loop-e2e/weights/nuplan/diffusionplanner/args.json
        - name: DIFFUSION_PLANNER_CKPT
          value: /closed-loop-e2e/weights/nuplan/diffusionplanner/model.pth
      resources:
        requests:
          cpu: "4"
          memory: "32Gi"
          nvidia.com/gpu: "1"
          ephemeral-storage: 100Gi
        limits:
          cpu: "4"
          memory: "32Gi"
          nvidia.com/gpu: "1"
          ephemeral-storage: 100Gi
      volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: avl-west-vol
          mountPath: /avl-west
        - name: cogrob-avl-west-vol
          mountPath: /cogrob-avl-west
        - name: closed-loop-e2e
          mountPath: /closed-loop-e2e
        - name: hugsim-storage
          mountPath: /hugsim-storage
  volumes:
    - name: dshm
      emptyDir:
        medium: Memory
    - name: avl-west-vol
      persistentVolumeClaim:
        claimName: avl-west-vol
    - name: cogrob-avl-west-vol
      persistentVolumeClaim:
        claimName: cogrob-avl-west-vol
    - name: closed-loop-e2e
      persistentVolumeClaim:
        claimName: closed-loop-e2e
    - name: hugsim-storage
      persistentVolumeClaim:
        claimName: horuan-hugsim-vol
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values:
                  - us-west
              - key: nvidia.com/gpu.product
                operator: In
                values:
                  - NVIDIA-GeForce-RTX-3090
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - ry-gpu-04.sdsc.optiputer.net
                  - ry-gpu-05.sdsc.optiputer.net
                  - ry-gpu-06.sdsc.optiputer.net
                  - ry-gpu-07.sdsc.optiputer.net
                  - ry-gpu-11.sdsc.optiputer.net
                  - ry-gpu-12.sdsc.optiputer.net
                  - ry-gpu-13.sdsc.optiputer.net
                  - ry-gpu-14.sdsc.optiputer.net
  tolerations:
    - effect: NoSchedule
      key: nautilus.io/reservation
      operator: Equal
      value: cogrob
