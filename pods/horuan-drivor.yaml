apiVersion: v1
kind: Pod
metadata:
  name: horuan-drivor
  labels:
    k8s-app: horuan-drivor
spec:
  containers:
    - image: robinwangucsd/metabench:latest
      name: drivor-container
      command:
        - "bash"
        - "-lc"
      args:
        - |
          set -e
          cd /hugsim-storage/WorldModel4Driving/DrivoR_vanilla
          conda create -n drivoR python=3.8 -y
          source /opt/conda/etc/profile.d/conda.sh
          conda activate drivoR
          pip install torch==2.1.0 torchvision==0.16.0 torchaudio==2.1.0 --index-url https://download.pytorch.org/whl/cu121
          pip install -e ./nuplan-devkit
          pip install -e .
          sleep infinity
      resources:
        requests:
          cpu: "4"
          memory: "32Gi"
          ephemeral-storage: 100Gi
          # nvidia.com/gpu: "1"
        limits:
          cpu: "4"
          memory: "32Gi"
          ephemeral-storage: 100Gi
          # nvidia.com/gpu: "1"
      volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: avl-west-vol
          mountPath: /avl-west
        - name: cogrob-avl-west-vol
          mountPath: /cogrob-avl-west
        - name: closed-loop-e2e
          mountPath: /closed-loop-e2e
        - name: hugsim-storage
          mountPath: /hugsim-storage
  volumes:
    - name: dshm
      emptyDir:
        medium: Memory
    - name: avl-west-vol
      persistentVolumeClaim:
        claimName: avl-west-vol
    - name: cogrob-avl-west-vol
      persistentVolumeClaim:
        claimName: cogrob-avl-west-vol
    - name: closed-loop-e2e
      persistentVolumeClaim:
        claimName: closed-loop-e2e
    - name: hugsim-storage
      persistentVolumeClaim:
        claimName: horuan-hugsim-vol
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values:
                  - us-west
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - ry-gpu-11.sdsc.optiputer.net

  tolerations:
    - effect: NoSchedule
      key: nautilus.io/reservation
      operator: Equal
      value: cogrob
