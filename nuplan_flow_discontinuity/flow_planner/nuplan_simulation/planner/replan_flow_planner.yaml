replan_flow_planner:
  _target_: flow_planner.nuplan_simulation.planner.replan_rate_wrapper.ReplanRateWrapperPlanner
  _convert_: "all"

  replan_interval_steps: 1
  output_dir: null
  sample_interval_s: null
  max_logged_overlap_s: 2.0

  base_planner:
    _target_: flow_planner.planner.FlowPlanner
    _convert_: "all"

    config_path: ???
    ckpt_path: ???

    past_trajectory_sampling:
      _target_: nuplan.planning.simulation.trajectory.trajectory_sampling.TrajectorySampling
      _convert_: "all"

      num_poses: 20
      time_horizon: 2

    future_trajectory_sampling:
      _target_: nuplan.planning.simulation.trajectory.trajectory_sampling.TrajectorySampling
      _convert_: "all"

      num_poses: 80
      time_horizon: 8

    enable_ema: false
    device: cuda
    use_cfg: true
    cfg_weight: 1.0
