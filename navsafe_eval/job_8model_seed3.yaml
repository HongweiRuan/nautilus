# NavSafe eval sweep as ONE indexed Job per seed, capped at 52 GPUs
# concurrently (parallelism 26 pods x 2 GPUs each = 52). Replaces the 25
# separate per-worker Jobs per seed with completions=25 on a single Job;
# WORKER_INDEX is populated from k8s's own completion-index downward API
# instead of being templated per file, so run_worker.sh needs no changes.
#
# Submit one of these per seed you want to run (seed 1/2/3), substituting
# 3. Concurrency across ALL submitted seeds combined is NOT capped by
# k8s (parallelism is per-Job) -- submit seeds one at a time, or halve
# parallelism per seed, if running >1 seed together must also stay <=52 GPUs
# total.
apiVersion: batch/v1
kind: Job
metadata:
  name: navsafe-eval-8model-seed3
  namespace: cogrob
  labels: {app: navsafe-eval-8model, seed: "3"}
spec:
  completionMode: Indexed
  completions: 25
  parallelism: 26
  backoffLimit: 4
  template:
    metadata:
      labels: {app: navsafe-eval-8model, seed: "3"}
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [ry-gpu-05.sdsc.optiputer.net, ry-gpu-06.sdsc.optiputer.net,
                             ry-gpu-07.sdsc.optiputer.net, ry-gpu-08.sdsc.optiputer.net,
                             ry-gpu-11.sdsc.optiputer.net, ry-gpu-12.sdsc.optiputer.net,
                             ry-gpu-13.sdsc.optiputer.net, ry-gpu-14.sdsc.optiputer.net]
                  - key: nvidia.com/gpu.product
                    operator: In
                    values: [NVIDIA-GeForce-RTX-3090]
      containers:
        - name: eval
          command: ["/opt/nvidia/nvidia_entrypoint.sh", "bash", "/cfg/run_worker.sh"]
          env:
            - name: WORKER_INDEX
              valueFrom: {fieldRef: {fieldPath: "metadata.annotations['batch.kubernetes.io/job-completion-index']"}}
            - {name: WORKERS, value: "25"}
            - {name: SEEDS, value: "3"}
            - {name: OUTROOT, value: "/avl-west/navsafe_eval/outputs_v2"}
            - {name: NEXUSSIM_SHA, value: "f26ad2fe2abb8489bed4f1eb6a492219cbb49764"}
            - {name: NGC_API_KEY, valueFrom: {secretKeyRef: {name: ngc-api-key, key: NGC_API_KEY}}}
            - {name: HF_TOKEN, valueFrom: {secretKeyRef: {name: hf-token, key: HF_TOKEN}}}
            - {name: HYDRA_FULL_ERROR, value: "1"}
            - {name: ACCEPT_EULA, value: "Y"}
            - {name: OMNI_KIT_ACCEPT_EULA, value: "Y"}
          image: nvcr.io/nvidia/nre/nre-ga@sha256:6e0caa70a9148490552520c3dde9ee665c8d094ca10b814601cb8bb306567c90
          imagePullPolicy: IfNotPresent
          resources:
            limits: {cpu: "3", ephemeral-storage: "100Gi", memory: "48Gi", nvidia.com/gpu: "2"}
            requests: {cpu: "3", ephemeral-storage: "100Gi", memory: "48Gi", nvidia.com/gpu: "2"}
          volumeMounts:
            - {name: dshm, mountPath: /dev/shm}
            - {name: cfg, mountPath: /cfg}
            - {name: avl-west-vol, mountPath: /avl-west}
            - {name: hugsim-storage, mountPath: /hugsim-storage}
      imagePullSecrets: [{name: ngc-pull}]
      restartPolicy: Never
      tolerations:
        - {effect: NoSchedule, key: nautilus.io/reservation, operator: Equal, value: cogrob}
        - {effect: NoSchedule, key: nautilus.io/cogrob, operator: Exists}
      volumes:
        - {name: dshm, emptyDir: {medium: Memory, sizeLimit: 24Gi}}
        - {name: cfg, configMap: {name: navsafe-eval-cfg-8model}}
        - {name: avl-west-vol, persistentVolumeClaim: {claimName: avl-west-vol}}
        - {name: hugsim-storage, persistentVolumeClaim: {claimName: horuan-hugsim-vol}}
  ttlSecondsAfterFinished: 259200
