apiVersion: v1
kind: Pod
metadata:
  name: horuan-mdsn # replace with ${USER_NAME}-http
  labels:
    k8s-app: horuan-mdsn
spec:
  # nodeName: ry-gpu-13.sdsc.optiputer.net
  containers:
    - image: robinwangucsd/metabench:latest
      name: http-server
      command:
        - "sh"
        - "-c"
      args:
        - |
          set -e &&
          echo "=== Copying MetaBench Cleaned ===" &&
          cp -r /hugsim-storage/MetaBench /root/MetaBench &&
          echo "=== Creating conda env ===" &&
          conda create -n mdsn python=3.9 pip -y &&
          echo "=== Installing metadrive ===" &&
          cd /root/MetaBench/metadrive &&
          /opt/conda/envs/mdsn/bin/pip install -e .[cuda] &&
          echo "=== Installing torch ===" &&
          /opt/conda/envs/mdsn/bin/pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu118 &&
          echo "=== Installing cupy & cuda-python ===" &&
          /opt/conda/envs/mdsn/bin/pip install cupy-cuda11x &&
          /opt/conda/envs/mdsn/bin/pip install cuda-python &&
          mkdir -p /usr/lib/dri &&
          ln -sf /usr/lib/x86_64-linux-gnu/dri/swrast_dri.so /usr/lib/dri/swrast_dri.so &&
          ln -sf /usr/lib/x86_64-linux-gnu/libstdc++.so.6.0.30 /opt/conda/envs/mdsn/lib/libstdc++.so.6 &&
          echo "=== Installing scenarionet ===" &&
          cd /root/MetaBench/scenarionet &&
          /opt/conda/envs/mdsn/bin/pip install -e . &&
          echo "=== Configuring panda3d ===" &&
          echo "model-path /root/MetaBench/metadrive/metadrive/assets/models/pedestrian" >> /opt/conda/envs/mdsn/lib/python3.9/site-packages/panda3d/etc/Config.prc &&
          echo "model-path /root/MetaBench/metadrive/metadrive/assets/models/traffic_cone" >> /opt/conda/envs/mdsn/lib/python3.9/site-packages/panda3d/etc/Config.prc &&
          echo "=== Installing remaining packages ===" &&
          /opt/conda/envs/mdsn/bin/pip install timm scienceplots scipy nuplan-devkit pyyaml pyogrio rasterio aioboto3 retry numpy==1.23.4 pyquaternion pytest h5py diffusers einops omegaconf hydra-core joblib wandb pytorch-lightning timm imageio &&
          echo "=== Installing MetaBench (cleaned) ===" &&
          cd /root/MetaBench &&
          /opt/conda/envs/mdsn/bin/pip install -e . &&
          echo "=== Copying checkpoints to /root ===" &&
          cp /closed-loop-e2e/weights/navsimv2/DiffusionDrive/diffusiondrive_navsim_88p1_PDMS /root/diffusiondrive_navsim_88p1_PDMS &&
          cp /closed-loop-e2e/weights/navsimv2/DiffusionDriveV2/kmeans_navsim_traj_20.npy /root/kmeans_navsim_traj_20.npy &&
          cp /closed-loop-e2e/weights/navsim_bev_flow_1/diffusiondrive-bevflow-DiT-XL/2-navsim_no_lidar/epoch=400-step=5213.ckpt /root/epoch=400-step=5213.ckpt &&
          cp /closed-loop-e2e/weights/navsimv2/DiffusionDriveV2/diffusiondrivev2_sel.ckpt /root/diffusiondrivev2_sel.ckpt &&
          cp /closed-loop-e2e/weights/navsim_bev_flow_1/diffusiondrivev2-bevflow-DiT-XL/2-navsim_no_lidar/epoch=300-step=3913.ckpt /root/epoch=300-step=3913.ckpt &&
          echo "=== Environment setup complete; keeping container alive ===" &&
          sleep infinity
      resources:
        requests:
          cpu: "4"
          memory: "32Gi"
          nvidia.com/gpu: "1"
          ephemeral-storage: 100Gi
        limits:
          cpu: "4"
          memory: "32Gi"
          nvidia.com/gpu: "1"
          ephemeral-storage: 100Gi
      volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: avl-west-vol
          mountPath: /avl-west
        - name: cogrob-avl-west-vol
          mountPath: /cogrob-avl-west
        - name: closed-loop-e2e
          mountPath: /closed-loop-e2e
        - name: hugsim-storage
          mountPath: /hugsim-storage
  volumes:
    - name: dshm
      emptyDir:
        medium: Memory
    - name: avl-west-vol
      persistentVolumeClaim:
        claimName: avl-west-vol
    - name: cogrob-avl-west-vol
      persistentVolumeClaim:
        claimName: cogrob-avl-west-vol
    - name: closed-loop-e2e
      persistentVolumeClaim:
        claimName: closed-loop-e2e
    - name: hugsim-storage
      persistentVolumeClaim:
        claimName: horuan-hugsim-vol
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: topology.kubernetes.io/region
            operator: In
            values:
            - us-west
          - key: nvidia.com/gpu.product
            operator: In
            values:
            - NVIDIA-GeForce-RTX-4090
            - NVIDIA-GeForce-RTX-3090
            # - NVIDIA-RTX-A4000
            # - NVIDIA-RTX-A5000
            # - Quadro-RTX-6000
            # - NVIDIA-TITAN-RTX 
            # - NVIDIA-A10
            # - Tesla-V130-SXM2-32GB
            # - NVIDIA-A40
            # - NVIDIA-RTX-A6000
            # - Quadro-RTX-8000
          - key: kubernetes.io/hostname
            operator: In
            values:
              - ry-gpu-01.sdsc.optiputer.net
              # - ry-gpu-02.sdsc.optiputer.net
              - ry-gpu-03.sdsc.optiputer.net
              - ry-gpu-04.sdsc.optiputer.net
              # - ry-gpu-05.sdsc.optiputer.net
              # - ry-gpu-06.sdsc.optiputer.net
              - ry-gpu-07.sdsc.optiputer.net
              # - ry-gpu-08.sdsc.optiputer.net
              - ry-gpu-09.sdsc.optiputer.net
              - ry-gpu-10.sdsc.optiputer.net
              - ry-gpu-11.sdsc.optiputer.net
              - ry-gpu-12.sdsc.optiputer.net
              # - ry-gpu-13.sdsc.optiputer.net
              - ry-gpu-14.sdsc.optiputer.net

  tolerations:
  - effect: NoSchedule
    key: nautilus.io/reservation
    operator: Equal
    value: cogrob
