apiVersion: batch/v1
kind: Job
metadata:
  name: job-eval-navhard-vad-rr-${REPLAN_RATE}-ef-${EVAL_FRAMES}-${SPLIT}
  namespace: cogrob
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        k8s-app: job-eval-navhard-vad-rr-${REPLAN_RATE}-ef-${EVAL_FRAMES}-${SPLIT}
    spec:
      restartPolicy: Never
      containers:
        - name: gpu-container
          image: robinwangucsd/metabench:latest
          imagePullPolicy: Always
          command:
            - "sh"
            - "-c"
          args:
            - |
              echo "=== Copying MetaBench ===" &&
              cp -r /hugsim-storage/MetaBench /root/MetaBench &&
              echo "=== Creating conda env ===" &&
              conda create -n mmcv python=3.8 pip -y &&
              echo "=== Installing metadrive ===" &&
              cd /root/MetaBench/metadrive && /opt/conda/envs/mmcv/bin/pip install -e .[cuda] &&
              echo "=== Installing torch ===" &&
              /opt/conda/envs/mmcv/bin/pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu118 &&
              echo "=== Installing cupy & cuda-python ===" &&
              /opt/conda/envs/mmcv/bin/pip install cupy-cuda11x &&
              /opt/conda/envs/mmcv/bin/pip install cuda-python &&
              mkdir /usr/lib/dri &&
              ln -s /usr/lib/x86_64-linux-gnu/dri/swrast_dri.so /usr/lib/dri/swrast_dri.so &&
              ln -sf /usr/lib/x86_64-linux-gnu/libstdc++.so.6.0.30 /opt/conda/envs/mmcv/lib/libstdc++.so.6 &&
              echo "=== Installing scenarionet ===" &&
              cd /root/MetaBench/scenarionet &&
              /opt/conda/envs/mmcv/bin/pip install -e . &&
              echo "=== Installing bench2drive ===" &&
              cd /root/MetaBench/bridgesim/modelzoo/bench2drive &&
              /opt/conda/envs/mmcv/bin/pip install --upgrade numpy==1.20.0 &&
              /opt/conda/envs/mmcv/bin/pip install ninja packaging &&
              /opt/conda/envs/mmcv/bin/pip install -v -e . --no-build-isolation &&
              echo "=== Installing remaining packages ===" &&
              /opt/conda/envs/mmcv/bin/pip install timm scipy nuplan-devkit pyyaml pyogrio rasterio aioboto3 retry numpy==1.23.4 pyquaternion pytest h5py diffusers einops omegaconf hydra-core joblib wandb pytorch-lightning timm imageio &&
              echo "=== Configuring panda3d ===" &&
              echo "model-path /root/MetaBench/metadrive/metadrive/assets/models/pedestrian" >> /opt/conda/envs/mmcv/lib/python3.8/site-packages/panda3d/etc/Config.prc &&
              echo "model-path /root/MetaBench/metadrive/metadrive/assets/models/traffic_cone" >> /opt/conda/envs/mmcv/lib/python3.8/site-packages/panda3d/etc/Config.prc &&
              echo "=== Installing MetaBench ===" &&
              cd /root/MetaBench &&
              /opt/conda/envs/mmcv/bin/pip install -e . &&
              echo "=== Copying VAD weight to /root ===" &&
              cp /closed-loop-e2e/weights/bench2drive/VAD/vad_b2d_base.pth /root/vad_b2d_base.pth &&
              echo "=== Creating mdsn symlink for run_eval.sh compatibility ===" &&
              ln -s /opt/conda/envs/mmcv /opt/conda/envs/mdsn &&
              echo "=== Starting eval: vad ===" &&
              bash /closed-loop-e2e/experiments/scripts/run_eval.sh \
                  vad \
                  /root/vad_b2d_base.pth \
                  /root/MetaBench/bridgesim/modelzoo/bench2drive/adzoo/vad/configs/VAD/VAD_base_e2e_b2d.py \
                  /avl-west/navsim/navhard_md_logs \
                  /closed-loop-e2e/experiments/zero_shot_results/eval/vad/split_${SPLIT}_rr_${REPLAN_RATE}_ef_${EVAL_FRAMES} \
                  ${REPLAN_RATE} \
                  ${EVAL_FRAMES} \
                  /closed-loop-e2e/navhard_test_split/${SPLIT}.txt
          resources:
            requests:
              cpu: "3"
              memory: "20Gi"
              nvidia.com/gpu: "1"
              ephemeral-storage: 100Gi
            limits:
              cpu: "4"
              memory: "24Gi"
              nvidia.com/gpu: "1"
              ephemeral-storage: 100Gi
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: avl-west-vol
              mountPath: /avl-west
            - name: closed-loop-e2e
              mountPath: /closed-loop-e2e
            - name: hugsim-storage
              mountPath: /hugsim-storage
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
        - name: avl-west-vol
          persistentVolumeClaim:
            claimName: avl-west-vol
        - name: closed-loop-e2e
          persistentVolumeClaim:
            claimName: closed-loop-e2e
        - name: hugsim-storage
          persistentVolumeClaim:
            claimName: horuan-hugsim-vol
      tolerations:
        - effect: NoSchedule
          key: nautilus.io/reservation
          operator: Equal
          value: cogrob
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/region
                    operator: In
                    values:
                      - us-west
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-GeForce-RTX-4090
                      - NVIDIA-GeForce-RTX-3090
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      # - ry-gpu-01.sdsc.optiputer.net
                      # - ry-gpu-02.sdsc.optiputer.net
                      - ry-gpu-03.sdsc.optiputer.net
                      - ry-gpu-04.sdsc.optiputer.net
                      - ry-gpu-05.sdsc.optiputer.net
                      - ry-gpu-06.sdsc.optiputer.net
                      - ry-gpu-07.sdsc.optiputer.net
                      - ry-gpu-08.sdsc.optiputer.net
                      - ry-gpu-09.sdsc.optiputer.net
                      - ry-gpu-10.sdsc.optiputer.net
                      - ry-gpu-11.sdsc.optiputer.net
                      - ry-gpu-12.sdsc.optiputer.net
                      - ry-gpu-13.sdsc.optiputer.net
                      - ry-gpu-14.sdsc.optiputer.net
