apiVersion: batch/v1
kind: Job
metadata:
  name: job-train-drivor-35epochs-v7-sigreg
  namespace: cogrob
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        k8s-app: job-train-drivor-35epochs-v7-sigreg
    spec:
      restartPolicy: Never
      containers:
        - name: gpu-container
          image: robinwangucsd/ambient_diffusion_planner
          imagePullPolicy: Always
          env:
            - name: NUPLAN_MAP_VERSION
              value: "nuplan-maps-v1.0"
            - name: NUPLAN_MAPS_ROOT
              value: "/avl-west/nuplan/maps"
            - name: NAVSIM_EXP_ROOT
              value: "/closed-loop-e2e/drivor-exp"
            - name: NAVSIM_DEVKIT_ROOT
              value: "/root/DrivoR"
            - name: OPENSCENE_DATA_ROOT
              value: "/avl-west/navsim"
            - name: SUBSCORE_PATH
              value: "/closed-loop-e2e/drivor-exp/train_metric_cache"
            - name: HYDRA_FULL_ERROR
              value: "1"
            - name: TORCH_NCCL_HEARTBEAT_TIMEOUT_SEC
              value: "7200"
            - name: NCCL_TIMEOUT
              value: "7200"
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: "expandable_segments:True"
          command:
            - "sh"
            - "-c"
          args:
            - |
              set -e &&
              echo "=== Copying DrivoR repo ===" &&
              cp -r /hugsim-storage/WorldModel4Driving/DrivoR_vanilla /root/DrivoR &&

              echo "=== Installing nuplan-devkit ===" &&
              cd /root/DrivoR/nuplan-devkit &&
              pip install -e . &&

              echo "=== Installing DrivoR ===" &&
              cd /root/DrivoR &&
              pip install -e . &&

              echo "=== Installing system deps ===" &&
              apt-get update && apt-get install -y ninja-build gcc-12 g++-12 &&

              echo "=== Installing Python deps ===" &&
              pip install nvidia-cudnn-cu12==8.9.7.29 &&
              pip install torch torchvision pytorch-lightning wandb timm &&

              echo "=== Setting LD_LIBRARY_PATH for cuDNN ===" &&
              export LD_LIBRARY_PATH=$(python -c "import nvidia.cudnn; print(nvidia.cudnn.__path__[0] + '/lib')"):$LD_LIBRARY_PATH &&

              echo "=== Removing stale latent-next cache index ===" &&
              rm -f /closed-loop-e2e/drivor-exp/navsim_cache_nommcv_latent_next/valid_caches.pkl &&

              echo "=== Starting DrivoR v7 Training from scratch with latent-next cache + SIGReg ===" &&
              echo "CACHE_PATH=/closed-loop-e2e/drivor-exp/navsim_cache_nommcv_latent_next" &&
              echo "LATENT_LEARNING enabled=true one_step=true latent_weight=0.3 sigreg=0.1" &&
              echo "BATCH_SIZE_PER_GPU=4 ACCUMULATE_GRAD_BATCHES=2 EFFECTIVE_GLOBAL_BATCH=64" &&
              python /root/DrivoR/navsim/planning/script/run_training_full.py \
                  agent=drivoR \
                  experiment_name=training_drivoR_Nav1_traj_long_35epochs_v7_latent_next_sigreg \
                  train_test_split=navtrain \
                  navsim_log_path=/avl-west/navsim/trainval_navsim_logs/trainval \
                  train_test_split.data_split=trainval \
                  +train_test_split.log_splits=null \
                  cache_path=/closed-loop-e2e/drivor-exp/navsim_cache_nommcv_latent_next \
                  use_cache_without_dataset=true \
                  sensor_blobs_path=/avl-west/navsim/trainval_sensor_blobs/trainval \
                  trainer.params.max_epochs=35 \
                  dataloader.params.prefetch_factor=2 \
                  dataloader.params.batch_size=4 \
                  trainer.params.accumulate_grad_batches=2 \
                  agent.lr_args.name=AdamW \
                  agent.lr_args.base_lr=0.0002 \
                  agent.lr_args.base_batch_size=32 \
                  agent.num_gpus=2 \
                  agent.progress_bar=false \
                  agent.config.latent_learning.enabled=true \
                  agent.config.latent_learning.one_step=true \
                  agent.loss.latent_weight=0.3 \
                  agent.config.latent_learning.loss_weights.sigreg=0.1 \
                  agent.config.refiner_ls_values=0.0 \
                  agent.config.image_backbone.focus_front_cam=false \
                  agent.config.one_token_per_traj=true \
                  agent.config.refiner_num_heads=1 \
                  agent.config.tf_d_model=256 \
                  agent.config.tf_d_ffn=1024 \
                  agent.config.area_pred=false \
                  agent.config.agent_pred=false \
                  agent.config.ref_num=4 \
                  agent.loss.prev_weight=0.0 \
                  agent.config.long_trajectory_additional_poses=2 \
                  seed=2
          resources:
            requests:
              cpu: "20"
              memory: "400Gi"
              nvidia.com/gpu: "8"
              ephemeral-storage: "50Gi"
            limits:
              cpu: "24"
              memory: "400Gi"
              nvidia.com/gpu: "8"
              ephemeral-storage: "100Gi"
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: avl-west-vol
              mountPath: /avl-west
            - name: closed-loop-e2e
              mountPath: /closed-loop-e2e
            - name: hugsim-storage
              mountPath: /hugsim-storage
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: "256Gi"
        - name: avl-west-vol
          persistentVolumeClaim:
            claimName: avl-west-vol
        - name: closed-loop-e2e
          persistentVolumeClaim:
            claimName: closed-loop-e2e
        - name: hugsim-storage
          persistentVolumeClaim:
            claimName: horuan-hugsim-vol
      tolerations:
        - effect: NoSchedule
          key: nautilus.io/reservation
          operator: Equal
          value: cogrob
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/region
                    operator: In
                    values:
                      - us-west
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-GeForce-RTX-3090
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      # - ry-gpu-12.sdsc.optiputer.net
                      - ry-gpu-13.sdsc.optiputer.net
                      # - ry-gpu-03.sdsc.optiputer.net
                      # - ry-gpu-04.sdsc.optiputer.net
                      # - ry-gpu-05.sdsc.optiputer.net
                      # - ry-gpu-06.sdsc.optiputer.net
                      # - ry-gpu-07.sdsc.optiputer.net
