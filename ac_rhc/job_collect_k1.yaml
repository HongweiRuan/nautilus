apiVersion: batch/v1
kind: Job
metadata:
  name: job-ac-collect-k1
  namespace: cogrob
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        k8s-app: job-ac-collect-k1
    spec:
      restartPolicy: Never
      containers:
        - name: ac-container
          image: robinwangucsd/metabench:latest
          imagePullPolicy: Always
          command:
            - "bash"
            - "-c"
          args:
            - |
              set -eo pipefail &&
              echo "=== Building nuplan-critic-rl conda env ===" &&
              conda env create -f /hugsim-storage/Flow-Planner/environment/critic-rl.yml &&
              echo "=== Preparing output dir on /avl-west ===" &&
              mkdir -p "/avl-west/nuplan-ac/k=1" &&
              echo "=== Starting k=1 collection (14 workers, ~1M transitions) ===" &&
              cd /hugsim-storage/Flow-Planner &&
              export OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1 &&
              /opt/conda/envs/nuplan-critic-rl/bin/python -m flow_planner.critic_rl.cli collect \
                  --config config/critic_rl/collect_k1.yaml \
                  --mode visibility
          resources:
            requests:
              cpu: "16"
              memory: "80Gi"
              nvidia.com/gpu: "1"
              ephemeral-storage: 100Gi
            limits:
              # factory build of 14 workers x 300 scenarios peaks ~75Gi; keep
              # headroom (ratio<=1.2). Steady-state collection only uses ~38Gi.
              cpu: "16"
              memory: "96Gi"
              nvidia.com/gpu: "1"
              ephemeral-storage: 100Gi
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: avl-west-vol
              mountPath: /avl-west
            - name: closed-loop-e2e
              mountPath: /closed-loop-e2e
            - name: hugsim-storage
              mountPath: /hugsim-storage
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
        - name: avl-west-vol
          persistentVolumeClaim:
            claimName: avl-west-vol
        - name: closed-loop-e2e
          persistentVolumeClaim:
            claimName: closed-loop-e2e
        - name: hugsim-storage
          persistentVolumeClaim:
            claimName: horuan-hugsim-vol
      tolerations:
        - effect: NoSchedule
          key: nautilus.io/reservation
          operator: Equal
          value: cogrob
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/region
                    operator: In
                    values:
                      - us-west
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-GeForce-RTX-4090
                      - NVIDIA-GeForce-RTX-3090
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - ry-gpu-01.sdsc.optiputer.net
                      - ry-gpu-03.sdsc.optiputer.net
                      - ry-gpu-04.sdsc.optiputer.net
                      - ry-gpu-07.sdsc.optiputer.net
                      - ry-gpu-09.sdsc.optiputer.net
                      - ry-gpu-10.sdsc.optiputer.net
                      - ry-gpu-11.sdsc.optiputer.net
                      - ry-gpu-12.sdsc.optiputer.net
                      - ry-gpu-14.sdsc.optiputer.net
