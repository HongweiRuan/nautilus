# horuan-bon-m0-convert-train-001: convert WOMD v1.3.0 training (first 100 shards) to PufferDrive maps
# Generated by scripts/make_job.py. Pinned to ry-gpu-07.sdsc.optiputer.net (user instruction 2026-09-27).
apiVersion: batch/v1
kind: Job
metadata:
  name: horuan-bon-m0-convert-train-001
  namespace: cogrob
  labels:
    app: horuan-bon-m0-convert-train-001
    project: bestofncritic
    workload-type: batch
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 14400
  ttlSecondsAfterFinished: 259200
  template:
    metadata:
      labels:
        app: horuan-bon-m0-convert-train-001
        project: bestofncritic
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: ry-gpu-07.sdsc.optiputer.net
      containers:
        - name: worker
          image: python:3.11-bookworm
          imagePullPolicy: IfNotPresent
          command: ["bash", "-lc"]
          args:
            - |
              set -euo pipefail
              RUN=horuan-bon-m0-convert-train-001
              OUT=/avl-west/bestofncritic/runs/$RUN
              REPO=/hugsim-storage/bestofncritic
              mkdir -p "$OUT"
              cp "$REPO/COMMIT" "$OUT/commit.txt"
              nvidia-smi -L > "$OUT/gpu.txt" 2>&1 || true
              bash "$REPO/scripts/setup_pufferdrive.sh" > "$OUT/setup.log" 2>&1
              cp /root/pufferdrive_commit.txt "$OUT/pufferdrive_commit.txt"
              source /root/venv/bin/activate
              export PYTHONPATH="$REPO" OUT
              cd /root/src/PufferDrive
              ( bash $REPO/scripts/setup_womd_protos.sh > $OUT/protos.log 2>&1 && WORKERS=10 bash $REPO/scripts/convert_split.sh training 100 ) 2>&1 | tee "$OUT/run.log"
              echo "exit ok" >> "$OUT/run.log"
          resources:
            requests: {cpu: "10", memory: 24Gi, ephemeral-storage: 40Gi}
            limits: {cpu: "10", memory: 24Gi, ephemeral-storage: 40Gi}
          volumeMounts:
            - {name: dshm, mountPath: /dev/shm}
            - {name: hugsim-storage, mountPath: /hugsim-storage}
            - {name: avl-west-vol, mountPath: /avl-west}
      volumes:
        - name: dshm
          emptyDir: {medium: Memory, sizeLimit: 8Gi}
        - name: hugsim-storage
          persistentVolumeClaim: {claimName: horuan-hugsim-vol}
        - name: avl-west-vol
          persistentVolumeClaim: {claimName: avl-west-vol}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: topology.kubernetes.io/region, operator: In, values: ["us-west"]}
      tolerations:
        - {effect: NoSchedule, key: nautilus.io/reservation, operator: Equal, value: cogrob}
