# horuan-bon-m1-clsft-001: base tier 2: CAT-K-style closed-loop SFT of m1-base-003 (3 rounds x 2000 train maps) + closed-loop eval
# Generated by scripts/make_job.py. Pinned to ry-gpu-07.sdsc.optiputer.net (user instruction 2026-09-27).
apiVersion: batch/v1
kind: Job
metadata:
  name: horuan-bon-m1-clsft-001
  namespace: cogrob
  labels:
    app: horuan-bon-m1-clsft-001
    project: bestofncritic
    workload-type: batch
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 57600
  ttlSecondsAfterFinished: 259200
  template:
    metadata:
      labels:
        app: horuan-bon-m1-clsft-001
        project: bestofncritic
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: ry-gpu-07.sdsc.optiputer.net
      containers:
        - name: worker
          image: python:3.11-bookworm
          imagePullPolicy: IfNotPresent
          command: ["bash", "-lc"]
          args:
            - |
              set -euo pipefail
              RUN=horuan-bon-m1-clsft-001
              OUT=/avl-west/bestofncritic/runs/$RUN
              REPO=/hugsim-storage/bestofncritic
              mkdir -p "$OUT"
              cp "$REPO/COMMIT" "$OUT/commit.txt"
              nvidia-smi -L > "$OUT/gpu.txt" 2>&1 || true
              bash "$REPO/scripts/setup_pufferdrive.sh" > "$OUT/setup.log" 2>&1
              cp /root/pufferdrive_commit.txt "$OUT/pufferdrive_commit.txt"
              source /root/venv/bin/activate
              export PYTHONPATH="$REPO" OUT
              cd /root/src/PufferDrive
              ( python $REPO/scripts/closed_loop_sft.py --maps /avl-west/bestofncritic/data/puffer_v130/training --num-maps 20000 --batch-maps 500 --policy /avl-west/bestofncritic/runs/horuan-bon-m1-base-003/policy.pt --vocab /avl-west/bestofncritic/runs/horuan-bon-m1-base-003/vocab.npz --expert /avl-west/bestofncritic/runs/horuan-bon-m1-base-002/expert --rounds 3 --out $OUT && python $REPO/scripts/eval_closed_loop.py --maps /avl-west/bestofncritic/data/puffer_v130/validation --num-maps 2000 --batch 500 --policy $OUT/policy.pt --vocab $OUT/vocab.npz --rules base_logp --ns 1,16 --out $OUT/eval_base ) 2>&1 | tee "$OUT/run.log"
              echo "exit ok" >> "$OUT/run.log"
          resources:
            requests: {cpu: "8", memory: 64Gi, ephemeral-storage: 40Gi, nvidia.com/gpu: "1"}
            limits: {cpu: "8", memory: 64Gi, ephemeral-storage: 40Gi, nvidia.com/gpu: "1"}
          volumeMounts:
            - {name: dshm, mountPath: /dev/shm}
            - {name: hugsim-storage, mountPath: /hugsim-storage}
            - {name: avl-west-vol, mountPath: /avl-west}
      volumes:
        - name: dshm
          emptyDir: {medium: Memory, sizeLimit: 8Gi}
        - name: hugsim-storage
          persistentVolumeClaim: {claimName: horuan-hugsim-vol}
        - name: avl-west-vol
          persistentVolumeClaim: {claimName: avl-west-vol}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: topology.kubernetes.io/region, operator: In, values: ["us-west"]}
      tolerations:
        - {effect: NoSchedule, key: nautilus.io/reservation, operator: Equal, value: cogrob}
