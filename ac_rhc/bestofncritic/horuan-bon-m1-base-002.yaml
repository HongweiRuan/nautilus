# horuan-bon-m1-base-002: M1: expert tracking (20k train maps) -> BC chunk-token base policy -> closed-loop base eval (N=1, mode, base scorer N=4/16/64) on 2000 val maps
# Generated by scripts/make_job.py. Pinned to ry-gpu-07.sdsc.optiputer.net (user instruction 2026-09-27).
apiVersion: batch/v1
kind: Job
metadata:
  name: horuan-bon-m1-base-002
  namespace: cogrob
  labels:
    app: horuan-bon-m1-base-002
    project: bestofncritic
    workload-type: batch
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 57600
  ttlSecondsAfterFinished: 259200
  template:
    metadata:
      labels:
        app: horuan-bon-m1-base-002
        project: bestofncritic
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: ry-gpu-07.sdsc.optiputer.net
      containers:
