              source /root/venv/bin/activate
              export PYTHONPATH="$REPO" OUT
              cd /root/src/PufferDrive
              ( python $REPO/scripts/collect_expert.py --maps /avl-west/bestofncritic/data/puffer_v130/training --num-maps 20000 --batch 1000 --out $OUT/expert && python $REPO/scripts/train_base.py --data $OUT/expert --out $OUT --vocab 512 --epochs 20 --batch 1024 && python $REPO/scripts/eval_closed_loop.py --maps /avl-west/bestofncritic/data/puffer_v130/validation --num-maps 2000 --batch 500 --policy $OUT/policy.pt --vocab $OUT/vocab.npz --rules base_logp --ns 1,4,16,64 --out $OUT/eval_base && python $REPO/scripts/eval_closed_loop.py --maps /avl-west/bestofncritic/data/puffer_v130/validation --num-maps 2000 --batch 500 --policy $OUT/policy.pt --vocab $OUT/vocab.npz --rules base_logp --ns 1 --temperature 0.05 --out $OUT/eval_base ) 2>&1 | tee "$OUT/run.log"
