apiVersion: batch/v1
kind: Job
metadata:
  name: horuan-eval-__RUN__
  labels: {k8s-app: horuan-eval-__RUN__}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 64800
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels: {k8s-app: horuan-eval-__RUN__}
    spec:
      restartPolicy: Never
      containers:
        - image: robinwangucsd/metabench:latest
          name: fpc-eval
          command: ["bash", "-lc"]
          args:
            - |
              set -euo pipefail
              bash /hugsim-storage/flowplanner-critic/environment/setup_nautilus_env.sh
              source /opt/conda/etc/profile.d/conda.sh && conda activate nuplan-critic-rl
              cd /hugsim-storage/flowplanner-critic
              mkdir -p outputs/aqc_div50/eval
              echo "=== val14 eval run=__RUN__ ==="
              RUN_NAME=__RUN__ python jobs/eval_aqc_diversity.py 2>&1 | tee outputs/aqc_div50/eval/run___RUN__.log
          env:
            - {name: RUN_NAME, value: "__RUN__"}
            - {name: BATCH_PER_WORKER, value: "2"}
          resources:
            requests: {cpu: "8", memory: "160Gi", nvidia.com/gpu: "4", ephemeral-storage: 100Gi}
            limits:   {cpu: "8", memory: "160Gi", nvidia.com/gpu: "4", ephemeral-storage: 100Gi}
          volumeMounts:
            - {name: dshm, mountPath: /dev/shm}
            - {name: avl-west-vol, mountPath: /avl-west}
            - {name: closed-loop-e2e, mountPath: /closed-loop-e2e}
            - {name: hugsim-storage, mountPath: /hugsim-storage}
      volumes:
        - name: dshm
          emptyDir: {medium: Memory, sizeLimit: 24Gi}
        - name: avl-west-vol
          persistentVolumeClaim: {claimName: avl-west-vol}
        - name: closed-loop-e2e
          persistentVolumeClaim: {claimName: closed-loop-e2e}
        - name: hugsim-storage
          persistentVolumeClaim: {claimName: horuan-hugsim-vol}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: nvidia.com/gpu.product, operator: In, values: [NVIDIA-GeForce-RTX-3090]}
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - ry-gpu-01.sdsc.optiputer.net
                      - ry-gpu-02.sdsc.optiputer.net
                      - ry-gpu-03.sdsc.optiputer.net
                      - ry-gpu-04.sdsc.optiputer.net
                      - ry-gpu-06.sdsc.optiputer.net
                      - ry-gpu-07.sdsc.optiputer.net
                      - ry-gpu-08.sdsc.optiputer.net
                      - ry-gpu-09.sdsc.optiputer.net
                      - ry-gpu-11.sdsc.optiputer.net
                      - ry-gpu-12.sdsc.optiputer.net
                      - ry-gpu-13.sdsc.optiputer.net
                      - ry-gpu-14.sdsc.optiputer.net
      tolerations:
        - {effect: NoSchedule, key: nautilus.io/reservation, operator: Equal, value: cogrob}
