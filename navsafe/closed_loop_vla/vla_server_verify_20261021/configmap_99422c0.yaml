apiVersion: v1
binaryData:
  main.bundle: 
data:
  models_cl.tsv: "# label\tmodel_type\tcheckpoint relative to NAVSAFE_MODEL_ZOO (public
    dataset layout)\nrecogdrive_il\trecogdrive\trecogdrive/planner_il/ReCogDrive_Diffusion_Planner_2B_IL.ckpt\nresworld\tresworld\tresworld/resworld_trained.pth\ndrivevla_w0\tdrivevla_w0\tdrivevla_w0/Emu3_Flow_Matching_Action_Expert_PDMS_87.2\nsimwam_rl\tsimwam\tsimwam/weights/SimWAM-RL.pt\nmtdrive_sft\tmtdrive\tmtdrive/mtdrive_sft\ndrivelaw\tdrivelaw\tdrivelaw/inference_front.template.yaml\nautovla\tautovla\tautovla/AutoVLA_PDMS_89.ckpt\n"
  run_closed_loop.sh: |
    #!/usr/bin/env bash
    # Job A: closed-loop smoke test of every VLA model with `navsafe benchmark` on
    # one unedited scenario, renderer as a sidecar. The eval container has two
    # GPUs: 0 = simulator + policy client (NAVSAFE_GPU), 1 = the model server
    # (NAVSAFE_VLA_GPU). A short frame cap: this checks that each model drives in
    # the loop, it is not a benchmark score.
    set -uo pipefail
    JOBTAG=cl
    source /cfg/${SETUP_SCRIPT:-setup_env.sh}

    OUT=${OUT:?}
    TOKEN=${TOKEN:?}
    mkdir -p "$OUT" /root/out
    export NAVSAFE_DATA_ROOT=/avl-west/navsafe_eval
    export NAVSAFE_RENDERER=existing NUREC_GRPC_HOST=127.0.0.1 NUREC_GRPC_PORT=8080
    export NAVSAFE_GPU=0 NAVSAFE_VLA_GPU=1
    export NAVSAFE_EVAL_FRAMES=${NAVSAFE_EVAL_FRAMES:-100} NAVSAFE_RETRIES=1
    export NAVSAFE_EPISODE_TIMEOUT=${NAVSAFE_EPISODE_TIMEOUT:-60m}
    printf '%s\n' "$TOKEN" > /root/tokens.txt
    export NAVSAFE_TOKENS=/root/tokens.txt

    # Warm Omniverse Kit cache (7-8 min of shader compilation per Isaac Sim boot
    # otherwise, paid once per model here). Keyed by driver version.
    DRV=$(nvidia-smi --query-gpu=driver_version --format=csv,noheader | head -1 | tr -d ' ')
    KITCACHE=/avl-west/navsafe_dev/kitcache/kitcache-3090-$DRV.tar
    KITPKG=$(python -c "import isaacsim, os; print(os.path.dirname(isaacsim.__file__))" 2>/dev/null)
    if [ -f "$KITCACHE" ] && [ -n "$KITPKG" ] && tar -xf "$KITCACHE" -C "$KITPKG" kit && tar -xf "$KITCACHE" -C / var root; then
      say "Kit cache restored ($KITCACHE)"
    else
      say "no Kit cache restored for driver $DRV; each Isaac Sim boot recompiles"
    fi

    for _ in $(seq 1 120); do
      (exec 3<>/dev/tcp/127.0.0.1/8080) 2>/dev/null && { exec 3<&- 3>&-; break; }
      sleep 10
    done
    (exec 3<>/dev/tcp/127.0.0.1/8080) 2>/dev/null && exec 3<&- 3>&- || die "renderer not reachable"
    say "renderer up"

    declare -A RESULT
    FAILED=0
    while IFS=$'\t' read -r LABEL MT CK; do
      [ -z "$LABEL" ] || [ "${LABEL#\#}" != "$LABEL" ] && continue
      case " ${MODELS_CL:-$LABEL} " in *" $LABEL "*) ;; *) continue ;; esac
      LOCAL=/root/out/$LABEL
      export NAVSAFE_OUT_ROOT=$LOCAL
      say "=== $LABEL: navsafe benchmark $MT $NAVSAFE_MODEL_ZOO/$CK"
      t0=$(date +%s)
      # NO_EXTRA_FOR: models run without NAVSAFE_VLA_EXTRA_PYTHONPATH (vla_client
      # hands it to every model process, and ResWorld's py3.8 cannot take the
      # py3.12 nuPlan side dir that DriveLaW needs).
      if [[ " ${NO_EXTRA_FOR:-} " == *" $LABEL "* ]]; then
        env -u NAVSAFE_VLA_EXTRA_PYTHONPATH navsafe benchmark "$MT" "$NAVSAFE_MODEL_ZOO/$CK" > "/root/out/$LABEL.benchmark.log" 2>&1
      else
        navsafe benchmark "$MT" "$NAVSAFE_MODEL_ZOO/$CK" > "/root/out/$LABEL.benchmark.log" 2>&1
      fi
      rc=$?
      dt=$(( $(date +%s) - t0 ))
      M="$LOCAL/scenarios/$TOKEN/navsafe_metrics.json"
      if [ -f "$M" ]; then
        RESULT[$LABEL]=$(python - "$M" <<'PY'
    import json, sys
    d = json.load(open(sys.argv[1]))
    m = d.get("metrics") or {}
    keys = [k for k in ("DS", "ds", "driving_score", "route_completion", "RC") if k in m]
    print(d.get("status"), (d.get("termination") or {}).get("reason"), d.get("frames"),
          {k: m[k] for k in keys} or sorted(m)[:6])
    PY
    )
      else
        RESULT[$LABEL]="no navsafe_metrics.json"
      fi
      [ "$rc" -eq 0 ] || FAILED=$((FAILED + 1))
      say "--- $LABEL rc=$rc ${dt}s: ${RESULT[$LABEL]}"
      grep -hE "server ready|Starting .* server|VLA server|Traceback|Error|navsafe: DS|\[server\]|\[simwam\]|\[drivevla_w0\]" \
        "$LOCAL"/logs/*.log 2>/dev/null | cut -c1-240 | tail -25
      mkdir -p "$OUT/$LABEL"
      cp -r "$LOCAL"/. "$OUT/$LABEL"/ 2>/dev/null; cp "/root/out/$LABEL.benchmark.log" "$OUT/" 2>/dev/null
    done < /cfg/models_cl.tsv

    say "summary ($TOKEN, NAVSAFE_EVAL_FRAMES=$NAVSAFE_EVAL_FRAMES)"
    for k in "${!RESULT[@]}"; do echo "  $k: ${RESULT[$k]}"; done
    say "closed loop done, $FAILED model(s) not scored; results in $OUT"
    [ "$FAILED" -eq 0 ]
  setup_env_v2.sh: |
    #!/usr/bin/env bash
    # Setup for the 99422c0 rerun (sourced). Follows the repo's own docs as a
    # public user would:
    #   README:  git clone --recurse-submodules, uv sync --locked --python 3.12
    #   docs/models.md "Upstream code":     the submodule command, run verbatim
    #   docs/models.md "Model environment": the bash block, run verbatim
    # The two doc blocks are extracted from the checkout's docs/models.md, so a
    # wrong command in the docs fails here. No NAVSAFE_VLA_PYTHON and no
    # NAVSAFE_*_REPO are exported: the documented defaults are what is tested.
    # NAVSAFE_VLA_EXTRA_PYTHONPATH stays exported for every model (fix 3).
    #
    # Needs: JOBTAG, EXPECT_SHA, /cfg/main.bundle. Leaves: REPO, exports, `say`.

    say() { echo "[$JOBTAG $(date -u +%H:%M:%S)] $*"; }
    die() { say "FATAL: $*"; exit 1; }

    PVC_ZOO=/avl-west/navsafe_eval/model_zoo
    VLA_REPOS=/avl-west/navsafe_eval/vla_repos
    ENV_KIT=/avl-west/navsafe_eval/env_kit
    REPO=/root/NavSafe-infty

    say "GPU: $(nvidia-smi --query-gpu=index,name,memory.total,driver_version --format=csv,noheader | tr '\n' ';')"

    # docs/installation.md system packages, plus python3-dev, which docs/models.md
    # asks for when the model environment uses Ubuntu's system Python.
    export DEBIAN_FRONTEND=noninteractive
    apt-get update -qq && apt-get install -y -qq git curl ca-certificates python3-dev \
      libglu1-mesa libxt6 libgl1 libglx0 libegl1 libglib2.0-0 libxrandr2 libxinerama1 \
      libxcursor1 libxi6 libxext6 libxrender1 libx11-6 libxfixes3 libxdamage1 libsm6 \
      libice6 libgomp1 >/dev/null || die "apt"

    export PATH=$HOME/.local/bin:$PATH UV_CACHE_DIR=/root/.cache/uv
    for i in 1 2 3 4; do
      command -v uv >/dev/null && break
      curl -LsSf https://astral.sh/uv/install.sh | sh >/dev/null 2>&1; hash -r; sleep 5
    done
    command -v uv >/dev/null || die "uv unavailable"

    # ── NavSafe-infty at EXPECT_SHA ─────────────────────────────────────────────
    git clone --quiet --recurse-submodules https://github.com/VAIL-UCLA/NavSafe-infty.git "$REPO" \
      || die "clone"
    git -C "$REPO" fetch --quiet /cfg/main.bundle main:refs/heads/verify-main || die "bundle fetch"
    git -C "$REPO" checkout --quiet verify-main || die "checkout"
    [ "$(git -C "$REPO" rev-parse HEAD)" = "$EXPECT_SHA" ] || die "HEAD is not $EXPECT_SHA"
    say "code at $(git -C "$REPO" log --oneline -1)"
    cd "$REPO" || die "cd"

    # README, existing checkout: must init IsaacLab only; the VLA ones are update=none.
    git submodule update --init --recursive --quiet || die "submodule update (README)"
    for n in AutoVLA DriveLaW DriveVLA-W0 ResWorld SimWAM; do
      [ -z "$(ls -A third_party/$n 2>/dev/null)" ] && say "README submodule update skipped third_party/$n (update = none): ok" \
        || say "WARN third_party/$n was populated by the README submodule update"
    done

    # docs/models.md "Upstream code", verbatim.
    python3 - docs/models.md > /tmp/doc_upstream.sh <<'PY' || die "no Upstream code block in docs/models.md"
    import re, sys
    t = open(sys.argv[1]).read()
    print(re.search(r"```bash\n(.*?)```", t.split("### Upstream code", 1)[1], re.S).group(1))
    PY
    say "docs 'Upstream code': $(cat /tmp/doc_upstream.sh | tr '\n' ' ')"
    bash -euo pipefail /tmp/doc_upstream.sh || die "docs 'Upstream code' command failed"
    PINS_OK=1
    for n in AutoVLA DriveLaW DriveVLA-W0 ResWorld SimWAM; do
      want=$(git ls-tree HEAD "third_party/$n" | awk '{print $3}')
      have=$(git -C "third_party/$n" rev-parse HEAD 2>/dev/null)
      if [ "$want" = "$have" ]; then say "submodule $n at pinned ${have:0:7}: ok"
      else say "submodule $n at '${have:0:7}', pinned '${want:0:7}': MISMATCH"; PINS_OK=0; fi
    done
    [ "$PINS_OK" = 1 ] || die "submodule pins"

    # Diagnostic only: what the PVC checkouts the earlier evals used have that a
    # fresh clone does not (local edits, untracked or ignored files).
    for pair in AutoVLA:AutoVLA DriveLaW:drivelaw DriveVLA-W0:DriveVLA-W0 ResWorld:ResWorld SimWAM:SimWAM; do
      n=${pair%%:*}; pvc=$VLA_REPOS/${pair#*:}
      say "PVC $pvc HEAD $(git -C "$pvc" rev-parse --short HEAD 2>&1 | tail -1); local changes:"
      timeout 300 git -C "$pvc" -c core.fileMode=false status --porcelain --ignored 2>&1 \
        | grep -v "__pycache__\|\.pyc$\|\.egg-info" | head -15 | sed 's/^/      /'
    done

    # Lock files: repo copies against the env_kit the earlier evals used.
    for p in requirements.lock.txt:vla_requirements.lock.txt drivelaw-extra.lock.txt:vla_extra_site_requirements.lock.txt; do
      cmp -s "deploy/envs/vla/${p%%:*}" "$ENV_KIT/${p#*:}" \
        && say "lock deploy/envs/vla/${p%%:*} == env_kit/${p#*:}: identical" \
        || say "lock deploy/envs/vla/${p%%:*} differs from env_kit/${p#*:}"
    done

    # README install.
    say "uv sync --locked --python 3.12 (README)"
    uv sync --locked --python 3.12 2>&1 | tail -3 || die "uv sync"
    "$REPO/.venv/bin/python" -c "import navsafe" || die "navsafe not importable"
    [ -z "$(git status --porcelain --untracked-files=no)" ] || { git status --porcelain --untracked-files=no; die "tracked files modified"; }
    export PATH="$REPO/.venv/bin:$PATH"

    # docs/models.md "Model environment", verbatim.
    python3 - docs/models.md > /tmp/doc_vla_env.sh <<'PY' || die "no Model environment block in docs/models.md"
    import re, sys
    t = open(sys.argv[1]).read()
    print(re.search(r"```bash\n(.*?)```", t.split("### Model environment", 1)[1], re.S).group(1))
    PY
    # DOC_PATCH_NO_CONFIG=1: the block as written fails from the repo root, where
    # `uv pip` applies the project's [tool.uv] overrides (transformers==5.12.0).
    # This tests the proposed doc fix: --no-config on every `uv pip install`.
    if [ "${DOC_PATCH_NO_CONFIG:-0}" = 1 ]; then
      sed -i 's/^uv pip install /uv pip install --no-config /' /tmp/doc_vla_env.sh
      say "DEVIATION from docs: added --no-config to each 'uv pip install' line"
    fi
    say "docs 'Model environment' block:"; sed 's/^/      /' /tmp/doc_vla_env.sh
    bash -euo pipefail /tmp/doc_vla_env.sh || die "docs 'Model environment' block failed"
    eval "$(grep '^export ' /tmp/doc_vla_env.sh)"
    say "NAVSAFE_VLA_EXTRA_PYTHONPATH=$NAVSAFE_VLA_EXTRA_PYTHONPATH (kept for every model)"
    VLA_PY=$HOME/.cache/navsafe/venvs/vla/bin/python
    "$VLA_PY" -c "import torch, transformers, tiktoken, blobfile, scipy; print('vla venv: torch', torch.__version__, 'cuda', torch.cuda.is_available(), 'transformers', transformers.__version__)" \
      || die "vla venv unusable"
    [ -z "${NAVSAFE_VLA_PYTHON:-}" ] || die "NAVSAFE_VLA_PYTHON must stay unset (default under test)"

    # Model zoo in the public dataset layout (symlinks into the PVC zoo).
    Z=/root/zoo
    mkdir -p "$Z/_base"
    for d in "$PVC_ZOO"/*; do
      b=$(basename "$d"); [ "$b" = _base ] || ln -s "$d" "$Z/$b"
    done
    ln -s "$PVC_ZOO/_base/diffsynth" "$Z/_base/diffsynth"
    ln -s "$PVC_ZOO/_base/qwen2.5-vl-3b-instruct" "$Z/_base/qwen2.5-vl-3b-instruct"
    ln -s "$PVC_ZOO/drivevla_w0/Emu3-Stage1" "$Z/_base/emu3-stage1"
    ln -s "$PVC_ZOO/drivevla_w0/Emu3-VisionTokenizer" "$Z/_base/emu3-visiontokenizer"
    export NAVSAFE_MODEL_ZOO=$Z

    # ResWorld keeps the PVC py3.8 venv (built per the ResWorld README).
    export NAVSAFE_RESWORLD_PYTHON=$VLA_REPOS/resworld-venv/bin/python
    "$NAVSAFE_RESWORLD_PYTHON" -c 'import torch, mmcv, mmdet3d' 2>/dev/null || die "ResWorld venv cannot import torch/mmcv/mmdet3d"
    for v in NAVSAFE_AUTOVLA_REPO NAVSAFE_SIMWAM_REPO NAVSAFE_DRIVELAW_REPO NAVSAFE_DRIVEVLA_W0_REPO NAVSAFE_RESWORLD_REPO; do
      [ -z "${!v:-}" ] || die "$v must stay unset (third_party default under test)"
    done
    export ACCEPT_EULA=Y OMNI_KIT_ACCEPT_EULA=YES
    say "setup done"
kind: ConfigMap
metadata:
  name: hw-vla-verify-99422c0
  namespace: cogrob
