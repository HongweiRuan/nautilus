apiVersion: v1
kind: ConfigMap
metadata:
  name: navsafe-heatmap-27x30-20260913-cfg
  namespace: cogrob
data:
  run_worker.sh: "#!/usr/bin/env bash\n# 27 scenarios, two DrivoR checkpoints, seeds\
    \ 0..29; no ego perturbation.\nset -uo pipefail\n\n: \"${WORKER_INDEX:?}\" \"\
    ${WORKERS:?}\" \"${SEEDS:?}\" \"${NEXUSSIM_SHA:?}\"\n\n# How many cards this pod\
    \ actually got decides the layout. See the note above.\nN_GPU=$(nvidia-smi -L\
    \ 2>/dev/null | grep -c '^GPU ')\nif [ \"${N_GPU:-1}\" -ge 2 ]; then\n  RENDER_CACHE=4;\
    \ EVAL_GPU=1; GPU_LAYOUT=\"$N_GPU cards, rollout on GPU $EVAL_GPU\"\nelse\n  RENDER_CACHE=2;\
    \ EVAL_GPU=0;             GPU_LAYOUT=\"1 card, shared with the rollout\"\nfi\n\
    ROOT=/avl-west/navsafe_eval\nOUTROOT=${OUTROOT:-/avl-west/navsafe_eval/perturbation}\n\
    \n# Asset/gait banks. 7 of the 28 proxy tokens carry an edited recipe that inserts\n\
    # actors (e.g. 'car_6.ply'); the recipe stores the authoring machine's absolute\n\
    # path, so replay must rebase it against these banks. Unset => RecipeError at\n\
    # argument-parse time, ~10s per cell, which trips the consecutive-failure guard\n\
    # and blames the node. Set here rather than in the job YAML so a future copy of\n\
    # this script cannot lose them silently -- which is exactly how they went missing\n\
    # in this campaign's first launch (the source campaign only ran recipe-free\n\
    # tokens, so it never noticed). Override from the environment if ever needed.\n\
    export NAVSAFE_ASSET_BANK=${NAVSAFE_ASSET_BANK:-$ROOT/asset}\nexport NAVSAFE_GAIT_BANK=${NAVSAFE_GAIT_BANK:-$ROOT/gait_bank}\n\
    for _b in \"$NAVSAFE_ASSET_BANK\" \"$NAVSAFE_GAIT_BANK\"; do\n  [ -d \"$_b\" ]\
    \ || { echo \"FATAL: bank missing: $_b\"; exit 1; }\ndone\nMODELS_TSV=${MODELS_TSV:-/cfg/models.tsv}\n\
    SELECTION=${SELECTION:-/cfg/selection.json}\nZOO=$ROOT/model_zoo\nHARMONIZER_CACHE=${HARMONIZER_CACHE:-/avl-west/navsafe_dev/.harmonizer-cache}\n\
    PORT=8080\nCELL_TIMEOUT=${CELL_TIMEOUT:-45m}\nW=$(printf 'w%02d' \"$WORKER_INDEX\"\
    )\n\nsay() { echo \"[$W $(date -u +%H:%M:%S)] $*\"; }\n\n# \u2500\u2500 0. which\
    \ scenarios are mine \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n# One line per selected\
    \ scenario, sorted, so every worker computes the same\n# list from the same file\
    \ and no worker needs to be told which slice is its\n# own. Fields: leaf, token,\
    \ handoff frame, data root, recipe-or-'-',\n# nurec work dir-or-'-'.\nmapfile\
    \ -t ALL_ROWS < <(python3 - \"$SELECTION\" <<'PY'\nimport json, sys\nsel = json.load(open(sys.argv[1]))\n\
    default = \",\".join(a[\"id\"] for a in sel[\"grid\"][\"arms\"])\nrows = []\n\
    for leaf, block in sel[\"leaves\"].items():\n    for p in block[\"picked\"]:\n\
    \        # A scenario may name its OWN arm subset. A leaf whose geometry cannot\n\
    \        # take the full grid -- C-8 is backing, where the ego sits against the\n\
    \        # kerb and 1.5 m to its right is the pavement -- would otherwise have\n\
    \        # to be dropped or run with a single scenario. Absent, the full grid.\n\
    \        rows.append(\"\\t\".join([\n            leaf, p[\"token\"], str(p[\"\
    handoff\"]), p[\"data_root\"],\n            p.get(\"recipe\") or \"-\", p.get(\"\
    nurec_work_dir\") or \"-\",\n            \",\".join(p[\"arms_run\"]) if p.get(\"\
    arms_run\") else default,\n            str(p[\"ego_frames\"])]))\nprint(\"\\n\"\
    .join(sorted(rows)))\nPY\n)\n[ ${#ALL_ROWS[@]} -gt 0 ] || { say \"no scenarios\
    \ in $SELECTION\"; exit 1; }\nMY_ROWS=()\nfor i in \"${!ALL_ROWS[@]}\"; do\n \
    \ [ $(( i % WORKERS )) -eq \"$WORKER_INDEX\" ] && MY_ROWS+=(\"${ALL_ROWS[$i]}\"\
    )\ndone\nsay \"scenarios ${#ALL_ROWS[@]} selected, ${#MY_ROWS[@]} mine\"\n[ ${#MY_ROWS[@]}\
    \ -gt 0 ] || { say \"nothing to do\"; exit 0; }\n\n# The perturbation grid travels\
    \ in the same file as the selection it was\n# screened against -- a grid and a\
    \ screening that can disagree is a campaign\n# that silently evaluates arms nobody\
    \ checked.\nmapfile -t ARMS < <(python3 - \"$SELECTION\" <<'PY'\nimport json,\
    \ sys\nfor a in json.load(open(sys.argv[1]))[\"grid\"][\"arms\"]:\n    print(f'{a[\"\
    id\"]}\\t{a[\"lat\"]}\\t{a[\"lon\"]}\\t{a[\"yaw\"]}')\nPY\n)\nsay \"arms ${#ARMS[@]}:\
    \ $(printf '%s\\n' \"${ARMS[@]}\" | cut -f1 | tr '\\n' ' ')\"\n\nmapfile -t ROWS\
    \ < <(grep -v '^\\s*#' \"$MODELS_TSV\" | grep -v '^\\s*$')\nsay \"models: $(printf\
    \ '%s\\n' \"${ROWS[@]}\" | cut -f1 | tr '\\n' ' ')\"\nsay \"gpu: $GPU_LAYOUT,\
    \ renderer --cache-size $RENDER_CACHE\"\n\n# \u2500\u2500 1. environment \u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\n# Verbatim from the rerun worker: the venv\
    \ is built on the pod's own ephemeral\n# /root every time, ~15 minutes, paid once\
    \ per pod and amortised over ~250\n# cells.\nexport DEBIAN_FRONTEND=noninteractive\n\
    say \"apt: GL/X libs the renderer and IsaacSim need\"\napt-get update -qq && apt-get\
    \ install -y -qq git curl python3-venv python3-dev \\\n  libglu1-mesa libxt6 libgl1\
    \ libglx0 libegl1 libglib2.0-0 libxrandr2 libxinerama1 \\\n  libxcursor1 libxi6\
    \ libxext6 libxrender1 libx11-6 libxfixes3 libxdamage1 libsm6 \\\n  libice6 libgomp1\
    \ >/dev/null || { say \"apt FAILED\"; exit 1; }\n\nexport PATH=$HOME/.local/bin:$HOME/.cargo/bin:$PATH\n\
    export UV_CACHE_DIR=/root/.cache/uv UV_PROJECT_ENVIRONMENT=/root/ns-venv\nfor\
    \ i in 1 2 3 4; do\n  command -v uv >/dev/null && break\n  python -m pip install\
    \ --quiet --user uv 2>/dev/null \\\n    || pip install --quiet --user uv 2>/dev/null\
    \ \\\n    || curl -LsSf https://astral.sh/uv/install.sh | sh\n  hash -r; sleep\
    \ 5\ndone\ncommand -v uv >/dev/null || { say \"uv unavailable\"; exit 1; }\n\n\
    REPO=/root/ns\n[ ! -e \"$REPO\" ] || { say \"$REPO already exists; use a fresh\
    \ worker pod\"; exit 1; }\ngit clone --quiet --no-hardlinks /hugsim-storage/NexusSim\
    \ \"$REPO\" || { say \"clone FAILED\"; exit 1; }\ngit -C \"$REPO\" checkout --quiet\
    \ \"$NEXUSSIM_SHA\" || { say \"checkout $NEXUSSIM_SHA FAILED\"; exit 1; }\nsay\
    \ \"code at $(git -C \"$REPO\" log --oneline -1)\"\n\ncd \"$REPO\"\nif ! /root/ns-venv/bin/python\
    \ -c \"import isaacsim, isaaclab, nexussim\" 2>/dev/null; then\n  say \"uv sync\
    \ (IsaacSim 6.0 + cu128 torch, ~15 min)\"\n  uv sync --all-extras --python 3.12\
    \ || { say \"uv sync FAILED\"; exit 1; }\n  [ -d /root/IsaacLab/.git ] || git\
    \ clone --depth 1 --branch v3.0.0-beta \\\n    https://github.com/isaac-sim/IsaacLab.git\
    \ /root/IsaacLab\n  for ext in isaaclab isaaclab_assets isaaclab_tasks isaaclab_rl\
    \ isaaclab_mimic; do\n    d=/root/IsaacLab/source/$ext\n    [ -d \"$d\" ] && uv\
    \ pip install --python /root/ns-venv/bin/python --no-deps -e \"$d\" >/dev/null\n\
    \  done\n  uv pip install --python /root/ns-venv/bin/python lazy_loader einops\
    \ >/dev/null\n  uv pip install --python /root/ns-venv/bin/python ninja >/dev/null\n\
    fi\nPY=/root/ns-venv/bin/python\n\"$PY\" -c \"import nexussim, isaaclab\" || {\
    \ say \"venv unusable\"; exit 1; }\n\n# \u2500\u2500 1a. Omniverse Kit shader\
    \ cache \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\n# 7.6 of the ~10 minutes an IsaacSim boot costs\
    \ is Kit compiling materials\n# (omni.ujitso) and the ray-tracing pipeline, into\
    \ a cache that dies with the\n# pod. Restoring a warm tar takes AppLauncher from\
    \ 467 s to 10.5 s. Compilation\n# happens on an empty stage, before any scene\
    \ is read, so one tar serves every\n# scenario; it is keyed by DRIVER version\
    \ because the OptiX/Vulkan pipeline\n# caches are.\n#\n# EULA FIRST, and that\
    \ ordering is the whole point. Locating the tar's\n# destination needs `import\
    \ isaacsim`, and that import without ACCEPT_EULA\n# blocks on an interactive prompt\
    \ and exits 1 -- so a script that exports the\n# EULA vars AFTER this block restores\
    \ nothing, says only \"cannot locate the\n# isaacsim package\", and pays the eight\
    \ minutes anyway. That is exactly what\n# navsafe_eval/run_worker_current.sh does,\
    \ which is why the production eval\n# workers have never actually had this cache.\n\
    export ACCEPT_EULA=Y OMNI_KIT_ACCEPT_EULA=YES\nKITCACHE=/avl-west/navsafe_dev/kitcache/kitcache-3090-$(nvidia-smi\
    \ --query-gpu=driver_version --format=csv,noheader 2>/dev/null | head -1 | tr\
    \ -d \" \").tar\nif [ -f \"$KITCACHE\" ]; then\n  KITPKG=$(\"$PY\" -c \"import\
    \ isaacsim, os; print(os.path.dirname(isaacsim.__file__))\" 2>/dev/null)\n  if\
    \ [ -n \"$KITPKG\" ] && tar -xf \"$KITCACHE\" -C \"$KITPKG\" kit && tar -xf \"\
    $KITCACHE\" -C / var root; then\n    say \"Kit shader cache restored into $KITPKG\"\
    \n  else\n    say \"Kit cache restore FAILED \u2014 the first IsaacSim boot recompiles\
    \ (~8 min)\"\n  fi\nelse\n  say \"no Kit cache at $KITCACHE \u2014 first boot\
    \ recompiles (~8 min)\"\nfi\ngit -C \"$REPO\" checkout -- uv.lock 2>/dev/null\
    \ || true\nexport PATH=/root/ns-venv/bin:$PATH\nINC=$(\"$PY\" -c 'import sysconfig;\
    \ print(sysconfig.get_paths()[\"include\"])')\n[ -f \"$INC/Python.h\" ] || { say\
    \ \"missing Python.h\"; exit 1; }\nsay \"venv ready ($(git -C \"$REPO\" status\
    \ --porcelain | wc -l) tracked files modified)\"\n\n# \u2500\u2500 1b. VLA venv\
    \ (recogdrive_rl) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n# recogdrive and simwam\
    \ run their models in a persistent subprocess under the\n# shared vla venv built\
    \ from the proven lockfile. resworld was NOT here: it has\n# its own py3.8 venv\
    \ on the PVC and resworld.py defaults to it, which is why\n# swapping resworld\
    \ for simwam means adding simwam to this list -- without it\n# the venv is never\
    \ built, NAVSAFE_VLA_PYTHON keeps its /bigdata default, and\n# the adapter dies\
    \ on a missing interpreter before it ever reaches the GPU.\n# Every slug here\
    \ must be listed EXACTLY. `simwam\\b` does not match\n# `simwam_base`: an underscore\
    \ is a word character, so there is no word\n# boundary between them, and a slug\
    \ that slips past this test gets no venv\n# at all -- NAVSAFE_VLA_PYTHON keeps\
    \ its /bigdata default and the adapter\n# dies on a missing interpreter before\
    \ it ever reaches a GPU.\nif grep -qE '^(recogdrive_il|recogdrive_rl|mtdrive_sft|mtdrive_mtgrpo|autovla|drivelaw|simwam|simwam_base|drivevla_w0)\\\
    b' \"$MODELS_TSV\"; then\n  VLA_LOCK=/avl-west/navsafe_eval/env_kit/vla_requirements.lock.txt\n\
    \  VLA_EXTRA_LOCK=/avl-west/navsafe_eval/env_kit/vla_extra_site_requirements.lock.txt\n\
    \  [ -f \"$VLA_LOCK\" ] || { say \"VLA lockfile missing at $VLA_LOCK\"; exit 1;\
    \ }\n  if [ ! -x /root/vla-venv/bin/python ]; then\n    say \"building vla-venv\
    \ (torch 2.10.0+cu128 + transformers 4.57.6, ~5 min)\"\n    uv venv --python 3.12\
    \ /root/vla-venv >/dev/null || { say \"vla-venv create FAILED\"; exit 1; }\n \
    \   grep -v '^omegaconf==' \"$VLA_LOCK\" > /tmp/vla_reqs.txt\n    uv pip install\
    \ --python /root/vla-venv/bin/python \\\n      --extra-index-url https://download.pytorch.org/whl/cu128\
    \ \\\n      --index-strategy unsafe-best-match \\\n      -r /tmp/vla_reqs.txt\
    \ || { say \"vla-venv install FAILED\"; exit 1; }\n    uv pip install --python\
    \ /root/vla-venv/bin/python --no-deps omegaconf==2.4.0.dev14 \\\n      || { say\
    \ \"vla-venv omegaconf FAILED\"; exit 1; }\n  fi\n  export NAVSAFE_VLA_PYTHON=/root/vla-venv/bin/python\n\
    fi\n\nif grep -q '^drivevla_w0\\b' \"$MODELS_TSV\"; then\n  # Three packages the\
    \ shared lockfile does not carry, because no earlier VLA\n  # row needed them:\
    \ tiktoken/blobfile are what Emu3Tokenizer imports, and\n  # scipy is required\
    \ by the FAST action tokenizer's remote code (transformers\n  # refuses to load\
    \ that module without it). Installed into vla-venv rather\n  # than a side site-dir\
    \ -- unlike DriveLaW's nuplan devkit these are ordinary\n  # leaf packages and\
    \ cannot shadow another row's torch/numpy.\n  /root/vla-venv/bin/python -c 'import\
    \ tiktoken, scipy' 2>/dev/null || \\\n    uv pip install --python /root/vla-venv/bin/python\
    \ tiktoken blobfile scipy \\\n      || { say \"drivevla_w0 deps FAILED\"; exit\
    \ 1; }\nfi\nif grep -q '^drivelaw\\b' \"$MODELS_TSV\"; then\n  # DriveLaW's navsim\
    \ fork imports nuplan.common.actor_state beyond what\n  # drivelaw_server.py's\
    \ own stub covers; the real devkit has to be\n  # importable. Installed --no-deps\
    \ into a side site-dir (not into vla-venv\n  # itself) so its own transitive deps\
    \ never shadow vla-venv's torch/numpy for\n  # the other 5 VLA rows sharing that\
    \ venv.\n  [ -d /root/vla_extra_site ] || {\n    mkdir -p /root/vla_extra_site\n\
    \    uv pip install --target /root/vla_extra_site --no-deps -r \"$VLA_EXTRA_LOCK\"\
    \ \\\n      || { say \"vla_extra_site FAILED\"; exit 1; }\n  }\n  export NAVSAFE_VLA_EXTRA_PYTHONPATH=/root/vla_extra_site\n\
    \  [ -f /avl-west/navsafe_eval/model_zoo/drivelaw/inference_front.yaml ] || {\
    \ say \"missing DriveLaW config\"; exit 1; }\nfi\n\n# \u2500\u2500 1c. ResWorld\
    \ venv \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\n# ResWorld is a nuScenes/mmdet3d model,\
    \ not a navsim one: py3.8 + torch\n# 1.9.1+cu111 + mmcv-full 1.4.0 + a source-built\
    \ mmdet3d 0.17.1 with CUDA ops.\n# None of that can share vla-venv (py3.12 / torch\
    \ 2.10), so it gets its own,\n# and unlike vla-venv this one lives on the PVC\
    \ \u2014 the mmdet3d compile is ~10\n# minutes and there is no reason for every\
    \ worker to repeat it.\n#\n# Two fixes are baked into that PVC copy rather than\
    \ installed here, because\n# both are edits to third-party source: mmdet3d 0.17's\n\
    # `from numba.errors import NumbaPerformanceWarning` (the alias numba dropped\n\
    # in 0.49, so it fails against the pinned 0.53), and the pandas/lyft-sdk deps\n\
    # mmdet3d imports unconditionally.\nif grep -q '^resworld\\b' \"$MODELS_TSV\"\
    ; then\n  RW_VENV=/avl-west/navsafe_eval/vla_repos/resworld-venv\n  # `test -x`\
    \ is not enough and was not enough: the first build of this venv\n  # pointed\
    \ bin/python at a uv-managed interpreter under /root, which is the\n  # POD's\
    \ ephemeral disk. The symlink survives on the PVC, its target does\n  # not, so\
    \ `-x` fails on a venv that looks perfectly intact \u2014 and would fail\n  #\
    \ identically on every fresh worker. The venv is rebuilt --relocatable with\n\
    \  # its interpreter beside it under vla_repos/resworld-python; the check that\n\
    \  # actually means something is whether it can import the stack.\n  \"$RW_VENV/bin/python\"\
    \ -c 'import torch, mmcv, mmdet3d' 2>/dev/null || {\n    say \"ResWorld venv at\
    \ $RW_VENV cannot import torch/mmcv/mmdet3d\"\n    say \"  (if bin/python is a\
    \ dangling symlink, its interpreter was on a dead pod's disk)\"\n    ls -l \"\
    $RW_VENV/bin/python\" 2>&1 | while read -r l; do say \"  $l\"; done\n    exit\
    \ 1\n  }\n  export NAVSAFE_RESWORLD_PYTHON=\"$RW_VENV/bin/python\"\n  say \"ResWorld\
    \ venv OK ($RW_VENV)\"\nfi\n\n# \u2500\u2500 2. the renderer \u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\n# --artifact-glob covers only THIS worker's scenarios; pointing\
    \ every worker at\n# all 500 reconstructions would make each scan half a terabyte\
    \ of CephFS to\n# serve a handful of scenes.\nSHARD=/root/shard\nmkdir -p \"$SHARD\"\
    \nMY_SCENES=()\nfor ROW in \"${MY_ROWS[@]}\"; do\n  IFS=$'\\t' read -r _L T _H\
    \ _DR _RC _WD _AR _EF <<< \"$ROW\"\n  for f in /avl-west/navsafe_eval/dataset/\"\
    $T\"/*.usdz \\\n           /avl-west/navsafe_dev/full_test_mirror/\"$T\"/*.usdz;\
    \ do\n    [ -e \"$f\" ] || continue\n    b=$(basename \"$f\")\n    [ -e \"$SHARD/$b\"\
    \ ] && continue\n    ln -sf \"$f\" \"$SHARD/$b\"; MY_SCENES+=(\"${b%.usdz}\")\n\
    \  done\ndone\nmkdir -p \"$HARMONIZER_CACHE\"\nsay \"shard holds ${#MY_SCENES[@]}\
    \ reconstructions\"\n\nSERVE_PID=\"\"\n# A killed /app/run leaves its children\
    \ alive, and an orphaned renderer holds\n# ~19 GB that the replacement then cannot\
    \ get -- every subsequent cell OOMs.\n# Kill the tree and wait for the port to\
    \ actually free.\nstop_serve() {\n  [ -n \"$SERVE_PID\" ] || return 0\n  pkill\
    \ -TERM -P \"$SERVE_PID\" 2>/dev/null\n  kill -TERM \"$SERVE_PID\" 2>/dev/null\n\
    \  sleep 5\n  pkill -KILL -P \"$SERVE_PID\" 2>/dev/null\n  kill -KILL \"$SERVE_PID\"\
    \ 2>/dev/null\n  pkill -KILL -f 'serve-grpc' 2>/dev/null\n  for _ in $(seq 1 30);\
    \ do\n    (exec 3<>\"/dev/tcp/127.0.0.1/$PORT\") 2>/dev/null || break\n    exec\
    \ 3<&- 3>&-; sleep 2\n  done\n  SERVE_PID=\"\"\n}\n\nstart_serve() {\n  say \"\
    serve-grpc starting on GPU 0 (${GPU_LAYOUT}, --cache-size $RENDER_CACHE)\"\n \
    \ CUDA_VISIBLE_DEVICES=0 /app/run serve-grpc --host 0.0.0.0 \\\n    --enable-editing-actors\
    \ --renderer default --cache-size \"$RENDER_CACHE\" \\\n    --enable-harmonizer\
    \ --harmonizer-cache \"$HARMONIZER_CACHE\" \\\n    --artifact-glob \"$SHARD/*.usdz\"\
    \ > /tmp/serve.log 2>&1 &\n  SERVE_PID=$!\n\n  # The scene list is CHECKED, never\
    \ assumed: a renderer asked for a scene it\n  # does not hold falls back to raster\
    \ silently, and the result reads as a\n  # reconstruction-quality problem rather\
    \ than a configuration one.\n  for _ in $(seq 1 120); do\n    kill -0 $SERVE_PID\
    \ 2>/dev/null || { say \"serve exited early\"; tail -40 /tmp/serve.log; return\
    \ 1; }\n    grep -q \"Available scenes\" /tmp/serve.log && break\n    sleep 5\n\
    \  done\n  local scenes; scenes=$(grep \"Available scenes\" /tmp/serve.log | tail\
    \ -1)\n  [ -n \"$scenes\" ] || { say \"no scene list published\"; tail -40 /tmp/serve.log;\
    \ return 1; }\n  for SC in \"${MY_SCENES[@]}\"; do\n    echo \"$scenes\" | grep\
    \ -q \"$SC\" || { say \"MISSING scene $SC \u2014 would render raster\"; return\
    \ 1; }\n  done\n  # The scene list is not readiness: serve-grpc prints it while\
    \ still loading\n  # the harmonizer weights and binds the port ~2 min later.\n\
