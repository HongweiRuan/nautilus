apiVersion: v1
kind: ConfigMap
metadata:
  name: navsafe-simscale-assets-cfg
  namespace: cogrob
data:
  prepare_assets.sh: "#!/usr/bin/env bash\nset -euo pipefail\n\nROOT=${ROOT:-/avl-west/navsafe_eval/aug_zoo/SimScale}\nHF=https://huggingface.co/datasets/OpenDriveLab/SimScale/resolve/main/SimScale_ckpts\n\
    SIMSCALE_SHA=e7eb8a0ef3bcc41e86ccfdf4d0e5c9bb4a5826a1\n\nif ! command -v curl >/dev/null || ! command -v git >/dev/null;\
    \ then\n  apt-get update -qq\n  apt-get install -y -qq curl git ca-certificates\nfi\n\nmkdir -p \"$ROOT\"/{LTF,DiffusionDrive,GTRS_Dense}\n\
    \nfetch() {\n  local relative=$1 sha=$2 destination=\"$ROOT/$relative\" partial\n  partial=\"$destination.partial\"\n\
    \  mkdir -p \"$(dirname \"$destination\")\"\n  if [ -f \"$destination\" ] && echo \"$sha  $destination\" | sha256sum -c\
    \ - >/dev/null 2>&1; then\n    echo \"OK existing $relative\"\n    return\n  fi\n  curl -L --fail --retry 5 --retry-all-errors\
    \ -C - -o \"$partial\" \"$HF/$relative\"\n  echo \"$sha  $partial\" | sha256sum -c -\n  mv \"$partial\" \"$destination\"\
    \n}\n\nfetch LTF/ltf_sim_navhard.ckpt 265efc6322ee769510dd32cc7c83b465e73d4704568cef823824540198f04d42\nfetch GTRS_Dense/gtrs_dense_resnet_sim_expert_navhard.ckpt\
    \ 2496b82f5f256d7de09fca656c7634967b8660eb12e5c10386a587283629a7ff\nfetch GTRS_Dense/gtrs_dense_resnet_sim_reward_navhard.ckpt\
    \ 8dad0395332ccd844785cbfc7c9e24cb3f8d8dbf5cb9ca7f8f8dc75478fcf409\nfetch GTRS_Dense/gtrs_dense_vov_sim_expert_navhard.ckpt\
    \ badcf3e7c3e2ecc1d7ecb9fc744c78420c368f96e47b89d1681ade7833cd5e57\nfetch GTRS_Dense/gtrs_dense_vov_sim_reward_navhard.ckpt\
    \ 7567d269bd8d0757cf906c30612bf1ad167ac7310e8af0ead74dc7798fe54c99\n\nif [ ! -d \"$ROOT/source/.git\" ]; then\n  rm -rf\
    \ \"$ROOT/source.partial\"\n  git clone https://github.com/OpenDriveLab/SimScale.git \"$ROOT/source.partial\"\n  git -C\
    \ \"$ROOT/source.partial\" checkout --detach \"$SIMSCALE_SHA\"\n  mv \"$ROOT/source.partial\" \"$ROOT/source\"\nfi\ntest\
    \ \"$(git -C \"$ROOT/source\" rev-parse HEAD)\" = \"$SIMSCALE_SHA\"\ntest -f \"$ROOT/source/traj_final/8192.npy\"\n\n\
    echo \"SimScale assets ready at ${ROOT}\"\n"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: navsafe-simscale-assets
  namespace: cogrob
  labels:
    app: navsafe-simscale-assets
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 259200
  template:
    metadata:
      labels:
        app: navsafe-simscale-assets
    spec:
      restartPolicy: Never
      imagePullSecrets:
      - name: ngc-pull
      containers:
      - name: prepare
        image: nvcr.io/nvidia/nre/nre-ga@sha256:6e0caa70a9148490552520c3dde9ee665c8d094ca10b814601cb8bb306567c90
        imagePullPolicy: IfNotPresent
        command:
        - /opt/nvidia/nvidia_entrypoint.sh
        - bash
        - /cfg/prepare_assets.sh
        resources:
          requests:
            cpu: '2'
            memory: 8Gi
            ephemeral-storage: 10Gi
          limits:
            cpu: '2'
            memory: 8Gi
            ephemeral-storage: 10Gi
        volumeMounts:
        - name: cfg
          mountPath: /cfg
        - name: avl-west-vol
          mountPath: /avl-west
      volumes:
      - name: cfg
        configMap:
          name: navsafe-simscale-assets-cfg
      - name: avl-west-vol
        persistentVolumeClaim:
          claimName: avl-west-vol
