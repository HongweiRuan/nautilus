apiVersion: batch/v1
kind: Job
metadata:
  name: navsafe-full-test-prepare
  namespace: cogrob
  labels:
    navsafe-batch: full-test-prepare
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        navsafe-batch: full-test-prepare
    spec:
      restartPolicy: Never
      containers:
      - name: download
        image: python:3.12-slim
        command: [bash, -lc]
        args:
        - python -m pip install --quiet 'huggingface_hub[hf_xet]>=0.34' && python /cfg/prepare_full_test.py
        env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: HF_TOKEN
        - name: HF_XET_HIGH_PERFORMANCE
          value: "1"
        resources:
          requests:
            cpu: "8"
            memory: 16Gi
            ephemeral-storage: 20Gi
          limits:
            cpu: "8"
            memory: 16Gi
            ephemeral-storage: 20Gi
        volumeMounts:
        - name: cfg
          mountPath: /cfg
          readOnly: true
        - name: avl-west-vol
          mountPath: /avl-west
      volumes:
      - name: cfg
        configMap:
          name: navsafe-full-test-prepare
      - name: avl-west-vol
        persistentVolumeClaim:
          claimName: avl-west-vol
      tolerations:
      - key: nautilus.io/reservation
        operator: Equal
        value: cogrob
        effect: NoSchedule
      - key: nautilus.io/cogrob
        operator: Exists
        effect: NoSchedule
