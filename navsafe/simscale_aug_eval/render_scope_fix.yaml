apiVersion: batch/v1
kind: Job
metadata:
  name: navsafe-simscale-aug-scope-fix-w00
  namespace: cogrob
  labels:
    app: navsafe-simscale-aug-scope-fix
    navsafe-batch: simscale-aug-scope-fix
    worker: w00
spec:
  backoffLimit: 4
  podReplacementPolicy: TerminatingOrFailed
  ttlSecondsAfterFinished: 259200
  activeDeadlineSeconds: 604800
  template:
    metadata:
      labels:
        app: navsafe-simscale-aug-scope-fix
        navsafe-batch: simscale-aug-scope-fix
        worker: w00
    spec:
      restartPolicy: Never
      imagePullSecrets:
      - name: ngc-pull
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - ry-gpu-06.sdsc.optiputer.net
                - ry-gpu-07.sdsc.optiputer.net
                - ry-gpu-08.sdsc.optiputer.net
                - ry-gpu-09.sdsc.optiputer.net
                - ry-gpu-10.sdsc.optiputer.net
                - ry-gpu-11.sdsc.optiputer.net
                - ry-gpu-12.sdsc.optiputer.net
                - ry-gpu-13.sdsc.optiputer.net
                - ry-gpu-14.sdsc.optiputer.net
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-GeForce-RTX-3090
      tolerations:
      - effect: NoSchedule
        key: nautilus.io/reservation
        operator: Equal
        value: cogrob
      - effect: NoSchedule
        key: nautilus.io/cogrob
        operator: Exists
      containers:
      - name: eval
        image: nvcr.io/nvidia/nre/nre-ga@sha256:6e0caa70a9148490552520c3dde9ee665c8d094ca10b814601cb8bb306567c90
        imagePullPolicy: IfNotPresent
        command:
        - /opt/nvidia/nvidia_entrypoint.sh
        - bash
        - /cfg/run_worker.sh
        env:
        - name: WORKER_INDEX
          value: '0'
        - name: WORKERS
          value: '3'
        - name: SEEDS
          value: 0 1 1024
        - name: OUTROOT
          value: /avl-west/navsafe_eval/simscale_aug_scope_fix_outputs
        - name: CELL_TRIES
          value: '4'
        - name: CELL_TIMEOUT
          value: 45m
        - name: RETRY_EXCLUDED
          value: '1'
        - name: DATASET
          value: /avl-west/navsafe_eval/full_test
        - name: TOKENS_FILE
          value: /cfg/render_scope_tokens.txt
        - name: NEXUSSIM_SHA
          value: 649ddde
        - name: MODELS_TSV
          value: /cfg/models.tsv
        - name: NGC_API_KEY
          valueFrom:
            secretKeyRef:
              name: ngc-api-key
              key: NGC_API_KEY
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: HF_TOKEN
        - name: HYDRA_FULL_ERROR
          value: '1'
        - name: ACCEPT_EULA
          value: "Y"
        - name: OMNI_KIT_ACCEPT_EULA
          value: "Y"
        - name: NAVSAFE_ASSET_BANK
          value: /avl-west/navsafe_eval/asset
        - name: NAVSAFE_GAIT_BANK
          value: /avl-west/navsafe_eval/gait_bank
        - name: EXPECTED_TOKENS
          value: '3'
        - name: NAVSAFE_REPLACE_SCOPE
          value: source
        resources:
          requests:
            cpu: '2'
            memory: 32Gi
            ephemeral-storage: 100Gi
            nvidia.com/gpu: '2'
          limits:
            cpu: '2'
            memory: 32Gi
            ephemeral-storage: 100Gi
            nvidia.com/gpu: '2'
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: cfg
          mountPath: /cfg
        - name: avl-west-vol
          mountPath: /avl-west
        - name: hugsim-storage
          mountPath: /hugsim-storage
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 24Gi
      - name: cfg
        configMap:
          name: navsafe-simscale-aug-scope-fix-cfg
      - name: avl-west-vol
        persistentVolumeClaim:
          claimName: avl-west-vol
      - name: hugsim-storage
        persistentVolumeClaim:
          claimName: horuan-hugsim-vol
