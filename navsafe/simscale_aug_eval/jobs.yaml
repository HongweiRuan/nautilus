apiVersion: v1
kind: ConfigMap
metadata:
  name: navsafe-simscale-aug-cfg
  namespace: cogrob
data:
  run_worker.sh: "#!/usr/bin/env bash\n# One NavSafe eval worker: a renderer and a sequential eval loop over this\n# worker's\
    \ slice of the scenario set, inside one pod on two 3090s.\n#\n# Why it is shaped like this, since none of it is arbitrary:\n\
    #\n#  * `run_bundle_eval.sh` cannot be used here. It starts the renderer with\n#    `docker run` (the single-machine \"\
    Mode B\" of docs/navsafe_eval.md); a pod\n#    has no docker daemon. This is Mode A \u2014 a long-lived serve-grpc the\
    \ eval\n#    client reaches over the network \u2014 with server and client in the SAME pod, so\n#    the network is loopback\
    \ and the renderer cannot outlive the work. Every\n#    eval FLAG below is copied from that wrapper verbatim, because\
    \ the flags are\n#    what make a score comparable and this file is not the place to have an\n#    opinion about them.\n\
    #\n#  * ONE renderer per worker, started once. serve-grpc costs 2-4 minutes to\n#    publish its scenes and bind, and\
    \ the eval venv costs ~15 minutes to build;\n#    a pod that evaluated a single scenario would spend most of its life\
    \ on\n#    that. Here both are paid once and amortised over ~25 cells.\n#\n#  * Two GPUs, not one. serve-grpc with the\
    \ harmonizer and --cache-size 4 was\n#    measured at 21.8 GiB of a 3090's 23.6 GiB (see nexussim/nurec_serving/\n#  \
    \  serve-grpc.yaml), which leaves nothing for a policy. GPU 0 renders, GPU 1\n#    runs the rollout.\n#\n#  * --cache-size\
    \ 4 is a correctness floor, not a speed knob: a NavSafe scenario\n#    is FOUR 5 s reconstructions the episode renders\
    \ in turn, and at a smaller\n#    cache they evict each other mid-episode.\n#\n#  * Token-outer, model-inner. All models\
    \ run against one scenario before moving\n#    to the next, so the renderer keeps that scenario's four reconstructions\n\
    #    resident across the whole model list instead of reloading ~8 GB per model.\n#\n#  * --eval-frames 600 states the\
    \ episode bound instead of inheriting it.\n#    `eval_frames` counts SCORED frames, so the run lasts\n#    ego_replay_frames\
    \ + eval_frames = 20 + 600 = 620 frames; leaving it unset\n#    stops at ego_replay_frames + round(SAFETY_CEILING_S /\
    \ sim_dt) =\n#    20 + 60.0/0.1 = the same 620 (evaluator.py, \"safety ceiling\"). Same bound,\n#    now written down\
    \ \u2014 which is what keeps cells scored before this flag was\n#    added comparable with the ones after.\n#\n#  * Resumable,\
    \ per cell. A Job's pod is NOT time-capped here (verified: the\n#    6 h activeDeadlineSeconds cogrob injects lands on\
    \ bare Pods, not on pods a\n#    Job owns), so a worker normally runs its slice to the end in one go. The\n#    resume\
    \ exists for the other reasons a pod dies \u2014 a node drain, an evicted\n#    pod, a renderer that wedges \u2014 and\
    \ it costs nothing when unused. A cell is\n#    skipped when its log carries eval_py123d's DONE line AND a\n#    navsafe_metrics.json\
    \ exists \u2014 not on a frame count, which --enable-vis\n#    being off makes zero for finished and unfinished runs alike.\n\
    #\n# Inputs, all from the Job manifest:\n#   WORKER_INDEX  this worker's index, 0-based\n#   WORKERS       how many workers\
    \ share the scenario set\n#   SEEDS         space-separated --eval-seed values, e.g. \"1\" or \"1 2 3\"\n#   NEXUSSIM_SHA\
    \  the commit every worker in the campaign evaluates\n#   CAMPAIGN      output subtree name under outputs/\nset -uo pipefail\n\
    \n: \"${WORKER_INDEX:?}\" \"${WORKERS:?}\" \"${SEEDS:?}\" \"${NEXUSSIM_SHA:?}\"\nROOT=/avl-west/navsafe_eval\nSIMSCALE_ROOT=${SIMSCALE_ROOT:-$ROOT/aug_zoo/SimScale/source}\n\
    [ -f \"$SIMSCALE_ROOT/traj_final/8192.npy\" ] || { echo \"SimScale assets missing; run prepare-assets.yaml first\"; exit\
    \ 1; }\nDATASET=${DATASET:-$ROOT/dataset}\nOUTROOT=${OUTROOT:-$ROOT/outputs}\nMODELS_TSV=${MODELS_TSV:-/cfg/models.tsv}\n\
    ZOO=$ROOT/model_zoo\nHARMONIZER_CACHE=${HARMONIZER_CACHE:-/avl-west/navsafe_dev/.harmonizer-cache}\nPORT=8080\nCELL_TIMEOUT=${CELL_TIMEOUT:-45m}\n\
    W=$(printf 'w%02d' \"$WORKER_INDEX\")\n\nsay() { echo \"[$W $(date -u +%H:%M:%S)] $*\"; }\n\n# \u2500\u2500 0. which scenarios\
    \ are mine \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n# Deterministic stride, computed identically by every worker from the\
    \ same\n# sorted list, so no worker needs to be told and two workers never collide.\n# Directories only, and only bundles\
    \ that can actually be served. An entry under\n# $DATASET that is not an evaluatable scenario killed a whole worker: it\
    \ became a\n# dangling symlink in the shard, serve-grpc died on FileNotFoundError before\n# publishing any scene list,\
    \ and the slice went down with it. Two produced that\n# on 2026-08-26 \u2014 a stray top-level manifest.json (a FILE,\
    \ which `ls` happily\n# returns; since moved to ../dataset_manifest.json) and 442b2cf63c6f570a, which\n# carries arrow/\
    \ and offsets/ but no usdz at all. Screened here, where the cost\n# is one skipped scenario rather than one dead worker.\n\
    # TOKENS_FILE: restrict this run to an explicit token list instead of\n# globbing the whole dataset. Used for targeted\
    \ retries -- the 4 scenarios\n# that never got a directory in the seed-1 rerun -- where scanning all 270\n# would spend\
    \ the renderer's start-up on scenarios already scored.\nif [ -n \"${TOKENS_FILE:-}\" ]; then\n  mapfile -t ALL_TOKENS\
    \ < <(grep -vE '^[[:space:]]*(#|$)' \"$TOKENS_FILE\" | awk '{print $1}' | sort -u)\n  say \"TOKENS_FILE=$TOKENS_FILE ->\
    \ ${#ALL_TOKENS[@]} token(s)\"\nelse\nmapfile -t ALL_TOKENS < <(\n  for d in \"$DATASET\"/*/; do\n    t=$(basename \"\
    $d\")\n    [ -f \"$d/manifest.json\" ] && [ -d \"$d/arrow\" ] || continue\n    n=0; for f in \"$d\"/*.usdz; do [ -e \"\
    $f\" ] && n=$((n+1)); done\n    [ \"$n\" -ge 1 ] && echo \"$t\"\n  done | sort\n)\nfi\nMY_TOKENS=()\nfor i in \"${!ALL_TOKENS[@]}\"\
    ; do\n  [ $(( i % WORKERS )) -eq \"$WORKER_INDEX\" ] && MY_TOKENS+=(\"${ALL_TOKENS[$i]}\")\ndone\nsay \"scenarios ${#ALL_TOKENS[@]}\
    \ evaluatable, ${#MY_TOKENS[@]} mine: ${MY_TOKENS[*]}\"\n[ ${#MY_TOKENS[@]} -gt 0 ] || { say \"nothing to do\"; exit 0;\
    \ }\n\nmapfile -t ROWS < <(grep -v '^\\s*#' \"$MODELS_TSV\" | grep -v '^\\s*$')\nsay \"models: $(printf '%s ' \"${ROWS[@]%%\
    \ *}\")\"\n\n# \u2500\u2500 1. environment \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\n# The venv is built here, on the pod's own ephemeral /root, every time. It is\n\
    # NOT cached on the PVC: a shared interpreter tree on CephFS is not ours to\n# create. ~15 minutes, paid once per pod.\n\
    export DEBIAN_FRONTEND=noninteractive\nsay \"apt: GL/X libs the renderer and IsaacSim need\"\n# python3-dev is not decoration:\
    \ SparseDriveV2 JIT-builds a C++/CUDA extension,\n# `uv sync --python 3.12` resolves to this image's SYSTEM python (Ubuntu\
    \ 24.04\n# ships 3.12.3), and torch hands the compiler `-isystem /usr/include/python3.12`.\n# Without the headers the\
    \ C++ half of the build dies on `Python.h: No such file\n# or directory` while the CUDA half compiles fine \u2014 which\
    \ reads as a broken\n# adapter rather than a missing apt package.\napt-get update -qq && apt-get install -y -qq git curl\
    \ python3-venv python3-dev \\\n  libglu1-mesa libxt6 libgl1 libglx0 libegl1 libglib2.0-0 libxrandr2 libxinerama1 \\\n\
    \  libxcursor1 libxi6 libxext6 libxrender1 libx11-6 libxfixes3 libxdamage1 libsm6 \\\n  libice6 libgomp1 >/dev/null ||\
    \ { say \"apt FAILED\"; exit 1; }\n\nexport PATH=$HOME/.local/bin:$HOME/.cargo/bin:$PATH\nexport UV_CACHE_DIR=/root/.cache/uv\
    \ UV_PROJECT_ENVIRONMENT=/root/ns-venv\nfor i in 1 2 3 4; do\n  command -v uv >/dev/null && break\n  python -m pip install\
    \ --quiet --user uv 2>/dev/null \\\n    || pip install --quiet --user uv 2>/dev/null \\\n    || curl -LsSf https://astral.sh/uv/install.sh\
    \ | sh\n  hash -r; sleep 5\ndone\ncommand -v uv >/dev/null || { say \"uv unavailable\"; exit 1; }\n\n# Pinned checkout,\
    \ cloned locally: 30 workers importing .py straight off CephFS\n# would contend on __pycache__ writes, and a campaign\
    \ has to be able to say\n# which commit produced its numbers.\nREPO=/root/ns\nrm -rf \"$REPO\"\ngit clone --quiet --no-hardlinks\
    \ /hugsim-storage/NexusSim \"$REPO\" || { say \"clone FAILED\"; exit 1; }\ngit -C \"$REPO\" checkout --quiet \"$NEXUSSIM_SHA\"\
    \ || { say \"checkout $NEXUSSIM_SHA FAILED\"; exit 1; }\ncp /cfg/gtrs_dense.py \"$REPO/nexussim/policy/sensor/gtrs_dense.py\"\
    \nsed -i '/\"nexussim.policy.sensor.ltf\",/a\\    \"nexussim.policy.sensor.gtrs_dense\",' \"$REPO/nexussim/engine/registry.py\"\
    \nsay \"code at $(git -C \"$REPO\" log --oneline -1)\"\n\ncd \"$REPO\"\nif ! /root/ns-venv/bin/python -c \"import isaacsim,\
    \ isaaclab, nexussim\" 2>/dev/null; then\n  say \"uv sync (IsaacSim 6.0 + cu128 torch, ~15 min)\"\n  uv sync --all-extras\
    \ --python 3.12 || { say \"uv sync FAILED\"; exit 1; }\n  [ -d /root/IsaacLab/.git ] || git clone --depth 1 --branch v3.0.0-beta\
    \ \\\n    https://github.com/isaac-sim/IsaacLab.git /root/IsaacLab\n  for ext in isaaclab isaaclab_assets isaaclab_tasks\
    \ isaaclab_rl isaaclab_mimic; do\n    d=/root/IsaacLab/source/$ext\n    [ -d \"$d\" ] && uv pip install --python /root/ns-venv/bin/python\
    \ --no-deps -e \"$d\" >/dev/null\n  done\n  uv pip install --python /root/ns-venv/bin/python lazy_loader einops >/dev/null\n\
    \  # SparseDriveV2 JIT-builds a CUDA extension (deformable attention) at its first\n  # forward pass, and torch.utils.cpp_extension\
    \ refuses to without ninja:\n  # \"Ninja is required to load C++ extensions\". The NRE image ships nvcc 12.8 and\n  #\
    \ g++ but not ninja, so the cell died at frame 0 with an infra_failure that\n  # reads like a broken adapter. Compiled\
    \ once per pod into\n  # /root/.cache/torch_extensions.\n  uv pip install --python /root/ns-venv/bin/python ninja >/dev/null\n\
    fi\nPY=/root/ns-venv/bin/python\n\"$PY\" -c \"import nexussim, isaaclab\" || { say \"venv unusable\"; exit 1; }\n# `uv\
    \ sync` rewrites uv.lock in place \u2014 it normalises the environment markers for\n# this platform, same package versions\
    \ \u2014 and every eval then records itself as\n# \"launched from a DIRTY tree ... this run corresponds to no commit\"\
    . Restoring\n# the file is what lets run_meta.json name the commit these numbers came from;\n# the installed set is the\
    \ locked one either way, which is why this is safe.\ngit -C \"$REPO\" checkout -- uv.lock 2>/dev/null || true\n\n# The\
    \ venv's bin/ has to be on PATH, not just its interpreter. torch checks for\n# ninja by SHELLING OUT (`subprocess.run([\"\
    ninja\", \"--version\"])` in\n# verify_ninja_availability), so installing ninja into the venv while invoking\n# only /root/ns-venv/bin/python\
    \ leaves it invisible and SparseDriveV2 still dies\n# at frame 0 with \"Ninja is required to load C++ extensions\". Checked\
    \ here\n# rather than trusted: the install is quiet, and its failure would otherwise\n# surface 30 pods later as one adapter\
    \ that never scores anything.\nexport PATH=/root/ns-venv/bin:$PATH\ncommand -v ninja >/dev/null || { say \"ninja not on\
    \ PATH \u2014 sparsedrivev2 cannot JIT its CUDA extension\"; exit 1; }\n# The exact path torch will pass as -isystem,\
    \ asked of the interpreter that will\n# do the building rather than assumed from the apt package name.\nINC=$(\"$PY\"\
    \ -c 'import sysconfig; print(sysconfig.get_paths()[\"include\"])')\n[ -f \"$INC/Python.h\" ] || { say \"no Python.h under\
    \ $INC \u2014 sparsedrivev2's extension cannot build\"; exit 1; }\nsay \"venv ready ($(git -C \"$REPO\" status --porcelain\
    \ | wc -l) tracked files modified, ninja $(ninja --version), headers $INC)\"\n\n# \u2500\u2500 1b. VLA venv \u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \n# The 6 subprocess-VLA rows in this sweep (recogdrive x2, mtdrive x2, autovla,\n# drivelaw) run their model in a persistent\
    \ subprocess under ONE shared venv\n# (nexussim/policy/sensor/vla_client.py, NAVSAFE_VLA_PYTHON) built from the\n# proven\
    \ lockfile in navsafe_env_kit/envs/vla/ (captured 2026-08-26 from\n# bolei-gpu07, where all these rows already ran successfully)\
    \ \u2014 torch==2.10.0+\n# cu128, transformers==4.57.6, same torch as the host venv. Kept separate from\n# the host venv\
    \ anyway because e.g. recogdrive/autovla need qwen_vl_utils and a\n# specific transformers/diffusers combination the sim\
    \ stack doesn't otherwise\n# need. Built fresh on this pod's ephemeral /root, same as /root/ns-venv above\n# \u2014 not\
    \ cached on the PVC, ~5 min, paid once per pod.\n#\n# SimWAM (simwam/simwam_rl) is EXCLUDED from this sweep by models.tsv:\
    \ its\n# world-model load alone consumes the full ~23.5GB of a 3090 (confirmed via a\n# standalone 1-GPU/80Gi-RAM Job\
    \ \u2014 CUDA OOM in simwam.runtime.create_simwam),\n# leaving nothing for this pod's second GPU (the renderer). The source\n\
    # machine had 8 GPUs and dedicated a whole one to NAVSAFE_VLA_GPU; our pods\n# only get 2 total, so SimWAM does not fit\
    \ here and is run elsewhere.\nif grep -qE '^(recogdrive_il|recogdrive_rl|mtdrive_sft|mtdrive_mtgrpo|autovla|drivelaw|simwam|simwam_rl|drivevla_w0)\\\
    b' \"$MODELS_TSV\"; then\n  VLA_LOCK=/avl-west/navsafe_eval/env_kit/vla_requirements.lock.txt\n  VLA_EXTRA_LOCK=/avl-west/navsafe_eval/env_kit/vla_extra_site_requirements.lock.txt\n\
    \  [ -f \"$VLA_LOCK\" ] || { say \"VLA lockfile missing at $VLA_LOCK\"; exit 1; }\n  if [ ! -x /root/vla-venv/bin/python\
    \ ]; then\n    say \"building vla-venv (torch 2.10.0+cu128 + transformers 4.57.6, ~5 min)\"\n    uv venv --python 3.12\
    \ /root/vla-venv >/dev/null || { say \"vla-venv create FAILED\"; exit 1; }\n    # omegaconf==2.4.0.dev14 (a real PyPI\
    \ prerelease) conflicts with\n    # hydra-core==1.3.2's declared `omegaconf<2.4` under uv's strict resolver,\n    # even\
    \ though this exact pairing is what SimWAM/DriveLaW's Hydra configs\n    # were proven against on the source machine \u2014\
    \ install everything else via\n    # the resolver, then force this one package in after, same as the source\n    # env's\
    \ own pip almost certainly did.\n    grep -v '^omegaconf==' \"$VLA_LOCK\" > /tmp/vla_reqs.txt\n    uv pip install --python\
    \ /root/vla-venv/bin/python \\\n      --extra-index-url https://download.pytorch.org/whl/cu128 \\\n      --index-strategy\
    \ unsafe-best-match \\\n      -r /tmp/vla_reqs.txt || { say \"vla-venv install FAILED\"; exit 1; }\n    uv pip install\
    \ --python /root/vla-venv/bin/python --no-deps omegaconf==2.4.0.dev14 \\\n      || { say \"vla-venv omegaconf FAILED\"\
    ; exit 1; }\n  fi\n  export NAVSAFE_VLA_PYTHON=/root/vla-venv/bin/python\nfi\nif grep -q '^drivevla_w0\\b' \"$MODELS_TSV\"\
    ; then\n  /root/vla-venv/bin/python -c 'import tiktoken, scipy' 2>/dev/null || \\\n    uv pip install --python /root/vla-venv/bin/python\
    \ tiktoken blobfile scipy \\\n      || { say \"drivevla_w0 deps FAILED\"; exit 1; }\nfi\n# RAP is BEVFormer + a DINO backbone,\
    \ so it needs the OpenMMLab stack, which\n# the sim venv does not carry: without it every rap cell dies at load with\n\
    # `ModuleNotFoundError: mmengine`. Three things this install has to get right,\n# each measured on this image:\n#\n# \
    \ * --no-build-isolation. mmcv's setup.py imports pkg_resources without\n#    declaring setuptools as a build dependency,\
    \ so an isolated build cannot\n#    even start. It also needs torch importable at build time, which isolation\n#    would\
    \ hide.\n#  * mmcv PINNED to 2.1.0. 2.2.0 compiles and its CUDA ops load, but mmdet\n#    asserts `mmcv>=2.0.0rc4, <2.2.0`\
    \ at import and refuses it.\n#  * a --target dir, not the venv. The build takes ~30 min of nvcc; keeping it\n#    out\
    \ of ns-venv means a failed or half-finished build cannot break the\n#    other 14 rows, which import from ns-venv on\
    \ every cell.\nif grep -q '^rap\\b' \"$MODELS_TSV\"; then\n  if [ ! -d /root/mm_site/mmcv ]; then\n    say \"building\
    \ the mmcv/mmdet stack for rap (~30 min of nvcc, once per pod)\"\n    mkdir -p /root/mm_site\n    uv pip install --python\
    \ /root/ns-venv/bin/python --target /root/mm_site \\\n      --no-build-isolation \\\n      --extra-index-url https://download.pytorch.org/whl/cu128\
    \ \\\n      --index-strategy unsafe-best-match \\\n      mmengine \"mmcv==2.1.0\" \"mmdet>=3.0.0,<3.4\" \\\n      || {\
    \ say \"mmcv stack FAILED \u2014 rap cells will fail, the rest are unaffected\"; }\n  fi\n  # Appended (not prepended)\
    \ at the PYTHONPATH assignment further down, so\n  # ns-venv's own torch/numpy keep winning over anything mmdet pulled\
    \ in.\n  export MM_SITE=/root/mm_site\n  if PYTHONPATH=/root/mm_site /root/ns-venv/bin/python -c \"from mmcv.ops.multi_scale_deform_attn\
    \ import MultiScaleDeformableAttention\" 2>/dev/null; then\n    say \"mmcv stack ready (rap enabled)\"\n  else\n    say\
    \ \"WARNING: mmcv stack did not import \u2014 rap cells will fail at load\"\n  fi\nfi\n\nif grep -q '^drivelaw\\b' \"\
    $MODELS_TSV\"; then\n  # DriveLaW's navsim fork imports nuplan.common.actor_state beyond what\n  # drivelaw_server.py's\
    \ own stub covers; the real devkit has to be\n  # importable. Installed --no-deps into a side site-dir (not into vla-venv\n\
    \  # itself) so its own transitive deps never shadow vla-venv's torch/numpy for\n  # the other 5 VLA rows sharing that\
    \ venv.\n  [ -d /root/vla_extra_site ] || {\n    mkdir -p /root/vla_extra_site\n    uv pip install --target /root/vla_extra_site\
    \ --no-deps -r \"$VLA_EXTRA_LOCK\" \\\n      || { say \"vla_extra_site FAILED\"; exit 1; }\n  }\n  export NAVSAFE_VLA_EXTRA_PYTHONPATH=/root/vla_extra_site\n\
    \  [ -f /avl-west/navsafe_eval/model_zoo/drivelaw/inference_front.yaml ] || \\\n    sed -e \"s|\\${DRIVELAW_ZOO}|/avl-west/navsafe_eval/model_zoo/drivelaw|g\"\
    \ \\\n        -e \"s|\\${DRIVELAW_REPO}|/avl-west/navsafe_eval/vla_repos/drivelaw|g\" \\\n        /avl-west/navsafe_eval/model_zoo/drivelaw/inference_front.template.yaml\
    \ \\\n        > /avl-west/navsafe_eval/model_zoo/drivelaw/inference_front.yaml\nfi\n\n# \u2500\u2500 2. the renderer \u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n# Its --artifact-glob\
    \ covers only THIS worker's scenarios. serve-grpc scans the\n# glob at start-up and reads every artifact it finds; pointing\
    \ all 30 workers at\n# all 508 reconstructions would make each of them scan half a terabyte of CephFS\n# to serve twenty\
    \ scenes.\nSHARD=/root/shard\nmkdir -p \"$SHARD\"\nMY_SCENES=()\nfor T in \"${MY_TOKENS[@]}\"; do\n  for f in \"$DATASET/$T\"\
    /*.usdz; do\n    [ -e \"$f\" ] || continue                     # a dangling link is not a scene\n    b=$(basename \"$f\"\
    ); ln -sf \"$f\" \"$SHARD/$b\"; MY_SCENES+=(\"${b%.usdz}\")\n  done\ndone\nmkdir -p \"$HARMONIZER_CACHE\"\n\nSERVE_PID=\"\
    \"\nstart_serve() {\n  say \"serve-grpc starting on GPU 0\"\n  CUDA_VISIBLE_DEVICES=0 /app/run serve-grpc --host 0.0.0.0\
    \ \\\n    --enable-editing-actors --renderer default --cache-size 4 \\\n    --enable-harmonizer --harmonizer-cache \"\
    $HARMONIZER_CACHE\" \\\n    --artifact-glob \"$SHARD/*.usdz\" > /tmp/serve.log 2>&1 &\n  SERVE_PID=$!\n\n  # The scene\
    \ list is CHECKED, never assumed: a renderer asked for a scene it\n  # does not hold falls back to raster silently, and\
    \ the result reads as a\n  # reconstruction-quality problem rather than a configuration one.\n  for _ in $(seq 1 120);\
    \ do\n    kill -0 $SERVE_PID 2>/dev/null || { say \"serve exited early\"; tail -40 /tmp/serve.log; return 1; }\n    grep\
    \ -q \"Available scenes\" /tmp/serve.log && break\n    sleep 5\n  done\n  local scenes; scenes=$(grep \"Available scenes\"\
    \ /tmp/serve.log | tail -1)\n  [ -n \"$scenes\" ] || { say \"no scene list published\"; tail -40 /tmp/serve.log; return\
