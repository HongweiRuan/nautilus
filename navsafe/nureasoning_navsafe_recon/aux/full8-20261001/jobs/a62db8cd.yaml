    spec:
      restartPolicy: Never
      imagePullSecrets:
      - name: ngc-pull
      containers:
      - name: aux
        image: nvcr.io/nvidia/nre/nre-tools-ga@sha256:46d78256219a6541601fd16517c7edca3e7a6ec9634f1858f7977279bd98f9ff
        imagePullPolicy: IfNotPresent
        command:
        - /opt/nvidia/nvidia_entrypoint.sh
        - bash
        - -c
        args:
        - |2

          set -euo pipefail
          cd "$REPO_ROOT"
          DEST="$RECON_ROOT/$CLIP_ID"
          DIAG="$DEST/diagnostics/${HOSTNAME:-manual}"
          mkdir -p "$DIAG"

          exec > >(tee -a "$DIAG/aux.log") 2>&1
          MANIFEST="pai_${CLIP_ID}.json"
          test -s "/scratch/ncore/$MANIFEST"
          complete=true
          for kind in sseg lidar-sseg lidar-camvis egomask; do
            test -s "$NCORE_DIR/pai_${CLIP_ID}.aux.$kind.zarr.itar" || complete=false
          done
          if "$complete"; then
            echo "AUX_REUSED $CLIP_ID (four persistent stores present; native train loads actual arrays)"
          else
            /app/apps/nre_tools ncore-aux-data --dataset-path="/scratch/ncore/$MANIFEST" --output-dir=/scratch/ncore --segmentation-backend=mask2former --zarr-store-type=itar --store-meta --lidar-seg-camvis --ego-mask --num-threads=8
            for kind in sseg lidar-sseg lidar-camvis egomask; do
              files=(/scratch/ncore/*.aux."$kind".zarr.itar)
              test -s "${files[0]}"
              file="${files[0]}"; base="$(basename "$file")"
              cp -a "$file" "$NCORE_DIR/$base"
              alias="pai_${CLIP_ID}.aux.$kind.zarr.itar"
              if [[ "$base" != "$alias" ]]; then ln -sfn "$base" "$NCORE_DIR/$alias"; fi
            done
          fi
          # Native GA26.04 discovers aux from the manifest stem before its first dot.
          AUX_BASE="${MANIFEST%%.*}"
          for kind in sseg lidar-sseg lidar-camvis egomask; do
            src="$NCORE_DIR/pai_${CLIP_ID}.aux.$kind.zarr.itar"
            test -s "$src"
            cp -aL "$src" "/scratch/ncore/$AUX_BASE.aux.$kind.zarr.itar"
          done
          echo "AUX_COMPLETE $CLIP_ID"
