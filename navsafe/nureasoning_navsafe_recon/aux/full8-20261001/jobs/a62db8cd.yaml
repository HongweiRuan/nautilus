      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-GeForce-RTX-3090
      tolerations:
      - effect: NoSchedule
        key: nautilus.io/reservation
        operator: Equal
        value: cogrob
      - effect: NoSchedule
        key: nautilus.io/cogrob
        operator: Exists
      initContainers:
      - name: stage-ncore
        image: robinwangucsd/metabench:latest
        imagePullPolicy: IfNotPresent
        command:
        - /bin/bash
        - -lc
        args:
        - |
          set -euo pipefail
          cd "$REPO_ROOT"
          test -s "$NCORE_DIR/pai_${CLIP_ID}.json"
          mkdir -p /scratch/ncore
          cp -a "$NCORE_DIR/." /scratch/ncore/
        env:
