          value: data/train/part_3/2026.02.19.17.20.39_PFDKB4AE0RF000102_a62db8cd1ce25fb1b27cf37488233aae.zip
        - name: PYTHONUNBUFFERED
          value: '1'
        - name: HYDRA_FULL_ERROR
          value: '1'
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: expandable_segments:True
        - name: NGC_API_KEY
          valueFrom:
            secretKeyRef:
              name: ngc-api-key
              key: NGC_API_KEY
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token-nureasoning
              key: HF_TOKEN
        resources:
          requests:
            cpu: '8'
            memory: 64Gi
            ephemeral-storage: 200Gi
            nvidia.com/gpu: '1'
          limits:
            cpu: '8'
            memory: 64Gi
            ephemeral-storage: 200Gi
            nvidia.com/gpu: '1'
        volumeMounts:
        - name: hugsim
          mountPath: /hugsim-storage
        - name: avl-west
          mountPath: /avl-west
        - name: scratch
          mountPath: /scratch
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: hugsim
        persistentVolumeClaim:
          claimName: horuan-hugsim-vol
      - name: avl-west
        persistentVolumeClaim:
          claimName: avl-west-vol
      - name: scratch
        emptyDir:
          sizeLimit: 185Gi
      - name: dshm
        emptyDir:
          medium: Memory
