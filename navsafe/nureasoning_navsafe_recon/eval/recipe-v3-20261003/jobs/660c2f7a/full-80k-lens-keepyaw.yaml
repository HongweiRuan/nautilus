          \ -c 'import isaacsim,os; print(os.path.dirname(isaacsim.__file__))' | tail -1)\n  if tar -xf \"$KITCACHE\" -C \"$KITPKG\" kit && tar -xf \"$KITCACHE\" -C / var root; then\n    echo \"WARM_KIT_CACHE_RESTORED $KITCACHE\"\n    printf '%s\\n' \"$KITCACHE\" > \"$LOCAL/warm_kit_cache.txt\"\n  else\n    echo \"WARM_KIT_CACHE_RESTORE_FAILED $KITCACHE\" >&2\n  fi\nelse\n  echo \"WARM_KIT_CACHE_MISSING driver=$DRIVER\" >&2\nfi\n# Limit discovery to exactly this Arrow log: --py123d-scene-index 0 cannot drift.\nARROW=/root/navsafe-eval-arrow\nmkdir -p \"$ARROW/logs/nureasoning-mini_train\"\nln -s \"$BATCH_ROOT/arrow/logs/nureasoning-mini_train/$CLIP_ID\" \"$ARROW/logs/nureasoning-mini_train/$CLIP_ID\"\npython - <<'RENDER_READY'\nimport grpc,time,pathlib\nfrom nre.grpc.protos import common_pb2,sensorsim_pb2_grpc\nchannel=grpc.insecure_channel('127.0.0.1:8080')\nfor attempt in range(120):\n if pathlib.Path('/sync/SERVE_FAILED').exists(): raise RuntimeError('NuRec renderer failed; see renderer.log')\n\
          \ try:\n  grpc.channel_ready_future(channel).result(timeout=10)\n  print('NUREC_RENDERER_READY',flush=True)\n  break\n except grpc.FutureTimeoutError: pass\nelse: raise RuntimeError('NuRec renderer not ready within1200 seconds')\nstub=sensorsim_pb2_grpc.SensorsimServiceStub(channel)\nconfig=dict(stub.get_server_config(common_pb2.Empty(),timeout=30).server_config)\nassert config.get('enable_editing_actors','').lower()=='true',config\nprint('ACTOR_POSE_POLICY simulation_driven_actor_editing',flush=True)\nchannel.close()\nRENDER_READY\nCOMMON=(--scenario-source py123d --py123d-data-root \"$ARROW\" --py123d-scene-index 0 --nurec-work-dir \"$RECON_ROOT\" --render-backend nurec_grpc --traffic-mode log_replay --execution-mode controller --controller lqr --replan-rate 5 --eval-seed 1 --enable-vis --keep-ego-replay-frames --camera-resolution-scale 1.0 --log-level INFO)\nfailed=0\necho \"EVAL_BEGIN $CLIP_ID full ego replay200\"\nif navsafe-eval \"${COMMON[@]}\" --model-type pdm_closed --checkpoint\
          \ none --ego-replay-frames 200 --eval-frames 0 --output-dir \"$LOCAL/ego_replay_200\" 2>&1 | tee \"$OUT/ego_replay_200.log\"; then\n  echo 0 > \"$LOCAL/ego_replay_200.exit_code\"\nelse\n  status=$?; echo \"$status\" > \"$LOCAL/ego_replay_200.exit_code\"; failed=1\nfi\nexport LOCAL\nif python - <<'VALIDATE_EVAL'\nimport os,json,pathlib\nroot=pathlib.Path(os.environ['LOCAL']);records=[]\nfor mode in ['ego_replay_200']:\n p=root/mode\n assert (root/(mode+'.exit_code')).read_text().strip()=='0',mode\n metrics=json.loads((p/'metrics.json').read_text())\n assert not metrics.get('infra_failure_error'),metrics\n assert all((p/'visualization'/name).is_file() and (p/'visualization'/name).stat().st_size>0 for name in ['topdown.gif','cam_f0.gif','combined.gif']),mode\n if mode=='ego_replay_200':\n  assert metrics['total_frames']==200 and metrics['success'],metrics\n  note='Visualization-only replay; current evaluator marks zero controlled frames unscorable.'\n else:\n  assert 20<=metrics['total_frames']<=200\
          \ and metrics.get('termination_reason')!='infra_failure',metrics\n  note='20 replay frames, up to180 controlled; normal episode termination may end early.'\n records.append({'mode':mode,'metrics':metrics,'note':note})\nrecord={'clip_id':os.environ['CLIP_ID'],'reconstruction_source':os.environ['SOURCE_RECON'],'experiment_id':os.environ['EXPERIMENT_ID'],'actor_pose_policy':'simulation_driven_actor_editing','render_client_sha256':os.environ['RENDER_CLIENT_SHA256'],'visualization_enabled':True,'records':records}\n(root/'SUCCESS.json').write_text(json.dumps(record,indent=2)+'\\n')\nprint('EVAL_BOTH_DONE',record,flush=True)\nVALIDATE_EVAL\nthen :; else failed=1; fi\nexit \"$failed\"\n"
