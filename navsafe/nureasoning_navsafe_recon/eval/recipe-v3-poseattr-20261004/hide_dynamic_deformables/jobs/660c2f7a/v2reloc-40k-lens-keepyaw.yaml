        args:
        - "set -euo pipefail\ncd \"$REPO_ROOT\"\nOUT=\"$OUTPUT_DIR\"\nLOCAL=/root/navsafe-eval-output\nmkdir -p \"$OUT\" \"$LOCAL\" /sync\nexec > >(tee -a \"$OUT/job.log\") 2>&1\nfinish() {\n  rc=$?\n  echo \"$rc\" > /sync/EVAL_DONE\n  if [[ -d \"$LOCAL\" ]]; then cp -a \"$LOCAL/.\" \"$OUT/\" || rc=8; fi\n  printf '{\"exit_code\":%s,\"finished_utc\":\"%s\"}\\n' \"$rc\" \"$(date -u +%FT%TZ)\" > \"$OUT/exit_status.json\"\n  trap - EXIT\n  exit \"$rc\"\n}\ntrap finish EXIT\ntest -s \"$SOURCE_RECON/SUCCESS.json\"\ntest -s \"$SOURCE_RECON/nurec_origin_offset.json\"\nEXPECTED=\"$RENDER_CLIENT_SHA256  navsafe/render/nurec_grpc.py\"\nprintf '%s\\n' \"$EXPECTED\" | sha256sum --check\n# Expose the setting's reconstruction under the clip identity expected by the loader.\nmkdir -p \"$RECON_ROOT\"\nln -s \"$SOURCE_RECON\" \"$RECON_ROOT/$CLIP_ID\"\ncommand -v conda >/dev/null && conda info --envs || true\nexport DEBIAN_FRONTEND=noninteractive\napt-get update -qq\napt-get install -y -qq git curl libglu1-mesa\
          \ libxt6 libgl1 libglx0 libegl1 libglib2.0-0 libxrandr2 libxinerama1 libxcursor1 libxi6 libxext6 libxrender1 libx11-6 libxfixes3 libxdamage1 libsm6 libice6 libgomp1 >/dev/null\npython3 -m pip install --quiet uv\nexport UV_PROJECT_ENVIRONMENT=/root/navsafe-eval-venv UV_CACHE_DIR=/root/.cache/uv UV_LINK_MODE=copy\nuv sync --locked --python 3.12\nexport PATH=/root/navsafe-eval-venv/bin:$PATH PYTHONPATH=\"$REPO_ROOT\"\nexport ACCEPT_EULA=Y OMNI_KIT_ACCEPT_EULA=YES PYTHONUNBUFFERED=1\nexport NUREC_GRPC_HOST=127.0.0.1 NUREC_GRPC_PORT=8080\npython - <<'ENV_CHECK'\nimport torch,isaaclab,py123d\nfrom importlib.metadata import version\nprint('EVAL_ENV',version('py123d'),torch.__version__,torch.cuda.is_available())\nassert torch.cuda.is_available() and version('py123d')=='0.6.0'\nENV_CHECK\nDRIVER=$(nvidia-smi --query-gpu=driver_version --format=csv,noheader | head -1 | tr -d ' ')\nKITCACHE=\"/avl-west/navsafe_dev/kitcache/kitcache-3090-$DRIVER.tar\"\nif [[ -s \"$KITCACHE\" ]]; then\n  KITPKG=$(python\
          \ -c 'import isaacsim,os; print(os.path.dirname(isaacsim.__file__))' | tail -1)\n  if tar -xf \"$KITCACHE\" -C \"$KITPKG\" kit && tar -xf \"$KITCACHE\" -C / var root; then\n    echo \"WARM_KIT_CACHE_RESTORED $KITCACHE\"\n    printf '%s\\n' \"$KITCACHE\" > \"$LOCAL/warm_kit_cache.txt\"\n  else\n    echo \"WARM_KIT_CACHE_RESTORE_FAILED $KITCACHE\" >&2\n  fi\nelse\n  echo \"WARM_KIT_CACHE_MISSING driver=$DRIVER\" >&2\nfi\n# Limit discovery to exactly this Arrow log: --py123d-scene-index 0 cannot drift.\nARROW=/root/navsafe-eval-arrow\nmkdir -p \"$ARROW/logs/nureasoning-mini_train\"\nln -s \"$BATCH_ROOT/arrow/logs/nureasoning-mini_train/$CLIP_ID\" \"$ARROW/logs/nureasoning-mini_train/$CLIP_ID\"\npython - <<'RENDER_READY'\nimport grpc,time,pathlib\nfrom nre.grpc.protos import common_pb2,sensorsim_pb2_grpc\nchannel=grpc.insecure_channel('127.0.0.1:8080')\nfor attempt in range(120):\n if pathlib.Path('/sync/SERVE_FAILED').exists(): raise RuntimeError('NuRec renderer failed; see renderer.log')\n\
          \ try:\n  grpc.channel_ready_future(channel).result(timeout=10)\n  print('NUREC_RENDERER_READY',flush=True)\n  break\n except grpc.FutureTimeoutError: pass\nelse: raise RuntimeError('NuRec renderer not ready within1200 seconds')\nstub=sensorsim_pb2_grpc.SensorsimServiceStub(channel)\nconfig=dict(stub.get_server_config(common_pb2.Empty(),timeout=30).server_config)\nassert config.get('enable_editing_actors','').lower()=='true',config\nprint('ACTOR_POSE_POLICY simulation_driven_actor_editing',flush=True)\nchannel.close()\nRENDER_READY\npython - <<'STATIC_POSES'\nimport json,os,zipfile\nd=json.loads(zipfile.ZipFile(os.environ['SOURCE_RECON']+'/artifacts/last.usdz').read('sequence_tracks.json'))\nt=next(iter(d.values()))['tracks_data'];out={}\nfor tid,poses,flags,label in zip(t['tracks_id'],t['tracks_poses'],t['tracks_flags'],t['tracks_label_class']):\n dyn='DYNAMIC' in flags;deform='HUMAN' in label or (dyn and any(k in label for k in ('BYCICLE','BICYCLE','MOTORCYCLE')))\n const=(not\
          \ dyn) and all(max(abs(a-b) for a,b in zip(p,poses[0]))<1e-6 for p in poses)\n out[tid]={'group':('dynamic' if dyn else 'static')+'_'+('deformables' if deform else 'rigids'),'pose':poses[0] if const else None}\nimport collections\njson.dump(out,open('/root/nur_static_poses.json','w'));print('STATIC_POSES_EXTRACTED',sum(v['pose'] is not None for v in out.values()),'of',len(out),dict(collections.Counter(v['group'] for v in out.values())),flush=True)\nassert out\nSTATIC_POSES\nSITE=$(python -c 'import sysconfig; print(sysconfig.get_paths()[\"purelib\"])')\ncat > \"$SITE/nur_static_pose_override.py\" <<'POSE_HOOK'\n\"\"\"Actor-editing render with one group of actors changed, to find what causes the debris seen under actor editing.\n\nNUR_STATIC_POSE_MODE:\n- trained_yaw / trained_position / trained_pose: static objects stored with one fixed pose in the reconstruction\n  get that rotation, translation or both instead of the raw per-frame annotation the simulation sends;\n- hide_static_rigids\
          \ / hide_static_deformables / hide_dynamic_rigids / hide_dynamic_deformables: every actor of\n  that layer is moved far away, as the client does for actors absent from the simulation.\nNUR_STATIC_POSES is a JSON file {track_id: {\"group\": layer, \"pose\": [x, y, z, qx, qy, qz, qw] or null}} in the\nreconstruction's world frame. Installed through a .pth file so it also applies in the child interpreter\nnavsafe-eval starts.\n\"\"\"\nimport importlib.abc\nimport json\nimport os\nimport sys\n\nTARGET = \"navsafe.render.nurec_grpc\"\nMODE = os.environ.get(\"NUR_STATIC_POSE_MODE\", \"\")\nGROUPS = (\"static_rigids\", \"static_deformables\", \"dynamic_rigids\", \"dynamic_deformables\")\nMODES = (\"trained_yaw\", \"trained_position\", \"trained_pose\") + tuple(\"hide_\" + g for g in GROUPS)\n\n\ndef _rotation(q):\n    import numpy as np\n\n    x, y, z, w = (float(v) for v in q)\n    return np.array([\n        [1 - 2 * (y * y + z * z), 2 * (x * y - z * w), 2 * (x * z + y * w)],\n     \
          \   [2 * (x * y + z * w), 1 - 2 * (x * x + z * z), 2 * (y * z - x * w)],\n        [2 * (x * z - y * w), 2 * (y * z + x * w), 1 - 2 * (x * x + y * y)],\n    ])\n\n\ndef _patch(module):\n    if MODE not in MODES:\n        return\n    import numpy as np\n\n    with open(os.environ[\"NUR_STATIC_POSES\"]) as f:\n        entries = json.load(f)\n    hidden = {k for k, v in entries.items() if MODE == \"hide_\" + v[\"group\"]}\n    table = {} if MODE.startswith(\"hide_\") else {\n        k: np.asarray(v[\"pose\"], dtype=np.float64) for k, v in entries.items() if v[\"pose\"] is not None}\n    renderer = module.NuRecGrpcSceneRenderer\n    actor_to_world = renderer._actor_to_world\n    seen = {}\n\n    def patched(self, state):\n        T = np.array(actor_to_world(self, state), dtype=np.float64, copy=True)\n        tid = str(state.get(\"id\"))\n        if tid in hidden:\n            if tid not in seen:\n                seen[tid] = 0.0\n                if len(seen) in (1, len(hidden)):\n  \
          \                  print(f\"STATIC_POSE_OVERRIDE {MODE} hidden={len(seen)} of {len(hidden)}\", flush=True)\n            T[:3, 3] = [1.0e5, 1.0e5, 0.0]\n            return T\n        trained = table.get(tid)\n        if trained is None:\n            return T\n        if tid not in seen:\n            # How far the simulation pose is from the trained one: centimetres if both use the same frame.\n            seen[tid] = float(np.linalg.norm(T[:2, 3] - trained[:2]))\n            if len(seen) in (1, 50, 200):\n                offsets = np.array(list(seen.values()))\n                print(f\"STATIC_POSE_OVERRIDE {MODE} tracks_in_table={len(table)} seen={len(seen)} \"\n                      f\"xy_offset_cm median={np.median(offsets) * 100:.1f} max={offsets.max() * 100:.1f}\", flush=True)\n        if MODE in (\"trained_yaw\", \"trained_pose\"):\n            T[:3, :3] = _rotation(trained[3:7])\n        if MODE in (\"trained_position\", \"trained_pose\"):\n            T[:3, 3] = trained[:3]\n\
          \        return T\n\n    renderer._actor_to_world = patched\n    renderer._nur_static_pose_patch = MODE\n\n\nclass _Loader(importlib.abc.Loader):\n    def __init__(self, loader):\n        self._loader = loader\n\n    def __getattr__(self, name):\n        return getattr(self._loader, name)\n\n    def create_module(self, spec):\n        return self._loader.create_module(spec)\n\n    def exec_module(self, module):\n        self._loader.exec_module(module)\n        _patch(module)\n\n\nclass _Finder(importlib.abc.MetaPathFinder):\n    def find_spec(self, name, path=None, target=None):\n        if name != TARGET:\n            return None\n        for finder in sys.meta_path:\n            if finder is self or not hasattr(finder, \"find_spec\"):\n                continue\n            spec = finder.find_spec(name, path, target)\n            if spec is not None and spec.loader is not None:\n                spec.loader = _Loader(spec.loader)\n                return spec\n        return None\n\
          \n\nsys.meta_path.insert(0, _Finder())\nPOSE_HOOK\necho 'import nur_static_pose_override' > \"$SITE/nur_static_pose_override.pth\"\nexport NUR_STATIC_POSE_MODE=hide_dynamic_deformables NUR_STATIC_POSES=/root/nur_static_poses.json\npython -c \"import navsafe.render.nurec_grpc as m; assert m.NuRecGrpcSceneRenderer._nur_static_pose_patch == 'hide_dynamic_deformables'; print('POSE_HOOK_ACTIVE hide_dynamic_deformables')\"\nCOMMON=(--scenario-source py123d --py123d-data-root \"$ARROW\" --py123d-scene-index 0 --nurec-work-dir \"$RECON_ROOT\" --render-backend nurec_grpc --traffic-mode log_replay --execution-mode controller --controller lqr --replan-rate 5 --eval-seed 1 --enable-vis --keep-ego-replay-frames --camera-resolution-scale 1.0 --log-level INFO)\nfailed=0\necho \"EVAL_BEGIN $CLIP_ID full ego replay200\"\nif navsafe-eval \"${COMMON[@]}\" --model-type pdm_closed --checkpoint none --ego-replay-frames 200 --eval-frames 0 --output-dir \"$LOCAL/ego_replay_200\" 2>&1 | tee \"$OUT/ego_replay_200.log\"\
          ; then\n  echo 0 > \"$LOCAL/ego_replay_200.exit_code\"\nelse\n  status=$?; echo \"$status\" > \"$LOCAL/ego_replay_200.exit_code\"; failed=1\nfi\nif ! grep -q STATIC_POSE_OVERRIDE \"$OUT/ego_replay_200.log\"; then echo 'ERROR: static pose hook was not active in the renderer process' >&2; failed=1; fi\nexport LOCAL\nif python - <<'VALIDATE_EVAL'\nimport os,json,pathlib\nroot=pathlib.Path(os.environ['LOCAL']);records=[]\nfor mode in ['ego_replay_200']:\n p=root/mode\n assert (root/(mode+'.exit_code')).read_text().strip()=='0',mode\n metrics=json.loads((p/'metrics.json').read_text())\n assert not metrics.get('infra_failure_error'),metrics\n assert all((p/'visualization'/name).is_file() and (p/'visualization'/name).stat().st_size>0 for name in ['topdown.gif','cam_f0.gif','combined.gif']),mode\n if mode=='ego_replay_200':\n  assert metrics['total_frames']==200 and metrics['success'],metrics\n  note='Visualization-only replay; current evaluator marks zero controlled frames unscorable.'\n\
          \ else:\n  assert 20<=metrics['total_frames']<=200 and metrics.get('termination_reason')!='infra_failure',metrics\n  note='20 replay frames, up to180 controlled; normal episode termination may end early.'\n records.append({'mode':mode,'metrics':metrics,'note':note})\nrecord={'clip_id':os.environ['CLIP_ID'],'reconstruction_source':os.environ['SOURCE_RECON'],'experiment_id':os.environ['EXPERIMENT_ID'],'actor_pose_policy':'actor_editing_static_hide_dynamic_deformables','render_client_sha256':os.environ['RENDER_CLIENT_SHA256'],'visualization_enabled':True,'records':records}\n(root/'SUCCESS.json').write_text(json.dumps(record,indent=2)+'\\n')\nprint('EVAL_BOTH_DONE',record,flush=True)\nVALIDATE_EVAL\nthen :; else failed=1; fi\nexit \"$failed\"\n"
