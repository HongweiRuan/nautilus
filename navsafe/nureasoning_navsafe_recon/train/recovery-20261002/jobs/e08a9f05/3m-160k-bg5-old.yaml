        - name: RECIPE_SHA256
          value: a0ca369466ce1ca58fb3c6352060e2075d22b18817926b578d4d9131d80e264c
        resources:
          requests:
            cpu: '2'
            memory: 32Gi
            ephemeral-storage: 100Gi
            nvidia.com/gpu: '1'
          limits:
            cpu: '2'
            memory: 32Gi
