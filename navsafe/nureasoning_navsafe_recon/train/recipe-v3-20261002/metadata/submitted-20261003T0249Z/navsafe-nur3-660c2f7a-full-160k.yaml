t: false\n      optimizers:\n      - name: fused_adam\n        args:\n          lr: 0.01\n          eps: 1.0e-15\n          betas: \u0026id004\n          - 0.9\n          - 0.99\n        params:\n          positions:\n            args:\n              lr: 0.0016\n        scheduler:\n          name: ExponentialLR\n          interval: step\n          args:\n            gamma: ${calc_exp_lr_decay_rate:0.01,${mul:${trainer.max_epochs},${dataset.n_samples_per_epoch}}}\n      - name: fused_adam\n        args:\n          lr: 0.01\n          eps: 1.0e-15\n          betas: *id004\n        params:\n          densities:\n            args:\n              lr: 0.05\n          features_albedo:\n            args:\n              lr: 0.0025\n          features_specular:\n            args:\n              lr: 0.000125\n          rotations:\n            args:\n              lr: 0.001\n          scales:\n            args:\n              lr: 0.005\n          extra_signal:\n            args:\n              lr: 0.01\n          camera_extra_signal:\n            args:\n              lr: 0.01\n          lidar_extra_signal:\n            args:\n              lr: 0.01\n  strategy:\n    add:\n      max_n_gaussians: 2100000\n      end_iteration: 140000\n      start_iteration: 20000\n      frequency: 100\n    relocate:\n      end_iteration: 140000\n      frequency: 100\n    perturb:\n      end_iteration: 160000\n    exclude_layer_ids:\n    - road\n    - dynamic_rigids\n    - dynamic_deformables\n    - static_rigids\n    - static_deformables\n  calib:\n    name: free-pose-calib\n    camera:\n      enabled: true\n    lidar:\n      enabled: false\n  renderer:\n    outputs:\n      camera:\n        enable_ray_gradients: true\n      lidar:\n        enable_ray_gradients: false\n  post_processing:\n    b:\n      per_frame_ppisp_enabled: false\ndataset:\n  n_samples_per_epoch: 160000\n  camera_ids: \u0026id005\n  - camera_pcam_f0\n  - camera_pcam_b0\n  - camera_pcam_l0\n  - camera_pcam_l1\n  - camera_pcam_l2\