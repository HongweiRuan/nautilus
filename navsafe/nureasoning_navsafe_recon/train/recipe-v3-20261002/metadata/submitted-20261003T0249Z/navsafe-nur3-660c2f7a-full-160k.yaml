1\n  save_on_train_epoch_end: true\n  artifact:\n    enabled: true\n    mesh:\n      ground:\n        enabled: false\n  save_last: true\nseed: 42\nmode: trainval\nout_dir: /avl-west/navsafe_nureasoning/recipe-v3-20261002/660c2f7a-full-160k/native\nlogger:\n  enabled: true\n  run_id: \u003cgenerate\u003e\nsystem:\n  warmup_steps: 1000\n  record_quality_metrics:\n    psnr_interval: 100\n  test:\n    save_results: true\n    save_inputs: true\n    save_videos: true\n    save_stats: true\n    separate_val_dir_per_step: true\n    use_camera_name_dirs: true\n    video_fps: 1\n    metrics:\n      ssim:\n        enabled: true\n      lpips:\n        enabled: false\n    val_render_selected_nodes: {}\nNRE_RECIPE\nprintf '%s  %s\\n' \"$RECIPE_SHA256\" /scratch/recipe.yaml | sha256sum -c -\ncat \u003e /scratch/nur_v3_train.py \u003c\u003c'NUR_V3_PY'\n\"\"\"nuReasoning recipe v3 training entry: NRE main + two input-hygiene patches.\n\nRun inside the NRE image: /app/run run-script nur_v3_train.py\nEnvironment:\n  NUR_V3_ARGS_FILE         NRE main args, one per line (same as `/app/run \u003cargs\u003e`); or NUR_V3_ARGS as JSON\n  NUR_V3_REPORT_DIR        where patch reports are written\n  NUR_V3_SOURCE_METADATA   raw nuReasoning metadata.json (camera filename clocks)\n  NUR_V3_TRACK_CLEAN       1/0  (P1)\n  NUR_V3_CAMERA_CLOCK      1/0  (P2)\n  NUR_V3_ACTOR_RELOCATE_LAYERS  comma list of actor layers for P3 (empty = off)\n\nP1 track hygiene: nuReasoning boxes are per-frame detections. Consecutive boxes jump 0.1-0.8 m,\nheadings flip by pi on parked objects, and NRE takes each track's box size from its first\nobservation. Rigid actors live in the box frame, so the jitter turns into blur. Each track is\nre-estimated: pi flips resolved against motion / axial heading, robust LOESS on xyz and yaw,\nnear-stationary tracks snapped to one pose, box size = per-track percentile of all observations.\n\nP2 camera clock: the py123d NCore bridge stamps every camera image with the LiDAR/ego frame time,\nwhile the cameras are triggered during the LiDAR sweep (-18..+24 ms, some frames +-40 ms). Rig\ntrajectories handed to the model now carry each image's filename capture time, so camera poses\nand actor-track interpolation use the real exposure time. Image / aux lookups keep the original\nsensor timestamps, which are untouched.\n\nP3 actor relocation: actor layers stay out of the global MCMC (so the background cannot drain\nthem) but get MCMC relocation inside their own layer; see install_actor_relocation_patch.\n\"\"\"\n\nimport hashlib\nimport json\nimport math\nimport os\nimport pickle\nimport sys\nimport time\n\nimport numpy as np\n\nREPORT_DIR = os.environ.get(\"NUR_V3_REPORT_DIR\", \"/tmp/nur_v3\")\nTRACK_CLEAN = os.environ.get(\"NUR_V3_TRACK_CLEAN\", \"1\") == \"1\"\nCAMERA_CLOCK = os.environ.get(\"NUR_V3_CAMERA_CLOCK\", \"1\") == \"1\"\nHALF_WINDOW_S = float(os.environ.get(\"NUR_V3_SMOOTH_HALF_WINDOW_S\", \"0.8\"))\nDIM_PERCENTILE = float(os.environ.get(\"NUR_V3_DIM_PERCENTILE\", \"75\"))\nSTATIC_SNAP_M = float(os.environ.get(\"NUR_V3_STATIC_SNAP_M\", \"0.5\"))\nACTOR_RELOCATE_LAYERS = [x for x in os.environ.get(\"NUR_V3_ACTOR_RELOCATE_LAYERS\", \"\").split(\",\") if x]\nMOVING_SPEED_MS = 1.0\nCAMERA_FOLDER_TO_NCORE = {\n    \"CAM_M_F\": \"camera_pcam_f0\",\n    \"CAM_M_B\": \"camera_pcam_b0\",\n    \"CAM_M_L0\": \"camera_pcam_l0\",\n    \"CAM_M_L1\": \"camera_pcam_l1\",\n    \"CAM_M_L2\": \"camera_pcam_l2\",\n    \"CAM_M_R0\": \"camera_pcam_r0\",\n    \"CAM_M_R1\": \"camera_pcam_r1\",\n    \"CAM_M_R2\": \"camera_pcam_r2\",\n}\n\n\ndef _say(*parts):\n    print(\"[nur_v3]\", *parts, flush=True)\n\n\ndef _write_report(name, obj):\n    os.makedirs(REPORT_DIR, exist_ok=True)\n    with open(os.path.join(REPORT_DIR, name), \"w\") as f:\n        json.dump(obj, f, indent=1, default=float)\n\n\n# ---------------------------------------------------------------- P1: track hygiene\n\n\ndef _wrap(a):\n    return (np.asarray(a) + np.pi) % (2 * np.pi) - np.pi\n\n\ndef _rotz(a):\n    c, s = math.cos(a), math.sin(a)\n    return np.array([[c, -s, 0.0], [s, c, 0.0], [0.0, 0.0, 1.0]])\n\n\ndef loess(t, y, half_window, degree=2, robust_iters=2, scale_floor=0.05):\n    \"\"\"Robust local polynomial regression (tricube kernel, bisquare reweighting).\n\n    The local degree drops when the window is thin or one-sided (track ends, gaps), and every\n    fit is clamped to the range of the samples it used, so sparse tracks cannot extrapolate.\n    \"\"\"\n    t = np.asarray(t, dtype=np.float64)\n    y = np.asarray(y, dtype=np.float64)\n    squeeze = y.ndim == 1\n    y = y.reshape(len(t), -1)\n    n = len(t)\n    out = y.copy()\n    robust = np.ones(n)\n    for it in range(robust_iters + 1):\n        for i in range(n):\n            d = np.abs(t - t[i])\n            k = min(n - 1, degree + 2)\n            h = max(half_window, np.partition(d, k)[k] * 1.0001)\n            w = np.clip(1.0 - (d / h) ** 3, 0.0, None) ** 3 * robust\n            m = w \u003e 1e-12\n            count = int(m.sum())\n            if count == 0:\n                continue\n            dt = t[m] - t[i]\n            deg = degree\n            if not (np.any(dt \u003c -1e-9) and np.any(dt \u003e 1e-9)):\n                deg = min(deg, 1)\n            deg = max(0, min(deg, count - 3))\n            ym, wm = y[m], w[m][:, None]\n            X = np.vander(dt, deg + 1, increasing=True)\n            A = X.T @ (wm * X) + 1e-9 * np.eye(deg + 1)\n            fit = np.linalg.solve(A, X.T @ (wm * ym))[0]\n            lo, hi = ym.min(axis=0), ym.max(axis=0)\n            pad = 0.25 * (hi - lo) + scale_floor\n            out[i] = np.clip(fit, lo - pad, hi + pad)\n        if it \u003c robust_iters:\n            r = np.linalg.norm(y - out, axis=1)\n            s = max(6.0 * np.median(r), scale_floor)\n            robust = np.clip(1.0 - (r / s) ** 2, 0.0, None) ** 2\n    return out[:, 0] if squeeze else out\n\n\ndef clean_track(timestamps_us, poses, dims):\n    \"\"\"Return (clean poses list, clean dims, info) for one track.\n\n    poses: list of 4x4 world poses (z-up), dims: (M, 3) array of all observed box sizes.\n    \"\"\"\n    P = np.stack(poses).astype(np.float64)\n    n = len(P)\n    info = {\"n\": n}\n    new_dims = np.percentile(np.asarray(dims, dtype=np.float64), DIM_PERCENTILE, axis=0) if len(dims) else None\n    if n \u003c 4:\n        info[\"skipped\"] = \"few_poses\"\n        return poses, new_dims, info\n    t = (np.asarray(timestamps_us, dtype=np.int64) - int(timestamps_us[0])) / 1e6\n    if np.any(np.diff(t) \u003c= 0):\n        info[\"skipped\"] = \"non_increasing_time\"\n        return poses, new_dims, info\n    xyz = P[:, :3, 3]\n    yaw = np.arctan2(P[:, 1, 0], P[:, 0, 0])\n    tilt = np.einsum(\"nij,njk-\u003enik\", np.stack([_rotz(-a) for a in yaw]), P[:, :3, :3])\n    tilt_deg = float(np.degrees(np.arccos(np.clip((np.trace(tilt, axis1=1, axis2=2) - 1) / 2, -1, 1))).max())\n    info[\"max_tilt_deg\"] = tilt_deg\n\n    xyz_s = loess(t, xyz, HALF_WINDOW_S)\n    vel = np.gradient(xyz_s[:, :2], t, axis=0)\n    speed = np.linalg.norm(vel, axis=1)\n    moving = speed \u003e MOVING_SPEED_MS\n    center = np.median(xyz_s[:, :2], axis=0)\n    spread = float(np.max(np.linalg.norm(xyz_s[:, :2] - center, axis=1)))\n    info[\"jitter_rms_m\"] = float(np.sqrt(np.mean(np.sum((xyz - xyz_s) ** 2, axis=1))))\n    info[\"spread_m\"] = spread\n    info[\"moving_frac\"] = float(moving.mean())\n\n    # Heading modulo pi is flip-invariant: smooth the doubled angle, then pick one direction.\n    doubled = loess(t, np.stack([np.cos(2 * yaw), np.sin(2 * yaw)], axis=1), HALF_WINDOW_S * 2, scale_floor=0.1)\n    axial = 0.5 * np.unwrap(np.arctan2(doubled[:, 1], doubled[:, 0]))\n    path = float(np.sum(np.linalg.norm(np.diff(xyz_s[:, :2], axis=0), axis=1)))\n    info[\"path_m\"] = path\n    if moving.mean() \u003e= 0.3 and path \u003e= 3.0:\n        heading = np.arctan2(vel[:, 1], vel[:, 0])\n        forward = np.mean(np.abs(_wrap(axial[moving] - heading[moving])) \u003c np.pi / 2) \u003e= 0.5\n        ref = axial if forward else axial + np.pi\n    else:\n        votes = np.mean(np.abs(_wrap(yaw - axial)) \u003c np.pi / 2) \u003e= 0.5\n        ref = axial if votes else axial + np.pi\n    d = _wrap(yaw - ref)\n    flips = np.abs(d) \u003e np.pi / 2\n    d = np.where(flips, _wrap(d - np.pi), d)\n    yaw_aligned = ref + d\n    info[\"yaw_flips_fixed\"] = int(flips.sum())\n    yaw_s = loess(t, yaw_aligned, HALF_WINDOW_S, scale_floor=0.02)\n    info[\"yaw_jitter_rms_rad\"] = float(np.sqrt(np.mean((yaw_aligned - yaw_s) ** 2)))\n\n    snapped = spread \u003c STATIC_SNAP_M and not moving.any()\n    info[\"static_snapped\"] = bool(snapped)\n    if snapped:\n        mean_yaw = math.atan2(np.mean(np.sin(yaw_s)), np.mean(np.cos(yaw_s)))\n        xyz_s = np.repeat(np.median(xyz_s, axis=0, keepdims=True), n, axis=0)\n        yaw_s = np.full(n, mean_yaw)\n    keep_tilt = tilt_deg \u003e 3.0\n    out = []\n    for i in range(n):\n        T = np.eye(4)\n        T[:3, :3] = _rotz(yaw_s[i]) @ (tilt[i] if keep_tilt else np.eye(3))\n        T[:3, 3] = xyz_s[i]\n        out.append(T)\n    return out, new_dims, info\n\n\ndef _bbox_dims(b):\n    if isinstance(b, dict):\n        return tuple(float(x) for x in b[\"dim\"])\n    return tuple(float(x) for x in b.dim)\n\n\ndef install_track_patch():\n    import nre.datasets.utils as du\n\n    original = du.consolidate_cuboid_tracks\n\n    def consolidate_and_clean(*args, **kwargs):\n        all_tracks = original(*args, **kwargs)\n        cuboids_df = kwargs[\"cuboids_df\"] if \"cuboids_df\" in kwargs else args[0]\n        key_src = repr(sorted((k, len(v[\"timestamps_us\"]), v[\"timestamps_us\"][0]) for k, v in all_tracks.items() if v[\"timestamps_us\"]))\n        cache = os.path.join(\"/tmp\", \"nur_v3_tracks_\" + hashlib.sha1(key_src.encode()).hexdigest()[:16] + \".pkl\")\n        if os.path.exists(cache):\n            with open(cache, \"rb\") as f:\n                cleaned = pickle.load(f)\n            for track_id, (poses, dims) in cleaned.items():\n                all_tracks[track_id][\"poses\"] = poses\n                if dims is not None:\n                    all_tracks[track_id][\"dimension\"] = dims\n            _say(\"track hygiene: reused cache\", cache, \"tracks\", len(cleaned))\n            return all_tracks\n        start = time.time()\n        dims_by_track = {}\n        for track_id, bbox3 in zip(cuboids_df[\"track_id\"].tolist(), cuboids_df[\"bbox3\"].tolist()):\n            dims_by_track.setdefault(track_id, []).append(_bbox_dims(bbox3))\n        cleaned, report = {}, {}\n        for track_id, track in all_tracks.items():\n            if not track[\"timestamps_us\"]:\n                continue\n            first_dims = np.asarray(track[\"dimension\"], dtype=np.float64)\n            poses, dims, info = clean_track(track[\"timestamps_us\"], track[\"poses\"], dims_by_track.get(track_id, []))\n            if dims is not None:\n                dims = dims.astype(np.asarray(track[\"dimension\"]).dtype)\n                track[\"dimension\"] = dims\n                info[\"dims_first\"] = first_dims.tolist()\n                info[\"dims_new\"] = dims.tolist()\n            track[\"poses\"] = poses\n            info[\"label_class\"] = str(track[\"label_class\"])\n            cleaned[track_id] = (poses, dims)\n            report[track_id] = info\n        tmp = f\"{cache}.{os.getpid()}.tmp\"\n        with open(tmp, \"wb\") as f:\n            pickle.dump(cleaned, f)\n        os.replace(tmp, cache)\n        jit = np.array([r.get(\"jitter_rms_m\", 0.0) for r in report.values()])\n        summary = {\n            \"tracks\": len(report),\n            \"seconds\": time.time() - start,\n            \"half_window_s\": HALF_WINDOW_S,\n            \"dim_percentile\": DIM_PERCENTILE,\n            \"static_snapped\": int(sum(r.get(\"static_snapped\", False) for r in report.values())),\n            \"tracks_with_yaw_flips\": int(sum(r.get(\"yaw_flips_fixed\", 0) \u003e 0 for r in report.values())),\n            \"yaw_flips_fixed_total\": int(sum(r.get(\"yaw_flips_fixed\", 0) for r in report.values())),\n            \"removed_jitter_rms_m_p50_p90_max\": [float(np.percentile(jit, 50)), float(np.percentile(jit, 90)), float(jit.max())] if len(jit) else [],\n            \"max_tilt_deg\": float(max([r.get(\"max_tilt_deg\", 0.0) for r in report.values()] or [0.0])),\n        }\n        _write_report(\"track_hygiene.json\", {\"summary\": summary, \"tracks\": report})\n        _say(\"track hygiene:\", json.dumps(summary))\n        return all_tracks\n\n    du.consolidate_cuboid_tracks = consolidate_and_clean\n    _say(\"installed track hygiene patch\")\n\n\n# ---------------------------------------------------------------- P2: camera capture clock\n\n\ndef load_capture_clock(metadata_path):\n    meta = json.load(open(metadata_path))\n    clock = {}\n    for frame in meta[\"frames\"]:\n        ego_ts = int(frame[\"timestamp_us\"])\n        for rel in frame[\"sensors\"][\"cameras\"].values():\n            folder = rel.split(\"/\")[1]\n            capture_ts = int(os.path.splitext(rel)[0].rsplit(\"_\", 1)[1])\n            clock.setdefault(CAMERA_FOLDER_TO_NCORE[folder], {})[ego_ts] = capture_ts\n    return clock\n\n\ndef install_camera_clock_patch(metadata_path):\n    import torch\n    import nre.datasets.ncore as nc\n    from ncore.impl.common.transformations import PoseInterpolator\n\n    clock = load_capture_clock(metadata_path)\n    original = nc.NCOREDataSource.get_rig_trajectories\n    reported = {\"done\": False}\n\n    def get_rig_trajectories_capture_clock(self):\n        rts = original(self)\n        stats = {}\n        for rt in rts.rig_trajectories:\n            pose_ts = rt.T_rig_world_timestamps_us.cpu().numpy()\n            lo, hi = int(pose_ts.min()), int(pose_ts.max())\n            for unique_id, ts in list(rt.cameras_frame_timestamps_us.items()):\n                logical = rts.camera_calibrations[unique_id].logical_sensor_name\n                table = clock.get(logical)\n                if table is None:\n                    raise RuntimeError(f\"nur_v3: no capture clock for camera {logical}\")\n                stamped = ts.cpu().numpy().astype(np.int64)\n                found = np.array([int(e) in table for e in stamped[:, 1]])\n                if found.mean() \u003c 0.95:\n                    raise RuntimeError(f\"nur_v3: capture clock covers only {found.mean():.1%} of {logical} frames\")\n                capture = np.array([table.get(int(e), int(e)) for e in stamped[:, 1]], dtype=np.int64)\n                capture = np.clip(capture, lo, hi)\n                for i in range(1, len(capture)):  # keep strictly increasing frame times\n                    if capture[i] \u003c= capture[i - 1]:\n                        capture[i] = stamped[i, 1] if stamped[i, 1] \u003e capture[i - 1] else capture[i - 1] + 1\n                new = np.stack([capture, capture], axis=1)\n                rt.cameras_frame_timestamps_us[unique_id] = torch.from_numpy(new).to(ts.dtype)\n                if rt.cameras_frame_T_rig_worlds is not None and unique_id in rt.cameras_frame_T_rig_worlds:\n                    interp = PoseInterpolator(rt.T_rig_worlds.cpu().numpy(), pose_ts)\n                    T = interp.interpolate_to_timestamps(capture, dtype=np.float64)\n                    rt.cameras_frame_T_rig_worlds[unique_id] = torch.from_numpy(np.stack([T, T], axis=1))\n                off = (capture - stamped[:, 1]) / 1e3\n                stats[logical] = {\n                    \"frames\": len(capture),\n                    \"coverage\": float(found.mean()),\n                    \"offset_ms_median\": float(np.median(off)),\n                    \"offset_ms_min\": float(off.min()),\n                    \"offset_ms_max\": float(off.max()),\n                    \"frames_abs_offset_gt_30ms\": int(np.sum(np.abs(off) \u003e 30)),\n                }\n        if not reported[\"done\"]:\n            reported[\"done\"] = True\n            _write_report(\"camera_clock.json\", {\"metadata\": metadata_path, \"cameras\": stats})\n            _say(\"camera clock:\", json.dumps({k: round(v[\"offset_ms_median\"], 1) for k, v in stats.items()}))\n        return rts\n\n    nc.NCOREDataSource.get_rig_trajectories = get_rig_trajectories_capture_clock\n    _say(\"installed camera capture-clock patch\", metadata_path)\n\n\n# ---------------------------------------------------------------- P3: actor-layer MCMC relocation\n\n\ndef install_actor_relocation_patch(layers):\n    \"\"\"Relocate dead Gaussians inside each actor layer on the MCMC relocation schedule.\n\n    v2 keeps actor layers out of the global MCMC so the background cannot drain them, but then\n    nothing recycles their dead Gaussians: in the v2 3M/40k checkpoint 96-98% of every actor\n    layer ended with opacity \u003c 0.05. Here each listed layer gets its own relocation pass: dead\n    Gaussians (opacity \u003c= threshold) move onto alive ones of the same layer (cuboid ids follow\n    the target), counts stay fixed, nothing crosses layers. Death is opacity-only; the\n    invisible-steps rule would recycle actors that are simply off-screen for a while.\n    \"\"\"\n    from nre.models.gaussians.strategies.mcmc import MCMCStrategy\n\n    original = MCMCStrategy.update_step_train_batch_end\n    logged = {\"n\": 0}\n\n    def update_step_with_actor_relocation(self, epoch, global_step, batch, system, gaussians_nodes, **kwargs):\n        original(self, epoch, global_step, batch, system, gaussians_nodes, **kwargs)\n        relocate = self.config.relocate\n        if not self._check_step_condition(\n            step=global_step, start=relocate.start_iteration, end=relocate.end_iteration, freq=relocate.frequency\n        ):\n            return\n        saved_exclude, saved_invisible = list(self.config.exclude_layer_ids), relocate.max_invisible_steps\n        try:\n            relocate.max_invisible_steps = None\n            for layer in layers:\n                if layer not in gaussians_nodes or gaussians_nodes[layer].get_num_gaussians() == 0:\n                    continue\n                self.config.exclude_layer_ids = [name for name in gaussians_nodes.keys() if name != layer]\n                self.relocate_gaussians(gaussians_nodes)\n        finally:\n            self.config.exclude_layer_ids = saved_exclude\n            relocate.max_invisible_steps = saved_invisible\n        if logged[\"n\"] \u003c 3:\n            logged[\"n\"] += 1\n            _say(\"actor relocation pass at step\", global_step, \"layers\", layers)\n\n    MCMCStrategy.update_step_train_batch_end = update_step_with_actor_relocation\n    _say(\"installed actor-layer relocation patch\", layers)\n\n\ndef main():\n    if \"NUR_V3_ARGS_FILE\" in os.environ:\n        args = [a for a in open(os.environ[\"NUR_V3_ARGS_FILE\"]).read().split(\"\\n\") if a]\n    else:\n        args = json.loads(os.environ[\"NUR_V3_ARGS\"])\n    if TRACK_CLEAN:\n        install_track_patch()\n    if CAMERA_CLOCK:\n        install_camera_clock_patch(os.environ[\"NUR_V3_SOURCE_METADATA\"])\n    if ACTOR_RELOCATE_LAYERS:\n        install_actor_relocation_patch(ACTOR_RELOCATE_LAYERS)\n    from nre.run.main import main as nre_main\n\n    _say(\"NRE main args:\", args)\n    nre_main.main(args=args, standalone_mode=False)\n\n\nif __name__ == \"__main__\":\n    main()\nNUR_V3_PY\nprintf '%s  %s\\n' \"$WRAPPER_SHA256\" /scratch/nur_v3_train.py | sha256sum -c -\nARGS=(--config-name=/scratch/recipe.yaml mode=trainval \"logger.run_id='$CLIP_ID'\" \"dataset.path=/scratch/ncore/pai_$CLIP_ID.json\" \"out_dir=$DEST/native\")\n/app/run export-parsed-config --config-name=/scratch/recipe.yaml --output \"$DEST/parsed-preflight.yaml\" -- \"${ARGS[@]:1}\"\nprintf '%s\\n' \"${ARGS[@]}\" \u003e /scratch/nre_args.txt\nNUR_V3_ARGS_FILE=/scratch/nre_args.txt NUR_V3_REPORT_DIR=\"$DEST/nur_v3\" NUR_V3_SOURCE_METADATA=\"$SOURCE_METADATA\" \\\n  /app/run run-script /scratch/nur_v3_train.py\ntest