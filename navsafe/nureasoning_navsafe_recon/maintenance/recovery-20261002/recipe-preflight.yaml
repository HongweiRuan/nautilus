apiVersion: batch/v1
kind: Job
metadata:
  name: navsafe-nur-recovery-preflight-20261002-r1
  namespace: cogrob
  labels: &id001
    app: navsafe-nureasoning-recovery
    batch: nureasoning-recovery-20261002
    purpose: recipe-preflight
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels: *id001
    spec:
      restartPolicy: Never
      imagePullSecrets:
      - name: ngc-pull
      containers:
      - image: nvcr.io/nvidia/nre/nre-ga@sha256:6e0caa70a9148490552520c3dde9ee665c8d094ca10b814601cb8bb306567c90
        imagePullPolicy: IfNotPresent
        command:
        - /opt/nvidia/nvidia_entrypoint.sh
        - bash
        - -c
        env:
        - name: OMP_NUM_THREADS
          value: '1'
        - name: MKL_NUM_THREADS
          value: '1'
        volumeMounts:
        - name: hugsim
          mountPath: /hugsim-storage
        - name: avl-west
          mountPath: /avl-west
        name: audit
        args:
        - |
          set -euo pipefail
          cd /hugsim-storage/NavSafe-infty
          export RUNFILES_DIR=/app/run.runfiles
          source <(head -n -1 /app/run)
          python3 - <<'RECIPE_PREFLIGHT'
          import pathlib,json,hashlib,datetime,yaml
          from nre.config.parse import parse_typed_config
          from omegaconf import OmegaConf
          import gzip,base64
          rows=json.loads(gzip.decompress(base64.b64decode('')))
          root=pathlib.Path('/hugsim-storage/NavSafe-infty/deploy/nautilus/nureasoning_recovery_20261002')
          (root/'recipes').mkdir(parents=True,exist_ok=True)
          checks=[]
          for r in rows:
           f=root/'recipes'/(r['job_name']+'.yaml');f.write_text(r['recipe'])
           assert hashlib.sha256(f.read_bytes()).hexdigest()==r['recipe_sha256']
           args=["logger.run_id='"+r['clip_id']+"'",'dataset.path='+r['dataset_path']]
           if r['job_name'].endswith('-old'):args.extend(['mode=train','logger=dummy','system.optimizers.0.scheduler.args.T_max=160000'])
           if r['resume_checkpoint']:args.extend(['resume='+r['resume_checkpoint'],'resume_weights_only=false'])
           cfg=parse_typed_config(str(f),args)
           d=json.loads(json.dumps(cfg.model_dump(),default=lambda v:OmegaConf.to_container(v,resolve=True) if OmegaConf.is_config(v) else str(v)))
           assert d['dataset']['n_samples_per_epoch']==r['target_steps']
           assert d['trainer']['max_epochs']==1 and d['checkpoint']['every_n_train_steps']==10000
           assert d['out_dir']==r['output_dir']+'/native'
           assert not d['resume_weights_only']
           assert d['system']['optimizers'][0]['scheduler']['args']['T_max']==r['target_steps']
           previous=pathlib.Path(r['output_dir'])/'native'/r['clip_id']/'config/parsed.yaml'
           assert previous.is_file(),previous
           old=yaml.safe_load(previous.read_text())
           for field in ['model','loss','system']:
            assert d[field]==old[field],(r['job_name'],field)
           for field in ['dataset','trainer']:
            a=dict(d[field]);b=dict(old[field])
            for k in (['path'] if field=='dataset' else ['device_count','world_size','num_nodes']):a.pop(k,None);b.pop(k,None)
            assert a==b,(r['job_name'],field,[(k,a.get(k),b.get(k)) for k in a.keys()|b.keys() if a.get(k)!=b.get(k)])
           (root/'parsed').mkdir(exist_ok=True)
           (root/'parsed'/(r['job_name']+'.yaml')).write_text(yaml.safe_dump(d,sort_keys=False))
           checks.append({'job_name':r['job_name'],'native_typed_config':'passed','model_loss_system_dataset_trainer':'identical_to_original_native_config','resume_step':r['resume_step']})
           print('PREFLIGHT_PASS',r['job_name'],'resume',r['resume_step'],flush=True)
          report={'checked_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'checks_passed':len(checks),'runs':checks,'native_version':'26.4.146','training_started_by_preflight':False}
          (root/'validation.json').write_text(json.dumps(report,indent=2)+'\n')
          pathlib.Path('/avl-west/navsafe_nureasoning/recovery-20261002/validation.json').write_text(json.dumps(report,indent=2)+'\n')
          print('RECOVERY_NATIVE_PREFLIGHT_PASS',len(checks),flush=True)

          RECIPE_PREFLIGHT
        resources:
          requests:
            cpu: '1'
            memory: 2Gi
          limits:
            cpu: '1'
            memory: 2Gi
      volumes:
      - name: hugsim
        persistentVolumeClaim:
          claimName: horuan-hugsim-vol
      - name: avl-west
        persistentVolumeClaim:
          claimName: avl-west-vol
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - ry-gpu-07.sdsc.optiputer.net
                - ry-gpu-11.sdsc.optiputer.net
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-GeForce-RTX-3090
      tolerations:
      - key: nautilus.io/reservation
        operator: Equal
        value: cogrob
        effect: NoSchedule
