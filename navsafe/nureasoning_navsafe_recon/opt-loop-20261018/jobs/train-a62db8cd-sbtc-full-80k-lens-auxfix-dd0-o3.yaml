        - name: NUR_V3_ACTOR_SCALE_CAP
          value: '0.5'
        - name: NGC_API_KEY
          valueFrom:
            secretKeyRef:
              name: ngc-api-key
              key: NGC_API_KEY
        volumeMounts: &id003
        - name: hugsim
          mountPath: /hugsim-storage
        - name: avl-west
          mountPath: /avl-west
        - name: scratch
          mountPath: /scratch
        - name: dshm
          mountPath: /dev/shm
        name: stage-inputs
        args:
        - |
          set -euo pipefail
          DIAG="$DEST/diagnostics/$HOSTNAME"
          mkdir -p "$DIAG" /scratch/ncore
          exec > >(tee -a "$DIAG/prepare.log") 2>&1
          test -s "$NCORE_DIR/nurec_origin_offset.json"
          test -s "$NCORE_DIR/pai_$CLIP_ID.json"
          test -s "$SOURCE_METADATA"
          cp -a "$NCORE_DIR/pai_$CLIP_ID.json" /scratch/ncore/
          for src in "$NCORE_DIR/pai_$CLIP_ID".ncore4*.zarr.itar; do
            test -s "$src"
            cp -aL "$src" /scratch/ncore/
          done
          test "$(find /scratch/ncore -maxdepth 1 -name '*.ncore4*.zarr.itar' | wc -l)" -eq 10
          # Native aux loader truncates the filename at its first dot.
          MANIFEST="pai_$CLIP_ID.json"
          AUX_BASE="${MANIFEST%%.*}"
          for kind in sseg lidar-sseg lidar-camvis egomask; do
            src="$NCORE_DIR/pai_$CLIP_ID.aux.$kind.zarr.itar"
            # auxfix: the regenerated lidar-sseg store replaces the original; the other three stores are unchanged.
            if [[ "$kind" == lidar-sseg ]]; then src="$LIDAR_SSEG_FIX"; fi
            test -s "$src"
            cp -aL "$src" "/scratch/ncore/$AUX_BASE.aux.$kind.zarr.itar"
          done
          printf '%s  %s\n' "$LIDAR_SSEG_FIX_SHA256" "/scratch/ncore/$AUX_BASE.aux.lidar-sseg.zarr.itar" | sha256sum -c -
          echo "STAGING_COMPLETE $EXPERIMENT_ID"
        resources:
          requests:
            cpu: '1'
            memory: 4Gi
            ephemeral-storage: 100Gi
          limits:
            cpu: '1'
            memory: 4Gi
            ephemeral-storage: 100Gi
      containers:
      - image: nvcr.io/nvidia/nre/nre-ga@sha256:6e0caa70a9148490552520c3dde9ee665c8d094ca10b814601cb8bb306567c90
        imagePullPolicy: IfNotPresent
        command: *id001
        env: *id002
        volumeMounts: *id003
        name: train
        args:
        - |
          set -euo pipefail
          DIAG="$DEST/diagnostics/$HOSTNAME"
          mkdir -p "$DIAG"
          exec > >(tee -a "$DIAG/train.log") 2>&1
          finish() {
            rc=$?
            trap - EXIT
            printf '{"exit_code":%s,"finished_utc":"%s"}\n' "$rc" "$(date -u +%FT%TZ)" > "$DIAG/exit_status.json"
            exit "$rc"
          }
          trap finish EXIT
          RUN="$DEST/native/$CLIP_ID"
          test ! -e "$RUN"
          mkdir -p "$DEST/checkpoints" "$RUN" /scratch/native-artifacts
          ln -s "$DEST/checkpoints" "$RUN/checkpoints"
          ln -s /scratch/native-artifacts "$RUN/artifacts"
          nvidia-smi --query-gpu=name,memory.total,driver_version --format=csv
          cat > /scratch/recipe.yaml <<'NRE_RECIPE'
