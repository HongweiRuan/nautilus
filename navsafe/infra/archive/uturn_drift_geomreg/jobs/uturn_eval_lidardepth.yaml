# EVAL + GIF for the U-turn lidardepth reconstruction.
#
# WHAT THIS SHOWS: these recons were trained on a rig trajectory whose
# absolute-UTM poses had been cast to float32 before the frame-0 re-reference,
# so the ego track is a 0.5 m staircase (measured: 0.000 / 0.500 m steps,
# apparent speed swinging 0 - 53 m/s against the corpus store's smooth
# 2.8 - 4.4 m/s). That is a converter bug of mine, since fixed in
# _clip_pose_trajectory, and the recons are being rebuilt. Jitter here is that,
# not the lidar supervision.
#
# The renderer is CO-LOCATED, not the shared nurec-grpc service: serve-grpc
# scans its --artifact-glob only at start-up, so pointing the shared one at
# these artifacts would mean editing symlinks other scenes rely on and
# restarting it for everybody. A per-job renderer globbing only these four
# artifacts costs nothing extra (serve + rollout together fit in ~7 GB of a
# 3090) and leaves shared state alone.
#
# 80 frames of pure ego replay, nothing scored -- the point is the picture.
apiVersion: batch/v1
kind: Job
metadata:
  {
    name: uturn-eval-lidardepth-r2,
    namespace: cogrob,
    labels: { app: uturn_drift_geomreg, stage: eval, arm: lidardepth },
  }
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 604800
  template:
    metadata: { labels: { app: uturn_drift_geomreg, stage: eval, arm: lidardepth } }
    spec:
      restartPolicy: Never
      imagePullSecrets: [{ name: ngc-pull }]
      containers:
        - name: gpu-container
          image: nvcr.io/nvidia/nre/nre-ga@sha256:6e0caa70a9148490552520c3dde9ee665c8d094ca10b814601cb8bb306567c90
          imagePullPolicy: IfNotPresent
          command: ["/opt/nvidia/nvidia_entrypoint.sh", "bash", "-c"]
          args:
            - |
              set -uo pipefail
              trap 'echo "=== serve-grpc tail ==="; tail -40 /tmp/serve.log 2>/dev/null || true' EXIT
              T=891953217984568c
              T0=1632945581749579
              SEG=5000000
              REC=/avl-west/runs/20260819-uturn-drift-geomreg/recon/lidardepth-staircase
              NC=/avl-west/runs/20260820-uturn-lidardepth-staircase-stores
              OUT=/avl-west/runs/20260819-uturn-drift-geomreg/eval/lidardepth-staircase

              # Fail before the ~20 min bootstrap if an input is missing.
              CK=/closed-loop-e2e/weights/navsimv2/DrivoR/drivor_Nav1_25epochs.pth
              test -s "$CK" || { echo "FATAL: no DrivoR checkpoint"; exit 1; }
              for k in 1 2 3 4; do
                test -s $REC/${T}s$k/artifacts/last.usdz || { echo "FATAL: no usdz for ${T}s$k"; exit 1; }
                test -s $NC/clips/${T}s$k/nurec_origin_offset.json || { echo "FATAL: no offset sidecar for ${T}s$k"; exit 1; }
              done
              test -d /avl-west/navsafe_5s_500/${T}_20s/arrow || { echo "FATAL: no arrow"; exit 1; }

              # --- runtime bootstrap (nre-ga is minimal; IsaacSim needs the X11/GL stack) ---
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq && apt-get install -y -qq git curl python3-venv \
                libglu1-mesa libxt6 libgl1 libglx0 libegl1 libglib2.0-0 \
                libxrandr2 libxinerama1 libxcursor1 libxi6 libxext6 libxrender1 \
                libx11-6 libxfixes3 libxdamage1 libsm6 libice6 libgomp1 >/dev/null
              export PATH=$HOME/.local/bin:$HOME/.cargo/bin:$PATH
              # Wheel cache on the PVC so this is a one-off cost across eval jobs.
              export UV_CACHE_DIR=/avl-west/navsafe_dev/.uv-cache
              export UV_PROJECT_ENVIRONMENT=/root/ns-venv
              export VIRTUAL_ENV=/root/ns-venv
              for i in 1 2 3 4; do
                command -v uv >/dev/null && break
                python -m pip install --quiet --user uv 2>/dev/null || \
                  pip install --quiet --user uv 2>/dev/null || \
                  curl -LsSf https://astral.sh/uv/install.sh | sh
                hash -r; sleep 10
              done
              command -v uv >/dev/null || { echo "FATAL: uv unavailable"; exit 1; }
              # Build against the PVC checkout but install into /root -- concurrent eval
              # jobs must not race on a .venv inside the shared repo.
              cd /hugsim-storage/NexusSim
              if ! /root/ns-venv/bin/python -c "import isaacsim, isaaclab, nexussim" 2>/dev/null; then
                uv sync --all-extras --python 3.12
                [ -d /root/IsaacLab/.git ] || git clone --depth 1 --branch v3.0.0-beta \
                  https://github.com/isaac-sim/IsaacLab.git /root/IsaacLab
                for ext in isaaclab isaaclab_assets isaaclab_tasks isaaclab_rl isaaclab_mimic; do
                  d=/root/IsaacLab/source/$ext
                  [ -d "$d" ] && uv pip install --python /root/ns-venv/bin/python --no-deps -e "$d"
                done
                uv pip install --python /root/ns-venv/bin/python lazy_loader einops
              fi
              /root/ns-venv/bin/python -m pip install --quiet grpcio protobuf 2>&1 | tail -1 || true

              # --- co-located renderer, these four artifacts only ---------------------
              CUDA_VISIBLE_DEVICES=0 /app/run serve-grpc --host 0.0.0.0 \
                --enable-editing-actors --renderer default \
                --enable-harmonizer --harmonizer-cache /avl-west/navsafe_dev/.harmonizer-cache \
                --artifact-glob "$REC/*/artifacts/last.usdz" > /tmp/serve.log 2>&1 &
              SERVE_PID=$!
              for i in $(seq 1 120); do
                kill -0 $SERVE_PID 2>/dev/null || { echo "FATAL: serve-grpc exited early"; exit 1; }
                (exec 3<>/dev/tcp/localhost/8080) 2>/dev/null && { echo "serve up after ${i}0s"; break; }
                sleep 10
              done
              echo "=== scenes the renderer holds ==="
              grep -ao "Available scenes.*" /tmp/serve.log | tr ',' '\n' | grep -o "${T}s[0-9]" | sort -u

              # --- handoff: one entry per 5 s clip, each naming ITS OWN offset sidecar.
              # The offsets belong to the store the recon was trained from, not the
              # corpus -- they differ by up to 0.19 m and mixing them shifts the scene.
              H=""
              for k in 0 1 2 3; do
                C=${T}s$((k+1))
                A=$((T0 + k*SEG)); B=$((T0 + (k+1)*SEG))
                H="${H:+$H;}$C,$NC/clips/$C/nurec_origin_offset.json,$A,$B"
              done
              echo "[handoff] $H"

              mkdir -p "$OUT"
              LD_PRELOAD=/usr/lib/x86_64-linux-gnu/libstdc++.so.6 \
              CUDA_VISIBLE_DEVICES=0 ACCEPT_EULA=Y OMNI_KIT_ACCEPT_EULA=YES \
              NUREC_GRPC_HANDOFF="$H" \
              PY123D_RECENTER=1 \
              NUREC_GRPC_HOST=localhost \
              NUREC_GRPC_CAM_RIG=navsim \
              NEXUSSIM_NO_CAM_MAP_LINES=1 \
              PYTHONPATH=/avl-west/nre_stubs:/hugsim-storage/NexusSim \
              /root/ns-venv/bin/python scripts/tools/eval_py123d.py \
                --scenario-source py123d \
                --py123d-data-root /avl-west/navsafe_5s_500/${T}_20s/arrow \
                --py123d-scene-index 0 \
                --render-backend nurec_grpc --cam-height navsim \
                --model-type drivor --checkpoint "$CK" \
                --traffic-mode log_replay --controller pure_pursuit \
                --ego-replay-frames 80 --eval-frames 0 --enable-vis \
                --camera-resolution-scale 1.0 \
                --output-dir "$OUT"
              rc=$?
              kill $SERVE_PID 2>/dev/null || true
              echo "=== gifs ==="
              find "$OUT" -name '*.gif' -exec ls -la {} \; 2>/dev/null | head
              [ $rc -eq 0 ] && echo "EVAL_OK" || echo "EVAL_FAIL rc=$rc"
              exit $rc
          env:
            - { name: HYDRA_FULL_ERROR, value: "1" }
          resources:
            requests:
              { cpu: "8", memory: "48Gi", nvidia.com/gpu: "1", ephemeral-storage: 150Gi }
            limits:
              { cpu: "8", memory: "48Gi", nvidia.com/gpu: "1", ephemeral-storage: 150Gi }
          volumeMounts:
            - { name: dshm, mountPath: /dev/shm }
            - { name: avl-west-vol, mountPath: /avl-west }
            - { name: hugsim-storage, mountPath: /hugsim-storage }
            - { name: closed-loop-e2e, mountPath: /closed-loop-e2e }
      volumes:
        - { name: dshm, emptyDir: { medium: Memory, sizeLimit: 16Gi } }
        - { name: avl-west-vol, persistentVolumeClaim: { claimName: avl-west-vol } }
        - { name: hugsim-storage, persistentVolumeClaim: { claimName: horuan-hugsim-vol } }
        - { name: closed-loop-e2e, persistentVolumeClaim: { claimName: closed-loop-e2e } }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {
                      key: kubernetes.io/hostname,
                      operator: In,
                      values:
                        [
                          "ry-gpu-06.sdsc.optiputer.net",
                          "ry-gpu-07.sdsc.optiputer.net",
                          "ry-gpu-08.sdsc.optiputer.net",
                          "ry-gpu-11.sdsc.optiputer.net",
                          "ry-gpu-12.sdsc.optiputer.net",
                          "ry-gpu-13.sdsc.optiputer.net",
                          "ry-gpu-14.sdsc.optiputer.net",
                        ],
                    }
      tolerations:
        - {
            effect: NoSchedule,
            key: nautilus.io/reservation,
            operator: Equal,
            value: cogrob,
          }
        - { effect: NoSchedule, key: nautilus.io/cogrob, operator: Exists }
