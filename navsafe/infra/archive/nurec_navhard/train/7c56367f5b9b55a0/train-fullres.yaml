# FULL-RESOLUTION variant of train-static.yaml (NO appearance fixes).
# Same static_rigids recon as train-static.yaml (8 cams, nuPlan class routing,
# reuses the existing NCore data + aux), but supervised at FULL resolution:
#   subsample = 1 on all three knobs (camera_pixel_sampler + n_val + n_train_seq;
#   NRE Waymo requires the three to stay equal). subsample=1 = 4x the pixels of
#   the half-res baseline -- THE knob that removes the blur.
# Deliberately DROPS the train-static-appearance.yaml changes (per-track affine
# albedo optimize_track_albedo + sky-banding post_processing.b/c.depth bumps).
# Writes to out_dir=output_static_fullres so the half-res output_static (and the
# appearance output_static_appear) are preserved for A/B.
# 7c56367f5b9b55a0 = navsim scene_token (e.g. b971052f62165a1d).
apiVersion: batch/v1
kind: Job
metadata: { name: navhard-trainstatic-fullres-7c56367f5b9b55a0, namespace: cogrob }
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 172800
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets: [{ name: ngc-pull }]
      containers:
        - name: nre-train
          image: nvcr.io/nvidia/nre/nre-ga@sha256:6e0caa70a9148490552520c3dde9ee665c8d094ca10b814601cb8bb306567c90
          command: ["/opt/nvidia/nvidia_entrypoint.sh", "bash", "-c"]
          args:
            - |
              set -ex
              CFGDIR=/app/internal/scripts/pycena/runtime/pycena_nrm_full.runfiles/_main/configs/apps/AV/Waymo
              # Overlay recipe (master: NexusSim repo nexussim/gs3d_converter/configs/
              # 3dgut_dynamic_static.yaml; synced PVC copy below). Adds static_rigids.
              cp /avl-west/nre_overlays/3dgut_dynamic_static.yaml "$CFGDIR/"
              head -3 "$CFGDIR/3dgut_dynamic_static.yaml"
              CLIP=7c56367f5b9b55a0
              /app/run --config-name=configs/apps/AV/Waymo/3dgut_dynamic_static.yaml \
                mode=train logger=dummy \
                dataset.path=/avl-west/r2s_work/$CLIP/clips/$CLIP/pai_$CLIP.json \
                out_dir=/avl-west/r2s_work/$CLIP/output_static_fullres \
                logger.run_id="$CLIP" \
                dataset.aux_data=True \
                dataset.camera_ids=[camera_pcam_f0,camera_pcam_b0,camera_pcam_l0,camera_pcam_l1,camera_pcam_l2,camera_pcam_r0,camera_pcam_r1,camera_pcam_r2] \
                dataset.train_camera_ids=[camera_pcam_f0,camera_pcam_b0,camera_pcam_l0,camera_pcam_l1,camera_pcam_l2,camera_pcam_r0,camera_pcam_r1,camera_pcam_r2] \
                dataset.val_camera_ids=[camera_pcam_f0,camera_pcam_b0,camera_pcam_l0,camera_pcam_l1,camera_pcam_l2,camera_pcam_r0,camera_pcam_r1,camera_pcam_r2] \
                dataset.lidar_ids=[lidar_top_360fov] \
                dataset.n_train_sample_lidar_rays=0 \
                dataset.cuboid_tracks_params.track_label_sources=[GT_ANNOTATION] \
                dataset.samplers.batch_sampler.camera_pixel_sampler.subsample=1 \
                dataset.n_val_image_subsample=1 \
                dataset.n_train_sequential_image_subsample=1 \
                model.layers.dynamic_rigids.tracks.label_classes=[NuPlanBoxDetectionLabel.VEHICLE,NuPlanBoxDetectionLabel.BICYCLE] \
                model.layers.dynamic_deformables.tracks.label_classes=[NuPlanBoxDetectionLabel.PEDESTRIAN] \
                model.layers.dynamic_rigids.initialization.name=camera-dynamic-tracks \
                +model.layers.dynamic_rigids.initialization.camera_ids=null \
                +model.layers.dynamic_rigids.initialization.step_frame=1 \
                +model.layers.dynamic_rigids.initialization.fill_with_random_points=true \
                model.layers.dynamic_deformables.initialization.name=camera-dynamic-tracks \
                +model.layers.dynamic_deformables.initialization.camera_ids=null \
                +model.layers.dynamic_deformables.initialization.step_frame=1 \
                +model.layers.dynamic_deformables.initialization.fill_with_random_points=true \
                ++model.layers.static_rigids.tracks.is_dynamic=false \
                ++model.layers.static_rigids.tracks.label_classes=[NuPlanBoxDetectionLabel.VEHICLE,NuPlanBoxDetectionLabel.TRAFFIC_CONE,NuPlanBoxDetectionLabel.BARRIER,NuPlanBoxDetectionLabel.CZONE_SIGN,NuPlanBoxDetectionLabel.GENERIC_OBJECT] \
                ++model.layers.static_rigids.initialization.symmetric_axis=Y \
                ++model.layers.static_rigids.initialization.camera_ids=null \
                ++model.layers.static_rigids.initialization.step_frame=1 \
                ++model.layers.static_rigids.initialization.fill_with_random_points=true
          env:
            - { name: NGC_API_KEY, valueFrom: { secretKeyRef: { name: ngc-api-key, key: NGC_API_KEY } } }
            - { name: HYDRA_FULL_ERROR, value: "1" }
          resources:
            requests: { cpu: "12", memory: "96Gi", nvidia.com/gpu: "1", ephemeral-storage: 100Gi }
            limits:   { cpu: "12", memory: "96Gi", nvidia.com/gpu: "1", ephemeral-storage: 100Gi }
          volumeMounts:
            - { name: dshm, mountPath: /dev/shm }
            - { name: avl-west-vol, mountPath: /avl-west }
      volumes:
        - { name: dshm, emptyDir: { medium: Memory, sizeLimit: 32Gi } }
        - { name: avl-west-vol, persistentVolumeClaim: { claimName: avl-west-vol } }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: topology.kubernetes.io/region, operator: In, values: ["us-west"] }
                  - { key: nvidia.com/gpu.product, operator: In, values: ["NVIDIA-GeForce-RTX-3090"] }
      tolerations:
        - { effect: NoSchedule, key: nautilus.io/reservation, operator: Equal, value: cogrob }
