# NuRec gRPC render server — serves the 28 navhard webgif recons (one per trained
# scenario_type category) over the sensorsim gRPC API. The eval client (run in the
# horuan-nexussim pod) reaches it via NUREC_GRPC_HOST=nurec-grpc and produces the
# per-category log-replay gifs.
# artifact-glob points at /avl-west/nurec_serve_webgif/ — a scoped dir of 28
# structure-preserving symlinks (so serve-grpc derives scene_id == <scene>).
# --enable-editing-actors kept so the nurec_grpc backend can move/remove actors.
#
# Must be a Deployment (not a bare Pod): Nautilus caps controller-less pods at
# 16 cores / 32 GB, and serve-grpc needs 48 GB. The eval reaches it via
# NUREC_GRPC_HOST=nurec-grpc (the Service below), which stays stable across pod
# restarts.
#
# Cluster caps a single GPU pod's lifetime, so cycle the pod manually every ~6 h
# (a fresh pod = new GPU lease; the Service is unchanged, evals need no edit):
#     kubectl rollout restart deploy/nurec-grpc-server -n cogrob
# Same command also picks up a NEWLY trained clip (serve-grpc scans --artifact-glob
# only at start-up).
apiVersion: apps/v1
kind: Deployment
metadata: { name: nurec-grpc-server, namespace: cogrob }
spec:
  replicas: 1
  # Single GPU: kill the old pod before starting the new one (RollingUpdate
  # would need a 2nd GPU to surge and would stall). ~1-2 min downtime per restart.
  strategy: { type: Recreate }
  selector: { matchLabels: { app: nurec-grpc-server } }
  template:
    metadata: { labels: { app: nurec-grpc-server } }
    spec:
      imagePullSecrets: [{ name: ngc-pull }]
      containers:
        - name: nre
          image: nvcr.io/nvidia/nre/nre-ga@sha256:6e0caa70a9148490552520c3dde9ee665c8d094ca10b814601cb8bb306567c90
          command: ["/opt/nvidia/nvidia_entrypoint.sh", "bash", "-c"]
          args:
            - |
              set -x
              # --cache-size 4: the 24GB 3090 fills if serve keeps the default 10
              # scenes' gaussians resident (~4-7GB each) -> CUDA OOM. This is a
              # single-pass eval (each scene rendered once), so a tiny LRU is fine
              # and keeps peak GPU memory bounded (~2 scenes at a time).
              /app/run serve-grpc --host 0.0.0.0 --enable-editing-actors --renderer default \
                  --enable-harmonizer \
                  --cache-size 3 \
                  --artifact-glob '/avl-west/navhard421-website-5s/*/output_5cam/*/artifacts/last.usdz'
          ports: [{ containerPort: 8080 }]
          env:
            - {
                name: NGC_API_KEY,
                valueFrom: { secretKeyRef: { name: ngc-api-key, key: NGC_API_KEY } },
              }
            - { name: HYDRA_FULL_ERROR, value: "1" }
          resources:
            # cpu:4 (not 8) so a node with a free GPU but CPU packed by cpu:3 trains
            # still has room. serve-grpc is GPU-bound; 4 CPU is plenty.
            requests:
              { cpu: "4", memory: "48Gi", nvidia.com/gpu: "1", ephemeral-storage: 40Gi }
            limits:
              { cpu: "4", memory: "48Gi", nvidia.com/gpu: "1", ephemeral-storage: 40Gi }
          volumeMounts:
            - { name: dshm, mountPath: /dev/shm }
            - { name: avl-west-vol, mountPath: /avl-west }
      volumes:
        - { name: dshm, emptyDir: { medium: Memory, sizeLimit: 24Gi } }
        - { name: avl-west-vol, persistentVolumeClaim: { claimName: avl-west-vol } }
      # PUBLIC path: the ry-gpu nodes lost their cogrob reservation/taints, so no
      # tolerations are needed. Pin by hostname to the SAME 10 nodes the trains use
      # (ry-gpu-02 omitted = bad GPU). This is the proven scheduling the trains land
      # on, so it avoids any gpu.product-label mismatch that a bare product selector
      # could hit.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - ry-gpu-01.sdsc.optiputer.net
                      - ry-gpu-03.sdsc.optiputer.net
                      - ry-gpu-05.sdsc.optiputer.net
                      - ry-gpu-06.sdsc.optiputer.net
                      - ry-gpu-07.sdsc.optiputer.net
                      - ry-gpu-08.sdsc.optiputer.net
                      - ry-gpu-11.sdsc.optiputer.net
                      - ry-gpu-12.sdsc.optiputer.net
                      - ry-gpu-13.sdsc.optiputer.net
                      - ry-gpu-14.sdsc.optiputer.net
      tolerations:
        - { effect: NoSchedule, key: nautilus.io/reservation, operator: Equal, value: cogrob }
        - { effect: NoSchedule, key: nautilus.io/cogrob, operator: Exists }
---
apiVersion: v1
kind: Service
metadata: { name: nurec-grpc, namespace: cogrob }
spec:
  type: ClusterIP
  selector: { app: nurec-grpc-server }
  ports:
    - { port: 8080, targetPort: 8080 }
