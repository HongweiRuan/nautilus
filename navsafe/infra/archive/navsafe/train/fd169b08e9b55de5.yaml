apiVersion: batch/v1
kind: Job
metadata:
  name: navsafe-dev-train-fd169b08e9b55de5
  namespace: cogrob
  labels:
    app: navsafe-dev
    k8s-app: navsafe-dev-train-fd169b08e9b55de5
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 1209600
  template:
    metadata:
      labels:
        k8s-app: navsafe-dev-train-fd169b08e9b55de5
    spec:
      restartPolicy: Never
      imagePullSecrets:
      - name: ngc-pull
      tolerations:
      - effect: NoSchedule
        key: nautilus.io/reservation
        operator: Equal
        value: cogrob
      - effect: NoSchedule
        key: nautilus.io/cogrob
        operator: Exists
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - ry-gpu-04.sdsc.optiputer.net
                - ry-gpu-06.sdsc.optiputer.net
                - ry-gpu-07.sdsc.optiputer.net
                - ry-gpu-11.sdsc.optiputer.net
                - ry-gpu-12.sdsc.optiputer.net
                - ry-gpu-13.sdsc.optiputer.net
                - ry-gpu-14.sdsc.optiputer.net
      containers:
      - name: gpu-container
        image: nvcr.io/nvidia/nre/nre-ga@sha256:6e0caa70a9148490552520c3dde9ee665c8d094ca10b814601cb8bb306567c90
        imagePullPolicy: IfNotPresent
        args:
        - "set -ex\nC=fd169b08e9b55de5; CLIPDIR=/avl-west/navsafe_dev/ncore/fd169b08e9b55de5/clips/fd169b08e9b55de5; OUT=/avl-west/navsafe_dev/recon/fd169b08e9b55de5\nif [ -f \"$OUT/$C/checkpoints/last.ckpt\" ]; then echo \"TRAIN_SKIP $C (checkpoint exists)\"; exit 0; fi\nCFGDIR=/app/internal/scripts/pycena/runtime/pycena_nrm_full.runfiles/_main/configs/apps/prod/Hyperion-8.1\ncp /avl-west/nre_overlays/car2sim_6cam_static.yaml \"$CFGDIR/\"\n# aux-data writes <C>.aux.*.zarr.itar; NRE discovers pai_<C>.aux.* -- symlink.\n( cd \"$CLIPDIR\" && for f in $C.aux.*.zarr.itar; do ln -sf \"$f\" \"pai_$f\"; done )\n/app/run --config-name=configs/apps/prod/Hyperion-8.1/car2sim_6cam_static.yaml \\\n  mode=train logger=dummy \\\n  dataset.path=$CLIPDIR/pai_$C.json \\\n  out_dir=$OUT \\\n  logger.run_id=\"$C\" \\\n  dataset.aux_data=True \\\n  dataset.camera_ids=[camera_pcam_f0,camera_pcam_b0,camera_pcam_l0,camera_pcam_l1,camera_pcam_l2,camera_pcam_r0,camera_pcam_r1,camera_pcam_r2] \\\n  dataset.train_camera_ids=[camera_pcam_f0,camera_pcam_b0,camera_pcam_l0,camera_pcam_l1,camera_pcam_l2,camera_pcam_r0,camera_pcam_r1,camera_pcam_r2] \\\n  dataset.val_camera_ids=[camera_pcam_f0,camera_pcam_b0,camera_pcam_l0,camera_pcam_l1,camera_pcam_l2,camera_pcam_r0,camera_pcam_r1,camera_pcam_r2] \\\n  dataset.lidar_ids=[lidar_top_360fov] \\\n  dataset.train_lidar_ids=[lidar_top_360fov] \\\n  dataset.val_lidar_ids=[lidar_top_360fov] \\\n  dataset.n_train_sample_lidar_rays=0 \\\n  dataset.cuboid_tracks_params.track_label_sources=[GT_ANNOTATION] \\\n  model.layers.dynamic_rigids.tracks.label_classes=[NuPlanBoxDetectionLabel.VEHICLE,NuPlanBoxDetectionLabel.BICYCLE] \\\n  model.layers.dynamic_deformables.tracks.label_classes=[NuPlanBoxDetectionLabel.PEDESTRIAN] \\\n  model.layers.dynamic_rigids.initialization.name=camera-dynamic-tracks \\\n  +model.layers.dynamic_rigids.initialization.camera_ids=null \\\n  +model.layers.dynamic_rigids.initialization.step_frame=1 \\\n  +model.layers.dynamic_rigids.initialization.fill_with_random_points=true \\\n  model.layers.dynamic_deformables.initialization.name=camera-dynamic-tracks \\\n  +model.layers.dynamic_deformables.initialization.camera_ids=null \\\n  +model.layers.dynamic_deformables.initialization.step_frame=1 \\\n  +model.layers.dynamic_deformables.initialization.fill_with_random_points=true \\\n  model.layers.road.initialization.name=lidar-rig-trajectory \\\n  model.layers.road.initialization.default_scale=0.1 \\\n  +model.layers.road.initialization.num_near_points=100000 \\\n  +model.layers.road.initialization.num_far_points=100000 \\\n  +model.layers.road.initialization.far_radius_factor=20 \\\n  +model.layers.road.initialization.observation_scale_factor=0.01 \\\n  +model.layers.road.initialization.lidar_ids=null \\\n  +model.layers.road.initialization.camera_ids=null \\\n  +model.layers.road.initialization.non_dynamic_points_only=true \\\n  checkpoint.artifact.mesh.ground.enabled=false\ntest -f $OUT/$C/checkpoints/last.ckpt\necho \"TRAIN_DONE $C\"\n"
        env:
        - name: HYDRA_FULL_ERROR
          value: '1'
        resources:
          limits:
            nvidia.com/gpu: '1'
            cpu: '4'
            memory: 32Gi
            ephemeral-storage: 120Gi
          requests:
            nvidia.com/gpu: '1'
            cpu: '4'
            memory: 32Gi
            ephemeral-storage: 120Gi
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: avl-west-vol
          mountPath: /avl-west
        - name: hugsim-storage
          mountPath: /hugsim-storage
        - name: closed-loop-e2e
          mountPath: /closed-loop-e2e
        command:
        - /opt/nvidia/nvidia_entrypoint.sh
        - bash
        - -c
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 8Gi
      - name: avl-west-vol
        persistentVolumeClaim:
          claimName: avl-west-vol
      - name: hugsim-storage
        persistentVolumeClaim:
          claimName: horuan-hugsim-vol
      - name: closed-loop-e2e
        persistentVolumeClaim:
          claimName: closed-loop-e2e
