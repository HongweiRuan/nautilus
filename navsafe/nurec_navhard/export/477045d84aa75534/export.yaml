# Export a trained navhard 3dgutdyn recon: gaussian PLYs, per-frame actor tracks,
# usd-asset (gaussian volume), and usd-out/*.usdz (the artifact serve-grpc serves).
# 477045d84aa75534 = navsim scene_token. Run after navhard-train-477045d84aa75534 is Complete.
apiVersion: batch/v1
kind: Job
metadata: { name: navhard-export-477045d84aa75534, namespace: cogrob }
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 172800
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets: [{ name: ngc-pull }]
      containers:
        - name: nre-export
          image: nvcr.io/nvidia/nre/nre-ga@sha256:6e0caa70a9148490552520c3dde9ee665c8d094ca10b814601cb8bb306567c90
          command: ["/opt/nvidia/nvidia_entrypoint.sh", "bash", "-c"]
          args:
            - |
              set -ex
              RD=/avl-west/r2s_work/477045d84aa75534/output_3dgutdyn/477045d84aa75534
              /app/run export-gaussian-plys   --config-name $RD/config/parsed.yaml --checkpoint-name last.ckpt --output-dir $RD/plys --format _3DGS
              /app/run export-sequence-tracks  --config-name $RD/config/parsed.yaml --checkpoint-path $RD/checkpoints/last.ckpt --output-dir $RD --world-frame --format json
              /app/run export-usdz-artifact    --config-name $RD/config/parsed.yaml --checkpoint-name last.ckpt --output-dir $RD/usd-out
              echo "=== usd-out contents ==="
              python -c "import zipfile,glob;u=glob.glob('$RD/usd-out/*.usdz')[0];print(u);print([n for n in zipfile.ZipFile(u).namelist() if not n.endswith(('.png','.jpg'))][:30])"
              echo EXPORT_ALL_DONE
          env:
            - { name: NGC_API_KEY, valueFrom: { secretKeyRef: { name: ngc-api-key, key: NGC_API_KEY } } }
            - { name: HYDRA_FULL_ERROR, value: "1" }
          resources:
            requests: { cpu: "8", memory: "48Gi", nvidia.com/gpu: "1", ephemeral-storage: 40Gi }
            limits:   { cpu: "8", memory: "48Gi", nvidia.com/gpu: "1", ephemeral-storage: 40Gi }
          volumeMounts:
            - { name: dshm, mountPath: /dev/shm }
            - { name: avl-west-vol, mountPath: /avl-west }
      volumes:
        - { name: dshm, emptyDir: { medium: Memory, sizeLimit: 24Gi } }
        - { name: avl-west-vol, persistentVolumeClaim: { claimName: avl-west-vol } }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: topology.kubernetes.io/region, operator: In, values: ["us-west"] }
                  - { key: nvidia.com/gpu.product, operator: In, values: ["NVIDIA-GeForce-RTX-3090"] }
      tolerations:
        - { effect: NoSchedule, key: nautilus.io/reservation, operator: Equal, value: cogrob }
