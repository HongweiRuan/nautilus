# STAGE 4 (train): car2sim_6cam_static recon (5 cameras, 160k steps / 5M gaussians)
# for a SHARD of clips, run sequentially. ~4.5 h per clip, so keep shards SMALL
# (submit_stage.sh uses TRAIN_PER_JOB, default 3) — a preempted shard only loses the
# clip in flight, because every finished clip copies its last.usdz to CephFS before the
# next one starts, and a resubmit skips whatever is already there.
# CephFS-relief per clip: copy the ncore store (+ aux) CephFS->local in ONE sequential
# read, link aux, train entirely on local disk, then copy just last.usdz back.
# GPU job. Prereq: aux. Placeholders: SHARD-NAME + a manifest block
apiVersion: batch/v1
kind: Job
metadata:
  {
    name: nav500-train-sh006-0821224900,
    namespace: cogrob,
    labels: { app: navsafe_5s_500, stage: train, shard: "sh006-0821224900" },
  }
spec:
  backoffLimit:
    6 # evictions/admission errors are external events, not code
    # failures; finished clips are skipped so a retry is cheap
  ttlSecondsAfterFinished: 7200 # 2h: finished jobs must release the namespace quota
  template:
    metadata: { labels: { app: navsafe_5s_500, stage: train, shard: "sh006-0821224900" } }
    spec:
      restartPolicy: Never
      imagePullSecrets: [{ name: ngc-pull }]
      containers:
        - name: nre-train
          image: nvcr.io/nvidia/nre/nre-ga@sha256:6e0caa70a9148490552520c3dde9ee665c8d094ca10b814601cb8bb306567c90
          command: ["/opt/nvidia/nvidia_entrypoint.sh", "bash", "-c"]
          args:
            - |
              set -uo pipefail
              cat > /tmp/shard.txt <<'MANIFEST_EOF'
              e7283286a9a65ab4s1 2021.05.25.15.59.03_veh-30_00625_00855 1621973619149836 1621973624149836
              MANIFEST_EOF
              echo "[train sh006-0821224900] $(grep -c . /tmp/shard.txt) clip(s)"
              # car2sim needs the overlay config copied into the container's config dir (once)
              CFGDIR=/app/internal/scripts/pycena/runtime/pycena_nrm_full.runfiles/_main/configs/apps/prod/Hyperion-8.1
              cp /avl-west/nre_overlays/car2sim_6cam_static.yaml "$CFGDIR/"
              ok=0; skip=0; fail=0; notready=0; failed=""
              while read -r C LOG T0 T1; do
                [ -z "${C:-}" ] && continue
                SRC=/avl-west/navsafe_5s_500/$C/clips/$C
                DST=/avl-west/navsafe_5s_500/$C/output_5cam
                L=/tmp/clip/$C; OUTL=/tmp/out
                if [ -f "$DST/$C/artifacts/last.usdz" ]; then echo "[skip] $C"; skip=$((skip+1)); continue; fi
                # prerequisite not built yet is NOT a failure (see aux.yaml)
                if ! [ -s "$SRC/pai_$C.json" ] || ! ls $SRC/$C.aux.*.zarr.itar >/dev/null 2>&1; then
                  echo "TRAIN_NOTREADY $C (ncore/aux not done yet)"; notready=$((notready+1)); continue
                fi
                echo "--- $C: copy-in store+aux CephFS->local ($(du -sh $SRC 2>/dev/null | cut -f1)) ---"
                rm -rf "$L" "$OUTL/$C"; mkdir -p "$L" "$OUTL" && cp -a $SRC/. $L/
                # REQUIRED: link aux stores to the manifest base name pai_<scene>.aux.* (local)
                ( cd "$L" && for f in $C.aux.*.zarr.itar; do [ -e "$f" ] && ln -sf "$f" "pai_$f"; done )
                ls $L/pai_$C.aux.*.zarr.itar >/dev/null 2>&1 || echo "WARN: no aux stores for $C"
                echo "[train $C] training on local disk (car2sim_6cam_static, 160k/5M) ..."
                /app/run --config-name=configs/apps/prod/Hyperion-8.1/car2sim_6cam_static.yaml \
                  mode=train logger=dummy dataset.path=$L/pai_$C.json out_dir=$OUTL logger.run_id="$C" dataset.aux_data=True \
                  dataset.camera_ids=[camera_pcam_f0,camera_pcam_b0,camera_pcam_l0,camera_pcam_r0,camera_pcam_l1] \
                  dataset.train_camera_ids=[camera_pcam_f0,camera_pcam_b0,camera_pcam_l0,camera_pcam_r0,camera_pcam_l1] \
                  dataset.val_camera_ids=[camera_pcam_f0,camera_pcam_b0,camera_pcam_l0,camera_pcam_r0,camera_pcam_l1] \
                  dataset.n_train_sequential_image_subsample=4 dataset.n_val_image_subsample=4 \
                  dataset.lidar_ids=[lidar_top_360fov] dataset.train_lidar_ids=[lidar_top_360fov] dataset.val_lidar_ids=[lidar_top_360fov] \
                  dataset.n_train_sample_lidar_rays=0 dataset.cuboid_tracks_params.track_label_sources=[GT_ANNOTATION] \
                  model.layers.dynamic_rigids.tracks.label_classes=[NuPlanBoxDetectionLabel.VEHICLE,NuPlanBoxDetectionLabel.BICYCLE] \
                  model.layers.dynamic_deformables.tracks.label_classes=[NuPlanBoxDetectionLabel.PEDESTRIAN] \
                  model.layers.dynamic_rigids.initialization.name=camera-dynamic-tracks \
                  +model.layers.dynamic_rigids.initialization.camera_ids=null +model.layers.dynamic_rigids.initialization.step_frame=1 +model.layers.dynamic_rigids.initialization.fill_with_random_points=true \
                  model.layers.dynamic_deformables.initialization.name=camera-dynamic-tracks \
                  +model.layers.dynamic_deformables.initialization.camera_ids=null +model.layers.dynamic_deformables.initialization.step_frame=1 +model.layers.dynamic_deformables.initialization.fill_with_random_points=true \
                  model.layers.road.initialization.name=lidar-rig-trajectory model.layers.road.initialization.default_scale=0.1 \
                  +model.layers.road.initialization.num_near_points=100000 +model.layers.road.initialization.num_far_points=100000 +model.layers.road.initialization.far_radius_factor=20 +model.layers.road.initialization.observation_scale_factor=0.01 \
                  +model.layers.road.initialization.lidar_ids=null +model.layers.road.initialization.camera_ids=null +model.layers.road.initialization.non_dynamic_points_only=true \
                  dataset.n_samples_per_epoch=160000 \
                  model.strategy.add.max_n_gaussians=5000000 model.strategy.add.end_iteration=140000 \
                  model.strategy.relocate.end_iteration=140000 model.strategy.perturb.end_iteration=160000 \
                  system.optimizers.0.scheduler.args.T_max=160000 checkpoint.every_n_train_steps=40000 \
                  checkpoint.artifact.mesh.ground.enabled=false
                # slim copy-out: keep ONLY last.usdz (the eval serves it directly) + config
                if [ -f "$OUTL/$C/artifacts/last.usdz" ]; then
                  echo "[train $C] copy-out last.usdz ($(du -h $OUTL/$C/artifacts/last.usdz | cut -f1)) ..."
                  mkdir -p $DST/$C/artifacts && cp -a $OUTL/$C/artifacts/last.usdz $DST/$C/artifacts/
                  cp -a $OUTL/$C/config $DST/$C/ 2>/dev/null || true
                  if [ -f "$DST/$C/artifacts/last.usdz" ]; then echo "TRAIN_DONE $C"; ok=$((ok+1));
                  else echo "TRAIN_FAIL $C (copy-out)"; fail=$((fail+1)); failed="$failed $C"; fi
                else
                  echo "TRAIN_FAIL $C (no last.usdz)"; fail=$((fail+1)); failed="$failed $C"
                fi
                rm -rf "$L" "$OUTL/$C"      # free local disk before the next clip
              done < /tmp/shard.txt
              echo "SHARD_DONE sh006-0821224900 ok=$ok skip=$skip notready=$notready fail=$fail"
              [ "$fail" -eq 0 ] || { echo "failed:$failed"; exit 1; }
          env:
            - {
                name: NGC_API_KEY,
                valueFrom: { secretKeyRef: { name: ngc-api-key, key: NGC_API_KEY } },
              }
            - { name: HYDRA_FULL_ERROR, value: "1" }
            - { name: PYTORCH_CUDA_ALLOC_CONF, value: "expandable_segments:True" }
          resources: # right-sized from measurement: 50 running pods peaked at
            # 1.3 CPU / 12.8Gi RAM, so cpu:3/mem:40Gi was ~3x over-requested
            # and dragged the Nautilus utilization metric down. ephemeral
            # stays 80Gi: the per-clip store copy + 2.1G ckpt + 2G usdz need it.
            requests:
              { cpu: "2", memory: "32Gi", nvidia.com/gpu: "1", ephemeral-storage: 80Gi }
            limits:
              { cpu: "2", memory: "32Gi", nvidia.com/gpu: "1", ephemeral-storage: 80Gi }
          volumeMounts:
            - { name: dshm, mountPath: /dev/shm }
            - { name: avl-west-vol, mountPath: /avl-west }
      volumes:
        - { name: dshm, emptyDir: { medium: Memory, sizeLimit: 24Gi } }
        - { name: avl-west-vol, persistentVolumeClaim: { claimName: avl-west-vol } }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  # train is long -> pin to OUR ry-gpu 3090s (stable, no foreign preemption)
                  - {
                      key: kubernetes.io/hostname,
                      operator: In,
                      values:
                        [
                          "ry-gpu-05.sdsc.optiputer.net",
                          "ry-gpu-06.sdsc.optiputer.net",
                          "ry-gpu-07.sdsc.optiputer.net",
                          "ry-gpu-08.sdsc.optiputer.net",
                          "ry-gpu-11.sdsc.optiputer.net",
                          "ry-gpu-12.sdsc.optiputer.net",
                          "ry-gpu-13.sdsc.optiputer.net",
                          "ry-gpu-14.sdsc.optiputer.net",
                        ],
                    }
      tolerations:
        - {
            effect: NoSchedule,
            key: nautilus.io/reservation,
            operator: Equal,
            value: cogrob,
          }
        - { effect: NoSchedule, key: nautilus.io/cogrob, operator: Exists }
