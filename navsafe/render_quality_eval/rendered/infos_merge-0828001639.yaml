# STAGE infos_merge: concatenate every shard's per-log pkls into one ann_file.
# Trivial and fast; kept a separate stage so a re-run of it costs nothing.
# OLD HEADER: STAGE infos: nuPlan ann_file for a SHARD of the logs the benchmark touches,
# restricted to the benchmark's time windows.
#
# Sharded by log because it is embarrassingly parallel and slow: measured ~2 min per
# log (the ORM queries every annotated box and the closest image for 6 cameras, per
# 2 Hz frame), so 118 logs serially is ~4 h.
#
# Each shard builds its OWN nuplan root on LOCAL disk holding only its logs --
# NuPlanDBWrapper opens every db in the splits dir it is given, and the dbs must be
# node-local anyway because the nuPlan ORM is pathological on CephFS.
#
# The converter writes one pkl per log to <out-dir>/tmp/; the infos_merge stage
# concatenates them across shards.
# CPU job. Placeholders: __SHARD__ + a manifest block of log names
apiVersion: batch/v1
kind: Job
metadata:
  {
    name: rqe-infos-merge-0828001639,
    namespace: cogrob,
    labels: { app: render_quality_eval, stage: infos_merge },
  }
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 7200
  template:
    metadata: { labels: { app: render_quality_eval, stage: infos_merge } }
    spec:
      restartPolicy: Never
      containers:
        - name: converter
          image: robinwangucsd/metabench:latest
          command: ["bash", "-c"]
          args:
            - |
              # NOT `set -u`: conda's binutils activate.d script dereferences
              # ADDR2LINE unset, so nounset kills the shell on `conda activate`.
              set -eo pipefail
              unset PYTHONPATH
              source /opt/conda/etc/profile.d/conda.sh
              # MUST be the dreamer env, the same one that wrote the per-log pkls.
              # Merging under `ue` (numpy 2.x) re-pickles them with numpy._core
              # references that the dreamer env (numpy 1.23.5) cannot import, and the
              # consumer of this file is DriveArena, which runs in dreamer.
              conda activate /avl-west/drivearena_bench/envs/dreamer
              python3 /avl-west/render_quality_eval/merge_infos.py
              echo INFOS_MERGE_DONE
          resources:
            requests: { cpu: "2", memory: "32Gi", ephemeral-storage: 20Gi }
            limits:   { cpu: "2", memory: "32Gi", ephemeral-storage: 20Gi }
          volumeMounts:
            - { name: dshm, mountPath: /dev/shm }
            - { name: avl-west-vol, mountPath: /avl-west }
      volumes:
        - { name: dshm, emptyDir: { medium: Memory, sizeLimit: 8Gi } }
        - { name: avl-west-vol, persistentVolumeClaim: { claimName: avl-west-vol } }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: topology.kubernetes.io/region, operator: In, values: [us-west] }
                  # CPU job, but pinned to the same nodes as everything else so it
                  # cannot land on ry-gpu-13/14.
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - ry-gpu-05.sdsc.optiputer.net
                      - ry-gpu-06.sdsc.optiputer.net
                      - ry-gpu-07.sdsc.optiputer.net
                      - ry-gpu-08.sdsc.optiputer.net
                      - ry-gpu-11.sdsc.optiputer.net
                      - ry-gpu-12.sdsc.optiputer.net
      tolerations:
        - { effect: NoSchedule, key: nautilus.io/reservation, operator: Equal, value: cogrob }
