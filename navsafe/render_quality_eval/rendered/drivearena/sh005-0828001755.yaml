# STAGE drivearena: WorldDreamer generates CAM_F0 for a SHARD of scenarios.
#
# Sharding is BY SCENARIO, never within one: generation is autoregressive, each frame
# conditioned on the previous generated frame, and `is_first_frame` re-anchors on the
# real image at a scenario boundary. Splitting a scenario across jobs would break that
# chain and change the output.
#
# Runs the same offline entry point upstream documents (tools/test.py +
# test_config_nup+nus + the released nus_nup checkpoint), with four upstream bugs
# patched -- see /avl-west/drivearena_bench/README.md. Most important of those: the
# demo caption hard-coded in test.py would otherwise prompt every scenario as
# "boston-seaport, night".
#
# GPU job. Prereq: infos stage. Placeholders: sh005-0828001755 + a manifest block of sids
apiVersion: batch/v1
kind: Job
metadata:
  {
    name: rqe-da-sh005-0828001755,
    namespace: cogrob,
    labels: { app: render_quality_eval, stage: drivearena, shard: "sh005-0828001755" },
  }
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 7200
  template:
    metadata: { labels: { app: render_quality_eval, stage: drivearena, shard: "sh005-0828001755" } }
    spec:
      restartPolicy: Never
      containers:
        - name: worlddreamer
          image: robinwangucsd/metabench:latest
          command: ["bash", "-c"]
          args:
            - |
              # NOT `set -u`: conda's binutils activate.d script dereferences
              # ADDR2LINE unset, so nounset kills the shell on `conda activate`.
              set -o pipefail
              cat > /tmp/shard.txt <<'MANIFEST_EOF'
              17296f6032025ecc
              173369dc059d5fe9
              1786ef7edac65502
              17a6a4a6137553cd
              17b0992157365222
              17cac31ef9135faf
              184c11a8cc875403
              18b5995484435fbe
              190808cc16cc53af
              190bf8dd22a25d1c
              190c8d0cece45af1
              1961d1075a085a1d
              1981a85eb4ba5001
              198bc5f3280e52cd
              19b85cbca28f5c41
              1ad96f74e72750db
              1b25edea36205814
              1bdfacbfcff75c27
              1bf45a481f1d52e3
              1c064ec24fa15900
              MANIFEST_EOF
              echo "[drivearena sh005-0828001755] $(grep -c . /tmp/shard.txt) scenario(s)"
              # the pod image exports a global PYTHONPATH that drags a torch-2.10
              # `nexussim` into every interpreter
              unset PYTHONPATH
              ROOT=/avl-west/drivearena_bench
              RQE=/avl-west/render_quality_eval
              WD=$ROOT/DriveArena/WorldDreamer
              source /opt/conda/etc/profile.d/conda.sh
              conda activate $ROOT/envs/dreamer
              cd $WD
              # per-shard infos + token map, so shards never write the same file
              python3 $RQE/make_shard_infos.py /tmp/shard.txt /tmp/shard_infos.pkl /tmp/shard_tokens.json \
                || { echo "SHARD_INFOS_FAILED"; exit 1; }
              export WD_RENDER_ROOT=$RQE/render_raw/drivearena
              export WD_TOKEN_MAP=/tmp/shard_tokens.json
              export WD_FRONT_ONLY=1
              mkdir -p "$WD_RENDER_ROOT"
              python tools/test.py \
                --config-name test_config_nup+nus \
                resume_from_checkpoint=$WD/dreamer_pretrained/SDv1.5_mv_single_ref_nus_nup/weight-S200000 \
                runner.validation_index=all \
                runner.enable_xformers_memory_efficient_attention=false \
                '~dataset.data.val.nuscenes' \
                dataset.dataset_root=$ROOT/nuplan_root \
                dataset.data.val.nuplan.ann_file=/tmp/shard_infos.pkl \
                'dataset.dataset_cache_file=[null,null]' \
                show_box_on_img=false show_map_on_img=false
              echo "[drivearena sh005-0828001755] frames=$(find "$WD_RENDER_ROOT" -name '*.jpg' | wc -l)"
              exit 0
          resources:
            requests: { cpu: "8", memory: "48Gi", nvidia.com/gpu: "1", ephemeral-storage: 60Gi }
            limits:   { cpu: "8", memory: "48Gi", nvidia.com/gpu: "1", ephemeral-storage: 60Gi }
          volumeMounts:
            - { name: dshm, mountPath: /dev/shm }
            - { name: avl-west-vol, mountPath: /avl-west }
      volumes:
        - { name: dshm, emptyDir: { medium: Memory, sizeLimit: 16Gi } }
        - { name: avl-west-vol, persistentVolumeClaim: { claimName: avl-west-vol } }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: topology.kubernetes.io/region, operator: In, values: [us-west] }
                  - { key: nvidia.com/gpu.product, operator: In, values: [NVIDIA-GeForce-RTX-3090] }
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - ry-gpu-05.sdsc.optiputer.net
                      - ry-gpu-06.sdsc.optiputer.net
                      - ry-gpu-07.sdsc.optiputer.net
                      - ry-gpu-08.sdsc.optiputer.net
                      - ry-gpu-11.sdsc.optiputer.net
                      - ry-gpu-12.sdsc.optiputer.net
      tolerations:
        - { effect: NoSchedule, key: nautilus.io/reservation, operator: Equal, value: cogrob }
