# STAGE render_native: replay each 5 s reconstruction at its OWN recorded camera
# poses, native 1920x1080, for a SHARD of clips run sequentially (~70 s per clip).
#
# This is the "our side" render of the render-quality benchmark. --replicate-training-views
# plays back the clip's own rig trajectory and per-frame intrinsics, so the output is the
# reconstruction's reproduction of the original CAM_F0 frame -- the same frame a generative
# renderer is asked to produce, and the same frame FID/FVD/FDpi score against.
#
# --frame-naming frame-end-timestamp is load-bearing: the filename IS the camera frame
# timestamp in microseconds, which is what maps a rendered frame back to a navsim image
# token. Measured offset against navsim frame timestamps: 0 us.
#
# Idempotent: a clip whose camera dir already has jpgs is skipped, so a resubmit only
# picks up stragglers.
# GPU job. Prereq: train (last.usdz). Placeholders: sh031-0827160658 + a manifest block
apiVersion: batch/v1
kind: Job
metadata:
  {
    name: rqe-rnative-sh031-0827160658,
    namespace: cogrob,
    labels: { app: render_quality_eval, stage: render_native, shard: "sh031-0827160658" },
  }
spec:
  backoffLimit: 6 # evictions are external events; finished clips are skipped on retry
  ttlSecondsAfterFinished: 7200 # finished jobs must release the namespace pod quota
  template:
    metadata: { labels: { app: render_quality_eval, stage: render_native, shard: "sh031-0827160658" } }
    spec:
      restartPolicy: Never
      imagePullSecrets: [{ name: ngc-pull }]
      containers:
        - name: nre-render
          image: nvcr.io/nvidia/nre/nre-ga@sha256:6e0caa70a9148490552520c3dde9ee665c8d094ca10b814601cb8bb306567c90
          command: ["/opt/nvidia/nvidia_entrypoint.sh", "bash", "-c"]
          args:
            - |
              set -uo pipefail
              cat > /tmp/shard.txt <<'MANIFEST_EOF'
              9d791495c47e5061s1
              9d791495c47e5061s2
              9d791495c47e5061s3
              9d791495c47e5061s4
              9e34c53444bd518cs1
              9e34c53444bd518cs2
              9e34c53444bd518cs3
              9e34c53444bd518cs4
              9e7ae0e0f04255fas1
              9e7ae0e0f04255fas2
              9e7ae0e0f04255fas3
              9e7ae0e0f04255fas4
              9ef1d618435d5e53s1
              9ef1d618435d5e53s2
              9ef1d618435d5e53s3
              9ef1d618435d5e53s4
              a0ff0b74063659a2s1
              a0ff0b74063659a2s2
              a0ff0b74063659a2s3
              a0ff0b74063659a2s4
              a12d1a61d7cc50fes1
              a12d1a61d7cc50fes2
              a12d1a61d7cc50fes3
              a12d1a61d7cc50fes4
              a18d2b32f8415373s1
              a18d2b32f8415373s2
              a18d2b32f8415373s3
              a18d2b32f8415373s4
              a1e689b17ca65053s1
              a1e689b17ca65053s2
              a1e689b17ca65053s3
              a1e689b17ca65053s4
              a2c2e046132e5596s1
              a2c2e046132e5596s2
              a2c2e046132e5596s3
              a2c2e046132e5596s4
              a437b6dcee9854aes1
              a437b6dcee9854aes2
              a437b6dcee9854aes3
              a437b6dcee9854aes4
              MANIFEST_EOF
              echo "[render_native sh031-0827160658] $(grep -c . /tmp/shard.txt) clip(s)"
              OUTROOT=/avl-west/render_quality_eval/render_raw/nurec_native
              ok=0; skip=0; fail=0; failed=""
              while read -r C REST; do
                [ -z "${C:-}" ] && continue
                USDZ=/avl-west/navsafe_5s_500/$C/output_5cam/$C/artifacts/last.usdz
                OUT=$OUTROOT/$C
                if ls "$OUT/camera_pcam_f0"/*.jpg >/dev/null 2>&1; then
                  echo "SKIP $C"; skip=$((skip+1)); continue
                fi
                if [ ! -f "$USDZ" ]; then
                  echo "NO_USDZ $C"; fail=$((fail+1)); failed="$failed $C"; continue
                fi
                mkdir -p "$OUT"
                if /app/run render \
                     --artifact-path "$USDZ" \
                     --output-dir "$OUT" \
                     --camera-id camera_pcam_f0 \
                     --image-scale 1.0 \
                     --image-format jpg \
                     --replicate-training-views \
                     --calib-source training-sensor-poses-calib \
                     --frame-naming frame-end-timestamp; then
                  echo "DONE $C $(ls "$OUT/camera_pcam_f0" 2>/dev/null | wc -l) frames"; ok=$((ok+1))
                else
                  echo "FAIL $C"; fail=$((fail+1)); failed="$failed $C"
                fi
              done < /tmp/shard.txt
              echo "[render_native sh031-0827160658] ok=$ok skip=$skip fail=$fail"
              [ -n "$failed" ] && echo "[render_native sh031-0827160658] failed:$failed"
              exit 0   # partial shards are normal; the resubmit picks up the rest
          resources:
            requests: { cpu: "4", memory: "32Gi", nvidia.com/gpu: "1", ephemeral-storage: 80Gi }
            limits:   { cpu: "4", memory: "32Gi", nvidia.com/gpu: "1", ephemeral-storage: 80Gi }
          volumeMounts:
            - { name: dshm, mountPath: /dev/shm }
            - { name: avl-west-vol, mountPath: /avl-west }
      volumes:
        - { name: dshm, emptyDir: { medium: Memory, sizeLimit: 8Gi } }
        - { name: avl-west-vol, persistentVolumeClaim: { claimName: avl-west-vol } }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: topology.kubernetes.io/region, operator: In, values: [us-west] }
                  - { key: nvidia.com/gpu.product, operator: In, values: [NVIDIA-GeForce-RTX-3090] }
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - ry-gpu-05.sdsc.optiputer.net
                      - ry-gpu-06.sdsc.optiputer.net
                      - ry-gpu-07.sdsc.optiputer.net
                      - ry-gpu-08.sdsc.optiputer.net
                      - ry-gpu-11.sdsc.optiputer.net
                      - ry-gpu-12.sdsc.optiputer.net
      tolerations:
        - { effect: NoSchedule, key: nautilus.io/reservation, operator: Equal, value: cogrob }
