# STAGE infos: nuPlan ann_file for a SHARD of the logs the benchmark touches,
# restricted to the benchmark's time windows.
#
# Sharded by log because it is embarrassingly parallel and slow: measured ~2 min per
# log (the ORM queries every annotated box and the closest image for 6 cameras, per
# 2 Hz frame), so 118 logs serially is ~4 h.
#
# Each shard builds its OWN nuplan root on LOCAL disk holding only its logs --
# NuPlanDBWrapper opens every db in the splits dir it is given, and the dbs must be
# node-local anyway because the nuPlan ORM is pathological on CephFS.
#
# The converter writes one pkl per log to <out-dir>/tmp/; the infos_merge stage
# concatenates them across shards.
# CPU job. Placeholders: sh006-0827232310 + a manifest block of log names
apiVersion: batch/v1
kind: Job
metadata:
  {
    name: rqe-infos-sh006-0827232310,
    namespace: cogrob,
    labels: { app: render_quality_eval, stage: infos, shard: "sh006-0827232310" },
  }
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 7200
  template:
    metadata: { labels: { app: render_quality_eval, stage: infos, shard: "sh006-0827232310" } }
    spec:
      restartPolicy: Never
      containers:
        - name: converter
          image: robinwangucsd/metabench:latest
          command: ["bash", "-c"]
          args:
            - |
              # NOT `set -u`: conda's binutils activate.d script dereferences
              # ADDR2LINE unset, so nounset kills the shell on `conda activate`.
              set -eo pipefail
              cat > /tmp/shard.txt <<'MANIFEST_EOF'
              2021.09.09.18.04.06_veh-40_00743_01071
              2021.09.09.18.29.25_veh-39_00427_00556
              2021.09.09.18.29.25_veh-39_00569_00903
              2021.09.09.18.29.25_veh-39_00969_01184
              MANIFEST_EOF
              echo "[infos sh006-0827232310] $(grep -c . /tmp/shard.txt) log(s)"
              unset PYTHONPATH
              ROOT=/avl-west/drivearena_bench
              RQE=/avl-west/render_quality_eval
              WD=$ROOT/DriveArena/WorldDreamer
              source /opt/conda/etc/profile.d/conda.sh
              conda activate $ROOT/envs/dreamer
              python3 $RQE/prep_infos_shard.py /tmp/shard.txt
              cd $WD
              export NUPLAN_BENCH_WINDOWS=$RQE/infos/windows.json
              OUT=$RQE/infos/work/sh006-0827232310
              mkdir -p $OUT
              python -m tools.create_data nuplan \
                --root-path /tmp/nproot/ \
                --version dreamer-trainval \
                --out-dir $OUT \
                --split-yaml /tmp/split.yaml \
                --extra-tag nuplan --only_info
              echo "[infos sh006-0827232310] pkls=$(ls $OUT/tmp/*.pkl 2>/dev/null | wc -l)"
              exit 0   # a short shard is picked up by the next submit, not a job failure
          resources:
            requests: { cpu: "6", memory: "32Gi", ephemeral-storage: 60Gi }
            limits:   { cpu: "6", memory: "32Gi", ephemeral-storage: 60Gi }
          volumeMounts:
            - { name: dshm, mountPath: /dev/shm }
            - { name: avl-west-vol, mountPath: /avl-west }
      volumes:
        - { name: dshm, emptyDir: { medium: Memory, sizeLimit: 8Gi } }
        - { name: avl-west-vol, persistentVolumeClaim: { claimName: avl-west-vol } }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: topology.kubernetes.io/region, operator: In, values: [us-west] }
                  # CPU job, but pinned to the same nodes as everything else so it
                  # cannot land on ry-gpu-13/14.
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - ry-gpu-05.sdsc.optiputer.net
                      - ry-gpu-06.sdsc.optiputer.net
                      - ry-gpu-07.sdsc.optiputer.net
                      - ry-gpu-08.sdsc.optiputer.net
                      - ry-gpu-11.sdsc.optiputer.net
                      - ry-gpu-12.sdsc.optiputer.net
      tolerations:
        - { effect: NoSchedule, key: nautilus.io/reservation, operator: Equal, value: cogrob }
