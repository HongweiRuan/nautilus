# One shard of the fidelity render campaign. Four of these, one per node, two
# GPUs each: serve-grpc on GPU 0, the eval rollout on GPU 1.
#
# Why two GPUs and not one: serve-grpc with the harmonizer and --cache-size 4
# fills a 3090 on its own, leaving nothing for the policy. That is
# run_worker_current.sh's finding, reused here unchanged.
#
# Scheduled on the PUBLIC pool: no hostname pin and no cogrob reservation
# toleration, so a shard runs wherever capacity turns up. The only node
# constraint left is GPU model, and it is not a preference: serve-grpc with the
# harmonizer plus the eval process needs a 24 GB card, and a smaller one fails
# with RESOURCE_EXHAUSTED partway through a pass rather than at start-up.
apiVersion: batch/v1
kind: Job
metadata:
  name: __NAME__
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 604800
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-GeForce-RTX-3090
                      - NVIDIA-GeForce-RTX-4090
                      - NVIDIA-TITAN-RTX
                      - NVIDIA-RTX-A5000
                      - NVIDIA-RTX-A6000
                      - NVIDIA-A10
                      - NVIDIA-A40
                      - NVIDIA-L40
                      - NVIDIA-L40S
                      - Quadro-RTX-8000
      containers:
        - name: worker
          image: nvcr.io/nvidia/nre/nre-ga@sha256:6e0caa70a9148490552520c3dde9ee665c8d094ca10b814601cb8bb306567c90
          command: ["/opt/nvidia/nvidia_entrypoint.sh", "bash", "/cfg/run_evalrender_worker.sh"]
          env:
            - {name: WORKER_INDEX, value: "__IDX__"}
            - {name: WORKERS, value: "__N__"}
            - {name: OUTROOT, value: "/avl-west/fidelity_eval/evalrender"}
          resources:
            limits:   {cpu: "3", memory: 64Gi, ephemeral-storage: 100Gi, nvidia.com/gpu: "2"}
            requests: {cpu: "3", memory: 64Gi, ephemeral-storage: 100Gi, nvidia.com/gpu: "2"}
          volumeMounts:
            - {mountPath: /dev/shm,        name: dshm}
            - {mountPath: /cfg,            name: cfg}
            - {mountPath: /avl-west,       name: avl-west-vol}
            - {mountPath: /hugsim-storage, name: hugsim-storage}
      volumes:
        - {name: dshm, emptyDir: {medium: Memory, sizeLimit: 24Gi}}
        - {name: cfg, configMap: {name: navsafe-evalrender-cfg, defaultMode: 420}}
        - {name: avl-west-vol, persistentVolumeClaim: {claimName: avl-west-vol}}
        - {name: hugsim-storage, persistentVolumeClaim: {claimName: horuan-hugsim-vol}}
