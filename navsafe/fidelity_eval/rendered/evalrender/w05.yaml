# One shard of the fidelity render campaign. Four of these, one per node, two
# GPUs each: serve-grpc on GPU 0, the eval rollout on GPU 1.
#
# Why two GPUs and not one: serve-grpc with the harmonizer and --cache-size 4
# fills a 3090 on its own, leaving nothing for the policy. That is
# run_worker_current.sh's finding, reused here unchanged.
#
# Scheduled on the cogrob reserved nodes. ry-gpu-13 is left out deliberately;
# 14 is in. No per-worker hostname pin: the scheduler places shards across the
# seven, so a node filling up delays one shard instead of stranding it, and a
# shard left Pending starts by itself when a pair of cards frees.
#
# The GPU model constraint is not a preference: serve-grpc with the harmonizer
# plus the eval process needs a 24 GB card, and a smaller one fails with
# RESOURCE_EXHAUSTED partway through a pass rather than at start-up.
apiVersion: batch/v1
kind: Job
metadata:
  name: navsafe-evalrender-w05
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 604800
  template:
    spec:
      restartPolicy: Never
      tolerations:
        - {effect: NoSchedule, key: nautilus.io/reservation, operator: Equal, value: cogrob}
        - {effect: NoSchedule, key: nautilus.io/cogrob, operator: Exists}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - ry-gpu-05.sdsc.optiputer.net
                      - ry-gpu-06.sdsc.optiputer.net
                      - ry-gpu-07.sdsc.optiputer.net
                      - ry-gpu-08.sdsc.optiputer.net
                      - ry-gpu-11.sdsc.optiputer.net
                      - ry-gpu-12.sdsc.optiputer.net
                      - ry-gpu-14.sdsc.optiputer.net
                  - {key: nvidia.com/gpu.product, operator: In, values: [NVIDIA-GeForce-RTX-3090]}
      containers:
        - name: worker
          image: nvcr.io/nvidia/nre/nre-ga@sha256:6e0caa70a9148490552520c3dde9ee665c8d094ca10b814601cb8bb306567c90
          command: ["/opt/nvidia/nvidia_entrypoint.sh", "bash", "/cfg/run_evalrender_worker.sh"]
          env:
            - {name: WORKER_INDEX, value: "5"}
            - {name: WORKERS, value: "10"}
            # A NEW tree. /avl-west/fidelity_eval/evalrender holds 392x2
            # cells rendered before the actor-z fix (bbd27ad1), every one of
            # them carrying a .done marker, so resuming into it would skip the
            # whole campaign. The inputs are read from there unchanged --
            # scenario list and step lists are what makes the two comparable.
            - {name: OUTROOT,   value: "/avl-west/fidelity_eval/evalrender_zfix"}
            - {name: SCENARIOS, value: "/avl-west/fidelity_eval/evalrender/scenarios.txt"}
            - {name: STEPDIR,   value: "/avl-west/fidelity_eval/evalrender/steps"}
            # Pinned, not "whatever HEAD is when the pod starts": the point of
            # this re-run is the commit below, and a shard that restarts hours
            # later must render the same code as its siblings.
            - {name: NEXUSSIM_SHA, value: "bbd27ad1"}
          # Sized down from 64Gi/100Gi: the pod holds the venv (~15 GB), the
          # copied tree (~200 MB) and one eval process, and requesting more
          # than it uses is what the utilisation admission policy counts
          # against the account.
          resources:
            limits:   {cpu: "3", memory: 32Gi, ephemeral-storage: 60Gi, nvidia.com/gpu: "2"}
            requests: {cpu: "3", memory: 32Gi, ephemeral-storage: 60Gi, nvidia.com/gpu: "2"}
          volumeMounts:
            - {mountPath: /dev/shm,        name: dshm}
            - {mountPath: /cfg,            name: cfg}
            - {mountPath: /avl-west,       name: avl-west-vol}
            - {mountPath: /hugsim-storage, name: hugsim-storage}
      volumes:
        - {name: dshm, emptyDir: {medium: Memory, sizeLimit: 24Gi}}
        - {name: cfg, configMap: {name: navsafe-evalrender-cfg, defaultMode: 420}}
        - {name: avl-west-vol, persistentVolumeClaim: {claimName: avl-west-vol}}
        - {name: hugsim-storage, persistentVolumeClaim: {claimName: horuan-hugsim-vol}}
