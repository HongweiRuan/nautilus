# STAGE ncore (re-convert): the four U-turn clips WITH the recovered nuPlan
# spinning-lidar component, so lidar-supervised training becomes possible.
#
# Lives in jobs/, not rendered/ -- rendered/ is submit.sh's output directory and
# gets globbed away.
#
# Output goes to a RUN dir, not the corpus: a store with an extra component is
# an unproven variant until the lidardepth arm says otherwise. Promoting it into
# /avl-west/navsafe_5s_500 is a separate, deliberate step.
#
# aux MUST be rebuilt, not copied. It was tempting to reuse the corpus copy --
# the camera stores are byte-identical and the merged cloud decodes identically --
# but aux keys its per-point lidar labels BY SENSOR ID, and NRE refuses to train
# on a lidar it has no labels for:
#     KeyError: 'No lidar semantic segmentation data found for lidar_top_structured'
# So this stage is followed by templates/lidardepth_aux.yaml, one job per clip.
apiVersion: batch/v1
kind: Job
metadata:
  {
    name: uturn-lidardepth-ncore-f64,
    namespace: cogrob,
    labels: { app: uturn_drift_geomreg, stage: lidardepth-ncore, scene: "uturn" },
  }
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata: { labels: { app: uturn_drift_geomreg, stage: lidardepth-ncore, scene: "uturn" } }
    spec:
      restartPolicy: Never
      containers:
        - name: ncore
          # Same image the proven navsafe_5s_500 ncore stage uses. python:3.11-slim
          # looks tidier but ships no OpenGL runtime, and py123d[nuplan] pulls in cv2:
          #   ImportError: libGL.so.1: cannot open shared object file
          image: robinwangucsd/metabench:latest
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c"]
          args:
            - |
              set -uo pipefail
              LOG=2021.09.29.19.02.14_veh-28_03198_03360
              TOK=891953217984568c
              T0=1632945581749579
              SEG=5000000
              DEST=/avl-west/runs/20260820-uturn-lidardepth/ncore

              VENV=/root/cv; python3 -m venv "$VENV"; "$VENV/bin/pip" install -q --upgrade pip
              cp -a /hugsim-storage/py123d /root/py123d && rm -rf /root/py123d/build /root/py123d/*.egg-info
              "$VENV/bin/pip" install -q nuplan-devkit nvidia-ncore "/root/py123d[nuplan]" || exit 1

              DBDIR=/tmp/nuplan_local/nuplan-v1.1/splits/test; mkdir -p "$DBDIR"
              cp -n /avl-west/nuplan/nuplan-v1.1/splits/test/$LOG.db "$DBDIR/" || exit 1

              cat > /tmp/run_one.py <<'PY'
              import sys, logging
              from pathlib import Path
              logging.basicConfig(level=logging.INFO, format="%(levelname)s %(message)s")
              sys.path.insert(0, "/hugsim-storage/NexusSim")
              from nexussim.gs3d_converter.log_ingestion import NuplanLogReader
              from nexussim.gs3d_converter.ncore_bridge import NCoreBridge
              tok, log, t0, t1, out = sys.argv[1], sys.argv[2], int(sys.argv[3]), int(sys.argv[4]), sys.argv[5]
              reader = NuplanLogReader(
                  nuplan_data_root="/tmp/nuplan_local",
                  sensor_root="/avl-west/nuplan/nuplan-v1.1/sensor_blobs",
                  maps_root="/avl-west/nuplan/maps",
                  scenes=[(log, tok, t0, t1)], split="nuplan_test")
              scene = next(iter(reader.iter_scenes()))
              print(f"[{tok}] frames={scene.n_frames}", flush=True)
              print(f"[{tok}] NCore OK -> {NCoreBridge.prepare(scene, Path(out))}", flush=True)
              PY

              ok=0; fail=0; failed=""
              for k in 1 2 3 4; do
                C=${TOK}s${k}
                CT0=$((T0 + (k-1)*SEG)); CT1=$((T0 + k*SEG))
                CD=$DEST/clips/$C
                if [ -s "$CD/pai_$C.json" ]; then echo "[skip] $C"; continue; fi
                echo "--- $C ($CT0 .. $CT1) ---"
                if PYTHONPATH=/hugsim-storage/NexusSim NCORE_REREF_FRAME0=1 \
                     "$VENV/bin/python" /tmp/run_one.py "$C" "$LOG" "$CT0" "$CT1" "$DEST" \
                   && [ -s "$CD/pai_$C.json" ] \
                   && [ -s "$CD/nurec_origin_offset.json" ] \
                   && [ -s "$CD/pai_$C.ncore4-lidar_top_structured.zarr.itar" ]; then
                  echo "NCORE_DONE $C"; ok=$((ok+1))
                else
                  echo "NCORE_FAIL $C"; fail=$((fail+1)); failed="$failed $C"
                fi
              done
              echo "NCORE_SUMMARY ok=$ok fail=$fail"
              ls -la $DEST/clips/*/ | grep structured
              [ "$fail" -eq 0 ] || { echo "failed:$failed"; exit 1; }
          resources:
            # 45 % of the original ask (see submit.sh arm_mem). This stage has no measured
            # peak, unlike train -- if it OOMKills, that is the thing to raise first.
            requests: { cpu: "6", memory: "10800Mi", ephemeral-storage: 60Gi }
            limits: { cpu: "8", memory: "14400Mi", ephemeral-storage: 60Gi }
          volumeMounts:
            - { name: avl-west-vol, mountPath: /avl-west }
            - { name: hugsim-storage, mountPath: /hugsim-storage }
      volumes:
        - { name: avl-west-vol, persistentVolumeClaim: { claimName: avl-west-vol } }
        - { name: hugsim-storage, persistentVolumeClaim: { claimName: horuan-hugsim-vol } }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {
                      key: nvidia.com/gpu.product,
                      operator: In,
                      values: ["NVIDIA-GeForce-RTX-3090"],
                    }
                  - {
                      key: kubernetes.io/hostname,
                      operator: NotIn,
                      values: ["ry-gpu-02.sdsc.optiputer.net"],
                    }
      tolerations:
        - {
            effect: NoSchedule,
            key: nautilus.io/reservation,
            operator: Equal,
            value: cogrob,
          }
        - { effect: NoSchedule, key: nautilus.io/cogrob, operator: Exists }
