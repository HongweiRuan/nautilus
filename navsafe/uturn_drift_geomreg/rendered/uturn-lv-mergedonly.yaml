# VERIFY (short): does NRE accept lidar-supervised training on the recovered
# nuPlan spinning model? 2000 steps, one clip -- this is a yes/no about plumbing,
# not a quality run.
#
# Three things the log has to show:
#   1. no crash from get_lidar_data_batch (the whole point: the flattened store
#      has no lidar intrinsics, so this is impossible without the new component)
#   2. the lidar loss actually receiving samples (n_train_sample_lidar_rays=1024)
#   3. init point counts UNCHANGED -- "Original number of points: 1672462" for
#      background and 1022807 for road, i.e. the structured component did not
#      leak into Gaussian initialisation. If those numbers move, the init needs
#      model.layers.{background,road}.initialization.lidar_ids pinned to the
#      merged cloud before any comparison run.
apiVersion: batch/v1
kind: Job
metadata:
  {
    name: uturn-lv-mergedonly,
    namespace: cogrob,
    labels: { app: uturn_drift_geomreg, stage: lidarverify, variant: mergedonly },
  }
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata: { labels: { app: uturn_drift_geomreg, stage: lidarverify, variant: mergedonly } }
    spec:
      restartPolicy: Never
      imagePullSecrets: [{ name: ngc-pull }]
      containers:
        - name: nre-verify
          image: nvcr.io/nvidia/nre/nre-ga@sha256:6e0caa70a9148490552520c3dde9ee665c8d094ca10b814601cb8bb306567c90
          command: ["/opt/nvidia/nvidia_entrypoint.sh", "bash", "-c"]
          args:
            - |
              set -uo pipefail
              C=891953217984568cs1
              # The re-converted store, with aux already built ALONGSIDE the structured
              # component by templates/lidardepth_aux.yaml. The first attempt at this job
              # copied aux from the corpus instead and died with
              #   KeyError: 'No lidar semantic segmentation data found for lidar_top_structured'
              # -- aux keys its per-point lidar labels by sensor id, so a new lidar needs
              # its own labels and the corpus copy cannot supply them.
              SRC=/avl-west/runs/20260820-uturn-lidardepth/ncore/clips/$C
              L=/tmp/clip/$C; OUTL=/tmp/out
              RUN=/avl-west/runs/20260820-uturn-lidardepth

              CFGDIR=/app/internal/scripts/pycena/runtime/pycena_nrm_full.runfiles/_main/configs/apps/prod/Hyperion-8.1
              cp /avl-west/nre_overlays/car2sim_6cam_static.yaml "$CFGDIR/" || exit 1

              rm -rf "$L" "$OUTL"; mkdir -p "$L" "$OUTL"
              cp -a $SRC/. $L/ || exit 1
              ls $L/$C.aux.*.zarr.itar >/dev/null 2>&1 || { echo "FAIL: aux not built for $C yet"; exit 1; }
              ( cd "$L" && for f in $C.aux.*.zarr.itar; do ln -sf "$f" "pai_$f"; done )
              echo "[verify] stores:"; ls -la $L/*.zarr.itar | awk '{printf "   %10d %s\n", $5, $9}'

              /app/run --config-name=configs/apps/prod/Hyperion-8.1/car2sim_6cam_static.yaml \
                mode=train logger=dummy dataset.path=$L/pai_$C.json out_dir=$OUTL logger.run_id="$C" dataset.aux_data=True \
                dataset.camera_ids=[camera_pcam_f0,camera_pcam_b0,camera_pcam_l0,camera_pcam_r0,camera_pcam_l1] \
                dataset.train_camera_ids=[camera_pcam_f0,camera_pcam_b0,camera_pcam_l0,camera_pcam_r0,camera_pcam_l1] \
                dataset.val_camera_ids=[camera_pcam_f0,camera_pcam_b0,camera_pcam_l0,camera_pcam_r0,camera_pcam_l1] \
                dataset.n_train_sequential_image_subsample=4 dataset.n_val_image_subsample=4 \
                dataset.lidar_ids=[lidar_top_360fov] dataset.train_lidar_ids=[lidar_top_360fov] dataset.val_lidar_ids=[lidar_top_360fov] \
                dataset.n_train_sample_lidar_rays=1024 \
                dataset.cuboid_tracks_params.track_label_sources=[GT_ANNOTATION] \
                model.layers.dynamic_rigids.tracks.label_classes=[NuPlanBoxDetectionLabel.VEHICLE,NuPlanBoxDetectionLabel.BICYCLE] \
                model.layers.dynamic_deformables.tracks.label_classes=[NuPlanBoxDetectionLabel.PEDESTRIAN] \
                model.layers.dynamic_rigids.initialization.name=camera-dynamic-tracks \
                +model.layers.dynamic_rigids.initialization.camera_ids=null +model.layers.dynamic_rigids.initialization.step_frame=1 +model.layers.dynamic_rigids.initialization.fill_with_random_points=true \
                model.layers.dynamic_deformables.initialization.name=camera-dynamic-tracks \
                +model.layers.dynamic_deformables.initialization.camera_ids=null +model.layers.dynamic_deformables.initialization.step_frame=1 +model.layers.dynamic_deformables.initialization.fill_with_random_points=true \
                model.layers.road.initialization.name=lidar-rig-trajectory model.layers.road.initialization.default_scale=0.1 \
                +model.layers.road.initialization.num_near_points=100000 +model.layers.road.initialization.num_far_points=100000 +model.layers.road.initialization.far_radius_factor=20 +model.layers.road.initialization.observation_scale_factor=0.01 \
                +model.layers.road.initialization.lidar_ids=[lidar_top_360fov] +model.layers.road.initialization.camera_ids=null +model.layers.road.initialization.non_dynamic_points_only=true \
                dataset.n_samples_per_epoch=2000 \
                model.strategy.add.max_n_gaussians=5000000 model.strategy.add.end_iteration=1500 \
                model.strategy.relocate.end_iteration=1500 model.strategy.perturb.end_iteration=2000 \
                system.optimizers.0.scheduler.args.T_max=2000 checkpoint.every_n_train_steps=2000 \
                checkpoint.artifact.mesh.ground.enabled=false
              rc=$?

              echo "=== VERIFY SUMMARY (exit $rc) ==="
              mkdir -p $RUN
              if [ -f "$OUTL/$C/config/parsed.yaml" ]; then
                cp -a $OUTL/$C/config $RUN/verify-config 2>/dev/null || true
                grep -nE "n_train_sample_lidar_rays|train_lidar_ids" -A2 "$OUTL/$C/config/parsed.yaml" | head -12
              fi
              [ $rc -eq 0 ] && echo "LIDARVERIFY_OK_mergedonly" || echo "LIDARVERIFY_FAIL_mergedonly rc=$rc"
              exit $rc
          env:
            - {
                name: NGC_API_KEY,
                valueFrom: { secretKeyRef: { name: ngc-api-key, key: NGC_API_KEY } },
              }
            - { name: HYDRA_FULL_ERROR, value: "1" }
            - { name: PYTORCH_CUDA_ALLOC_CONF, value: "expandable_segments:True" }
          resources:
            requests:
              { cpu: "2", memory: "32Gi", nvidia.com/gpu: "1", ephemeral-storage: 80Gi }
            limits:
              { cpu: "2", memory: "32Gi", nvidia.com/gpu: "1", ephemeral-storage: 80Gi }
          volumeMounts:
            - { name: dshm, mountPath: /dev/shm }
            - { name: avl-west-vol, mountPath: /avl-west }
      volumes:
        - { name: dshm, emptyDir: { medium: Memory, sizeLimit: 24Gi } }
        - { name: avl-west-vol, persistentVolumeClaim: { claimName: avl-west-vol } }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {
                      key: kubernetes.io/hostname,
                      operator: In,
                      values:
                        [
                          "ry-gpu-06.sdsc.optiputer.net",
                          "ry-gpu-07.sdsc.optiputer.net",
                          "ry-gpu-08.sdsc.optiputer.net",
                          "ry-gpu-11.sdsc.optiputer.net",
                          "ry-gpu-12.sdsc.optiputer.net",
                          "ry-gpu-13.sdsc.optiputer.net",
                          "ry-gpu-14.sdsc.optiputer.net",
                        ],
                    }
      tolerations:
        - {
            effect: NoSchedule,
            key: nautilus.io/reservation,
            operator: Equal,
            value: cogrob,
          }
        - { effect: NoSchedule, key: nautilus.io/cogrob, operator: Exists }
