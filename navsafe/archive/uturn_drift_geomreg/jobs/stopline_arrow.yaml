# ARROW for the stopline HOST window. The recons carry pixels only -- without
# this there is no ego / boxes / map / route to drive, and eval_py123d.py has
# nothing to replay.
#
# Host layout, matching the U-turn scene that already works:
#   <corpus>/<token>_20s/arrow/logs/nuplan_test/<token>/   <- bare token inside
#   <corpus>/<token>_20s/arrow/maps/nuplan/
# so the conversion is run for the BARE token over the FULL 20 s window, and the
# result is copied into the `_20s` host directory.
#
# Shape copied from navsafe_5s_500/templates/arrow.yaml (proven over 500 scenes):
# local db + local HD maps (CephFS reads are slow and ray goes D-state on them),
# and threads_per_node=8 because os.cpu_count() reports the node's cores, not the
# cgroup's, so ray otherwise oversubscribes into an import deadlock.
apiVersion: batch/v1
kind: Job
metadata:
  {
    name: stopline-arrow,
    namespace: cogrob,
    labels: { app: uturn_drift_geomreg, stage: arrow, scene: stopline },
  }
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata: { labels: { app: uturn_drift_geomreg, stage: arrow, scene: stopline } }
    spec:
      restartPolicy: Never
      containers:
        - name: arrow
          image: robinwangucsd/metabench:latest
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c"]
          args:
            - |
              set -uo pipefail
              T=3efebf87894a552e
              LOG=2021.08.30.13.45.25_veh-40_01116_01336
              T0=1630332397000194
              T1=1630332418500220
              ROOT=/avl-west/navsafe_5s_500/${T}_20s/arrow

              if [ -d "$ROOT/logs/nuplan_test/$T" ] && [ -d "$ROOT/maps" ]; then
                echo "SKIP $T (arrow already present)"; exit 0
              fi

              VENV=/root/cv; python3 -m venv "$VENV"; "$VENV/bin/pip" install -q --upgrade pip
              cp -a /hugsim-storage/py123d /root/py123d && rm -rf /root/py123d/build /root/py123d/*.egg-info
              "$VENV/bin/pip" install -q nuplan-devkit nvidia-ncore "/root/py123d[nuplan]" || exit 1

              DBDIR=/tmp/nuplan_local/nuplan-v1.1/splits/test; mkdir -p "$DBDIR"
              cp -n /avl-west/nuplan/nuplan-v1.1/splits/test/$LOG.db "$DBDIR/" || exit 1
              mkdir -p /tmp/maps && cp -a /avl-west/nuplan/maps/. /tmp/maps/
              export RAY_DISABLE_USAGE_STATS=1

              echo "--- $T ($LOG $T0 $T1) ---"
              rm -rf /tmp/arrow
              if PYTHONPATH=/hugsim-storage/NexusSim PY123D_DATA_ROOT=/tmp/arrow \
                   timeout 1800 "$VENV/bin/py123d-conversion" dataset=nuplan-navhard \
                     "dataset.parser.scenes=[[$LOG, $T, $T0, $T1]]" \
                     dataset.parser.nuplan_data_root=/tmp/nuplan_local \
                     dataset.parser.nuplan_maps_root=/tmp/maps \
                     execution.threads_per_node=8 \
                 && [ -d /tmp/arrow/logs/nuplan_test/$T ] && [ -d /tmp/arrow/maps ]; then
                mkdir -p $ROOT && cp -a /tmp/arrow/. $ROOT/
                if [ -d "$ROOT/logs/nuplan_test/$T" ] && [ -d "$ROOT/maps" ]; then
                  echo "ARROW_DONE $T"; find $ROOT -maxdepth 3 -type d | head
                else
                  echo "ARROW_FAIL $T (copy-out)"; exit 1
                fi
              else
                echo "ARROW_FAIL $T"; exit 1
              fi
          resources:
            requests: { cpu: "6", memory: "24Gi", ephemeral-storage: 60Gi }
            limits: { cpu: "8", memory: "32Gi", ephemeral-storage: 60Gi }
          volumeMounts:
            - { name: avl-west-vol, mountPath: /avl-west }
            - { name: hugsim-storage, mountPath: /hugsim-storage }
      volumes:
        - { name: avl-west-vol, persistentVolumeClaim: { claimName: avl-west-vol } }
        - { name: hugsim-storage, persistentVolumeClaim: { claimName: horuan-hugsim-vol } }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {
                      key: nvidia.com/gpu.product,
                      operator: In,
                      values: ["NVIDIA-GeForce-RTX-3090"],
                    }
                  - {
                      key: kubernetes.io/hostname,
                      operator: NotIn,
                      values: ["ry-gpu-02.sdsc.optiputer.net"],
                    }
      tolerations:
        - {
            effect: NoSchedule,
            key: nautilus.io/reservation,
            operator: Equal,
            value: cogrob,
          }
        - { effect: NoSchedule, key: nautilus.io/cogrob, operator: Exists }
