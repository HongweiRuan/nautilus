# ABLATION train: one (ARM, CLIP) pair per job.
#
# Same recipe / same data / same flags as the navsafe_5s_500 baseline train
# (../navsafe_5s_500/templates/train.yaml), with ONE difference: the loss.lidar.lambda_=0.005
# line. Everything else is byte-identical on purpose — the point of the run is that
# any quality delta is attributable to the arm, not to a stray flag.
#
# The baseline arm is NOT retrained: it already exists at
#   /avl-west/navsafe_5s_500/<CLIP>/output_5cam/<CLIP>/artifacts/last.usdz
# Ablation recons are experiment variants, so they go to a RUN dir, never into the
# corpus tree:
#   /avl-west/runs/20260819-uturn-drift-geomreg/recon/<ARM>/<CLIP>/artifacts/last.usdz
#
# Placeholders: lidardepth 891953217984568cs1 20260819-uturn-drift-geomreg dataset.n_samples_per_epoch=160000 model.strategy.add.max_n_gaussians=5000000 model.strategy.add.end_iteration=140000 model.strategy.relocate.end_iteration=140000 model.strategy.perturb.end_iteration=160000 system.optimizers.0.scheduler.args.T_max=160000 loss.lidar.lambda_=0.005 {"dataset.n_train_sample_lidar_rays": 1024, "loss.lidar.lambda_": 0.005, "dataset.lidar_ids": ["lidar_top_structured"], "dataset.train_lidar_ids": ["lidar_top_structured"], "model.strategy.add.max_n_gaussians": 5000000}
#               2 32Gi /avl-west/runs/20260820-uturn-lidardepth/ncore/clips/$C [lidar_top_structured] dataset.lidar_ids=[lidar_top_structured] dataset.train_lidar_ids=[lidar_top_structured] dataset.val_lidar_ids=[lidar_top_structured] dataset.n_train_sample_lidar_rays=1024 
# Every Hydra key appears EXACTLY once on the command line: repeating one is a
# composition error, which is why the lidar ids and ray count are a placeholder
# rather than something an arm can append to.
apiVersion: batch/v1
kind: Job
metadata:
  {
    name: uturn-lidardepth-891953217984568cs1,
    namespace: cogrob,
    labels:
      { app: uturn_drift_geomreg, stage: train, arm: "lidardepth", clip: "891953217984568cs1" },
  }
spec:
  backoffLimit: 4 # evictions are external events, not code failures; a retry
    # exits immediately if the artifact is already on CephFS
  ttlSecondsAfterFinished: 86400 # 24h — keep the logs readable after the run
  template:
    metadata:
      labels:
        { app: uturn_drift_geomreg, stage: train, arm: "lidardepth", clip: "891953217984568cs1" }
    spec:
      restartPolicy: Never
      imagePullSecrets: [{ name: ngc-pull }]
      containers:
        - name: nre-train
          image: nvcr.io/nvidia/nre/nre-ga@sha256:6e0caa70a9148490552520c3dde9ee665c8d094ca10b814601cb8bb306567c90
          command: ["/opt/nvidia/nvidia_entrypoint.sh", "bash", "-c"]
          args:
            - |
              set -uo pipefail
              C=891953217984568cs1
              ARM=lidardepth
              RUN=/avl-west/runs/20260819-uturn-drift-geomreg
              SRC=/avl-west/runs/20260820-uturn-lidardepth/ncore/clips/$C
              DST=$RUN/recon/$ARM/$C
              L=/tmp/clip/$C; OUTL=/tmp/out
              echo "[uturn $ARM/$C] overrides: loss.lidar.lambda_=0.005"

              if [ -f "$DST/artifacts/last.usdz" ]; then echo "SKIP $ARM/$C (already done)"; exit 0; fi
              if ! [ -s "$SRC/pai_$C.json" ] || ! ls $SRC/$C.aux.*.zarr.itar >/dev/null 2>&1; then
                echo "FAIL $ARM/$C: ncore store or aux missing under $SRC"; exit 1
              fi

              # car2sim needs the overlay config inside the container's Hydra config dir
              CFGDIR=/app/internal/scripts/pycena/runtime/pycena_nrm_full.runfiles/_main/configs/apps/prod/Hyperion-8.1
              cp /avl-west/nre_overlays/car2sim_6cam_static.yaml "$CFGDIR/" || exit 1

              # CephFS relief: one sequential read of the store+aux, then train off local disk
              echo "--- $C: copy-in store+aux CephFS->local ($(du -sh $SRC 2>/dev/null | cut -f1)) ---"
              rm -rf "$L" "$OUTL/$C"; mkdir -p "$L" "$OUTL" && cp -a $SRC/. $L/ || exit 1
              # REQUIRED: training discovers aux under the manifest base name pai_<scene>.aux.*
              ( cd "$L" && for f in $C.aux.*.zarr.itar; do [ -e "$f" ] && ln -sf "$f" "pai_$f"; done )
              ls $L/pai_$C.aux.*.zarr.itar >/dev/null 2>&1 || { echo "FAIL: no aux stores for $C"; exit 1; }

              # Whether difix.training fits on a 24 GB 3090 next to the gaussians is the
              # whole question for the difix arms, so sample VRAM for the run's lifetime.
              ( while true; do nvidia-smi --query-gpu=memory.used --format=csv,noheader,nounits; sleep 30; done ) > /tmp/vram.log 2>/dev/null &
              VRAMPID=$!

              echo "[uturn $ARM/$C] training ..."
              /app/run --config-name=configs/apps/prod/Hyperion-8.1/car2sim_6cam_static.yaml \
                mode=train logger=dummy dataset.path=$L/pai_$C.json out_dir=$OUTL logger.run_id="$C" dataset.aux_data=True \
                dataset.camera_ids=[camera_pcam_f0,camera_pcam_b0,camera_pcam_l0,camera_pcam_r0,camera_pcam_l1] \
                dataset.train_camera_ids=[camera_pcam_f0,camera_pcam_b0,camera_pcam_l0,camera_pcam_r0,camera_pcam_l1] \
                dataset.val_camera_ids=[camera_pcam_f0,camera_pcam_b0,camera_pcam_l0,camera_pcam_r0,camera_pcam_l1] \
                dataset.n_train_sequential_image_subsample=4 dataset.n_val_image_subsample=4 \
                dataset.lidar_ids=[lidar_top_structured] dataset.train_lidar_ids=[lidar_top_structured] dataset.val_lidar_ids=[lidar_top_structured] dataset.n_train_sample_lidar_rays=1024 \
                dataset.cuboid_tracks_params.track_label_sources=[GT_ANNOTATION] \
                model.layers.dynamic_rigids.tracks.label_classes=[NuPlanBoxDetectionLabel.VEHICLE,NuPlanBoxDetectionLabel.BICYCLE] \
                model.layers.dynamic_deformables.tracks.label_classes=[NuPlanBoxDetectionLabel.PEDESTRIAN] \
                model.layers.dynamic_rigids.initialization.name=camera-dynamic-tracks \
                +model.layers.dynamic_rigids.initialization.camera_ids=null +model.layers.dynamic_rigids.initialization.step_frame=1 +model.layers.dynamic_rigids.initialization.fill_with_random_points=true \
                model.layers.dynamic_deformables.initialization.name=camera-dynamic-tracks \
                +model.layers.dynamic_deformables.initialization.camera_ids=null +model.layers.dynamic_deformables.initialization.step_frame=1 +model.layers.dynamic_deformables.initialization.fill_with_random_points=true \
                model.layers.road.initialization.name=lidar-rig-trajectory model.layers.road.initialization.default_scale=0.1 \
                +model.layers.road.initialization.num_near_points=100000 +model.layers.road.initialization.num_far_points=100000 +model.layers.road.initialization.far_radius_factor=20 +model.layers.road.initialization.observation_scale_factor=0.01 \
                +model.layers.road.initialization.lidar_ids=[lidar_top_structured] +model.layers.road.initialization.camera_ids=null +model.layers.road.initialization.non_dynamic_points_only=true \
                dataset.n_samples_per_epoch=160000 model.strategy.add.max_n_gaussians=5000000 model.strategy.add.end_iteration=140000 model.strategy.relocate.end_iteration=140000 model.strategy.perturb.end_iteration=160000 system.optimizers.0.scheduler.args.T_max=160000 \
                checkpoint.every_n_train_steps=40000 \
                checkpoint.artifact.mesh.ground.enabled=false \
                loss.lidar.lambda_=0.005

              kill $VRAMPID 2>/dev/null
              echo "[vram] $ARM/$C peak $(sort -n /tmp/vram.log 2>/dev/null | tail -1) MiB of 24576"

              if [ -f "$OUTL/$C/artifacts/last.usdz" ]; then
                echo "[uturn $ARM/$C] copy-out last.usdz ($(du -h $OUTL/$C/artifacts/last.usdz | cut -f1)) ..."
                mkdir -p $DST/artifacts && cp -a $OUTL/$C/artifacts/last.usdz $DST/artifacts/
                cp -a $OUTL/$C/config $DST/ 2>/dev/null || true
                [ -f "$DST/artifacts/last.usdz" ] || { echo "FAIL $ARM/$C (copy-out)"; exit 1; }
                echo "DONE $ARM/$C"
              else
                echo "FAIL $ARM/$C (no last.usdz)"; exit 1
              fi
              rm -rf "$L" "$OUTL/$C"

              # An arm label is only worth anything if the overrides actually landed, so
              # read them back out of the config the run itself parsed. Runs LAST and on
              # the already-copied-out config: a checker problem must never cost us a
              # finished 4.5 h artifact, but a real MISMATCH must fail the job loudly so
              # nobody compares against a recon that is not the arm it claims to be.
              if python3 -c 'import yaml' >/dev/null 2>&1; then
                python3 $RUN/arm_check.py "$DST/config/parsed.yaml" '{"dataset.n_train_sample_lidar_rays": 1024, "loss.lidar.lambda_": 0.005, "dataset.lidar_ids": ["lidar_top_structured"], "dataset.train_lidar_ids": ["lidar_top_structured"], "model.strategy.add.max_n_gaussians": 5000000}' || exit 1
              else
                echo "[arm-check] WARN: no python3+yaml in this image, arm not verified"
              fi
          env:
            - {
                name: NGC_API_KEY,
                valueFrom: { secretKeyRef: { name: ngc-api-key, key: NGC_API_KEY } },
              }
            - { name: HYDRA_FULL_ERROR, value: "1" }
            - { name: PYTORCH_CUDA_ALLOC_CONF, value: "expandable_segments:True" }
          resources: # the geometry arms use the baseline shape (cpu 2 / mem 32Gi) so a
            # resource difference is not one more uncontrolled variable; the difix arms
            # need more CPU/RAM for difix.training's extra novel-view dataloader workers
            requests:
              { cpu: "2", memory: "32Gi", nvidia.com/gpu: "1", ephemeral-storage: 80Gi }
            limits:
              { cpu: "2", memory: "32Gi", nvidia.com/gpu: "1", ephemeral-storage: 80Gi }
          volumeMounts:
            - { name: dshm, mountPath: /dev/shm }
            - { name: avl-west-vol, mountPath: /avl-west }
      volumes:
        - { name: dshm, emptyDir: { medium: Memory, sizeLimit: 24Gi } }
        - { name: avl-west-vol, persistentVolumeClaim: { claimName: avl-west-vol } }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  # our reserved 3090s. ry-gpu-05 is left out: it is measurably slower,
                  # and one straggling arm holds up the whole comparison.
                  - {
                      key: kubernetes.io/hostname,
                      operator: In,
                      values:
                        [
                          "ry-gpu-06.sdsc.optiputer.net",
                          "ry-gpu-07.sdsc.optiputer.net",
                          "ry-gpu-08.sdsc.optiputer.net",
                          "ry-gpu-11.sdsc.optiputer.net",
                          "ry-gpu-12.sdsc.optiputer.net",
                          "ry-gpu-13.sdsc.optiputer.net",
                          "ry-gpu-14.sdsc.optiputer.net",
                        ],
                    }
      tolerations:
        - {
            effect: NoSchedule,
            key: nautilus.io/reservation,
            operator: Equal,
            value: cogrob,
          }
        - { effect: NoSchedule, key: nautilus.io/cogrob, operator: Exists }
