# 5166e079 low-res(480x270, subsample 4) + 5-camera budget sweep — reserved 3090.
# 480k-10M : 480000 steps / 10M gaussians. expandable_segments to avoid
# the fragmentation OOM. NOTE: 10M configs are very likely to OOM a 24GB 3090
# (gaussian storage ~35GB dominates; low-res/5-cam barely helps) -> move to 48GB if so.
apiVersion: batch/v1
kind: Job
metadata: { name: navhard-lr5cam-5166e079-480k-10m, namespace: cogrob, labels: { batch: navhard-lr5cam, tag: "480k-10M" } }
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 259200
  template:
    metadata: { labels: { batch: navhard-lr5cam, tag: "480k-10M" } }
    spec:
      restartPolicy: Never
      imagePullSecrets: [{ name: ngc-pull }]
      containers:
        - name: train
          image: nvcr.io/nvidia/nre/nre-ga@sha256:6e0caa70a9148490552520c3dde9ee665c8d094ca10b814601cb8bb306567c90
          imagePullPolicy: IfNotPresent
          command: ["/opt/nvidia/nvidia_entrypoint.sh", "bash", "-c"]
          args:
            - |
              set -e
              C=5166e079c1185f4c
              CLIPDIR=/avl-west/navsafe_dev/ncore/$C/clips/$C
              OUT=/avl-west/navsafe_dev/recon-lr5cam/480k-10M
              CFGDIR=/app/internal/scripts/pycena/runtime/pycena_nrm_full.runfiles/_main/configs/apps/prod/Hyperion-8.1
              cp /avl-west/nre_overlays/car2sim_6cam_static.yaml "$CFGDIR/"
              ( cd "$CLIPDIR" && for f in $C.aux.*.zarr.itar; do ln -sf "$f" "pai_$f"; done )
              /app/run --config-name=configs/apps/prod/Hyperion-8.1/car2sim_6cam_static.yaml                 mode=train logger=dummy dataset.path=$CLIPDIR/pai_$C.json out_dir=$OUT logger.run_id="$C" dataset.aux_data=True                 dataset.camera_ids=[camera_pcam_f0,camera_pcam_b0,camera_pcam_l0,camera_pcam_r0,camera_pcam_l1] dataset.train_camera_ids=[camera_pcam_f0,camera_pcam_b0,camera_pcam_l0,camera_pcam_r0,camera_pcam_l1] dataset.val_camera_ids=[camera_pcam_f0,camera_pcam_b0,camera_pcam_l0,camera_pcam_r0,camera_pcam_l1]                 dataset.n_train_sequential_image_subsample=4 dataset.n_val_image_subsample=4                 dataset.lidar_ids=[lidar_top_360fov] dataset.train_lidar_ids=[lidar_top_360fov] dataset.val_lidar_ids=[lidar_top_360fov]                 dataset.n_train_sample_lidar_rays=0 dataset.cuboid_tracks_params.track_label_sources=[GT_ANNOTATION]                 model.layers.dynamic_rigids.tracks.label_classes=[NuPlanBoxDetectionLabel.VEHICLE,NuPlanBoxDetectionLabel.BICYCLE]                 model.layers.dynamic_deformables.tracks.label_classes=[NuPlanBoxDetectionLabel.PEDESTRIAN]                 model.layers.dynamic_rigids.initialization.name=camera-dynamic-tracks +model.layers.dynamic_rigids.initialization.camera_ids=null +model.layers.dynamic_rigids.initialization.step_frame=1 +model.layers.dynamic_rigids.initialization.fill_with_random_points=true                 model.layers.dynamic_deformables.initialization.name=camera-dynamic-tracks +model.layers.dynamic_deformables.initialization.camera_ids=null +model.layers.dynamic_deformables.initialization.step_frame=1 +model.layers.dynamic_deformables.initialization.fill_with_random_points=true                 model.layers.road.initialization.name=lidar-rig-trajectory model.layers.road.initialization.default_scale=0.1                 +model.layers.road.initialization.num_near_points=100000 +model.layers.road.initialization.num_far_points=100000 +model.layers.road.initialization.far_radius_factor=20 +model.layers.road.initialization.observation_scale_factor=0.01                 +model.layers.road.initialization.lidar_ids=null +model.layers.road.initialization.camera_ids=null +model.layers.road.initialization.non_dynamic_points_only=true                 dataset.n_samples_per_epoch=480000                 model.strategy.add.max_n_gaussians=10000000 model.strategy.add.end_iteration=420000                 model.strategy.relocate.end_iteration=420000 model.strategy.perturb.end_iteration=480000                 system.optimizers.0.scheduler.args.T_max=480000 checkpoint.every_n_train_steps=40000                 checkpoint.artifact.mesh.ground.enabled=false
              test -f $OUT/$C/checkpoints/last.ckpt && echo "TRAIN_DONE $C 480k-10M"
          env:
            - { name: NGC_API_KEY, valueFrom: { secretKeyRef: { name: ngc-api-key, key: NGC_API_KEY } } }
            - { name: HYDRA_FULL_ERROR, value: "1" }
            - { name: PYTORCH_CUDA_ALLOC_CONF, value: "expandable_segments:True" }
          resources:
            requests: { cpu: "4", memory: 32Gi, nvidia.com/gpu: "1", ephemeral-storage: 80Gi }
            limits:   { cpu: "4", memory: 32Gi, nvidia.com/gpu: "1", ephemeral-storage: 80Gi }
          volumeMounts:
            - { name: dshm, mountPath: /dev/shm }
            - { name: avl-west-vol, mountPath: /avl-west }
      volumes:
        - { name: dshm, emptyDir: { medium: Memory, sizeLimit: 24Gi } }
        - { name: avl-west-vol, persistentVolumeClaim: { claimName: avl-west-vol } }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: nvidia.com/gpu.product, operator: In, values: ["NVIDIA-A100-80GB-PCIe","NVIDIA-A100-SXM4-80GB","NVIDIA-L40","NVIDIA-L40S","NVIDIA-A40","NVIDIA-RTX-A6000","NVIDIA-RTX-PRO-6000-Blackwell-Max-Q-Workstation-Edition"] }
                  - { key: topology.kubernetes.io/region, operator: In, values: ["us-west"] }
      tolerations:
        - { effect: NoSchedule, key: nautilus.io/hardware, operator: Equal, value: large-gpu }
