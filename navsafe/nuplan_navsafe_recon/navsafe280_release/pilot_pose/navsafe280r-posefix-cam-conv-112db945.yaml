          grep -q "NCORE_RIG_ROT=0.37,1.13" /avl-west/navsafe280_release_20261021/posefix_cam/prep/112db94505025ec5/*/convert.log

          cat /avl-west/navsafe280_release_20261021/posefix_cam/prep/112db94505025ec5/*/convert.log | grep -c "NCORE_CAM_ROT camera_" | grep -qx 8

          cp /avl-west/navsafe280_release_20261021/inputs/112db94505025ec5/clips/112db94505025ec5/112db94505025ec5.aux.*.zarr.itar /avl-west/navsafe280_release_20261021/posefix_cam/inputs/112db94505025ec5/clips/112db94505025ec5/

