          value: /avl-west/navsafe280_release_20261021/posefix_cam
        - name: C
          value: 112db94505025ec5
        - name: LOG
          value: 2021.08.30.16.16.44_veh-40_01099_01351
        - name: T0
          value: '1630341561950081'
        - name: T1
          value: '1630341582049994'
        - name: NCORE_RIG_ROT
          value: 0.37,1.13
        - name: NCORE_CAM_ROT
          value: pcam_b0:0.0275,-0.0360,0.0912;pcam_f0:0.0890,0.2076,-0.1581;pcam_l0:0.0708,0.1273,-0.0011;pcam_l1:0.1229,0.2370,-0.1106;pcam_l2:0.0730,0.1134,-0.0162;pcam_r0:-0.0936,0.1139,0.1029;pcam_r1:0.0100,-0.2420,0.0589;pcam_r2:0.0888,-0.1864,-0.1059
