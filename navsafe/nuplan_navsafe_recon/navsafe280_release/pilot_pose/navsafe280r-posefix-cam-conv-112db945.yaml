          (cd /avl-west/navsafe280_release_20261021/posefix_cam/inputs/112db94505025ec5/clips/112db94505025ec5 && sha256sum -c --quiet /avl-west/navsafe280_release_20261021/posefix_cam/aux/112db94505025ec5/aux.sha256)

          [ -s /avl-west/navsafe280_release_20261021/posefix_cam/audit8/112db94505025ec5.json ] || cp /avl-west/navsafe280_release_20261021/audit8/112db94505025ec5.json /avl-west/navsafe280_release_20261021/posefix_cam/audit8/112db94505025ec5.json

          date -u +%FT%TZ > /avl-west/navsafe280_release_20261021/posefix_cam/aux/112db94505025ec5/ready

          echo POSEFIX_CLIP_READY 112db94505025ec5

          '
