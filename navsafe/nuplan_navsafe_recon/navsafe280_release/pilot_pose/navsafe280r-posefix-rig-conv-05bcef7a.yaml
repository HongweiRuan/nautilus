          value: /avl-west/navsafe280_release_20261021/posefix_rig
        - name: C
          value: 05bcef7a11d65c6a
        - name: LOG
          value: 2021.09.09.18.04.06_veh-40_00743_01071
        - name: T0
          value: '1631211506950101'
        - name: T1
          value: '1631211527049827'
        - name: NCORE_RIG_ROT
