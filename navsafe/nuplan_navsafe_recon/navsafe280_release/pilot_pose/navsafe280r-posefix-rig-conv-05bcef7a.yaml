          (cd /avl-west/navsafe280_release_20261021/posefix_rig/inputs/05bcef7a11d65c6a/clips/05bcef7a11d65c6a && sha256sum -c --quiet /avl-west/navsafe280_release_20261021/posefix_rig/aux/05bcef7a11d65c6a/aux.sha256)

          [ -s /avl-west/navsafe280_release_20261021/posefix_rig/audit8/05bcef7a11d65c6a.json ] || cp /avl-west/navsafe280_release_20261021/audit8/05bcef7a11d65c6a.json /avl-west/navsafe280_release_20261021/posefix_rig/audit8/05bcef7a11d65c6a.json

          date -u +%FT%TZ > /avl-west/navsafe280_release_20261021/posefix_rig/aux/05bcef7a11d65c6a/ready

