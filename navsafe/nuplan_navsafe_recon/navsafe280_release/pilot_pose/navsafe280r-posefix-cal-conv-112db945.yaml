        - name: avl-west-vol
          mountPath: /avl-west
        - name: hugsim-storage
          mountPath: /hugsim-storage
        - name: pipeline
          mountPath: /pipeline
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 24Gi
      - name: avl-west-vol
        persistentVolumeClaim:
          claimName: avl-west-vol
      - name: hugsim-storage
        persistentVolumeClaim:
          claimName: horuan-hugsim-vol
      - name: pipeline
