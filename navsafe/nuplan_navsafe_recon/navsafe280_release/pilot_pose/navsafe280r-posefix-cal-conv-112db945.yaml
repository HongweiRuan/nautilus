        - name: C
          value: 112db94505025ec5
        - name: LOG
          value: 2021.08.30.16.16.44_veh-40_01099_01351
        - name: T0
          value: '1630341561950081'
        - name: T1
          value: '1630341582049994'
        - name: NCORE_RIG_ROT
          value: 0.37,1.13
        - name: NCORE_CAM_ROT
          value: pcam_f0:0.0000,0.0000,0.0000;pcam_l0:0.2173,-0.0874,0.1684;pcam_l1:0.4191,-0.0854,0.2168;pcam_l2:0.5490,-0.0836,0.1242;pcam_r0:0.1023,-0.0701,-0.3988;pcam_r1:0.4835,-0.1596,-0.0749;pcam_r2:0.7132,-0.1103,-0.0731;pcam_b0:0.6370,-0.0885,0.1569
        - name: NCORE_CAM_FOCAL
