          bash /pipeline/convert.sh

          grep -q "NCORE_RIG_ROT=0.37,1.13" /avl-west/navsafe280_release_20261021/posefix_cal/prep/112db94505025ec5/*/convert.log

          cat /avl-west/navsafe280_release_20261021/posefix_cal/prep/112db94505025ec5/*/convert.log | grep -c "NCORE_CAM_ROT camera_" | grep -qx 8

          cp /avl-west/navsafe280_release_20261021/inputs/112db94505025ec5/clips/112db94505025ec5/112db94505025ec5.aux.*.zarr.itar /avl-west/navsafe280_release_20261021/posefix_cal/inputs/112db94505025ec5/clips/112db94505025ec5/

          cp /avl-west/navsafe280_release_20261021/aux/112db94505025ec5/aux.sha256 /avl-west/navsafe280_release_20261021/posefix_cal/aux/112db94505025ec5/aux.sha256

          (cd /avl-west/navsafe280_release_20261021/posefix_cal/inputs/112db94505025ec5/clips/112db94505025ec5 && sha256sum -c --quiet /avl-west/navsafe280_release_20261021/posefix_cal/aux/112db94505025ec5/aux.sha256)

          [ -s /avl-west/navsafe280_release_20261021/posefix_cal/audit8/112db94505025ec5.json ] || cp /avl-west/navsafe280_release_20261021/audit8/112db94505025ec5.json /avl-west/navsafe280_release_20261021/posefix_cal/audit8/112db94505025ec5.json

          date -u +%FT%TZ > /avl-west/navsafe280_release_20261021/posefix_cal/aux/112db94505025ec5/ready

          echo POSEFIX_CLIP_READY 112db94505025ec5

          '
