    spec:
      restartPolicy: Never
      imagePullSecrets:
      - name: ngc-pull
      containers:
      - name: convert
        image: robinwangucsd/metabench:latest
        imagePullPolicy: IfNotPresent
        command:
        - bash
        - -c
        args:
        - 'set -euo pipefail

          mkdir -p /avl-west/navsafe280_release_20261021/posefix_rig/lidar_calib /avl-west/navsafe280_release_20261021/posefix_rig/audit8 /avl-west/navsafe280_release_20261021/posefix_rig/aux/0436604d25145231

          [ -s /avl-west/navsafe280_release_20261021/posefix_rig/lidar_calib/2021.09.09.17.18.51_veh-48_00889_01147.json ] || cp /avl-west/navsafe280_release_20261021/lidar_calib/2021.09.09.17.18.51_veh-48_00889_01147.json /avl-west/navsafe280_release_20261021/posefix_rig/lidar_calib/2021.09.09.17.18.51_veh-48_00889_01147.json

          bash /pipeline/convert.sh

          grep -q "NCORE_RIG_ROT=-1.87,-0.91" /avl-west/navsafe280_release_20261021/posefix_rig/prep/0436604d25145231/*/convert.log


          cp /avl-west/navsafe280_release_20261021/inputs/0436604d25145231/clips/0436604d25145231/0436604d25145231.aux.*.zarr.itar /avl-west/navsafe280_release_20261021/posefix_rig/inputs/0436604d25145231/clips/0436604d25145231/

          cp /avl-west/navsafe280_release_20261021/aux/0436604d25145231/aux.sha256 /avl-west/navsafe280_release_20261021/posefix_rig/aux/0436604d25145231/aux.sha256

          (cd /avl-west/navsafe280_release_20261021/posefix_rig/inputs/0436604d25145231/clips/0436604d25145231 && sha256sum -c --quiet /avl-west/navsafe280_release_20261021/posefix_rig/aux/0436604d25145231/aux.sha256)

          [ -s /avl-west/navsafe280_release_20261021/posefix_rig/audit8/0436604d25145231.json ] || cp /avl-west/navsafe280_release_20261021/audit8/0436604d25145231.json /avl-west/navsafe280_release_20261021/posefix_rig/audit8/0436604d25145231.json

          date -u +%FT%TZ > /avl-west/navsafe280_release_20261021/posefix_rig/aux/0436604d25145231/ready

          echo POSEFIX_CLIP_READY 0436604d25145231

          '
        env:
        - name: ROOT
          value: /avl-west/navsafe280_release_20261021/posefix_rig
        - name: C
          value: 0436604d25145231
        - name: LOG
          value: 2021.09.09.17.18.51_veh-48_00889_01147
        - name: T0
          value: '1631209156950224'
        - name: T1
          value: '1631209176950289'
        - name: NCORE_RIG_ROT
          value: -1.87,-0.91
        resources:
          requests:
            cpu: '3'
            memory: 28Gi
            ephemeral-storage: 60Gi
          limits:
            cpu: '3'
            memory: 33Gi
            ephemeral-storage: 60Gi
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: avl-west-vol
          mountPath: /avl-west
        - name: hugsim-storage
          mountPath: /hugsim-storage
        - name: pipeline
          mountPath: /pipeline
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 24Gi
      - name: avl-west-vol
        persistentVolumeClaim:
          claimName: avl-west-vol
      - name: hugsim-storage
        persistentVolumeClaim:
          claimName: horuan-hugsim-vol
      - name: pipeline
        configMap:
          name: navsafe280r-pilot-pose
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - ry-gpu-11.sdsc.optiputer.net
                - ry-gpu-12.sdsc.optiputer.net
                - ry-gpu-13.sdsc.optiputer.net
                - ry-gpu-14.sdsc.optiputer.net
      tolerations:
      - effect: NoSchedule
        key: nautilus.io/reservation
        operator: Equal
        value: cogrob
      - effect: NoSchedule
        key: nautilus.io/cogrob
        operator: Exists
