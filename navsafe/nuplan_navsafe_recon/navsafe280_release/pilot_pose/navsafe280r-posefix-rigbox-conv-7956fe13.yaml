          cp /avl-west/navsafe/navsafe280_release_20261021/inputs/7956fe13f69e53dc/clips/7956fe13f69e53dc/7956fe13f69e53dc.aux.*.zarr.itar /avl-west/navsafe/navsafe280_release_20261021/posefix_rigbox/inputs/7956fe13f69e53dc/clips/7956fe13f69e53dc/

          cp /avl-west/navsafe/navsafe280_release_20261021/aux/7956fe13f69e53dc/aux.sha256 /avl-west/navsafe/navsafe280_release_20261021/posefix_rigbox/aux/7956fe13f69e53dc/aux.sha256

          (cd /avl-west/navsafe/navsafe280_release_20261021/posefix_rigbox/inputs/7956fe13f69e53dc/clips/7956fe13f69e53dc && sha256sum -c --quiet /avl-west/navsafe/navsafe280_release_20261021/posefix_rigbox/aux/7956fe13f69e53dc/aux.sha256)

          [ -s /avl-west/navsafe/navsafe280_release_20261021/posefix_rigbox/audit8/7956fe13f69e53dc.json ] || cp /avl-west/navsafe/navsafe280_release_20261021/audit8/7956fe13f69e53dc.json /avl-west/navsafe/navsafe280_release_20261021/posefix_rigbox/audit8/7956fe13f69e53dc.json

          date -u +%FT%TZ > /avl-west/navsafe/navsafe280_release_20261021/posefix_rigbox/aux/7956fe13f69e53dc/ready

          echo POSEFIX_CLIP_READY 7956fe13f69e53dc

          '
        env:
        - name: ROOT
          value: /avl-west/navsafe/navsafe280_release_20261021/posefix_rigbox
        - name: C
          value: 7956fe13f69e53dc
        - name: LOG
          value: 2021.06.28.18.03.27_veh-14_00620_01581
        - name: T0
          value: '1624904964649712'
        - name: T1
          value: '1624904984649890'
        - name: NCORE_RIG_ROT
