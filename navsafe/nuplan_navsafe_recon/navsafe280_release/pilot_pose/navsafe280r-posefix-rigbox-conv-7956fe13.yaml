          [ -s /avl-west/navsafe/navsafe280_release_20261021/posefix_rigbox/lidar_calib/2021.06.28.18.03.27_veh-14_00620_01581.json ] || cp /avl-west/navsafe/navsafe280_release_20261021/lidar_calib/2021.06.28.18.03.27_veh-14_00620_01581.json /avl-west/navsafe/navsafe280_release_20261021/posefix_rigbox/lidar_calib/2021.06.28.18.03.27_veh-14_00620_01581.json

