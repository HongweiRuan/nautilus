          (cd /avl-west/navsafe280_release_20261021/posefix_cam/inputs/89e02236312d5038/clips/89e02236312d5038 && sha256sum -c --quiet /avl-west/navsafe280_release_20261021/posefix_cam/aux/89e02236312d5038/aux.sha256)

