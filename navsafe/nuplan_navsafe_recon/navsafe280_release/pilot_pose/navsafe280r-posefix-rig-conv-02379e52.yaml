          (cd /avl-west/navsafe280_release_20261021/posefix_rig/inputs/02379e524f105926/clips/02379e524f105926 && sha256sum -c --quiet /avl-west/navsafe280_release_20261021/posefix_rig/aux/02379e524f105926/aux.sha256)

          [ -s /avl-west/navsafe280_release_20261021/posefix_rig/audit8/02379e524f105926.json ] || cp /avl-west/navsafe280_release_20261021/audit8/02379e524f105926.json /avl-west/navsafe280_release_20261021/posefix_rig/audit8/02379e524f105926.json

          date -u +%FT%TZ > /avl-west/navsafe280_release_20261021/posefix_rig/aux/02379e524f105926/ready

          echo POSEFIX_CLIP_READY 02379e524f105926

          '
        env:
        - name: ROOT
          value: /avl-west/navsafe280_release_20261021/posefix_rig
        - name: C
          value: 02379e524f105926
        - name: LOG
          value: 2021.09.16.14.39.34_veh-42_01111_01448
        - name: T0
          value: '1631804481149895'
        - name: T1
          value: '1631804501150002'
        - name: NCORE_RIG_ROT
          value: -0.09,0.52
        resources:
          requests:
            cpu: '3'
            memory: 28Gi
            ephemeral-storage: 60Gi
          limits:
            cpu: '3'
            memory: 33Gi
            ephemeral-storage: 60Gi
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: avl-west-vol
