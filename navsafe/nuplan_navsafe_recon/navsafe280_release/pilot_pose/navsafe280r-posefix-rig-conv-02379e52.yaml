          bash /pipeline/convert.sh

          grep -q "NCORE_RIG_ROT=-0.09,0.52" /avl-west/navsafe280_release_20261021/posefix_rig/prep/02379e524f105926/*/convert.log


          cp /avl-west/navsafe280_release_20261021/inputs/02379e524f105926/clips/02379e524f105926/02379e524f105926.aux.*.zarr.itar /avl-west/navsafe280_release_20261021/posefix_rig/inputs/02379e524f105926/clips/02379e524f105926/

