apiVersion: batch/v1
kind: Job
metadata:
  name: navsafe280r-posefix-rig-conv-0f622aef
  namespace: cogrob
  labels: &id001
    app: navsafe280-release-pilot
    stage: convert
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  activeDeadlineSeconds: 86400
  template:
    metadata:
      labels: *id001
    spec:
      restartPolicy: Never
      imagePullSecrets:
      - name: ngc-pull
      containers:
      - name: convert
        image: robinwangucsd/metabench:latest
        imagePullPolicy: IfNotPresent
        command:
        - bash
        - -c
        args:
        - 'set -euo pipefail

          mkdir -p /avl-west/navsafe280_release_20261021/posefix_rig/lidar_calib /avl-west/navsafe280_release_20261021/posefix_rig/audit8 /avl-west/navsafe280_release_20261021/posefix_rig/aux/0f622aef14545f59

          [ -s /avl-west/navsafe280_release_20261021/posefix_rig/lidar_calib/2021.06.28.20.24.43_veh-38_03385_04952.json ] || cp /avl-west/navsafe280_release_20261021/lidar_calib/2021.06.28.20.24.43_veh-38_03385_04952.json /avl-west/navsafe280_release_20261021/posefix_rig/lidar_calib/2021.06.28.20.24.43_veh-38_03385_04952.json

          bash /pipeline/convert.sh

          grep -q "NCORE_RIG_ROT=-0.30,0.08" /avl-west/navsafe280_release_20261021/posefix_rig/prep/0f622aef14545f59/*/convert.log


          cp /avl-west/navsafe280_release_20261021/inputs/0f622aef14545f59/clips/0f622aef14545f59/0f622aef14545f59.aux.*.zarr.itar /avl-west/navsafe280_release_20261021/posefix_rig/inputs/0f622aef14545f59/clips/0f622aef14545f59/

          cp /avl-west/navsafe280_release_20261021/aux/0f622aef14545f59/aux.sha256 /avl-west/navsafe280_release_20261021/posefix_rig/aux/0f622aef14545f59/aux.sha256

          (cd /avl-west/navsafe280_release_20261021/posefix_rig/inputs/0f622aef14545f59/clips/0f622aef14545f59 && sha256sum -c --quiet /avl-west/navsafe280_release_20261021/posefix_rig/aux/0f622aef14545f59/aux.sha256)

          [ -s /avl-west/navsafe280_release_20261021/posefix_rig/audit8/0f622aef14545f59.json ] || cp /avl-west/navsafe280_release_20261021/audit8/0f622aef14545f59.json /avl-west/navsafe280_release_20261021/posefix_rig/audit8/0f622aef14545f59.json

          date -u +%FT%TZ > /avl-west/navsafe280_release_20261021/posefix_rig/aux/0f622aef14545f59/ready

          echo POSEFIX_CLIP_READY 0f622aef14545f59

          '
        env:
        - name: ROOT
          value: /avl-west/navsafe280_release_20261021/posefix_rig
        - name: C
          value: 0f622aef14545f59
        - name: LOG
          value: 2021.06.28.20.24.43_veh-38_03385_04952
        - name: T0
          value: '1624915404549682'
        - name: T1
          value: '1624915424649497'
        - name: NCORE_RIG_ROT
          value: -0.30,0.08
        resources:
          requests:
            cpu: '3'
            memory: 28Gi
            ephemeral-storage: 60Gi
          limits:
            cpu: '3'
            memory: 33Gi
            ephemeral-storage: 60Gi
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: avl-west-vol
          mountPath: /avl-west
        - name: hugsim-storage
          mountPath: /hugsim-storage
        - name: pipeline
          mountPath: /pipeline
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 24Gi
      - name: avl-west-vol
        persistentVolumeClaim:
          claimName: avl-west-vol
      - name: hugsim-storage
        persistentVolumeClaim:
          claimName: horuan-hugsim-vol
      - name: pipeline
        configMap:
          name: navsafe280r-pilot-pose
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - ry-gpu-11.sdsc.optiputer.net
                - ry-gpu-12.sdsc.optiputer.net
                - ry-gpu-13.sdsc.optiputer.net
                - ry-gpu-14.sdsc.optiputer.net
      tolerations:
      - effect: NoSchedule
        key: nautilus.io/reservation
        operator: Equal
        value: cogrob
      - effect: NoSchedule
        key: nautilus.io/cogrob
        operator: Exists
