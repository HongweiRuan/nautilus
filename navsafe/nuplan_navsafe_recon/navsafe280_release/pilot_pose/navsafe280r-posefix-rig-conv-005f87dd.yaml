apiVersion: batch/v1
kind: Job
metadata:
  name: navsafe280r-posefix-rig-conv-005f87dd
  namespace: cogrob
  labels: &id001
    app: navsafe280-release-pilot
    stage: convert
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  activeDeadlineSeconds: 86400
  template:
    metadata:
      labels: *id001
    spec:
      restartPolicy: Never
      imagePullSecrets:
      - name: ngc-pull
      containers:
      - name: convert
        image: robinwangucsd/metabench:latest
        imagePullPolicy: IfNotPresent
        command:
        - bash
        - -c
        args:
        - 'set -euo pipefail

          mkdir -p /avl-west/navsafe280_release_20261021/posefix_rig/lidar_calib /avl-west/navsafe280_release_20261021/posefix_rig/audit8 /avl-west/navsafe280_release_20261021/posefix_rig/aux/005f87dd980253a5

          [ -s /avl-west/navsafe280_release_20261021/posefix_rig/lidar_calib/2021.09.16.16.20.27_veh-08_02435_02525.json ] || cp /avl-west/navsafe280_release_20261021/lidar_calib/2021.09.16.16.20.27_veh-08_02435_02525.json /avl-west/navsafe280_release_20261021/posefix_rig/lidar_calib/2021.09.16.16.20.27_veh-08_02435_02525.json

          bash /pipeline/convert.sh

          grep -q "NCORE_RIG_ROT=0.56,0.22" /avl-west/navsafe280_release_20261021/posefix_rig/prep/005f87dd980253a5/*/convert.log


          cp /avl-west/navsafe280_release_20261021/inputs/005f87dd980253a5/clips/005f87dd980253a5/005f87dd980253a5.aux.*.zarr.itar /avl-west/navsafe280_release_20261021/posefix_rig/inputs/005f87dd980253a5/clips/005f87dd980253a5/

          cp /avl-west/navsafe280_release_20261021/aux/005f87dd980253a5/aux.sha256 /avl-west/navsafe280_release_20261021/posefix_rig/aux/005f87dd980253a5/aux.sha256

          (cd /avl-west/navsafe280_release_20261021/posefix_rig/inputs/005f87dd980253a5/clips/005f87dd980253a5 && sha256sum -c --quiet /avl-west/navsafe280_release_20261021/posefix_rig/aux/005f87dd980253a5/aux.sha256)

          [ -s /avl-west/navsafe280_release_20261021/posefix_rig/audit8/005f87dd980253a5.json ] || cp /avl-west/navsafe280_release_20261021/audit8/005f87dd980253a5.json /avl-west/navsafe280_release_20261021/posefix_rig/audit8/005f87dd980253a5.json

          date -u +%FT%TZ > /avl-west/navsafe280_release_20261021/posefix_rig/aux/005f87dd980253a5/ready

          echo POSEFIX_CLIP_READY 005f87dd980253a5

          '
        env:
        - name: ROOT
          value: /avl-west/navsafe280_release_20261021/posefix_rig
        - name: C
          value: 005f87dd980253a5
        - name: LOG
          value: 2021.09.16.16.20.27_veh-08_02435_02525
        - name: T0
          value: '1631811843149648'
        - name: T1
          value: '1631811863249515'
        - name: NCORE_RIG_ROT
          value: 0.56,0.22
        resources:
          requests:
            cpu: '3'
            memory: 28Gi
            ephemeral-storage: 60Gi
          limits:
            cpu: '3'
            memory: 33Gi
            ephemeral-storage: 60Gi
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: avl-west-vol
          mountPath: /avl-west
        - name: hugsim-storage
          mountPath: /hugsim-storage
        - name: pipeline
          mountPath: /pipeline
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 24Gi
      - name: avl-west-vol
        persistentVolumeClaim:
          claimName: avl-west-vol
      - name: hugsim-storage
        persistentVolumeClaim:
          claimName: horuan-hugsim-vol
      - name: pipeline
        configMap:
          name: navsafe280r-pilot-pose
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - ry-gpu-11.sdsc.optiputer.net
                - ry-gpu-12.sdsc.optiputer.net
                - ry-gpu-13.sdsc.optiputer.net
                - ry-gpu-14.sdsc.optiputer.net
      tolerations:
      - effect: NoSchedule
        key: nautilus.io/reservation
        operator: Equal
        value: cogrob
      - effect: NoSchedule
        key: nautilus.io/cogrob
        operator: Exists
