        command:
        - /opt/nvidia/nvidia_entrypoint.sh
        - bash
        - -c
        args:
        - "set -uo pipefail\nROOT=/avl-west/navsafe/colmap280\nmkdir -p $ROOT/_claims\ntrap 'touch /work/EXPORT_DONE' EXIT\nRF=/app/internal/scripts/pycena/runtime/pycena_nrm_full.runfiles/_main\nexport PYTHONPATH=\"$RF\"\nPY=\"$RF/internal/scripts/pycena/runtime/pycena_run_venv_deps.venv/bin/python\"\nexport_one() {\n  t=$1; OUT=$ROOT/$t; W=/work/$t\n  mkdir -p \"$OUT/$HOSTNAME\" $W/ncore $W/colmap\n  if (set -e\n      cp -a /avl-west/navsafe/navsafe280_release_20261021/inputs/$t/clips/$t/. $W/ncore/\n      cd $W/ncore; for f in \"$t\".aux.*.zarr.itar; do ln -s \"$f\" \"pai_$f\"; done\n      COLMAP_MANIFEST=$W/ncore/pai_$t.json COLMAP_AUDIT=/avl-west/navsafe/navsafe280_release_20261021/audit8/$t.json COLMAP_WORK=$W/colmap \"$PY\" /pipeline/colmap_export.py\n      rm -rf $W/ncore\n      cp $W/colmap/priors.json $W/colmap/pairs.txt \"$OUT/\") > \"$OUT/$HOSTNAME/export.log\" 2>&1; then\n    touch $W/exported; echo \"$(date -u +%FT%TZ) exported $t\"\n  else\n    echo \"export failed on $HOSTNAME\
          \ $(date -u +%FT%TZ)\" > \"$OUT/FAILED\"; rm -rf $W; echo \"$(date -u +%FT%TZ) EXPORT_FAILED $t\"\n  fi\n}\nbacklog() { n=0; for f in /work/*/exported; do [ -e \"$f\" ] && [ ! -e \"$(dirname $f)/taken\" ] && n=$((n+1)); done; echo $n; }\nlane() {\n  while true; do\n    while [ \"$(backlog)\" -ge 3 ]; do sleep 30; done\n    t=\"\"\n    for c in $TOKENS; do\n      [ -s \"$ROOT/$c/pose_delta.json\" ] && continue\n      if mkdir \"$ROOT/_claims/$c\" 2>/dev/null; then echo \"$HOSTNAME $(date -u +%FT%TZ)\" > \"$ROOT/_claims/$c/host\"; t=$c; break; fi\n    done\n    [ -z \"$t\" ] && return 0\n    export_one $t\n  done\n}\nlane & sleep 5; lane &\nwait\necho EXPORT_LANES_DONE\n"
