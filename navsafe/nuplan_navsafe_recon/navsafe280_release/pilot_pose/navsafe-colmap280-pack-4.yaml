        resources:
          requests:
            cpu: '6'
            memory: 28Gi
            ephemeral-storage: 40Gi
          limits:
            cpu: '6'
            memory: 28Gi
            ephemeral-storage: 40Gi
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: avl-west-vol
          mountPath: /avl-west
        - name: hugsim-storage
          mountPath: /hugsim-storage
        - name: pipeline
          mountPath: /pipeline
        - name: work
          mountPath: /work
      - name: colmap
        image: colmap/colmap:20260929.8466
        imagePullPolicy: IfNotPresent
        command:
        - /bin/bash
        - -c
        args:
        - "set -uo pipefail\nROOT=/avl-west/navsafe/colmap280\nexport DEBIAN_FRONTEND=noninteractive QT_QPA_PLATFORM=offscreen\napt-get update -qq && apt-get install -y -qq python3 python3-numpy >/dev/null || exit 1\ncolmap version 2>&1 | head -3 || true\nEX=$(colmap feature_extractor -h 2>&1 | grep -o -- '--[A-Za-z]*\\.use_gpu' | head -1)\nMA=$(colmap matches_importer -h 2>&1 | grep -o -- '--[A-Za-z]*\\.use_gpu' | head -1)\nEXT=$(colmap feature_extractor -h 2>&1 | grep -o -- '--[A-Za-z]*\\.num_threads' | head -1)\nMAT=$(colmap matches_importer -h 2>&1 | grep -o -- '--[A-Za-z]*\\.num_threads' | head -1)\necho \"gpu switches: $EX $MA, thread switches: $EXT $MAT\"\ntest -n \"$EXT\" && test -n \"$MAT\" || exit 1\nN=7\nrun_one() { (set -euo pipefail\n  t=$1; OUT=$ROOT/$t; W=/work/$t/colmap\n  date -u +%FT%TZ\n  colmap feature_extractor --database_path $W/database.db --image_path $W/images --image_list_path $W/image_list.txt \\\n    --ImageReader.mask_path $W/masks --ImageReader.camera_model\
          \ FULL_OPENCV --ImageReader.single_camera_per_folder 1 \\\n    $EX 0 $EXT $N --SiftExtraction.max_num_features 6000 --FeatureExtraction.max_image_size 1920\n  date -u +%FT%TZ\n  colmap matches_importer --database_path $W/database.db --match_list_path $W/pairs.txt --match_type pairs $MA 0 $MAT $N\n  date -u +%FT%TZ\n  python3 /pipeline/colmap_model.py make $W\n  IN=$W/sparse/prior\n  for round in 1 2; do\n    mkdir -p $W/sparse/tri$round $W/sparse/ba$round\n    colmap point_triangulator --database_path $W/database.db --image_path $W/images --input_path $IN --output_path $W/sparse/tri$round --clear_points 1\n    colmap bundle_adjuster --input_path $W/sparse/tri$round --output_path $W/sparse/ba$round \\\n      --BundleAdjustment.refine_focal_length 0 --BundleAdjustment.refine_principal_point 0 --BundleAdjustment.refine_extra_params 0 --BundleAdjustment.refine_rig_from_world 1 --BundleAdjustment.refine_sensor_from_rig 0\n    colmap model_analyzer --path $W/sparse/ba$round 2>&1 | tail\
          \ -12 || true\n    IN=$W/sparse/ba$round\n  done\n  date -u +%FT%TZ\n  mkdir -p $W/sparse/txt\n  colmap model_converter --input_path $W/sparse/ba2 --output_path $W/sparse/txt --output_type TXT\n  tar -C $W/sparse -czf \"$OUT/sparse_txt.tgz.partial\" txt && mv \"$OUT/sparse_txt.tgz.partial\" \"$OUT/sparse_txt.tgz\"\n  python3 /pipeline/colmap_model.py extract $W $W/sparse/txt /work/$t/pose_delta.json\n  cp /work/$t/pose_delta.json \"$OUT/pose_delta.json.partial\" && mv \"$OUT/pose_delta.json.partial\" \"$OUT/pose_delta.json\"\n  date -u +%FT%TZ > \"$OUT/ready\"\n  echo COLMAP_POSE_DONE) > \"$ROOT/$1/$HOSTNAME/colmap.log\" 2>&1\n}\ntake() { for f in /work/*/exported; do [ -e \"$f\" ] || continue; d=$(dirname $f); mkdir $d/taken 2>/dev/null && { basename $d; return; }; done; }\nlane() {\n  while true; do\n    t=$(take)\n    if [ -z \"$t\" ]; then\n      if [ -e /work/EXPORT_DONE ]; then t=$(take); [ -z \"$t\" ] && return 0; else sleep 20; continue; fi\n    fi\n    echo \"$(date -u\
          \ +%FT%TZ) lane $1 start $t\"\n    if run_one $t; then echo \"$(date -u +%FT%TZ) lane $1 done $t\"\n    else echo \"colmap failed on $HOSTNAME $(date -u +%FT%TZ)\" > \"$ROOT/$t/FAILED\"; echo \"$(date -u +%FT%TZ) lane $1 COLMAP_FAILED $t\"; fi\n    rm -rf /work/$t/colmap\n  done\n}\nfor k in $(seq 1 6); do lane $k & done\nwait\necho PACK_DONE\n"
