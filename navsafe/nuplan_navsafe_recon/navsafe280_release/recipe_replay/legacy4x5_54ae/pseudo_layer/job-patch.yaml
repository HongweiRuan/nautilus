apiVersion: batch/v1
kind: Job
metadata:
  name: navsafe280r-pseudolayer-patch
  namespace: cogrob
  labels:
    app: navsafe280r-pseudolayer-patch
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app: navsafe280r-pseudolayer-patch
    spec:
      restartPolicy: Never
      tolerations:
      - effect: NoSchedule
        key: nautilus.io/reservation
        operator: Equal
        value: cogrob
      - effect: NoSchedule
        key: nautilus.io/cogrob
        operator: Exists
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - ry-gpu-13.sdsc.optiputer.net
                - ry-gpu-14.sdsc.optiputer.net
                - ry-gpu-11.sdsc.optiputer.net
                - ry-gpu-12.sdsc.optiputer.net
      containers:
      - name: patch
        image: python:3.11-slim
        command:
        - bash
        - /cfg/run_patch.sh
        resources:
          requests:
            cpu: '2'
            memory: 12Gi
            ephemeral-storage: 12Gi
          limits:
            cpu: 2400m
            memory: 14Gi
            ephemeral-storage: 12Gi
        volumeMounts:
        - name: avl-west
          mountPath: /avl-west
        - name: cfg
          mountPath: /cfg
      volumes:
      - name: avl-west
        persistentVolumeClaim:
          claimName: avl-west-vol
      - name: cfg
        configMap:
          name: navsafe280r-pseudolayer-patch
