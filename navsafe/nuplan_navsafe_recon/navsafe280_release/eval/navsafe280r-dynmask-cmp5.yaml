apiVersion: batch/v1
kind: Job
metadata:
  name: navsafe280r-dynmask-cmp5
  namespace: cogrob
  labels: &id001
    app: navsafe280-release-eval
    stage: eval
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  activeDeadlineSeconds: 7200
  template:
    metadata:
      labels: *id001
    spec:
      restartPolicy: Never
      imagePullSecrets:
      - name: ngc-pull
      containers:
      - name: dynmask
        image: nvcr.io/nvidia/nre/nre-ga@sha256:6e0caa70a9148490552520c3dde9ee665c8d094ca10b814601cb8bb306567c90
        imagePullPolicy: IfNotPresent
        command:
        - /opt/nvidia/nvidia_entrypoint.sh
        - bash
        - -c
        args:
        - 'set -e

          TOKEN=89e02236312d5038 NCORE=/avl-west/navsafe/navsafe280_release_20261021/inputs/89e02236312d5038/clips/89e02236312d5038/pai_89e02236312d5038.json OUT=/avl-west/navsafe/navsafe280_release_20261021/eval/cmp5/89e02236312d5038 FRAMES=0-198 /app/run run-script /pipeline/dyn_masks.py

          TOKEN=00185dab0ba153b9 NCORE=/avl-west/navsafe/navsafe280_release_20261021/inputs/00185dab0ba153b9/clips/00185dab0ba153b9/pai_00185dab0ba153b9.json OUT=/avl-west/navsafe/navsafe280_release_20261021/eval/cmp5/00185dab0ba153b9 FRAMES=0-199 /app/run run-script /pipeline/dyn_masks.py

          TOKEN=112db94505025ec5 NCORE=/avl-west/navsafe/navsafe280_release_20261021/inputs/112db94505025ec5/clips/112db94505025ec5/pai_112db94505025ec5.json OUT=/avl-west/navsafe/navsafe280_release_20261021/eval/cmp5/112db94505025ec5 FRAMES=0-199 /app/run run-script /pipeline/dyn_masks.py

          TOKEN=7c00774138ae5805 NCORE=/avl-west/navsafe/navsafe280_release_20261021/inputs/7c00774138ae5805/clips/7c00774138ae5805/pai_7c00774138ae5805.json OUT=/avl-west/navsafe/navsafe280_release_20261021/eval/cmp5/7c00774138ae5805 FRAMES=0-199 /app/run run-script /pipeline/dyn_masks.py

          TOKEN=07c5114fdb395f8b NCORE=/avl-west/navsafe/navsafe280_release_20261021/inputs/07c5114fdb395f8b/clips/07c5114fdb395f8b/pai_07c5114fdb395f8b.json OUT=/avl-west/navsafe/navsafe280_release_20261021/eval/cmp5/07c5114fdb395f8b FRAMES=0-199 /app/run run-script /pipeline/dyn_masks.py

          '
        env:
        - name: NGC_API_KEY
          valueFrom:
            secretKeyRef:
              name: ngc-api-key
              key: NGC_API_KEY
        - name: HYDRA_FULL_ERROR
          value: '1'
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: expandable_segments:True
        resources:
          requests:
            cpu: '2'
            memory: 12Gi
            ephemeral-storage: 10Gi
            nvidia.com/gpu: '1'
          limits:
            cpu: 2400m
            memory: 14Gi
            ephemeral-storage: 10Gi
            nvidia.com/gpu: '1'
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: avl-west-vol
          mountPath: /avl-west
        - name: hugsim-storage
          mountPath: /hugsim-storage
        - name: pipeline
          mountPath: /pipeline
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 24Gi
      - name: avl-west-vol
        persistentVolumeClaim:
          claimName: avl-west-vol
      - name: hugsim-storage
        persistentVolumeClaim:
          claimName: horuan-hugsim-vol
      - name: pipeline
        configMap:
          name: navsafe280r-window
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - ry-gpu-11.sdsc.optiputer.net
      tolerations:
      - effect: NoSchedule
        key: nautilus.io/reservation
        operator: Equal
        value: cogrob
      - effect: NoSchedule
        key: nautilus.io/cogrob
        operator: Exists
