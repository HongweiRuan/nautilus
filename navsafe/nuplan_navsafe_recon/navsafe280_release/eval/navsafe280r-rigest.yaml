apiVersion: batch/v1
kind: Job
metadata:
  name: navsafe280r-rigest
  namespace: cogrob
  labels: &id001
    app: navsafe280-release-eval
    stage: eval
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  activeDeadlineSeconds: 43200
  template:
    metadata:
      labels: *id001
    spec:
      restartPolicy: Never
      imagePullSecrets:
      - name: ngc-pull
      containers:
      - name: rigest
        image: robinwangucsd/metabench:latest
        imagePullPolicy: IfNotPresent
        command:
        - bash
        - -c
        args:
        - 'set -euo pipefail

          mkdir -p /avl-west/navsafe280_release_20261021/eval/rig_estimate /tmp/rig && cp /pipeline/*.py /tmp/rig/

          /avl-west/drivearena_bench/envs/ue/bin/python /tmp/rig/rig_estimate_all.py /pipeline/scenes.tsv /avl-west/navsafe280_release_20261021/eval/rig_estimate/rig_estimate.tsv 10 2>&1 | grep -v -i warn

          '
        env: []
        resources:
          requests:
            cpu: '10'
            memory: 20Gi
            ephemeral-storage: 10Gi
          limits:
            cpu: '10'
            memory: 24Gi
            ephemeral-storage: 10Gi
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: avl-west-vol
          mountPath: /avl-west
        - name: hugsim-storage
          mountPath: /hugsim-storage
        - name: pipeline
          mountPath: /pipeline
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 24Gi
      - name: avl-west-vol
        persistentVolumeClaim:
          claimName: avl-west-vol
      - name: hugsim-storage
        persistentVolumeClaim:
          claimName: horuan-hugsim-vol
      - name: pipeline
        configMap:
          name: navsafe280r-rigest
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - ry-gpu-11.sdsc.optiputer.net
                - ry-gpu-12.sdsc.optiputer.net
                - ry-gpu-13.sdsc.optiputer.net
                - ry-gpu-14.sdsc.optiputer.net
      tolerations:
      - effect: NoSchedule
        key: nautilus.io/reservation
        operator: Equal
        value: cogrob
      - effect: NoSchedule
        key: nautilus.io/cogrob
        operator: Exists
