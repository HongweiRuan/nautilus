apiVersion: batch/v1
kind: Job
metadata:
  name: navsafe280r-eval-render-1
  namespace: cogrob
  labels: &id001
    app: navsafe280-release-eval
    stage: eval
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  activeDeadlineSeconds: 21600
  template:
    metadata:
      labels: *id001
    spec:
      restartPolicy: Never
      imagePullSecrets:
      - name: ngc-pull
      containers:
