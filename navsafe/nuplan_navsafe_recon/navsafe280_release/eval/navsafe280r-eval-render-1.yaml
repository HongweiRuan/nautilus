          [ -s /avl-west/navsafe280_release_20261021/eval/legacy_vs_best/36517f1223735d6a/RENDER_COMPLETE ] || TOKEN=36517f1223735d6a NEW_ART=/avl-west/navsafe280_release_20261021/train/best/36517f1223735d6a/artifacts/last.usdz LEGACY_DIR=/avl-west/navsafe_eval/full_test/36517f1223735d6a NCORE=/avl-west/navsafe280_release_20261021/inputs/36517f1223735d6a/clips/36517f1223735d6a/pai_36517f1223735d6a.json OUT=/avl-west/navsafe280_release_20261021/eval/legacy_vs_best/36517f1223735d6a /app/run run-script /pipeline/render_legacy_vs_best.py || FAILED="$FAILED 36517f1223735d6a"

          [ -s /avl-west/navsafe280_release_20261021/eval/legacy_vs_best/0371700bf65b51e0/RENDER_COMPLETE ] || TOKEN=0371700bf65b51e0 NEW_ART=/avl-west/navsafe280_release_20261021/train/best/0371700bf65b51e0/artifacts/last.usdz LEGACY_DIR=/avl-west/navsafe_eval/full_test/0371700bf65b51e0 NCORE=/avl-west/navsafe280_release_20261021/inputs/0371700bf65b51e0/clips/0371700bf65b51e0/pai_0371700bf65b51e0.json OUT=/avl-west/navsafe280_release_20261021/eval/legacy_vs_best/0371700bf65b51e0 /app/run run-script /pipeline/render_legacy_vs_best.py || FAILED="$FAILED 0371700bf65b51e0"

          [ -s /avl-west/navsafe280_release_20261021/eval/legacy_vs_best/398326681cd7500a/RENDER_COMPLETE ] || TOKEN=398326681cd7500a NEW_ART=/avl-west/navsafe280_release_20261021/train/best/398326681cd7500a/artifacts/last.usdz LEGACY_DIR=/avl-west/navsafe_eval/full_test/398326681cd7500a NCORE=/avl-west/navsafe280_release_20261021/inputs/398326681cd7500a/clips/398326681cd7500a/pai_398326681cd7500a.json OUT=/avl-west/navsafe280_release_20261021/eval/legacy_vs_best/398326681cd7500a /app/run run-script /pipeline/render_legacy_vs_best.py || FAILED="$FAILED 398326681cd7500a"

