# STAGE 1 (ncore): native-10Hz nuPlan -> NCore V4 store, for a SHARD of clips.
# One job walks a list of clips instead of a single one, so the venv + pip install
# (~4 min) and the local nuPlan DB cache are paid ONCE per shard instead of per clip.
# CPU job. Out per clip: /avl-west/navsafe_5s_500/<C>/clips/<C>/pai_<C>.json
#                        (+ shards + nurec_origin_offset.json sidecar for the eval anchor)
# Placeholders: SHARD-NAME + a manifest block   (manifest lines: "<clip> <log> <t0> <t1>")
apiVersion: batch/v1
kind: Job
metadata: { name: nav500-ncore-sh006-0830221200, namespace: cogrob, labels: { app: navsafe_5s_500, stage: ncore, shard: "sh006-0830221200" } }
spec:
  backoffLimit: 1          # a retry is cheap: finished clips are skipped
  ttlSecondsAfterFinished: 7200      # 2h: finished jobs must release the namespace quota
  template:
    metadata: { labels: { app: navsafe_5s_500, stage: ncore, shard: "sh006-0830221200" } }
    spec:
      restartPolicy: Never
      containers:
        - name: ncore
          image: robinwangucsd/metabench:latest
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c"]
          args:
            - |
              set -uo pipefail
              cat > /tmp/shard.txt <<'MANIFEST_EOF'
              029585f0509d52b0s3 2021.09.16.19.49.00_veh-42_00990_01609 1631823443999902 1631823448999902
              MANIFEST_EOF
              N=$(grep -c . /tmp/shard.txt)
              echo "[ncore sh006-0830221200] $N clip(s)"
              # ---- one-time setup for the whole shard ----
              VENV=/root/cv; python3 -m venv "$VENV"; "$VENV/bin/pip" install -q --upgrade pip
              cp -a /hugsim-storage/py123d /root/py123d && rm -rf /root/py123d/build /root/py123d/*.egg-info
              "$VENV/bin/pip" install -q nuplan-devkit nvidia-ncore "/root/py123d[nuplan]" || exit 1
              DBDIR=/tmp/nuplan_local/nuplan-v1.1/splits/test; mkdir -p "$DBDIR"
              cat > /tmp/run_one.py <<'PY'
              import sys
              from pathlib import Path
              sys.path.insert(0, "/hugsim-storage/NexusSim")
              from nexussim.gs3d_converter.log_ingestion import NuplanLogReader
              from nexussim.gs3d_converter.ncore_bridge import NCoreBridge
              tok, log, t0, t1 = sys.argv[1], sys.argv[2], int(sys.argv[3]), int(sys.argv[4])
              reader = NuplanLogReader(
                  nuplan_data_root="/tmp/nuplan_local",
                  sensor_root="/avl-west/nuplan/nuplan-v1.1/sensor_blobs",
                  maps_root="/avl-west/nuplan/maps",
                  scenes=[(log, tok, t0, t1)], split="nuplan_test")
              scene = next(iter(reader.iter_scenes()))
              print(f"[{tok}] frames={scene.n_frames}", flush=True)
              cd = NCoreBridge.prepare(scene, Path("/avl-west/navsafe_5s_500")/tok)
              print(f"[{tok}] NCore OK -> {cd}", flush=True)
              PY
              # ---- per-clip loop ----
              ok=0; skip=0; fail=0; failed=""
              while read -r C LOG T0 T1; do
                [ -z "${C:-}" ] && continue
                OUT=/avl-west/navsafe_5s_500/$C
                if [ -s "$OUT/clips/$C/pai_$C.json" ]; then
                  echo "[skip] $C"; skip=$((skip+1)); continue
                fi
                cp -n /avl-west/nuplan/nuplan-v1.1/splits/*/$LOG.db "$DBDIR/" 2>/dev/null || true
                echo "--- $C ($LOG $T0 $T1) ---"
                if PYTHONPATH=/hugsim-storage/NexusSim NCORE_REREF_FRAME0=1 \
                     "$VENV/bin/python" /tmp/run_one.py "$C" "$LOG" "$T0" "$T1" \
                   && [ -s "$OUT/clips/$C/pai_$C.json" ] && [ -s "$OUT/clips/$C/nurec_origin_offset.json" ]; then
                  echo "NCORE_DONE $C"; ok=$((ok+1))
                else
                  echo "NCORE_FAIL $C"; fail=$((fail+1)); failed="$failed $C"
                fi
              done < /tmp/shard.txt
              echo "SHARD_DONE sh006-0830221200 ok=$ok skip=$skip fail=$fail"
              [ "$fail" -eq 0 ] || { echo "failed:$failed"; exit 1; }
          resources:
            requests: { cpu: "6", memory: "24Gi", ephemeral-storage: 60Gi }
            limits:   { cpu: "8", memory: "32Gi", ephemeral-storage: 60Gi }
          volumeMounts:
            - { name: avl-west-vol, mountPath: /avl-west }
            - { name: hugsim-storage, mountPath: /hugsim-storage }
      volumes:
        - { name: avl-west-vol, persistentVolumeClaim: { claimName: avl-west-vol } }
        - { name: hugsim-storage, persistentVolumeClaim: { claimName: horuan-hugsim-vol } }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: nvidia.com/gpu.product, operator: In, values: ["NVIDIA-GeForce-RTX-3090"] }
                  - { key: kubernetes.io/hostname, operator: NotIn, values: ["ry-gpu-02.sdsc.optiputer.net"] }
      tolerations:
        - { effect: NoSchedule, key: nautilus.io/reservation, operator: Equal, value: cogrob }
        - { effect: NoSchedule, key: nautilus.io/cogrob, operator: Exists }
