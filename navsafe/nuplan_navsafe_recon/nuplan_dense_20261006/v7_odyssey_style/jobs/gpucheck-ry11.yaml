apiVersion: batch/v1
kind: Job
metadata: {name: horuan-gpucheck-ry11, namespace: cogrob}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  activeDeadlineSeconds: 900
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets: [{name: ngc-pull}]
      containers:
      - name: check
        image: nvcr.io/nvidia/nre/nre-ga@sha256:6e0caa70a9148490552520c3dde9ee665c8d094ca10b814601cb8bb306567c90
        command: ["/opt/nvidia/nvidia_entrypoint.sh", "bash", "-c"]
        args:
        - |
          nvidia-smi --query-gpu=index,name,temperature.gpu,memory.used,utilization.gpu --format=csv
          /app/internal/scripts/pycena/runtime/pycena_nrm_full.runfiles/_main/internal/scripts/pycena/runtime/pycena_run_venv_deps.venv/bin/python -c "
          import torch,time
          x=torch.randn(8000,8000,device='cuda')
          t=time.time()
          for i in range(200): y=x@x
          torch.cuda.synchronize(); print('CUDA_OK', round(time.time()-t,1),'s', torch.cuda.get_device_name(0))"
        resources:
          requests: {cpu: "1", memory: 4Gi, nvidia.com/gpu: "1"}
          limits: {cpu: "1", memory: 4Gi, nvidia.com/gpu: "1"}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - {key: kubernetes.io/hostname, operator: In, values: [ry-gpu-11.sdsc.optiputer.net]}
      tolerations:
      - {key: nautilus.io/reservation, operator: Equal, value: cogrob, effect: NoSchedule}
      - {key: nautilus.io/cogrob, operator: Exists, effect: NoSchedule}
