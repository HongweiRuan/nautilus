      initContainers:
      - name: wait-inputs
        image: nvcr.io/nvidia/nre/nre-ga@sha256:6e0caa70a9148490552520c3dde9ee665c8d094ca10b814601cb8bb306567c90
        command:
        - bash
        - -c
        args:
        - |
          set -euo pipefail
          ROOT=/avl-west/navsafe_nuplan_dense_20261006
          C=e3e0b3d6d5ae52a1
          echo WAITING_FOR_AUDITED_20S_INPUT_AND_GPU_VALIDATION "$C"
          for i in $(seq 1 5760); do
            if test -s "$ROOT/aux/$C/ready" && test -s "$ROOT/audits_20s/$C/ready" && test -s "$ROOT/eval/legacy-smoke/c895b062e3735053s1/EVAL_COMPLETE" && test -s "$ROOT/train/v1/c895b062e3735053/SMOKE_COMPLETE" && test -s "$ROOT/train/v2/c895b062e3735053/SMOKE_COMPLETE"; then echo DEPENDENCIES_READY "$C"; exit 0; fi
            sleep 30
          done
          echo INPUT_DEPENDENCY_TIMEOUT >&2
          exit 1
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 100m
            memory: 128Mi
        volumeMounts:
        - name: avl-west-vol
          mountPath: /avl-west
