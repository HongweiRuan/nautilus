          NRE_ARGS
          cat > /scratch/build_audit8.py <<'AUDIT8_PY'
          """Capture-clock table and lens parameters for ALL cameras of a converted nuPlan clip.

          Codex's audit covers the five cameras of the legacy recipe. This does the same for every camera in the clip: each
          stored frame is matched byte for byte to an image of the log database, and the database timestamp of that image is
          the capture time. Output has the two keys nuplan_training_optimizations.py reads: "clock" and "lens".

          usage (inside the NRE image): AUDIT8_MANIFEST=... AUDIT8_DB=... AUDIT8_OUT=... /app/run run-script build_audit8.py
          """
          import json
          import pathlib
          import pickle
          import sqlite3
          import sys
          import numpy as np
          from ncore.data.v4 import SequenceComponentGroupsReader, SequenceLoaderV4

          import os
          # "/app/run run-script" takes no script arguments, so the job passes them in the environment
          args = sys.argv[1:4] if len(sys.argv) >= 4 else [os.environ["AUDIT8_MANIFEST"], os.environ["AUDIT8_DB"], os.environ["AUDIT8_OUT"]]
          manifest, db, out = pathlib.Path(args[0]), args[1], args[2]
          BLOBS = pathlib.Path("/avl-west/nuplan/nuplan-v1.1/sensor_blobs")
          m = json.loads(manifest.read_text())
          loader = SequenceLoaderV4(SequenceComponentGroupsReader([manifest.parent / s["path"] for s in m["component_stores"]]))
          conn = sqlite3.connect("file:" + db + "?mode=ro", uri=True)
          lens = {}
          for channel, blob in conn.execute("SELECT channel, distortion FROM camera"):
              d = np.array(pickle.loads(blob)).reshape(-1)
              assert len(d) == 5
              lens["camera_pcam_" + channel[4:].lower()] = {"radial": [float(d[0]), float(d[1]), float(d[4]), 0, 0, 0], "tangential": [float(d[2]), float(d[3])]}
          clock, summary = {}, {}
          for name in sorted(loader.camera_ids):
              sensor = loader.get_camera_sensor(name)
              stamps = [int(t) for t in sensor.get_frames_timestamps_us()]
              channel = "CAM_" + name.removeprefix("camera_pcam_").upper()
              rows = conn.execute("SELECT image.timestamp, image.filename_jpg FROM image JOIN camera ON image.camera_token = camera.token "
                                  "WHERE camera.channel = ? AND image.timestamp BETWEEN ? AND ?", (channel, min(stamps) - 200000, max(stamps) + 200000)).fetchall()
              table = {}
              for i, ts in enumerate(stamps):
                  stored = sensor.get_frame_data(i)._encoded_image_data
                  candidates = sorted(rows, key=lambda r: abs(r[0] - ts))[:3]
                  matches = [t for t, f in candidates if (BLOBS / f).read_bytes() == stored]
                  assert len(matches) == 1, (name, i, matches)
                  table[str(ts)] = int(matches[0])
              clock[name] = table
              off = np.array([v - int(k) for k, v in table.items()]) / 1000
              summary[name] = {"frames": len(table), "offset_ms_min": float(off.min()), "offset_ms_median": float(np.median(off)), "offset_ms_max": float(off.max())}
              print("AUDIT8_CAMERA", name, summary[name], flush=True)
          json.dump({"clock": clock, "lens": lens, "summary": summary}, open(out, "w"))
          print("AUDIT8_DONE", len(clock), "cameras", flush=True)
          AUDIT8_PY
          AUDIT8_MANIFEST="$L/pai_$C.json" AUDIT8_DB=/avl-west/nuplan/nuplan-v1.1/splits/test/2021.06.28.20.24.43_veh-38_03385_04952.db AUDIT8_OUT=/scratch/input_audit8.json /app/run run-script /scratch/build_audit8.py
          test -s /scratch/input_audit8.json
          export NAVSAFE_MODULE=/scratch/nuplan_opt.py NAVSAFE_ARGS_FILE=/scratch/train_args.txt NAVSAFE_INPUT_AUDIT=/scratch/input_audit8.json NAVSAFE_VARIANT="$VARIANT" NAVSAFE_REPORT_DIR="$DEST/reports" NAVSAFE_BASELINE_CONFIG="$ROOT/audits_20s/$C/e3e0b3d6d5ae52a1s1_baseline_parsed.yaml"
          nvidia-smi --query-gpu=index,uuid,name,memory.total,driver_version,temperature.gpu,power.draw --format=csv

          # Save recovery checkpoints on the PVC; images and all GPU work stay local.
          mkdir -p "$OUTL/$C" "$DEST/ckpt_sync" /scratch/ckpt
          ln -sfn /scratch/ckpt "$OUTL/$C/checkpoints"
          if [ -s "$DEST/ckpt_sync/last.ckpt" ] && (cd "$DEST/ckpt_sync" && sha256sum -c last.ckpt.sha256); then
            # NRE refuses an argument that starts with out_dir= on resume, and fails without an out_dir: pass the same value as ++out_dir=
            cp "$DEST/ckpt_sync/last.ckpt" /scratch/resume.ckpt; sed -i "s/^out_dir=/++out_dir=/" /scratch/train_args.txt
            printf "resume=/scratch/resume.ckpt\nresume_weights_only=false\n" >> /scratch/train_args.txt
            echo RESUMING_FROM "$DEST/ckpt_sync/last.ckpt"
          else echo STARTING_FROM_SCRATCH; fi
          sync_ckpt() {
            local n s sha
            n=$(ls -t /scratch/ckpt/*.ckpt 2>/dev/null | head -1 || true); [ -n "$n" ] || return 0
            s=$(stat -c "%s %Y" "$n"); [ "$s" = "$(cat /scratch/ckpt_synced 2>/dev/null || true)" ] && return 0
            sleep 30; [ "$s" = "$(stat -c "%s %Y" "$n")" ] || return 0   # still being written
            cp "$n" "$DEST/ckpt_sync/last.ckpt.partial"
            sha=$(sha256sum < "$n" | cut -d" " -f1)
            echo "$sha  last.ckpt" > "$DEST/ckpt_sync/last.ckpt.sha256"
            mv "$DEST/ckpt_sync/last.ckpt.partial" "$DEST/ckpt_sync/last.ckpt"
            echo "$s" > /scratch/ckpt_synced; echo "CKPT_SYNCED $n $(date -u +%T)"
          }
          ( while true; do sync_ckpt || true; sleep 60; done ) &
          SYNC_PID=$!
          cat > /scratch/ody_launch.py <<'ODY_LAUNCH_PY'
          """Odyssey-style additions for the NRE nuPlan training, installed before the usual wrapper runs.

            1. Frame sampling weighted by ego speed (stand-in for Odyssey's coverage-aware sampling, appendix B.1): a frame taken
               while the car is slow sees the same surfaces as its neighbours, so it is drawn less often.
               weight = clip(speed / 90th percentile of speed, 0.1, 1). NRE's timestamp sampler draws uniformly; only that draw
               changes. Odyssey counts observations per 0.5 m voxel from LiDAR depth; that is not reproduced.
            2. Diagnostics of the LiDAR initialisation: how many points of the first sweeps survive each filter.
            3. ODY_EXTRA_LOSSES (JSON of weights): Odyssey objectives that NRE has no option for, added to NRE's total loss:
               entropy (+ entropy_start), lidar_inv_depth, depth_smooth, road_clearance. Odyssey's line-of-sight loss is not
               here: it needs per-sample opacity along the LiDAR ray, and NRE's renderer returns only per-ray opacity and distance.
          Then runs ODY_WRAPPER (nuplan_training_optimizations.py) unchanged.
          """
          import os
          import runpy

          import numpy as np


          def say(*args):
              print("[ody]", *args, flush=True)


          def install_weighted_sampling():
              import torch
              from nre.datasets.samplers import timestamp as ts
              from nre.datasets.samplers.base import FrameSamplerReturn
              from ncore.impl.data.util import closest_index_sorted

              cls = ts.TimestampFrameSampler
              original_init = cls.__init__

              def init(self, config, dataset):
                  original_init(self, config, dataset)
                  rig = dataset.get_datasource().get_rig_trajectories().rig_trajectories[0]
                  T = torch.as_tensor(rig.T_rig_worlds).double().cpu().numpy()
                  t = torch.as_tensor(rig.T_rig_world_timestamps_us).double().cpu().numpy()
                  assert T.ndim == 3 and len(T) == len(t) and len(t) > 10, (T.shape, t.shape)
                  # speed over a 0.5 s window, so pose noise does not enter the weights
                  grid = np.arange(t[0], t[-1], 1e5)
                  xyz = np.stack([np.interp(grid, t, T[:, k, 3]) for k in range(3)], 1)
                  half = 2
                  v = np.array([np.linalg.norm(xyz[min(i + half, len(grid) - 1)] - xyz[max(i - half, 0)])
                                / max((grid[min(i + half, len(grid) - 1)] - grid[max(i - half, 0)]) / 1e6, 1e-3) for i in range(len(grid))])
                  self._ody_t, self._ody_w = grid, np.clip(v / max(np.percentile(v, 90), 1e-3), 0.1, 1.0)
                  self._ody_p = {}
                  say(f"weighted sampling: speed {v.min():.1f}..{v.max():.1f} m/s, weights {self._ody_w.min():.2f}..{self._ody_w.max():.2f} (pid {os.getpid()})")

              def sample_frame(self, rng, batch_idx, frame_range, unique_sensor_id):
                  sensor_timestamps = self.unique_sensor_id_to_timestamps[unique_sensor_id][:, 1].numpy()
                  assert len(frame_range) == len(sensor_timestamps)
                  if batch_idx in self.batch_idx_to_timestamp:
                      sampled_timestamp = self.batch_idx_to_timestamp[batch_idx]
                  else:
                      p = self._ody_p.get(unique_sensor_id)
                      if p is None:
                          w = np.interp(sensor_timestamps.astype(np.float64), self._ody_t, self._ody_w)
                          p = self._ody_p[unique_sensor_id] = w / w.sum()
                          say(f"weighted sampling active for {unique_sensor_id}: p max/min {p.max() / p.min():.2f} (pid {os.getpid()})")
                      sampled_timestamp = rng.choice(sensor_timestamps, size=1, replace=False, p=p, shuffle=False).item()
                      self.batch_idx_to_timestamp = {batch_idx: sampled_timestamp}
                  return FrameSamplerReturn(sampled_frame_idx=frame_range[closest_index_sorted(sensor_timestamps, sampled_timestamp)])

              cls.__init__, cls.sample_frame = init, sample_frame
              say("installed: TimestampFrameSampler draws frames with speed weights")


          def install_init_diagnostics():
              import nre.datasets.ncore as nc

              original = nc.NCOREDataSource._color_pc_rgb
              seen = {"n": 0}

              def color_pc_rgb(self, xyz_e, *args, **kwargs):
                  out = original(self, xyz_e, *args, **kwargs)
                  if seen["n"] < 6:
                      seen["n"] += 1
                      say(f"init sweep {seen['n']}: {len(xyz_e)} points after the valid/non-dynamic masks, {int(out[1].sum())} get a camera colour")
                  return out

              nc.NCOREDataSource._color_pc_rgb = color_pc_rgb


          def extra_loss_terms(step, model, results, target, weights, state):
              """-> {name: (weight, unreduced value)}: the Odyssey objectives (appendix B.1, table 7) NRE has no option for."""
              import torch
              from nre.utils.types import RayFlags

              out = {}
              nodes = model.gaussians_nodes
              # L_ent: opacity entropy, pushes every Gaussian to transparent or opaque (road excluded: its mesh geometry is kept)
              if "entropy" in weights:
                  o = torch.cat([nodes[n].get_densities().reshape(-1) for n in model.get_gaussians_node_ids() if n != "road"]).clamp(1e-6, 1 - 1e-6)
                  w = weights["entropy"] if step >= weights.get("entropy_start", 0) else 0.0
                  out["ody_opacity_entropy"] = (w, -(o * o.log() + (1 - o) * (1 - o).log()))
              # L_depth: LiDAR inverse depth (near range weighs more than in NRE's own L1 range loss)
              lidar = target.data.lidar
              if "lidar_inv_depth" in weights and lidar is not None and results.rendered_lidar is not None:
                  pred = results.rendered_lidar.distance.reshape(-1)
                  gt = lidar.labels.distance.reshape(-1)
                  valid = (lidar.labels.get_mask_flags_none(RayFlags.INVALID) & lidar.labels.get_mask_flags_none(RayFlags.DROPPED)).reshape(-1)
                  valid = valid & torch.isfinite(gt) & (gt > 0.5)
                  if weights.get("lidar_static_only"):
                      # rays that the LiDAR labels call a vehicle are left out: LiDAR ray supervision blurred the vehicles
                      # (v7-ody-a against v7-ody-b); this asks whether the static scene alone gains from LiDAR depth
                      valid = valid & lidar.labels.get_mask_flags_none(RayFlags.VEHICLE_SEMANTIC).reshape(-1)
                      state["lidar_static_share"] = float(valid.float().mean())
                  if bool(valid.any()):
                      out["ody_lidar_inv_depth"] = (weights["lidar_inv_depth"], (1.0 / pred[valid].clamp_min(0.5) - 1.0 / gt[valid]).abs())
              # L_smooth: edge-aware smoothness of the rendered inverse depth of the camera image
              cam = target.data.camera
              if "depth_smooth" in weights and cam is not None and results.rendered_cam is not None and cam.labels.rgb is not None:
                  rgb = cam.labels.rgb
                  b, h, w_, _ = rgb.shape
                  dist = results.rendered_cam.distance.reshape(b, h, w_)
                  opa = results.rendered_cam.opacity.reshape(b, h, w_).clamp(0, 1)
                  solid = opa > 0.5
                  disp = torch.where(solid, opa / dist.clamp_min(0.2), torch.zeros_like(dist))   # 1 / (distance / opacity)
                  disp = disp / disp[solid].mean().clamp_min(1e-6) if bool(solid.any()) else disp
                  gx = (disp[:, :, 1:] - disp[:, :, :-1]).abs() * torch.exp(-(rgb[:, :, 1:] - rgb[:, :, :-1]).abs().mean(-1)) * (solid[:, :, 1:] & solid[:, :, :-1])
                  gy = (disp[:, 1:, :] - disp[:, :-1, :]).abs() * torch.exp(-(rgb[:, 1:, :] - rgb[:, :-1, :]).abs().mean(-1)) * (solid[:, 1:, :] & solid[:, :-1, :])
                  out["ody_depth_smooth"] = (weights["depth_smooth"], torch.cat([gx.reshape(-1), gy.reshape(-1)]))
              # ground: opacity of background Gaussians from 0.3 m below to 1.0 m above the road surface
              if "road_clearance" in weights and "road" in nodes and "background" in nodes:
                  cell = 0.5
                  if state.get("grid_step", -10**9) + 2000 <= step:
                      with torch.no_grad():
                          pr = nodes["road"].get_positions().detach()
                          lo = pr[:, :2].min(0).values
                          ij = ((pr[:, :2] - lo) / cell).long()
                          nx, ny = int(ij[:, 0].max()) + 1, int(ij[:, 1].max()) + 1
                          flat = ij[:, 0] * ny + ij[:, 1]
                          zsum = torch.zeros(nx * ny, device=pr.device).index_add_(0, flat, pr[:, 2])
                          cnt = torch.zeros(nx * ny, device=pr.device).index_add_(0, flat, torch.ones_like(pr[:, 2]))
                          state.update(grid_step=step, lo=lo, nx=nx, ny=ny, h=zsum / cnt.clamp_min(1), has=cnt > 0)
                  pb = nodes["background"].get_positions()
                  ij = ((pb[:, :2].detach() - state["lo"]) / cell).long()
                  inside = (ij[:, 0] >= 0) & (ij[:, 0] < state["nx"]) & (ij[:, 1] >= 0) & (ij[:, 1] < state["ny"])
                  flat = (ij[:, 0].clamp(0, state["nx"] - 1) * state["ny"] + ij[:, 1].clamp(0, state["ny"] - 1))
                  dz = pb[:, 2].detach() - state["h"][flat]
                  near = inside & state["has"][flat] & (dz > -0.3) & (dz < 1.0)
                  state["near_count"] = int(near.sum())
                  if bool(near.any()):
                      out["ody_road_clearance"] = (weights["road_clearance"], nodes["background"].get_densities().reshape(-1)[near])
              return out


          def install_extra_losses(weights):
              import torch
              from libs.losses.orchestration import loss_aggregator as la
              from libs.losses.orchestration.config import LossAggregatorReturn, LossReturn

              original = la.LossAggregator.__call__
              state = {}

              def mean(value, reduce_mask=None):
                  return value.mean()

              def call(self, *, step, model, results=None, target=None, **kwargs):
                  ret = original(self, step=step, model=model, results=results, target=target, **kwargs)
                  if results is None or target is None or not torch.is_grad_enabled():
                      return ret
                  terms = extra_loss_terms(step, model, results, target, weights, state)
                  if not terms:
                      return ret
                  merged = dict(ret.loss_returns)
                  for name, (weight, value) in terms.items():
                      merged[name] = LossReturn(name=name, lambda_=float(weight), value=value, reduce_fn=mean)
                  if step % 2000 == 0:
                      say(f"step {step}: " + ", ".join(f"{n} {float(merged[n].reduced_value):.5f} (w {merged[n].lambda_})" for n in terms)
                          + (f"; background Gaussians near the road {state.get('near_count')}" if "near_count" in state else "")
                          + (f"; LiDAR rays used {state['lidar_static_share']:.2f}" if "lidar_static_share" in state else ""))
                  return LossAggregatorReturn(merged)

              la.LossAggregator.__call__ = call
              say("installed: extra losses", weights)


          def install_gsplat_cap(cap, split_boundary_m, road_cap, fill=0.0, object_cap=400000):
              """Gradient densification (NRE strategy "gsplat") with a hard limit on the number of Gaussians.

              NRE's strategy clones and splits every Gaussian above the gradient threshold and has no limit. Here each
              densification step may add at most cap - current total: when more Gaussians qualify, the thresholds go up for that
              step so that only the ones with the largest gradients are taken. At the limit the step is skipped; pruning and
              the density reset go on and make room again.
              - clone/split boundary as an absolute size (Odyssey table 6: 0.056 m) instead of a fraction of the scene extent;
              - the road layer takes part in densification (model.strategy.exclude_layer_ids=[]), but not in the density reset:
                its density learning rate is 1e-4, a reset road would stay transparent.
              """
              import torch
              from nre.models.gaussians.strategies.gsplat import GSplatStrategy

              original_init, original_densify, original_reset = GSplatStrategy.__init__, GSplatStrategy.densify_gaussians, GSplatStrategy.reset_density
              state = {"calls": 0}
              nodes_of = {}

              def init(self, config, trainer_config, init_from_datasource, gaussians_nodes):
                  original_init(self, config, trainer_config, init_from_datasource, gaussians_nodes)
                  # not as an attribute: the strategy is an nn.Module, the layers would be registered a second time and their
                  # tensors would be saved twice (first run: the renderer refused the checkpoint, "unexpected keys _ody_nodes")
                  nodes_of[id(self)] = gaussians_nodes

              def densify(self, layer_id, gaussian_model):
                  # two budgets: the road layer, and all other layers together. First run with one common budget (2026-10-10): the
                  # road grew from 0.35 M to 1.64 M in 6000 steps and the background fell from 0.82 M to 0.48 M, because the road is
                  # never reset and so never pruned.
                  # Third run: with two budgets the vehicle layers (1.6 M at the start, 5000 points per object) kept the non-road
                  # budget and the background fell to 0.42 M. So three budgets: road, objects (all track layers), background.
                  counts = {k: m.get_num_gaussians() for k, m in nodes_of[id(self)].items()}
                  everything = sum(counts.values())
                  group = "road" if layer_id == "road" else "background" if layer_id == "background" else "objects"
                  budget = {"road": road_cap, "objects": object_cap, "background": cap - road_cap - object_cap}[group]
                  total = sum(n for k, n in counts.items() if ("road" if k == "road" else "background" if k == "background" else "objects") == group)
                  room = budget - total
                  state["calls"] += 1
                  if state["calls"] % 50 == 1:
                      say(f"densify call {state['calls']} ({layer_id}): all layers {everything}, this budget used {total}, room {room}, " + ", ".join(f"{k} {m.get_num_gaussians()}" for k, m in nodes_of[id(self)].items()))
                  if room <= 0:
                      return
                  cfg = self.config.densify
                  saved = (cfg.clone_grad_threshold, cfg.split_grad_threshold, cfg.relative_size_threshold)
                  g = (self.densify_grad_norm_accum[layer_id] / self.densify_grad_norm_denom[layer_id]).reshape(-1)
                  g = torch.nan_to_num(g, nan=0.0)
                  wanted = int((g >= min(saved[0], saved[1])).sum())
                  # a layer may use at most its share of the room (by current size), so the first layer in the loop cannot take all
                  share = max(1, int(room * gaussian_model.get_num_gaussians() / max(total, 1)))
                  # fill mode: NRE's fixed thresholds added almost nothing after the first steps (run of 2026-10-10: 0.81 M of a
                  # 2 M budget used, vehicle layers down to a few thousand Gaussians). With ODY_GSPLAT_FILL = f every step takes at
                  # least the fraction f of the layer, by the largest gradients, while there is room.
                  target = min(share, max(wanted, int(fill * gaussian_model.get_num_gaussians())))
                  try:
                      if target > 0 and target != wanted:
                          kth = float(torch.topk(g, min(target, g.numel())).values[-1])
                          if kth > 0:
                              cfg.clone_grad_threshold = cfg.split_grad_threshold = kth
                      cfg.relative_size_threshold = split_boundary_m / gaussian_model.scene_extent
                      original_densify(self, layer_id, gaussian_model)
                  finally:
                      cfg.clone_grad_threshold, cfg.split_grad_threshold, cfg.relative_size_threshold = saved

              def reset(self, layer_id, gaussian_model):
                  if layer_id == "road":
                      return
                  # vehicle and pedestrian layers: every second reset only (Odyssey table 6 resets rigid actors about half as often)
                  if layer_id != "background":
                      state[layer_id] = state.get(layer_id, 0) + 1
                      if state[layer_id] % 2 == 1:
                          return
                  original_reset(self, layer_id, gaussian_model)

              GSplatStrategy.__init__, GSplatStrategy.densify_gaussians, GSplatStrategy.reset_density = init, densify, reset
              say(f"installed: gsplat densification limited to {cap} Gaussians ({road_cap} of them for the road layer), clone/split boundary {split_boundary_m} m, no density reset on the road layer")


          def install_ground_classes(names):
              """The flat-disk ground layer takes every LiDAR point that carries the road flag. NRE sets that flag for the class
              "road" only, so sidewalks, traffic islands and verges stay in the background layer (measured on e3e0: 8 Gaussians per
              m2 there, most of them not flat, against 400 per m2 of flat disks on the road). Relabel these classes as road in
              the LiDAR labels. The flag is used for initialization only; camera labels are left as they are."""
              from nre.utils import ncore_utils
              orig = ncore_utils.AuxShardDataLoader.get_lidar_semantic_segmentation
              ids, seen = {}, {"total": 0, "moved": 0, "calls": 0}

              def patched(self, lidar_id, frame_timestamps_us):
                  labels = orig(self, lidar_id, frame_timestamps_us)
                  if lidar_id not in ids:
                      classes = list(self.get_lidar_semantic_segmentation_meta(lidar_id)["stuff_classes"])
                      ids[lidar_id] = (classes.index("road"), np.array([classes.index(n) for n in names if n in classes], dtype=labels.dtype))
                      say("ground classes for", lidar_id, "->", [n for n in names if n in classes], "relabelled as road")
                  road, extra = ids[lidar_id]
                  mask = np.isin(labels, extra)
                  seen["total"] += labels.size; seen["moved"] += int(mask.sum()); seen["calls"] += 1
                  if seen["calls"] in (50, 200, 800):
                      say("ground classes: %.2f%% of %d LiDAR labels relabelled as road" % (100.0 * seen["moved"] / max(seen["total"], 1), seen["total"]))
                  if mask.any():
                      labels = labels.copy(); labels[mask] = road
                  return labels

              ncore_utils.AuxShardDataLoader.get_lidar_semantic_segmentation = patched
              say("ground-class hook installed:", names)


          def install_depth_alignment(depth_dir=None):
              """Camera depth for the background initialization, aligned to the LiDAR (Odyssey aligns its MoGe-2 depth the same way).

              For every camera frame the top LiDAR sweep nearest in time is projected into the image with NRE's own camera model.
              The ratio LiDAR depth / predicted depth is taken per bin of predicted depth (median), interpolated over depth, and
              the depth image is multiplied by it. With depth_dir the predicted depth comes from <depth_dir>/<camera>/<stamp>.png
              (16 bit, metres * 65535 / max_depth_m in meta.json; MoGe-2) instead of the aux store (Depth Anything V2).
              Only active while the camera point clouds of an initialization are generated."""
              import json
              import traceback
              import cv2
              import torch
              import nre.datasets.ncore as nc
              from nre.utils import ncore_utils
              state = {"ds": None, "lidar": None, "active": False, "n": 0, "fallback": 0, "before": [], "after": [], "err": False}
              edges = np.geomspace(2.0, 80.0, 11)
              centers = np.sqrt(edges[:-1] * edges[1:])
              meta = json.load(open(os.path.join(depth_dir, "meta.json"))) if depth_dir else None
              orig_depth = ncore_utils.AuxShardDataLoader.get_depth

              def lidar_table(ds):
                  lid = "lidar_top_structured" if "lidar_top_structured" in ds.lidar_sensors else list(ds.lidar_sensors)[0]
                  sensor = ds.lidar_sensors[lid]
                  stamps = np.array([int(sensor.get_frame_timestamp_us(i)) for i in ds.lidar_frame_ranges[lid]], dtype=np.int64)
                  pcs = list(state["orig_lidar"](ds, [lid], False, False, None, 1, torch.device("cpu"), False, None))
                  assert len(pcs) == len(stamps), (len(pcs), len(stamps))
                  say(f"depth alignment: {len(pcs)} sweeps of {lid}, {sum(int(p.n_points) for p in pcs)} points")
                  return stamps, [p.xyz_end.detach().cpu().numpy().astype(np.float64) for p in pcs]

              def ratio_curve(ds, camera_id, stamp, depth):
                  """per-bin ratio LiDAR/predicted for one frame; depth is (H, W) in metres at any resolution"""
                  cam = ds.camera_sensors[camera_id]
                  params = ds.camera_model_parameters[camera_id]
                  width, height = [int(v) for v in params.resolution]
                  ends = np.asarray(cam.frames_timestamps_us)[:, 1].astype(np.int64)
                  hit = np.nonzero(ends == int(stamp))[0]
                  assert len(hit) == 1, (camera_id, stamp, len(hit))
                  idx = int(hit[0])
                  T = ds.world_to_nre.transform_poses(np.stack([cam.get_frames_T_sensor_target("world", idx, nc.ncore.data.FrameTimepoint.START),
                                                                cam.get_frames_T_sensor_target("world", idx, nc.ncore.data.FrameTimepoint.END)]))
                  nre_to_sensor = nc.ncore_transformations.se3_inverse(T)
                  stamps, clouds = state["lidar"]
                  points = clouds[int(np.argmin(np.abs(stamps - int(stamp))))]
                  model = nc.ncore.sensors.CameraModel.from_parameters(params, device="cpu")
                  proj = model.world_points_to_image_points_shutter_pose(torch.from_numpy(points).float(), nre_to_sensor[0], nre_to_sensor[1], return_valid_indices=True)
                  valid = proj.valid_indices.cpu().numpy()
                  uv = proj.image_points.cpu().numpy()
                  if len(uv) != len(valid):
                      uv = uv[valid]
                  z = (points[valid] @ nre_to_sensor[1][:3, :3].T + nre_to_sensor[1][:3, 3])[:, 2] / float(ds.world_to_nre.target_scale)
                  h, w = depth.shape
                  u = np.clip((uv[:, 0] * w / width).astype(np.int64), 0, w - 1); v = np.clip((uv[:, 1] * h / height).astype(np.int64), 0, h - 1)
                  pred = depth[v, u]
                  ok = (pred > 0.5) & (z > 1.0) & (z < 90.0) & np.isfinite(pred)
                  pred, z = pred[ok], z[ok]
                  if len(pred) < 200:
                      return None, pred, z
                  ratio = np.full(len(centers), np.nan)
                  which = np.digitize(pred, edges) - 1
                  for b in range(len(centers)):
                      m = which == b
                      if m.sum() >= 30:
                          ratio[b] = np.median(z[m] / pred[m])
                  if np.isfinite(ratio).sum() < 2:
                      return None, pred, z
                  good = np.isfinite(ratio)
                  return (np.log(centers[good]), ratio[good]), pred, z

              def aligned_depth(self, camera_id, frame_timestamps_us, target_width_height=None):
                  if not state["active"]:
                      return orig_depth(self, camera_id, frame_timestamps_us, target_width_height)
                  try:
                      if depth_dir:
                          raw = cv2.imread(os.path.join(depth_dir, camera_id, f"{int(frame_timestamps_us)}.png"), cv2.IMREAD_UNCHANGED)
                          assert raw is not None and raw.dtype == np.uint16, (camera_id, frame_timestamps_us)
                          depth = raw.astype(np.float32) * float(meta["max_depth_m"]) / 65535.0
                          if target_width_height:
                              depth = cv2.resize(depth, (int(target_width_height[0]), int(target_width_height[1])), interpolation=cv2.INTER_NEAREST)
                      else:
                          depth = orig_depth(self, camera_id, frame_timestamps_us, target_width_height)
                      curve, pred, z = ratio_curve(state["ds"], camera_id, frame_timestamps_us, depth)
                      state["n"] += 1
                      if curve is None:
                          state["fallback"] += 1
                          return depth
                      factor = np.interp(np.log(np.clip(depth, 1e-3, None)), curve[0], curve[1]).astype(np.float32)
                      out = depth * factor
                      if state["n"] % 8 == 1:   # statistics on a sample of the frames
                          state["before"].append(np.stack([pred, z / pred], 1)); state["after"].append(np.stack([pred, z / (pred * np.interp(np.log(pred), curve[0], curve[1]))], 1))
                      return out
                  except BaseException:
                      if not state["err"]:
                          state["err"] = True
                          say("DEPTH ALIGNMENT TRACEBACK\n" + traceback.format_exc())
                      raise

              def report():
                  if not state["before"]:
                      say("depth alignment: no statistics"); return
                  b, a = np.concatenate(state["before"]), np.concatenate(state["after"])
                  say(f"depth alignment: {state['n']} frames, {state['fallback']} left as they are (too few LiDAR points). Error of the predicted depth against LiDAR, median |ratio - 1| (and median ratio), before -> after:")
                  for lo, hi in ((2, 5), (5, 10), (10, 20), (20, 40), (40, 80)):
                      m = (b[:, 0] >= lo) & (b[:, 0] < hi)
                      if m.sum() > 100:
                          say(f"   {lo:>2}-{hi:<2} m: {100 * np.median(np.abs(b[m, 1] - 1)):.1f} % ({np.median(b[m, 1]):.3f}) -> {100 * np.median(np.abs(a[m, 1] - 1)):.1f} % ({np.median(a[m, 1]):.3f}), {int(m.sum())} points")

              ncore_utils.AuxShardDataLoader.get_depth = aligned_depth
              state["orig_lidar"] = nc.NCOREDataSource.get_lidar_point_clouds
              gen = nc.NCOREDataSource.get_camera_point_clouds

              def camera_point_clouds(self, *a, **k):
                  if state["lidar"] is None:
                      state["ds"] = self; state["lidar"] = lidar_table(self)
                  state["active"] = True
                  try:
                      for pc in gen(self, *a, **k):
                          yield pc
                  finally:
                      state["active"] = False
                  report()

              nc.NCOREDataSource.get_camera_point_clouds = camera_point_clouds
              say("depth alignment hook installed" + (f", depth from {depth_dir} ({meta})" if depth_dir else ", depth from the aux store"))


          def install_init_trace():
              """NRE prints only the exception name when an initialization fails. Print the whole traceback, and the number of
              points each sensor contributes to the background point cloud."""
              import traceback
              import nre.models.gaussians.initializations as ini
              import nre.datasets.ncore as nc
              import torch
              CAM_KEEP = float(os.environ.get("ODY_CAM_INIT_KEEP", "1"))
              orig = ini.LidarRigTrajInitializationBase.get_point_clouds_and_ego_poses

              def traced(self, datasource):
                  try:
                      return orig(self, datasource)
                  except BaseException:
                      say("INIT TRACEBACK\n" + traceback.format_exc())
                      raise

              ini.LidarRigTrajInitializationBase.get_point_clouds_and_ego_poses = traced
              # The label filter of a mixed camera + LiDAR point cloud asks for one class table. The LiDAR table is the camera table
              # plus extra entries at the end ("egocar", "ignore"), which NRE reports as inconsistent. Use the larger table when
              # every class they share has the same index.
              orig_map = nc.NCOREDataSource.get_semantic_classes_map

              def classes_map(self, camera_semantics, lidar_semantics):
                  if not (camera_semantics and lidar_semantics):
                      return orig_map(self, camera_semantics, lidar_semantics)
                  cam, lid = orig_map(self, True, False), orig_map(self, False, True)
                  if cam is None or lid is None:
                      return cam or lid
                  shared = set(cam) & set(lid)
                  assert all(cam[c] == lid[c] for c in shared), "camera and LiDAR class tables disagree on a shared class"
                  merged = dict(lid); merged.update(cam)
                  say(f"class tables merged: camera {len(cam)}, LiDAR {len(lid)}, shared {len(shared)} with equal indices")
                  return merged

              nc.NCOREDataSource.get_semantic_classes_map = classes_map
              for fn_name in ("get_camera_point_clouds", "get_lidar_point_clouds"):
                  gen = getattr(nc.NCOREDataSource, fn_name)

                  def counted(self, *a, _gen=gen, _n=fn_name, **k):
                      total = pcs = 0
                      for pc in _gen(self, *a, **k):
                          if _n == "get_camera_point_clouds":
                              # 8 cameras x 200 frames give about 190 M depth points against 5.5 M LiDAR points: keep a fraction, so
                              # the measured LiDAR points are not drowned out by predicted depth
                              if CAM_KEEP < 1.0 and pc.n_points:
                                  pc = pc[torch.rand(pc.n_points, device=pc.xyz_start.device) < CAM_KEEP]
                              # camera points carry no intensity, LiDAR points do; PointCloud.collate_fn needs the same fields
                              if pc.intensity is None:
                                  pc.intensity = torch.zeros(pc.n_points, dtype=torch.float32, device=pc.xyz_start.device)
                          total += int(pc.n_points); pcs += 1
                          yield pc
                      say(f"{_n}: {pcs} point clouds, {total} points")

                  setattr(nc.NCOREDataSource, fn_name, counted)


          if os.environ.get("ODY_WEIGHTED_SAMPLING", "1") == "1":
              install_weighted_sampling()
          install_init_diagnostics()
          if os.environ.get("ODY_ALIGN_DEPTH"):
              install_depth_alignment(os.environ.get("ODY_DEPTH_DIR") or None)
          if os.environ.get("ODY_TRACE_INIT"):
              install_init_trace()
          if os.environ.get("ODY_GROUND_CLASSES"):
              install_ground_classes([n.strip() for n in os.environ["ODY_GROUND_CLASSES"].split(",")])
          if os.environ.get("ODY_GSPLAT_CAP"):
              install_gsplat_cap(int(os.environ["ODY_GSPLAT_CAP"]), float(os.environ.get("ODY_SPLIT_BOUNDARY_M", "0.056")),
                                 int(os.environ.get("ODY_ROAD_CAP", "1000000")), float(os.environ.get("ODY_GSPLAT_FILL", "0")),
                                 int(os.environ.get("ODY_OBJECT_CAP", "400000")))
          if os.environ.get("ODY_EXTRA_LOSSES"):
              import json
              install_extra_losses(json.loads(os.environ["ODY_EXTRA_LOSSES"]))
          runpy.run_path(os.environ["ODY_WRAPPER"], run_name="__main__")
          ODY_LAUNCH_PY
          ODY_WRAPPER=/scratch/nuplan_opt.py /app/run run-script /scratch/ody_launch.py || echo "TRAINER_EXIT_NONZERO $?"
          ls -l "$OUTL/$C/artifacts"
          U=$(ls -t "$OUTL/$C"/artifacts/0800*.usdz | head -1)   # 080000, or 080001 after a resume
          test -s "$U"
          test -s "$OUTL/$C/artifacts/last.usdz" || cp "$U" "$OUTL/$C/artifacts/last.usdz"
          mkdir -p "$DEST/artifacts"
          cp -a "$OUTL/$C/artifacts/last.usdz" "$DEST/artifacts/last.usdz.copying"
          mv "$DEST/artifacts/last.usdz.copying" "$DEST/artifacts/last.usdz"
          kill "$SYNC_PID" 2>/dev/null || true
          cp -a "$OUTL/$C/config" "$DEST/" || true
          echo TRAIN_20S_DONE "$C" "$VARIANT"
          date -u +%FT%TZ > "$DEST/TRAIN_COMPLETE"
        env:
