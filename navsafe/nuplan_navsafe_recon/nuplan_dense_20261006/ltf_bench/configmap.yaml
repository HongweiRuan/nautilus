data:
  audit_models.py: "\"\"\"Audit actual final checkpoints in the native NRE environment before serving.\"\"\"\nimport glob\nimport json\nimport os\nfrom pathlib import Path\nimport zipfile\nimport torch\n\npaths = sorted(glob.glob(os.environ['NAVSAFE_ARTIFACT_GLOB']))\nassert len(paths) == int(os.environ['NAVSAFE_EXPECTED_MODELS']), paths\nrows = []\nfor p in paths:\n    with zipfile.ZipFile(p) as z:\n        with z.open('checkpoint.ckpt') as stream:\n            checkpoint = torch.load(stream, map_location='cpu', weights_only=False)\n        step = int(checkpoint['global_step'])\n        assert step == int(os.environ.get('NAVSAFE_EXPECTED_STEP', '160000')), (p, step)\n        del checkpoint\n        r = json.loads(z.read('rig_trajectories.json'))\n    cams = sorted(k.split('@')[0] for k in r['camera_calibrations'])\n    assert {'camera_pcam_f0', 'camera_pcam_b0', 'camera_pcam_l0', 'camera_pcam_r0'} <= set(cams)\n    rows.append({'path': p, 'global_step': step, 'cameras': cams,\n                 'world_to_nre': r['world_to_nre'], 'sequence_id': r['rig_trajectories'][0]['sequence_id']})\nPath(os.environ['NAVSAFE_MODEL_AUDIT']).write_text(json.dumps(rows, indent=2))\nprint('ACTUAL_160K_MODELS_AUDITED', len(rows), flush=True)\n"
  fixer_worker.py: "\"\"\"Resident Odyssey Fixer worker for the NavSafe benchmark (runs in the Fixer environment, on the evaluator's GPU).\n\nUses Odyssey's own Restorer (OdysseyRenderer/fixer/fixer_server.py: fine-tuned h1_b16_e1_model_11001.pkl, torch bf16,\none denoising step, timestep 250, network at 576x1024). One request = all camera images of one step as one batch.\nWire format on a local socket: 12-byte header (n, h, w as int32) + n*h*w*3 uint8 BGR, reply in the same layout.\n\"\"\"\nimport json, os, sys, time\nfrom multiprocessing.connection import Listener\nimport numpy as np\nimport torch\n\nROOT = os.environ[\"FIXER_ROOT\"]\nsys.path.insert(0, ROOT); os.chdir(ROOT)\nfrom fixer_server import Restorer, PROC_H, PROC_W, TIMESTEP  # noqa: E402\n\nOUT = os.environ.get(\"BENCH_OUT\", \"/tmp/bench\")\nt0 = time.time()\nr = Restorer(os.path.join(ROOT, \"models/finetuned/h1_b16_e1_model_11001.pkl\"), os.path.join(ROOT, \"src\"))\nfor _ in range(3):                                   # warm-up at the benchmark batch size\n    r.restore(np.zeros((3, 1080, 1920, 3), np.uint8), bgr=True)\ntorch.cuda.synchronize(); torch.cuda.reset_peak_memory_stats()\nprint(\"FIXER_READY load_s %.1f proc %dx%d timestep %d cudnn_benchmark_disabled %s\" % (time.time() - t0, PROC_H, PROC_W, TIMESTEP, getattr(r, \"cudnn_benchmark_disabled\", None)), flush=True)\nlog = open(os.path.join(OUT, \"fixer_worker.jsonl\"), \"a\", buffering=1)\nlistener = Listener((\"127.0.0.1\", 8091), authkey=b\"navsafe-bench\")\ncalls = 0\nwhile True:\n    conn = listener.accept()\n    try:\n        while True:\n            head = np.frombuffer(conn.recv_bytes(), np.int32)\n            if head[0] == 0:\n                raise EOFError\n            n, h, w = (int(x) for x in head)\n            batch = np.frombuffer(conn.recv_bytes(), np.uint8).reshape(n, h, w, 3)\n            torch.cuda.synchronize(); t = time.perf_counter()\n            out = r.restore(np.ascontiguousarray(batch), bgr=True)\n            torch.cuda.synchronize(); ms = (time.perf_counter() - t) * 1e3\n            conn.send_bytes(np.ascontiguousarray(out).tobytes())\n            log.write(json.dumps({\"call\": calls, \"n\": n, \"restore_ms\": ms, \"max_allocated_mib\": torch.cuda.max_memory_allocated() / 2**20,\n                                  \"max_reserved_mib\": torch.cuda.max_memory_reserved() / 2**20}) + \"\\n\")\n            if calls in (20, 100, 180):                # a few before/after pairs to look at\n                try:\n                    from PIL import Image\n                    for k in range(n):\n                        Image.fromarray(batch[k][:, :, ::-1]).save(os.path.join(OUT, \"sample_call%03d_cam%d_in.jpg\" % (calls, k)), quality=92)\n                        Image.fromarray(out[k][:, :, ::-1]).save(os.path.join(OUT, \"sample_call%03d_cam%d_fixer.jpg\" % (calls, k)), quality=92)\n                except Exception as exc:\n                    print(\"sample save failed\", repr(exc), flush=True)\n            calls += 1\n    except EOFError:\n        conn.close()\n"
  nuplan_training_optimizations.py: "\"\"\"nuPlan NRE ablation entrypoint: lens-only or validated optimizations 2/3/4/5.\n\nInvoked directly with /app/run run-script; all training flags live in the Job YAML.\nSource NCore images, auxiliary labels and cuboid trajectories are never rewritten.\n\"\"\"\nimport os\nimport json\nfrom pathlib import Path\nimport numpy as np\n\nACTOR_SCALE_CAP = 0.5\nDEFORMABLE_RELOCATE_END_STEP = 35000\nRELOCATE_TRACK_FLOOR = {\"dynamic_rigids\": 400, \"static_rigids\": 400, \"dynamic_deformables\": 3000}\nREPORT_DIR = Path(os.environ.get(\"NAVSAFE_REPORT_DIR\", \"/tmp/navsafe_reports\"))\n\ndef _say(*args):\n    print(\"[navsafe-nuplan]\", *args, flush=True)\n\ndef _write_report(name, data):\n    REPORT_DIR.mkdir(parents=True, exist_ok=True)\n    (REPORT_DIR / name).write_text(json.dumps(data, indent=2))\n\n\ndef install_camera_distortion_patch(lens):\n    # nuPlan ships measured Brown-Conrady radial AND tangential coefficients.\n    # Existing matching calibration stays untouched; a conflicting one fails.\n    import dataclasses\n    from ncore.impl.data.v4.compat import SequenceLoaderV4\n    original = SequenceLoaderV4.get_camera_sensor\n    reported = {}\n    def calibrated(self, sensor_id):\n        sensor = original(self, sensor_id)\n        expected = lens[sensor_id]\n        params = sensor._model_parameters\n        radial = np.asarray(expected[\"radial\"], dtype=np.float32)\n        tangential = np.asarray(expected[\"tangential\"], dtype=np.float32)\n        same = np.allclose(params.radial_coeffs, radial, atol=1e-7) and np.allclose(params.tangential_coeffs, tangential, atol=1e-7)\n        if not same:\n            if np.any(params.radial_coeffs) or np.any(params.tangential_coeffs):\n                raise RuntimeError(f\"Conflicting nuPlan calibration: {sensor_id}\")\n            sensor._model_parameters = dataclasses.replace(params, radial_coeffs=radial, tangential_coeffs=tangential)\n        if sensor_id not in reported:\n            reported[sensor_id] = {\"already_correct\": bool(same), **expected}\n            _write_report(\"lens_calibration.json\", reported)\n            _say(\"lens\", sensor_id, \"already correct\" if same else \"restored from DB\")\n        return sensor\n    SequenceLoaderV4.get_camera_sensor = calibrated\n\n\ndef allocate_track_budget(weights, total, floor):\n    \"\"\"Largest-remainder allocation preserving the original layer's total budget.\"\"\"\n    weights = np.asarray(weights, dtype=float)\n    n = len(weights)\n    if not n:\n        return np.array([], dtype=np.int64)\n    floor = min(floor, total // n)\n    shares = weights / weights.sum() * (total - n * floor)\n    counts = np.floor(shares).astype(np.int64) + floor\n    extra = int(total - counts.sum())\n    counts[np.argsort(-(shares - np.floor(shares)), kind=\"stable\")[:extra]] += 1\n    assert int(counts.sum()) == total and np.all(counts > 0)\n    return counts\n\n\ndef install_track_target_patch():\n    import torch\n    import nre.models.gaussians.initializations as initializations\n    original = initializations.DynamicTracksInitialization.initialize_from_datasource\n    reports = []\n    def initialize(self, datasource, **kwargs):\n        tracks = kwargs.get(\"cuboid_tracks\")\n        tokens = list(tracks.tracks_id) if tracks is not None else []\n        if not tokens:\n            return original(self, datasource, **kwargs)\n        dims = tracks.cuboids_dims.detach().cpu().numpy()\n        # Surface area allocates more points to buses and trucks than small actors.\n        weights = np.maximum(dims[:, 0]*dims[:, 1] + dims[:, 0]*dims[:, 2] + dims[:, 1]*dims[:, 2], 1e-6)\n        previous_per_track = self.config.num_point_cloud_points_per_track\n        previous_layer = self.config.num_point_cloud_points_in_layer\n        total = len(tokens) * previous_per_track\n        if previous_layer is not None:\n            total = min(total, previous_layer)\n        floor = 3000 if self.config.get(\"symmetric_axis\") is None else 400\n        counts = allocate_track_budget(weights, total, floor)\n        targets = dict(enumerate(map(int, counts)))\n        saved = initializations.subsample_points\n        # Raise the temporary per-track cap so big actors can reach their allocation.\n        self.config.num_point_cloud_points_per_track = int(counts.max())\n        self.config.num_point_cloud_points_in_layer = total\n        initializations.subsample_points = targeted_subsample(saved, targets)\n        try:\n            result = original(self, datasource, **kwargs)\n        finally:\n            initializations.subsample_points = saved\n            self.config.num_point_cloud_points_per_track = previous_per_track\n            self.config.num_point_cloud_points_in_layer = previous_layer\n        ids = self.gaussian_cuboid_ids\n        ids = torch.cat([g.reshape(-1) for g in ids]) if isinstance(ids, (list, tuple)) else ids.reshape(-1)\n        actual = torch.bincount(ids.long(), minlength=len(tokens)).cpu().tolist()\n        if actual != counts.tolist():\n            raise RuntimeError(f\"Track allocation mismatch: wanted {counts.tolist()}, got {actual}\")\n        reports.append({\"total\": total, \"targets\": {str(t): int(k) for t, k in zip(tokens, counts)}, \"actual\": actual})\n        _write_report(\"track_budgets.json\", reports)\n        _say(\"actor initialization\", len(tokens), \"tracks\", total, \"points; min/max\", int(counts.min()), int(counts.max()))\n        return result\n    initializations.DynamicTracksInitialization.initialize_from_datasource = initialize\n\ndef install_camera_clock_patch(metadata_path):\n    import torch\n    import nre.datasets.ncore as nc\n    from ncore.impl.common.transformations import PoseInterpolator\n\n    raw_clock = json.load(open(metadata_path))[\"clock\"]\n    clock = {camera: {int(stamp): int(capture) for stamp, capture in table.items()}\n             for camera, table in raw_clock.items()}\n    original = nc.NCOREDataSource.get_rig_trajectories\n    reported = {\"done\": False}\n\n    def get_rig_trajectories_capture_clock(self):\n        rts = original(self)\n        stats = {}\n        for rt in rts.rig_trajectories:\n            pose_ts = rt.T_rig_world_timestamps_us.cpu().numpy()\n            lo, hi = int(pose_ts.min()), int(pose_ts.max())\n            for unique_id, ts in list(rt.cameras_frame_timestamps_us.items()):\n                logical = rts.camera_calibrations[unique_id].logical_sensor_name\n                table = clock.get(logical)\n                if table is None:\n                    raise RuntimeError(f\"navsafe nuPlan: no capture clock for camera {logical}\")\n                stamped = ts.cpu().numpy().astype(np.int64)\n                found = np.array([int(e) in table for e in stamped[:, 1]])\n                if not found.all():\n                    raise RuntimeError(f\"navsafe nuPlan: capture clock covers only {found.mean():.1%} of {logical} frames\")\n                capture = np.array([table.get(int(e), int(e)) for e in stamped[:, 1]], dtype=np.int64)\n                clipped = (capture < lo) | (capture > hi)\n                capture = np.clip(capture, lo, hi)\n                for i in range(1, len(capture)):  # keep strictly increasing frame times\n                    if capture[i] <= capture[i - 1]:\n                        capture[i] = stamped[i, 1] if stamped[i, 1] > capture[i - 1] else capture[i - 1] + 1\n                new = np.stack([capture, capture], axis=1)\n                rt.cameras_frame_timestamps_us[unique_id] = torch.from_numpy(new).to(ts.dtype)\n                if rt.cameras_frame_T_rig_worlds is not None and unique_id in rt.cameras_frame_T_rig_worlds:\n                    interp = PoseInterpolator(rt.T_rig_worlds.cpu().numpy(), pose_ts)\n                    T = interp.interpolate_to_timestamps(capture, dtype=np.float64)\n                    rt.cameras_frame_T_rig_worlds[unique_id] = torch.from_numpy(np.stack([T, T], axis=1))\n                off = (capture - stamped[:, 1]) / 1e3\n                stats[logical] = {\n                    \"clipped_logical_times_us\": stamped[:, 1][clipped].tolist(),\n                    \"frames\": len(capture),\n                    \"coverage\": float(found.mean()),\n                    \"offset_ms_median\": float(np.median(off)),\n                    \"offset_ms_min\": float(off.min()),\n                    \"offset_ms_max\": float(off.max()),\n                    \"frames_abs_offset_gt_30ms\": int(np.sum(np.abs(off) > 30)),\n                }\n        if not reported[\"done\"]:\n            reported[\"done\"] = True\n            _write_report(\"camera_clock.json\", {\"metadata\": metadata_path, \"cameras\": stats})\n            _say(\"camera clock:\", json.dumps({k: round(v[\"offset_ms_median\"], 1) for k, v in stats.items()}))\n        return rts\n\n    nc.NCOREDataSource.get_rig_trajectories = get_rig_trajectories_capture_clock\n    _say(\"installed camera capture-clock patch\", metadata_path)\n\n\ndef exact_subsample(num_points, point_clouds, gaussian_cuboid_ids, gaussian_scales, observed_counts):\n    \"\"\"Avoid NRE's per-frame truncation losing points from a track's allocation.\"\"\"\n    import torch\n    sizes = np.asarray([pc.n_points for pc in point_clouds], dtype=np.int64)\n    total = int(sizes.sum())\n    if total <= num_points:\n        return point_clouds, gaussian_cuboid_ids, gaussian_scales, observed_counts\n    shares = sizes * (float(num_points) / total)\n    quotas = np.floor(shares).astype(np.int64)\n    extra = int(num_points - quotas.sum())\n    quotas[np.argsort(-(shares - quotas), kind=\"stable\")[:extra]] += 1\n    out = ([], [], [], [])\n    for pc, gid, scale, observed, quota in zip(point_clouds, gaussian_cuboid_ids, gaussian_scales, observed_counts, quotas):\n        if not quota:\n            continue\n        indices = torch.as_tensor(np.random.choice(pc.n_points, int(quota), replace=False), device=pc.xyz_start.device)\n        for collected,\
    \ part in zip(out, (pc[indices], gid[indices], scale[indices], observed)):\n            collected.append(part)\n    return out\n\n\ndef targeted_subsample(original, targets):\n    \"\"\"Replacement for NRE's subsample_points that gives every track its own number of points.\n\n    NRE fills each track of a layer to the same per-track count and then thins the whole layer by one\n    ratio, so a telehandler and a cone start with the same number of Gaussians. Relocation does not\n    repair that: Gaussians of small objects stay faintly visible instead of dying, so in the first\n    scene-budget run the telehandler ended at 8k of its 27k target. Here the layer-wide thinning is\n    replaced by one pass per track down to targets[track index]; measured (LiDAR) points are kept\n    before random filler. Calls that cover a single track are NRE's own per-track step and pass through.\n    \"\"\"\n\n    def subsample(num_points, point_clouds, gaussian_cuboid_ids, gaussian_scales, observed_counts):\n        owner = [int(g.reshape(-1)[0]) if g.numel() else None for g in gaussian_cuboid_ids]\n        tracks = sorted({t for t in owner if t is not None})\n        if len(tracks) <= 1 or any(t not in targets for t in tracks):\n            return exact_subsample(num_points, point_clouds, gaussian_cuboid_ids, gaussian_scales, observed_counts)\n        out = ([], [], [], [])\n        for track in tracks:\n            pieces = [i for i, o in enumerate(owner) if o == track]\n            measured = [i for i in pieces if observed_counts[i] > 0]\n            filler = [i for i in pieces if observed_counts[i] == 0]\n            n_measured = sum(point_clouds[i].n_points for i in measured)\n            want = targets[track]\n            parts = []\n            if n_measured > 0:\n                parts.append((min(want, n_measured), measured))\n            if filler and want > n_measured:\n                parts.append((want - n_measured, filler))\n            for n, selection in parts:\n                kept = exact_subsample(n, [point_clouds[i] for i in selection], [gaussian_cuboid_ids[i] for i in selection],\n                                [gaussian_scales[i] for i in selection], [observed_counts[i] for i in selection])\n                for collected, part in zip(out, kept):\n                    collected.extend(part)\n        return out\n\n    return subsample\n\n\ndef protect_track_floor(model, floor, opacity_threshold):\n    \"\"\"Keep at least `floor` Gaussians in every track of this layer during the next relocation pass.\n\n    Relocation takes dead Gaussians (opacity <= threshold) from anywhere in the layer and re-creates them on\n    alive ones sampled by opacity, so a small or rarely seen object can be emptied by its neighbours (e08a9f05:\n    one of two dynamic_deformables tracks ended with 0 of 60000). For every track with fewer than `floor`\n    alive Gaussians, enough of its dead ones are lifted just above the threshold to stay where they are.\n    Returns the number of Gaussians held back.\n    \"\"\"\n    import torch\n\n    ids = model.gaussian_cuboid_ids.long().view(-1)\n    opacity = model.get_densities().detach().view(-1)\n    dead = opacity <= opacity_threshold\n    if not bool(dead.any()):\n        return 0\n    n_tracks = int(ids.max()) + 1\n    need = (floor - torch.bincount(ids[~dead], minlength=n_tracks)).clamp(min=0)\n    dead_idx = torch.where(dead)[0]\n    order = torch.argsort(ids[dead_idx], stable=True)\n    sorted_idx, sorted_ids = dead_idx[order], ids[dead_idx][order]\n    rank = torch.arange(len(sorted_ids), device=ids.device) - torch.searchsorted(sorted_ids, sorted_ids)\n    keep = sorted_idx[rank < need[sorted_ids]]\n    if len(keep):\n        lifted = torch.full((len(keep),), opacity_threshold * 1.05, dtype=model.densities.dtype, device=ids.device)\n        with torch.no_grad():\n            model.densities.data.view(-1)[keep] = model.density_activation_inv(lifted)\n    return int(len(keep))\n\n\ndef cap_actor_scales(model, factor):\n    \"\"\"Keep every Gaussian of an actor layer no larger than `factor` x the longest side of its object's box.\n\n    Nothing bounds the scale of actor Gaussians (the layers are outside the MCMC strategy), and over long runs a few\n    grow to metres inside sub-metre objects: 660c2f7a sbt had 13 opaque dynamic-rigid Gaussians above 1 m at 40k\n    steps and 62 at 80k, one of them 19 m long in a 0.3 x 0.6 x 1.7 m object, which shows as a dark band on the road.\n    Returns the number of Gaussians that were clamped.\n    \"\"\"\n    import torch\n\n    tracks = getattr(model, \"cuboid_tracks\", None)\n    if tracks is None:\n        return 0\n    ids = model.gaussian_cuboid_ids.long().view(-1)\n    limit = (tracks.cuboids_dims.max(dim=1).values * factor)[ids].unsqueeze(-1)\n    raw_limit = model.scale_activation_inv(limit).to(model.scales.dtype).expand_as(model.scales.data)\n    with torch.no_grad():\n        over = int((model.scales.data > raw_limit).any(dim=1).sum())\n        if over:\n            model.scales.data.copy_(torch.minimum(model.scales.data, raw_limit))\n    return over\n\n\ndef install_actor_relocation_patch(layers):\n    \"\"\"Relocate dead Gaussians inside each actor layer on the MCMC relocation schedule.\n\n    v2 keeps actor layers out of the global MCMC so the background cannot drain them, but then\n    nothing recycles their dead Gaussians: in the v2 3M/40k checkpoint 96-98% of every actor\n    layer ended with opacity < 0.05. Here each listed layer gets its own relocation pass: dead\n    Gaussians (opacity <= threshold) move onto alive ones of the same layer (cuboid ids follow\n    the target), counts stay fixed, nothing crosses layers. Death is opacity-only; the\n    invisible-steps rule would recycle actors that are simply off-screen for a while.\n\n    Deformable layers degrade when this keeps running: 660c2f7a checkpoints after relocation\n    to 35k / 70k / 140k steps had 0 / 3 / 6 of 9 dynamic_deformables tracks collapsed into\n    needles (median anisotropy > 100, scales of metres) and the cyclist lost 2/3 of its\n    Gaussians to other tracks; without relocation (v2, 160k) none collapse. Rigid layers stay\n    healthy at every length. NUR_V3_DEFORMABLE_RELOCATE_END_STEP stops it for deformables only.\n    \"\"\"\n    from nre.models.gaussians.strategies.mcmc import MCMCStrategy\n\n    original = MCMCStrategy.update_step_train_batch_end\n    logged = {\"n\": 0, \"budget\": False}\n\n    def update_step_with_actor_relocation(self, epoch, global_step, batch, system, gaussians_nodes, **kwargs):\n        if not logged[\"budget\"]:\n            actor_count = sum(gaussians_nodes[k].get_num_gaussians() for k in layers if k in gaussians_nodes)\n            original_budget = self.config.add.max_n_gaussians\n            self.config.add.max_n_gaussians = original_budget - actor_count\n            if self.config.add.max_n_gaussians <= 0:\n                raise RuntimeError(\"Actors exceed the legacy Gaussian budget\")\n            _write_report(\"global_budget.json\", {\"original_eligible_budget\": original_budget, \"fixed_actor_points\": actor_count, \"background_budget\": self.config.add.max_n_gaussians, \"road_budget_unchanged\": True})\n            _say(\"background budget\", self.config.add.max_n_gaussians, \"actor budget\", actor_count)\n            logged[\"budget\"] = True\n        original(self, epoch, global_step, batch, system, gaussians_nodes, **kwargs)\n        relocate = self.config.relocate\n        if ACTOR_SCALE_CAP > 0 and global_step % relocate.frequency == 0:\n            capped = {layer: cap_actor_scales(gaussians_nodes[layer], ACTOR_SCALE_CAP) for layer in layers\n                      if layer in gaussians_nodes and gaussians_nodes[layer].get_num_gaussians() > 0}\n            if global_step % (50 * relocate.frequency) == 0:\n                _say(\"actor scale cap at step\", global_step, \"clamped\", capped)\n        if not self._check_step_condition(\n            step=global_step, start=relocate.start_iteration, end=relocate.end_iteration, freq=relocate.frequency\n        ):\n            return\n        saved_exclude, saved_invisible = list(self.config.exclude_layer_ids), relocate.max_invisible_steps\n        held = {}\n        try:\n            relocate.max_invisible_steps = None\n            for layer in layers:\n                if layer not in gaussians_nodes or gaussians_nodes[layer].get_num_gaussians() == 0:\n                    continue\n                if \"deformables\" in layer and 0 < DEFORMABLE_RELOCATE_END_STEP < global_step:\n                    continue\n                if RELOCATE_TRACK_FLOOR.get(layer, 0) > 0:\n                    held[layer] = protect_track_floor(gaussians_nodes[layer], RELOCATE_TRACK_FLOOR[layer], self.config.opacity_threshold)\n                self.config.exclude_layer_ids = [name for name in gaussians_nodes.keys() if name != layer]\n                self.relocate_gaussians(gaussians_nodes)\n        finally:\n            self.config.exclude_layer_ids = saved_exclude\n            relocate.max_invisible_steps = saved_invisible\n        if logged[\"n\"] < 3:\n            logged[\"n\"] += 1\n            _say(\"actor relocation pass at step\", global_step, \"layers\", layers, \"held back by track floor\", held)\n\n    MCMCStrategy.update_step_train_batch_end = update_step_with_actor_relocation\n    _say(\"installed actor-layer relocation patch\", layers, \"deformable end step\", DEFORMABLE_RELOCATE_END_STEP or \"same as rigid\",\n         \"track floor\", RELOCATE_TRACK_FLOOR or \"none\", \"scale cap\", ACTOR_SCALE_CAP or \"none\")\n\n\n\ndef install_actor_health_logging():\n    \"\"\"Observe actor survival and scale at identical steps in both variants.\"\"\"\n    import torch\n    from nre.models.gaussians.strategies.mcmc import MCMCStrategy\n    original = MCMCStrategy.update_step_train_batch_end\n    def update(self, epoch, global_step, batch, system, gaussians_nodes, **kwargs):\n        original(self,\
    \ epoch, global_step, batch, system, gaussians_nodes, **kwargs)\n        if global_step % 5000:\n            return\n        row = {\"step\": global_step, \"layers\": {}}\n        with torch.no_grad():\n            for name in RELOCATE_TRACK_FLOOR:\n                if name not in gaussians_nodes:\n                    continue\n                model = gaussians_nodes[name]\n                if model.get_num_gaussians() == 0:\n                    continue\n                ids = model.gaussian_cuboid_ids.long().view(-1)\n                n_tracks = len(model.cuboid_tracks.tracks_id)\n                opacity = model.get_densities().view(-1)\n                counts = torch.bincount(ids, minlength=n_tracks)\n                alive = torch.bincount(ids[opacity > self.config.opacity_threshold], minlength=n_tracks)\n                row[\"layers\"][name] = {\"points\": int(counts.sum()), \"tracks\": n_tracks, \"empty_tracks\": int((counts == 0).sum()), \"tracks_without_live_points\": int((alive == 0).sum()), \"opacity_le_005_fraction\": float((opacity <= 0.05).float().mean()), \"track_counts\": counts.cpu().tolist(), \"live_track_counts\": alive.cpu().tolist()}\n        _write_report(f\"actor_health_{global_step:06d}.json\", row)\n    MCMCStrategy.update_step_train_batch_end = update\n\n\ndef install_weights_only_validation():\n    \"\"\"NRE already loads the stripped USDZ weights in its model constructor.\n\n    Prevent Lightning's second restore from expecting discarded training-loop\n    state. This hook is installed only in evaluation processes, never training.\n    \"\"\"\n    import pytorch_lightning as pl\n    original = pl.Trainer.validate\n    def validate(self, *args, **kwargs):\n        if kwargs.get(\"ckpt_path\"):\n            _say(\"evaluating restored artifact weights; skipping training-loop restore\")\n            kwargs[\"ckpt_path\"] = None\n        return original(self, *args, **kwargs)\n    pl.Trainer.validate = validate\n\n\ndef install_paired_evaluation_logging():\n    \"\"\"Record original image timestamps, so 20s and four 5s models pair exactly.\"\"\"\n    from nre.systems.base import BaseSystemSO\n    original = BaseSystemSO.collect_metric\n    finish = BaseSystemSO.on_validation_end\n    rows = []\n    def collect(self, name, value, is_lidar=False, frame_meta=None, timestamps_startend_us=None, sequence_id=None, reduce_fx=None):\n        if frame_meta is not None and not is_lidar:\n            ds = self.datamodule.get_datasource()\n            camera = ds.all_camera_ids[frame_meta.unique_sensor_idx]\n            idx = frame_meta.unique_frame_idx - ds.camera_linear_start_frame_indices[camera] + ds.camera_frame_ranges[camera].start\n            stamp = int(ds.camera_sensors[camera].get_frame_timestamp_us(idx))\n            rows.append({\"camera\": camera, \"image_timestamp_us\": stamp, \"metric\": name, \"value\": float(value)})\n        return original(self, name, value, is_lidar=is_lidar, frame_meta=frame_meta, timestamps_startend_us=timestamps_startend_us, sequence_id=sequence_id, reduce_fx=reduce_fx)\n    def end(self):\n        finish(self)\n        _write_report(\"paired_metrics.json\", rows)\n        _say(\"paired evaluation\", len(rows), \"metric samples\")\n    BaseSystemSO.collect_metric = collect\n    BaseSystemSO.on_validation_end = end\n\n\ndef main():\n    audit_path = os.environ[\"NAVSAFE_INPUT_AUDIT\"]\n    audit = json.loads(Path(audit_path).read_text())\n    variant = os.environ[\"NAVSAFE_VARIANT\"]\n    install_camera_distortion_patch(audit[\"lens\"])\n    if variant in (\"v2\", \"eval_capture\"):\n        install_camera_clock_patch(audit_path)\n    if variant == \"v2\":\n        install_track_target_patch()\n        install_actor_relocation_patch([\"dynamic_rigids\", \"dynamic_deformables\", \"static_rigids\"])\n    elif variant not in (\"v1\", \"eval_capture\", \"eval_legacy\"):\n        raise ValueError(variant)\n    if variant in (\"v1\", \"v2\"):\n        install_actor_health_logging()\n    else:\n        install_weights_only_validation()\n        install_paired_evaluation_logging()\n    args = [a for a in Path(os.environ[\"NAVSAFE_ARGS_FILE\"]).read_text().splitlines() if a]\n    _say(\"variant\", variant, \"optimizations\", [2, 3, 4, 5] if variant == \"v2\" else [3])\n    from nre.run.main import main as nre_main\n    nre_main.main(args=args, standalone_mode=False)\n\nif __name__ == \"__main__\":\n    main()\n"
  patch_batch.py: "\"\"\"Patch a CHECKOUT of navsafe/render/nurec_grpc.py (inside the benchmark job): render all cameras of one step with ONE\nbatch_render_rgb call instead of one render_rgb call per camera.\n\nEach camera's RGBRenderRequest is built by the unchanged _render_one code (the send is intercepted, so the request is\nbyte-for-byte the one the per-camera path would send), then the requests go out together as BatchRGBRenderRequest items.\nThe returned images are decoded by the unchanged _decode. A failed item raises inside the original try block.\nEach replacement must match exactly once.\n\"\"\"\nimport sys\n\npath = sys.argv[1]\nsrc = open(path).read()\nfor old, new in (\n    ('        images: Dict[str, np.ndarray] = {}\\n        for name, cfg in cam_configs.items():\\n',\n     '        images: Dict[str, np.ndarray] = {}\\n'\n     '        _pre = {}\\n'\n     '        if self._renderable and len(cam_configs) > 1:\\n'\n     '            _reqs, _names = [], []\\n'\n     '            self._send_render = lambda req, t0us: (_reqs.append(req), b\"\")[1]\\n'\n     '            try:\\n'\n     '                for _n, _c in cam_configs.items():\\n'\n     '                    _k = len(_reqs)\\n'\n     '                    self._render_one(_n, _c, rig2world, t0, dyn_objs)\\n'\n     '                    if len(_reqs) > _k:\\n'\n     '                        _names.append(_n)\\n'\n     '            finally:\\n'\n     '                del self._send_render\\n'\n     '            if _names:\\n'\n     '                _sspb = self._g[\"sspb\"]\\n'\n     '                _ret = self._batch_call(_sspb.BatchRGBRenderRequest(items=[\\n'\n     '                    _sspb.BatchRGBRenderRequestItem(camera_name=_n, request=_r)\\n'\n     '                    for _n, _r in zip(_names, _reqs)]))\\n'\n     '                assert sorted(i.camera_name for i in _ret.items) == sorted(_names), \"batch reply does not match the request\"\\n'\n     '                for _it in _ret.items:\\n'\n     '                    _pre[_it.camera_name] = _it\\n'\n     '        for name, cfg in cam_configs.items():\\n'),\n    ('                    rgb = self._render_one(name, cfg, rig2world, t0, dyn_objs)\\n',\n     '                    if name in _pre:\\n'\n     '                        if not _pre[name].success:\\n'\n     '                            raise RuntimeError(\"batch_render_rgb item failed: \" + _pre[name].error_message)\\n'\n     '                        rgb = self._decode(_pre[name].result.image_bytes)\\n'\n     '                    else:\\n'\n     '                        rgb = self._render_one(name, cfg, rig2world, t0, dyn_objs)\\n'),\n    ('    def _send_render(self, req, t0: int) -> bytes:\\n',\n     '    def _batch_call(self, breq):\\n'\n     '        return self._stub.batch_render_rgb(breq, timeout=self._timeout)\\n\\n'\n     '    def _send_render(self, req, t0: int) -> bytes:\\n'),\n):\n    assert src.count(old) == 1, (src.count(old), old)\n    src = src.replace(old, new)\nopen(path, 'w').write(src)\nprint('BATCH_RENDER_PATCHED', path)\n"
  patch_fixer.py: "\"\"\"Patch a CHECKOUT of navsafe/render/nurec_grpc.py (inside the benchmark job): send the rendered camera images of a\nstep through the Odyssey Fixer worker (cfg/fixer_worker.py) before they are returned to the policy.\n\nThis REPLACES the renderer's Harmonizer with a different enhancer, so the images are different by design.\nEach replacement must match exactly once.\n\"\"\"\nimport sys\n\npath = sys.argv[1]\nsrc = open(path).read()\nfor old, new in (\n    ('        if self._render_steps is not None:\\n            self._last_images = {k: v.copy() for k, v in images.items()}\\n        return images\\n',\n     '        images = self._fixer_restore(images)\\n'\n     '        if self._render_steps is not None:\\n            self._last_images = {k: v.copy() for k, v in images.items()}\\n        return images\\n'),\n    ('    def _send_render(self, req, t0: int) -> bytes:\\n',\n     '    def _fixer_restore(self, images):\\n'\n     '        if not images:\\n'\n     '            return images\\n'\n     '        if getattr(self, \"_fixer_conn\", None) is None:\\n'\n     '            from multiprocessing.connection import Client\\n'\n     '            self._fixer_conn = Client((\"127.0.0.1\", 8091), authkey=b\"navsafe-bench\")\\n'\n     '        names = list(images)\\n'\n     '        batch = np.ascontiguousarray(np.stack([images[n] for n in names]))\\n'\n     '        n, h, w, _ = batch.shape\\n'\n     '        self._fixer_conn.send_bytes(np.array([n, h, w], np.int32).tobytes())\\n'\n     '        self._fixer_conn.send_bytes(batch.tobytes())\\n'\n     '        out = np.frombuffer(self._fixer_conn.recv_bytes(), np.uint8).reshape(n, h, w, 3)\\n'\n     '        return {name: out[i].copy() for i, name in enumerate(names)}\\n\\n'\n     '    def _send_render(self, req, t0: int) -> bytes:\\n'),\n):\n    assert src.count(old) == 1, (src.count(old), old)\n    src = src.replace(old, new)\nopen(path, 'w').write(src)\nprint('FIXER_PATCHED', path)\n"
  patch_noisaac.py: "\"\"\"Patch a CHECKOUT (inside the benchmark job) so the evaluator runs WITHOUT Isaac Sim / Isaac Lab.\n\nAn experiment, not a proposal: it answers \"what does the evaluation lose when the simulator app is never started\".\n  * eval_entry.py: no glib preload re-exec, no AppLauncher; `simulation_app` becomes a stub.\n  * navsafe_env.py: with NAVSAFE_NO_ISAAC=1 the IsaacLab import is treated as missing, which selects the\n    environment's own pure-Python path (`_HAS_ISAACLAB = False`).\nEach replacement must match exactly once.\n\"\"\"\nimport sys\n\nroot = sys.argv[1]\nfor path, pairs in (\n    (root + \"/navsafe/cli/eval_entry.py\", (\n        ('ensure_isaac_glib_preload()\\n', 'pass  # no Isaac: nothing to preload\\n'),\n        ('from isaaclab.app import AppLauncher\\n\\nAppLauncher.add_app_launcher_args(ap)\\n', ''),\n        ('app_launcher = AppLauncher(args)\\nsimulation_app = app_launcher.app\\n',\n         'class _NoApp:\\n    def close(self):\\n        pass\\n\\n\\nsimulation_app = _NoApp()\\nprint(\"[navsafe-eval] NO ISAAC: AppLauncher skipped\", flush=True)\\n'),\n    )),\n    (root + \"/navsafe/env/navsafe_env.py\", (\n        ('try:\\n    from isaaclab.envs import DirectRLEnv\\n',\n         'try:\\n    if os.environ.get(\"NAVSAFE_NO_ISAAC\") == \"1\":\\n        raise ImportError(\"NAVSAFE_NO_ISAAC=1\")\\n    from isaaclab.envs import DirectRLEnv\\n'),\n    )),\n):\n    src = open(path).read()\n    for old, new in pairs:\n        assert src.count(old) == 1, (path, src.count(old), old)\n        src = src.replace(old, new)\n    open(path, 'w').write(src)\nprint('NO_ISAAC_PATCHED', root)\n"
  patch_parallel.py: "\"\"\"Patch a CHECKOUT of navsafe/render/nurec_grpc.py (inside the benchmark job): send the camera requests of one step\nat the same time instead of one after the other.\n\nThe requests of one step are independent: the same timestamp, the same rig pose and the same dynamic-object list, one\ncamera each. Each camera's request and its decoding are unchanged (the same _render_one call); only the waiting\noverlaps. Errors surface in the same place, because the result is read inside the original try block.\nEach replacement must match exactly once.\n\"\"\"\nimport sys\n\npath = sys.argv[1]\nsrc = open(path).read()\nfor old, new in (\n    ('        images: Dict[str, np.ndarray] = {}\\n        for name, cfg in cam_configs.items():\\n',\n     '        images: Dict[str, np.ndarray] = {}\\n'\n     '        _pre = {}\\n'\n     '        if self._renderable and len(cam_configs) > 1:\\n'\n     '            from concurrent.futures import ThreadPoolExecutor\\n'\n     '            with ThreadPoolExecutor(len(cam_configs)) as _ex:\\n'\n     '                _pre = {n: _ex.submit(self._render_one, n, c, rig2world, t0, dyn_objs)\\n'\n     '                        for n, c in cam_configs.items()}\\n'\n     '        for name, cfg in cam_configs.items():\\n'),\n    ('                    rgb = self._render_one(name, cfg, rig2world, t0, dyn_objs)\\n',\n     '                    rgb = (_pre[name].result() if name in _pre\\n'\n     '                           else self._render_one(name, cfg, rig2world, t0, dyn_objs))\\n'),\n):\n    assert src.count(old) == 1, (src.count(old), old)\n    src = src.replace(old, new)\nopen(path, 'w').write(src)\nprint('PARALLEL_CAMERAS_PATCHED', path)\n"
  patch_raw.py: "\"\"\"Patch a CHECKOUT of navsafe/render/nurec_grpc.py (inside the benchmark job) to ask the renderer for raw pixels.\n\nThe repository requests JPEG quality 95 for every camera image and decodes it with PIL. The protocol also offers\nRGB_UINT8_PLANAR (uncompressed, 3 x H x W). Each replacement must match exactly once.\n\"\"\"\nimport sys\n\npath = sys.argv[1]\nsrc = open(path).read()\nfor old, new in (\n    ('image_format=g[\"ImageFormat\"].JPEG, image_quality=95,',\n     'image_format=g[\"ImageFormat\"].RGB_UINT8_PLANAR,'),\n    ('        return self._decode(self._send_render(req, int(t0)))\\n',\n     '        return self._decode_planar(self._send_render(req, int(t0)), h, w)\\n'),\n    ('    @staticmethod\\n    def _decode(image_bytes: bytes) -> Optional[np.ndarray]:\\n',\n     '    @staticmethod\\n    def _decode_planar(image_bytes: bytes, h: int, w: int) -> Optional[np.ndarray]:\\n'\n     '        if not image_bytes:\\n            return None\\n'\n     '        assert len(image_bytes) == 3 * h * w, (len(image_bytes), h, w)\\n'\n     '        return np.ascontiguousarray(np.frombuffer(image_bytes, np.uint8).reshape(3, h, w).transpose(1, 2, 0))\\n\\n'\n     '    @staticmethod\\n    def _decode(image_bytes: bytes) -> Optional[np.ndarray]:\\n'),\n):\n    assert src.count(old) == 1, (src.count(old), old)\n    src = src.replace(old, new)\nopen(path, 'w').write(src)\nprint('RAW_PIXELS_PATCHED', path)\n"
  prepare_bench.py: "\"\"\"Hand-off string for one continuous 20 s reconstruction (no legacy 5 s windows, no render-clock clamp).\"\"\"\nimport argparse\nimport json\nfrom pathlib import Path\nimport zipfile\n\np = argparse.ArgumentParser()\np.add_argument('--scenario', required=True)\np.add_argument('--artifact', required=True)\np.add_argument('--origin-file', required=True)\np.add_argument('--output-dir', required=True, type=Path)\na = p.parse_args()\nwith zipfile.ZipFile(a.artifact) as z:\n    data = json.loads(z.read('rig_trajectories.json'))\nr = data['rig_trajectories'][0]\nassert r['sequence_id'] == a.scenario, r['sequence_id']\ncams = sorted(k.split('@')[0] for k in data['camera_calibrations'])\nrow = {'scene_id': a.scenario, 'artifact': a.artifact, 'origin_file': a.origin_file,\n       't_start_us': int(r['T_rig_world_timestamps_us'][0]), 't_stop_us': int(r['T_rig_world_timestamps_us'][-1]) + 1}\nprepared = {'scenario': a.scenario, 'cameras_in_model': cams, 'handoff_rows': [row],\n            'handoff_string': f\"{row['scene_id']},{row['origin_file']},{row['t_start_us']},{row['t_stop_us']}\"}\na.output_dir.mkdir(parents=True, exist_ok=True)\n(a.output_dir / 'prepared_inputs.json').write_text(json.dumps(prepared, indent=2))\nprint('PREPARED', a.scenario, 'cameras', cams, flush=True)\n"
  prepare_inputs.py: "\"\"\"Audit aligned recon windows and export the exact logged physical trajectory.\"\"\"\nimport argparse\nimport json\nimport os\nfrom pathlib import Path\nimport zipfile\n\nimport numpy as np\nfrom navsafe.scenario.py123d_dataset import scenario_description_by_index, list_scene_ids\n\nROOT = Path('/avl-west/navsafe_nuplan_dense_20261006')\nBUNDLES = Path('/avl-west/navsafe_eval/full_test')\n\n\ndef rig(path):\n    with zipfile.ZipFile(path) as z:\n        data = json.loads(z.read('rig_trajectories.json'))\n    return data, data['rig_trajectories'][0]\n\n\ndef main():\n    p = argparse.ArgumentParser()\n    p.add_argument('--scenario', required=True)\n    p.add_argument('--method', choices=['legacy', 'v2'], required=True)\n    p.add_argument('--output-dir', required=True, type=Path)\n    a = p.parse_args(); C = a.scenario; out = a.output_dir\n    out.mkdir(parents=True, exist_ok=True)\n    arrow = BUNDLES / C / 'arrow'\n    ids = list_scene_ids(arrow)\n    assert len(ids) == 1, ids\n    sd = scenario_description_by_index(arrow, 0)\n    meta = sd['metadata']; track = sd['tracks'][meta['sdc_id']]['state']\n    timestamps = np.asarray(meta['ts'], dtype=np.int64)\n    assert len(timestamps) == 200, len(timestamps)\n    reference = {'scenario': C, 'arrow_scene_id': ids[0], 'positions': np.asarray(track['position']).tolist(),\n                 'headings': np.asarray(track['heading']).tolist(), 'timestamps_us': timestamps.tolist(),\n                 'origin_xy': meta.get('scenario_origin_xy'), 'coordinate': meta['coordinate'],\n                 'sampling_hz': 10, 'ego_reference': 'same recentered Arrow bounding-box center as evaluator'}\n    (out / 'log_reference.json').write_text(json.dumps(reference))\n    old = []\n    for s in range(1, 5):\n        E = f'{C}s{s}'\n        artifact = Path('/avl-west/navsafe_5s_500') / E / 'output_5cam' / E / 'artifacts/last.usdz'\n        data, r = rig(artifact)\n        cameras = {k.split('@')[0] for k in data['camera_calibrations']}\n        assert {'camera_pcam_f0', 'camera_pcam_b0', 'camera_pcam_l0', 'camera_pcam_r0'} <= cameras, cameras\n        old.append({'scene_id': E, 'artifact': str(artifact),\n                    'origin_file': str(Path('/avl-west/navsafe_5s_500') / E / 'clips' / E / 'nurec_origin_offset.json'),\n                    't_start_us': int(r['T_rig_world_timestamps_us'][0]),\n                    't_stop_us': int(r['T_rig_world_timestamps_us'][-1]) + 1})\n    common = timestamps.copy()\n    for index in range(200):\n        row = old[index // 50]\n        common[index] = np.clip(timestamps[index], row['t_start_us'], row['t_stop_us'] - 1)\n    if a.method == 'legacy':\n        handoff = old\n    else:\n        artifact = ROOT / 'train/v2' / C / 'artifacts/last.usdz'\n        data, r = rig(artifact)\n        assert {'camera_pcam_f0', 'camera_pcam_b0', 'camera_pcam_l0', 'camera_pcam_r0'} <= {k.split('@')[0] for k in data['camera_calibrations']}\n        handoff = [{'scene_id': C, 'artifact': str(artifact),\n                    'origin_file': str(ROOT / 'inputs' / C / 'clips' / C / 'nurec_origin_offset.json'),\n                    't_start_us': int(r['T_rig_world_timestamps_us'][0]),\n                    't_stop_us': int(r['T_rig_world_timestamps_us'][-1]) + 1}]\n    prepared = {'scenario': C, 'method': a.method, 'arrow_scene_id': ids[0], 'frame_count': 200,\n                'nominal_sim_timestamps_us': timestamps.tolist(), 'shared_render_timestamps_us': common.tolist(),\n                'clamp_us': (common - timestamps).tolist(), 'handoff_rows': handoff,\n                'handoff_string': ';'.join(f\"{r['scene_id']},{r['origin_file']},{r['t_start_us']},{r['t_stop_us']}\" for r in handoff),\n                'boundary_policy': 'Both recipes clamp renderer clock to same legacy coverage; physical simulation/traffic clock untouched',\n                'render_pose_clamp_m': 0, 'handoff_mode': 'time', 'traffic_mode': 'log_replay',\n                'controller': 'pure_pursuit', 'warmup_frames': 8, 'scored_frame_limit': 192, 'seed': 42}\n    (out / 'prepared_inputs.json').write_text(json.dumps(prepared, indent=2))\n    print('PREPARED', C, a.method, 'frames', 200, 'shared_clock_clamps', int((common != timestamps).sum()),\n          'max_clamp_us', int(np.max(abs(common - timestamps))), flush=True)\n\n\nif __name__ == '__main__':\n    main()\n"
  run_bench.py: "\"\"\"Run the repository's closed-loop CLI unchanged and time every render call of the NuRec gRPC backend.\n\nWrites $BENCH_OUT/render_timing.jsonl:\n  {\"kind\": \"rgb\", \"ms\": ..., \"bytes\": ..., \"h\": ..., \"w\": ..., \"t\": ...}   one renderer round trip (one camera image)\n  {\"kind\": \"step\", \"ms\": ..., \"cameras\": [...], \"t\": ...}                  one get_camera_images call (all cameras)\n  {\"kind\": \"decode\", \"fn\": ..., \"ms\": ..., \"bytes\": ...}                   decoding one returned image on the client\nNothing in the renderer or the policy is changed; the hook only wraps two methods with a clock.\n\"\"\"\nimport importlib.abc\nimport importlib.machinery\nimport json\nimport os\nimport runpy\nimport sys\nimport time\n\nLOG = open(os.path.join(os.environ['BENCH_OUT'], 'render_timing.jsonl'), 'a', buffering=1)\n\n# BENCH_PROF=1: attribute the time of get_camera_images. A sampler thread reads the main thread's stack every 10 ms\n# while a step is running; each step row also gets the process CPU time, the main thread CPU time and the cgroup\n# throttling counters. Nothing in the rendered images or the policy input changes.\nPROF = os.environ.get('BENCH_PROF') == '1'\nIN_STEP = [False]\nSTEP_NO = [-1]\nSAMPLES = {}\n\n\ndef _cgroup():\n    out = {}\n    try:\n        for line in open('/sys/fs/cgroup/cpu.stat'):\n            k, v = line.split()\n            out[k] = int(v)\n    except OSError:\n        pass\n    return out\n\n\ndef _sampler(main_id):\n    import collections\n    while True:\n        time.sleep(0.01)\n        if not IN_STEP[0]:\n            continue\n        frame = sys._current_frames().get(main_id)\n        nav, leaf = [], None\n        while frame is not None:\n            code = frame.f_code\n            if leaf is None:\n                leaf = '%s:%s:%d' % (os.path.basename(code.co_filename), code.co_name, frame.f_lineno)\n            if '/navsafe/' in code.co_filename and len(nav) < 3:\n                nav.append('%s:%s:%d' % (os.path.basename(code.co_filename), code.co_name, frame.f_lineno))\n            frame = frame.f_back\n        key = ' <- '.join(nav) + ' || leaf ' + str(leaf)\n        SAMPLES[key] = SAMPLES.get(key, 0) + 1\n\n\ndef _dump_samples():\n    with open(os.path.join(os.environ['BENCH_OUT'], 'stack_samples.json'), 'w') as f:\n        json.dump(sorted(SAMPLES.items(), key=lambda kv: -kv[1]), f, indent=1)\n\n\nif PROF:\n    import atexit\n    import threading\n    threading.Thread(target=_sampler, args=(threading.main_thread().ident,), daemon=True).start()\n    atexit.register(_dump_samples)\n\n\ndef instrument(module):\n    backends = [obj for obj in vars(module).values()\n                if isinstance(obj, type) and '_send_render' in vars(obj) and 'get_camera_images' in vars(obj)]\n    assert len(backends) == 1, backends\n    backend = backends[0]\n    send, images = backend._send_render, backend.get_camera_images\n\n    def timed_send(self, req, t0):\n        start = time.perf_counter()\n        out = send(self, req, t0)\n        LOG.write(json.dumps({'kind': 'rgb', 'ms': (time.perf_counter() - start) * 1e3, 'bytes': len(out),\n                              'h': int(getattr(req, 'resolution_h', 0)), 'w': int(getattr(req, 'resolution_w', 0)),\n                              't': time.time()}) + '\\n')\n        return out\n\n    def timed_images(self, *args, **kwargs):\n        if PROF:\n            cpu0, thr0, cg0 = time.process_time(), time.thread_time(), _cgroup()\n            IN_STEP[0] = True\n        start = time.perf_counter()\n        out = images(self, *args, **kwargs)\n        row = {'kind': 'step', 'ms': (time.perf_counter() - start) * 1e3,\n               'cameras': sorted(out) if isinstance(out, dict) else None, 't': time.time()}\n        if PROF:\n            IN_STEP[0] = False\n            cg1 = _cgroup()\n            row.update(proc_cpu_ms=(time.process_time() - cpu0) * 1e3, main_thread_cpu_ms=(time.thread_time() - thr0) * 1e3,\n                       throttled_ms=(cg1.get('throttled_usec', 0) - cg0.get('throttled_usec', 0)) / 1e3,\n                       nr_throttled=cg1.get('nr_throttled', 0) - cg0.get('nr_throttled', 0),\n                       cg_usage_ms=(cg1.get('usage_usec', 0) - cg0.get('usage_usec', 0)) / 1e3)\n            if _dump_samples and len(SAMPLES) and int(row['t']) % 20 == 0:\n                _dump_samples()\n        LOG.write(json.dumps(row) + '\\n')\n        if PROF and isinstance(out, dict):\n            # Fingerprint of what the policy receives, taken after the clock stopped: exact hash + a coarse 8x8 mean\n            # grid per camera. Lets two variants be compared image by image without saving the images.\n            import hashlib\n            import numpy as np\n            STEP_NO[0] += 1\n            for cam in sorted(out):\n                a = np.ascontiguousarray(out[cam])\n                hh, ww = (a.shape[0] // 8) * 8, (a.shape[1] // 8) * 8\n                grid = a[:hh, :ww].reshape(8, hh // 8, 8, ww // 8, -1).mean(axis=(1, 3, 4))\n                LOG.write(json.dumps({'kind': 'img', 'call': STEP_NO[0], 'cam': cam, 'shape': list(a.shape),\n                                      'sha1': hashlib.sha1(a.tobytes()).hexdigest(), 'mean': float(a.mean()),\n                                      'grid': [round(float(x), 3) for x in grid.ravel()]}) + '\\n')\n        return out\n\n    backend._send_render, backend.get_camera_images = timed_send, timed_images\n    if '_fixer_restore' in vars(backend):               # cfg/patch_fixer.py: Odyssey Fixer on the returned images\n        fixer = backend._fixer_restore\n\n        def timed_fixer(self, imgs):\n            start = time.perf_counter()\n            out = fixer(self, imgs)\n            if imgs:\n                LOG.write(json.dumps({'kind': 'fixer', 'ms': (time.perf_counter() - start) * 1e3, 'n': len(imgs), 't': time.time()}) + '\\n')\n            return out\n\n        backend._fixer_restore = timed_fixer\n    if '_batch_call' in vars(backend):                  # cfg/patch_batch.py: one call for all cameras of a step\n        batch = backend._batch_call\n\n        def timed_batch(self, breq):\n            start = time.perf_counter()\n            out = batch(self, breq)\n            LOG.write(json.dumps({'kind': 'rgb', 'ms': (time.perf_counter() - start) * 1e3, 'batch': len(breq.items),\n                                  'bytes': sum(len(i.result.image_bytes) for i in out.items), 't': time.time()}) + '\\n')\n            return out\n\n        backend._batch_call = timed_batch\n    for name in ('_decode', '_decode_planar'):          # client-side decoding of the returned image\n        if name in vars(backend):\n            decode = getattr(backend, name)\n\n            def timed_decode(image_bytes, *args, _decode=decode, _name=name):\n                start = time.perf_counter()\n                out = _decode(image_bytes, *args)\n                LOG.write(json.dumps({'kind': 'decode', 'fn': _name, 'ms': (time.perf_counter() - start) * 1e3,\n                                      'bytes': len(image_bytes or b''), 't': time.time()}) + '\\n')\n                return out\n\n            setattr(backend, name, staticmethod(timed_decode))\n    print('BENCH_TIMING_INSTALLED', backend.__name__, flush=True)\n\n\nclass Finder(importlib.abc.MetaPathFinder):\n    def find_spec(self, fullname, path, target=None):\n        if fullname != 'navsafe.render.nurec_grpc':\n            return None\n        spec = importlib.machinery.PathFinder.find_spec(fullname, path)\n        if spec is None:\n            return None\n        underlying = spec.loader\n\n        class Loader(importlib.abc.Loader):\n            def create_module(self, module_spec):\n                return underlying.create_module(module_spec)\n\n            def exec_module(self, module):\n                underlying.exec_module(module)\n                instrument(module)\n\n        spec.loader = Loader()\n        return spec\n\n\n\n\ndef shared_clock(module):\n    \"\"\"Codex's render-clock clamp for the four 5 s models: each frame's render time stays inside its own model.\"\"\"\n    prepared = json.loads(open(os.environ['NAVSAFE_PREPARED_INPUTS']).read())\n    original_load = module.Py123DLoader.load\n\n    def load(self, cfg):\n        sd = original_load(self, cfg)\n        meta = sd['metadata']\n        assert [int(t) for t in meta['ts']] == prepared['nominal_sim_timestamps_us']\n        t0 = int(meta['real2sim_start_timestamp_us'])\n        meta['nurec_frame_timestamps'] = [(int(t) - t0) / 1e6 for t in prepared['shared_render_timestamps_us']]\n        print('SHARED_RENDER_CLOCK_APPLIED', flush=True)\n        return sd\n\n    module.Py123DLoader.load = load\n\n\nclass ClockFinder(importlib.abc.MetaPathFinder):\n    def find_spec(self, fullname, path, target=None):\n        if fullname != 'navsafe.env.loaders.py123d':\n            return None\n        spec = importlib.machinery.PathFinder.find_spec(fullname, path)\n        if spec is None:\n            return None\n        underlying = spec.loader\n\n        class Loader(importlib.abc.Loader):\n            def create_module(self, module_spec):\n                return underlying.create_module(module_spec)\n\n            def exec_module(self, module):\n                underlying.exec_module(module)\n                shared_clock(module)\n\n        spec.loader = Loader()\n        return spec\n\n\ndef _instrument_repo_fixer(module):\n    \"\"\"Working-tree runs: time FixerEnhancer.restore (the cfg/patch_fixer.py hook does not exist there).\n    Installed when the module is imported: nothing of navsafe may be imported before the simulator app boots.\"\"\"\n    FixerEnhancer = module.FixerEnhancer\n    restore = FixerEnhancer.restore\n\n    def timed_restore(self, imgs):\n        start = time.perf_counter()\n        out = restore(self, imgs)\n        if imgs:\n            LOG.write(json.dumps({'kind': 'fixer', 'ms': (time.perf_counter() - start) * 1e3, 'n': len(imgs),\
    \ 't': time.time()}) + '\\n')\n        return out\n\n    FixerEnhancer.restore = timed_restore\n\n\n# BENCH_ISAAC_PROBE=1: what Isaac Sim / Isaac Lab actually does during an evaluation. Counts and times the env's\n# per-frame hooks, counts every SimulationContext / SimulationApp call, samples the main thread over the whole rollout\n# and marks the samples that are inside Isaac / Omniverse / USD code, and records when each start-up phase ends.\nPROBE = os.environ.get('BENCH_ISAAC_PROBE') == '1'\nPROBE_T0 = time.time()\nPROBE_DATA = {'phases': {'process_start': 0.0}, 'calls': {}, 'samples': {}, 'isaac_leaf': {}, 'stage': {}}\nISAAC_MARKS = ('/isaacsim/', '/isaaclab', '/omni/', '/pxr/', '/carb/', 'omni.', '/kit/', '/warp/')\nROLLOUT = [False]\n\n\ndef _phase(name):\n    PROBE_DATA['phases'].setdefault(name, round(time.time() - PROBE_T0, 2))\n\n\ndef _count(owner, method, label):\n    orig = getattr(owner, method, None)\n    if orig is None or getattr(orig, '_probe', False):\n        return\n    rec = PROBE_DATA['calls'].setdefault(label, {'n': 0, 'ms': 0.0, 'n_rollout': 0, 'ms_rollout': 0.0})\n\n    def wrapped(*a, **k):\n        start = time.perf_counter()\n        try:\n            return orig(*a, **k)\n        finally:\n            ms = (time.perf_counter() - start) * 1e3\n            rec['n'] += 1; rec['ms'] += ms\n            if ROLLOUT[0]:\n                rec['n_rollout'] += 1; rec['ms_rollout'] += ms\n    wrapped._probe = True\n    setattr(owner, method, wrapped)\n\n\ndef _probe_sampler(main_id):\n    while True:\n        time.sleep(0.005)\n        if not ROLLOUT[0]:\n            continue\n        frame = sys._current_frames().get(main_id)\n        chain, isaac_leaf = [], None\n        while frame is not None:\n            fn = frame.f_code.co_filename\n            if isaac_leaf is None and any(m in fn for m in ISAAC_MARKS):\n                isaac_leaf = '%s:%s' % ('/'.join(fn.split('/')[-3:]), frame.f_code.co_name)\n            if '/navsafe/' in fn and len(chain) < 2:\n                chain.append('%s:%s' % (os.path.basename(fn), frame.f_code.co_name))\n            frame = frame.f_back\n        key = ('ISAAC | ' if isaac_leaf else 'other | ') + ' <- '.join(chain)\n        PROBE_DATA['samples'][key] = PROBE_DATA['samples'].get(key, 0) + 1\n        if isaac_leaf:\n            PROBE_DATA['isaac_leaf'][isaac_leaf] = PROBE_DATA['isaac_leaf'].get(isaac_leaf, 0) + 1\n\n\ndef _probe_dump_now():\n    with open(os.path.join(os.environ['BENCH_OUT'], 'isaac_probe.json'), 'w') as f:\n        json.dump(PROBE_DATA, f, indent=1)\n\n\ndef _probe_dump():\n    _phase('exit')\n    with open(os.path.join(os.environ['BENCH_OUT'], 'isaac_probe.json'), 'w') as f:\n        json.dump(PROBE_DATA, f, indent=1)\n\n\ndef probe_env(module):\n    _phase('env_module_imported')            # the first navsafe import after the app boot\n    env_cls = module.NavSafeEnv\n    PROBE_DATA['has_isaaclab'] = bool(getattr(module, '_HAS_ISAACLAB', None))\n    for name in ('step', 'step_ego', '_step_ego_physics', '_update_agents', '_advance_replay_agent_prims',\n                 '_collect_agent_states_for_renderer', 'check_collision_at_fault', 'get_ego_state', '_setup_scene',\n                 '_pre_physics_step', '_apply_action', '_get_observations', 'reset', '_reset_idx'):\n        _count(env_cls, name, 'env.' + name)\n    init = env_cls.__init__\n\n    def timed_init(self, *a, **k):\n        _phase('env_init_begin')\n        init(self, *a, **k)\n        _phase('env_init_end')\n        try:\n            stage = self.sim.stage\n            types = {}\n            for prim in stage.Traverse():\n                types[prim.GetTypeName() or '(untyped)'] = types.get(prim.GetTypeName() or '(untyped)', 0) + 1\n            PROBE_DATA['stage'] = {'prims': sum(types.values()), 'by_type': dict(sorted(types.items(), key=lambda kv: -kv[1])[:25]),\n                                   'agent_prims': len(getattr(getattr(self, 'agent_manager', None), 'agent_prims', {}) or {})}\n        except Exception as exc:\n            PROBE_DATA['stage'] = {'error': repr(exc)[:200]}\n        try:\n            for name in ('step', 'render', 'reset', 'forward', 'update_fabric'):\n                _count(type(self.sim), name, 'sim.' + name)\n            PROBE_DATA['sim_class'] = type(self.sim).__module__ + '.' + type(self.sim).__name__\n        except Exception as exc:\n            PROBE_DATA['sim_class'] = 'none: ' + repr(exc)[:120]\n        try:\n            import isaacsim\n            from isaacsim import SimulationApp\n            _count(SimulationApp, 'update', 'simulation_app.update')\n        except Exception:\n            pass\n    env_cls.__init__ = timed_init\n\n\ndef probe_evaluator(module):\n    cls = module.Evaluator\n    step = cls._step\n\n    def timed_step(self, *a, **k):\n        if not ROLLOUT[0]:\n            _phase('first_eval_step')\n            ROLLOUT[0] = True\n        out = step(self, *a, **k)\n        PROBE_DATA['frames'] = PROBE_DATA.get('frames', 0) + 1\n        # The simulator app ends the process without running atexit handlers, so write as the rollout goes.\n        if not out or PROBE_DATA['frames'] % 25 == 0:\n            if not out:\n                ROLLOUT[0] = False\n                _phase('rollout_end')\n            _probe_dump_now()\n        return out\n    cls._step = timed_step\n    for name in ('_run_inference_and_cache', '_capture_observer_images'):\n        _count(cls, name, 'evaluator.' + name)\n\n\nclass ProbeFinder(importlib.abc.MetaPathFinder):\n    HOOKS = {'navsafe.env.navsafe_env': probe_env, 'navsafe.evaluation.evaluator': probe_evaluator}\n    if not PROBE:\n        HOOKS = {}\n    HOOKS['navsafe.render.fixer'] = _instrument_repo_fixer\n\n    def find_spec(self, fullname, path, target=None):\n        hook = self.HOOKS.get(fullname)\n        if hook is None:\n            return None\n        spec = importlib.machinery.PathFinder.find_spec(fullname, path)\n        if spec is None:\n            return None\n        underlying = spec.loader\n\n        class Loader(importlib.abc.Loader):\n            def create_module(self, module_spec):\n                return underlying.create_module(module_spec)\n\n            def exec_module(self, module):\n                underlying.exec_module(module)\n                hook(module)\n\n        spec.loader = Loader()\n        return spec\n\n\nif PROBE:\n    import atexit as _atexit\n    import threading as _threading\n    _threading.Thread(target=_probe_sampler, args=(_threading.main_thread().ident,), daemon=True).start()\n    _atexit.register(_probe_dump)\nsys.meta_path.insert(0, ProbeFinder())\nsys.meta_path.insert(0, Finder())\nif os.environ.get('BENCH_SHARED_CLOCK') == '1':\n    sys.meta_path.insert(0, ClockFinder())\nrunpy.run_module('navsafe.cli.eval_entry', run_name='__main__')\n"
