apiVersion: batch/v1
kind: Job
metadata:
  name: navsafe-nuplan20-c895-v2-retrain-probe-20261007
  namespace: cogrob
  labels:
    app: navsafe-nuplan20-nanprobe
    scenario: c895b062e3735053
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app: navsafe-nuplan20-nanprobe
        scenario: c895b062e3735053
    spec:
      restartPolicy: Never
      imagePullSecrets:
      - name: ngc-pull
      containers:
      - name: train
        image: nvcr.io/nvidia/nre/nre-ga@sha256:6e0caa70a9148490552520c3dde9ee665c8d094ca10b814601cb8bb306567c90
        command:
        - /opt/nvidia/nvidia_entrypoint.sh
        - bash
        - -c
        args:
        - |+
          set -euo pipefail
          ROOT=/avl-west/navsafe_nuplan_dense_20261006
          C=c895b062e3735053
          VARIANT=v2
          DEST="$ROOT/train_retry_20261007/$VARIANT/$C"
          DIAG="$DEST/diagnostics/$HOSTNAME"
          mkdir -p "$DIAG" /scratch/ncore /scratch/train_out
          exec > >(tee -a "$DIAG/train.log") 2>&1
          finish() {
            rc=$?
            trap - EXIT
            printf '{"exit_code":%s,"finished_utc":"%s"}\n' "$rc" "$(date -u +%FT%TZ)" > "$DIAG/exit_status.json"
            exit "$rc"
          }
          trap finish EXIT
          if [ -s "$DEST/TRAIN_COMPLETE" ]; then echo ALREADY_TRAINED; exit 0; fi
          test -s "$ROOT/aux/$C/ready"
          test -s "$ROOT/audits_20s/$C/ready"
          L=/scratch/ncore
          OUTL=/scratch/train_out
          cp -a "$ROOT/inputs/$C/clips/$C/." "$L/"
          (cd "$L"; sha256sum -c "$ROOT/aux/$C/aux.sha256")
          (cd "$L"; for f in "$C".aux.*.zarr.itar; do ln -s "$f" "pai_$f"; done)
          cp "$ROOT/source/nuplan_training_optimizations.py" /scratch/nuplan_opt.py
          cp "$ROOT/source/preflight.py" /scratch/preflight.py
          printf '%s\n' 'e57163240192ffd94462f4d3b028087c442243745146b4805d5e03ad21bc873c  /scratch/nuplan_opt.py' 'c038a37f57ecf25242b492f53b77bca02e02fa22519db142b669548c52b10841  /scratch/preflight.py' | sha256sum -c -
          CFGDIR=/app/internal/scripts/pycena/runtime/pycena_nrm_full.runfiles/_main/configs/apps/prod/Hyperion-8.1
          cp /avl-west/nre_overlays/car2sim_6cam_static.yaml "$CFGDIR/"
          cat > /scratch/train_args.txt <<NRE_ARGS
          --config-name=configs/apps/prod/Hyperion-8.1/car2sim_6cam_static.yaml
          mode=train
          logger=dummy
          dataset.path=$L/pai_$C.json
          out_dir=$OUTL
          logger.run_id=$C
          dataset.aux_data=True
          dataset.camera_ids=[camera_pcam_f0,camera_pcam_b0,camera_pcam_l0,camera_pcam_r0,camera_pcam_l1]
          dataset.train_camera_ids=[camera_pcam_f0,camera_pcam_b0,camera_pcam_l0,camera_pcam_r0,camera_pcam_l1]
          dataset.val_camera_ids=[camera_pcam_f0,camera_pcam_b0,camera_pcam_l0,camera_pcam_r0,camera_pcam_l1]
          dataset.n_train_sequential_image_subsample=4
          dataset.n_val_image_subsample=4
          dataset.lidar_ids=[lidar_top_360fov]
          dataset.train_lidar_ids=[lidar_top_360fov]
          dataset.val_lidar_ids=[lidar_top_360fov]
          dataset.n_train_sample_lidar_rays=0
          dataset.cuboid_tracks_params.track_label_sources=[GT_ANNOTATION]
          model.layers.dynamic_rigids.tracks.label_classes=[NuPlanBoxDetectionLabel.VEHICLE,NuPlanBoxDetectionLabel.BICYCLE]
          model.layers.dynamic_deformables.tracks.label_classes=[NuPlanBoxDetectionLabel.PEDESTRIAN]
          model.layers.dynamic_rigids.initialization.name=camera-dynamic-tracks
          +model.layers.dynamic_rigids.initialization.camera_ids=null
          +model.layers.dynamic_rigids.initialization.step_frame=1
          +model.layers.dynamic_rigids.initialization.fill_with_random_points=true
          model.layers.dynamic_deformables.initialization.name=camera-dynamic-tracks
          +model.layers.dynamic_deformables.initialization.camera_ids=null
          +model.layers.dynamic_deformables.initialization.step_frame=1
          +model.layers.dynamic_deformables.initialization.fill_with_random_points=true
          model.layers.road.initialization.name=lidar-rig-trajectory
          model.layers.road.initialization.default_scale=0.1
          +model.layers.road.initialization.num_near_points=100000
          +model.layers.road.initialization.num_far_points=100000
          +model.layers.road.initialization.far_radius_factor=20
          +model.layers.road.initialization.observation_scale_factor=0.01
          +model.layers.road.initialization.lidar_ids=null
          +model.layers.road.initialization.camera_ids=null
          +model.layers.road.initialization.non_dynamic_points_only=true
          dataset.n_samples_per_epoch=160000
          model.strategy.add.max_n_gaussians=5000000
          model.strategy.add.end_iteration=140000
          model.strategy.relocate.end_iteration=140000
          model.strategy.perturb.end_iteration=160000
          system.optimizers.0.scheduler.args.T_max=160000
          checkpoint.every_n_train_steps=40000
          checkpoint.artifact.mesh.ground.enabled=false
          model.strategy.exclude_layer_ids=[road,dynamic_rigids,dynamic_deformables,static_rigids]
          NRE_ARGS
          export NAVSAFE_MODULE=/scratch/nuplan_opt.py NAVSAFE_ARGS_FILE=/scratch/train_args.txt NAVSAFE_INPUT_AUDIT="$ROOT/audits_20s/$C/input_audit.json" NAVSAFE_VARIANT="$VARIANT" NAVSAFE_REPORT_DIR="$DEST/reports" NAVSAFE_BASELINE_CONFIG="$ROOT/audits_20s/$C/c895b062e3735053s1_baseline_parsed.yaml"
          nvidia-smi --query-gpu=name,memory.total,driver_version --format=csv
          /app/run run-script /scratch/preflight.py

          # Save recovery checkpoints on the PVC; images and all GPU work stay local.
          mkdir -p "$DEST/checkpoints" "$OUTL/$C"
          ln -s "$DEST/checkpoints" "$OUTL/$C/checkpoints"
          cat > /scratch/nan_probe.py <<'NAN_PROBE_PY'
          """Find the first training step, and the operation, that puts a non-finite value into the model.

          Runs the unchanged nuPlan training entry (NAVSAFE_MODULE) with read-only checks around it:
            before_forward        params at the start of a training step (catches anything done after the previous step's checks)
            after_optimizer_step  params and gradients right after the optimizer update
            after:<op>            params after each MCMC operation (relocate_gaussians / add_new_gaussians / perturb_gaussians)
          On the first hit it writes NAN_PROBE_DIR/first_nonfinite.json and .pt, then stops the run. Nothing in the model is changed.
          """
          import collections, json, os, runpy, sys, time
          import torch

          OUT = os.environ["NAN_PROBE_DIR"]
          STOP_STEP = int(os.environ.get("NAN_PROBE_STOP_STEP", "30000"))
          WATCH = os.environ.get("NAN_PROBE_LAYER", "dynamic_deformables")
          os.makedirs(OUT, exist_ok=True)
          S = {"nodes": None, "step": -1, "history": collections.deque(maxlen=300), "batch": None, "hooked": False, "t0": time.time()}


          def bad_params(nodes, grads=False, only=None):
              bad = {}
              for layer, node in nodes.items():
                  if only and layer != only:
                      continue
                  for name, p in node.named_parameters():
                      t = p.grad if grads else p
                      if t is None or t.numel() == 0:
                          continue
                      n = int((~torch.isfinite(t)).sum())
                      if n:
                          bad[f"{layer}.{name}"] = {"nonfinite": n, "of": t.numel(), "shape": list(t.shape)}
              return bad


          def stats(nodes):
              row = {"step": S["step"]}
              node = nodes.get(WATCH) if hasattr(nodes, "get") else nodes[WATCH]
              for name, p in node.named_parameters():
                  if p.numel() == 0:
                      continue
                  f = torch.isfinite(p)
                  row[name] = {"absmax": float(p[f].abs().max()) if bool(f.any()) else None}
                  if p.grad is not None:
                      g = p.grad; gf = torch.isfinite(g)
                      row[name]["grad_absmax"] = float(g[gf].abs().max()) if bool(gf.any()) else None
                      row[name]["grad_nonfinite"] = int((~gf).sum())
                  if name.endswith("tracks_delta_q"):
                      nrm = p.norm(dim=-1); row[name]["norm_min"] = float(nrm.min()); row[name]["norm_max"] = float(nrm.max())
              return row


          def describe(obj, depth=0):
              if torch.is_tensor(obj):
                  d = {"shape": list(obj.shape), "dtype": str(obj.dtype)}
                  if obj.numel() and obj.numel() <= 64:
                      d["values"] = obj.detach().flatten().tolist()
                  elif obj.numel() and obj.dtype.is_floating_point:
                      d["min"] = float(obj.min()); d["max"] = float(obj.max()); d["nonfinite"] = int((~torch.isfinite(obj)).sum())
                  elif obj.numel():
                      d["min"] = int(obj.min()); d["max"] = int(obj.max())
                  return d
              if isinstance(obj, (str, int, float, bool)) or obj is None:
                  return obj
              if depth > 2:
                  return type(obj).__name__
              if isinstance(obj, dict):
                  return {str(k): describe(v, depth + 1) for k, v in list(obj.items())[:40]}
              if isinstance(obj, (list, tuple)):
                  return [describe(v, depth + 1) for v in list(obj)[:8]]
              out = {"_type": type(obj).__name__}
              for k in dir(obj):
                  if k.startswith("_"):
                      continue
                  try:
                      v = getattr(obj, k)
                  except Exception:
                      continue
                  if callable(v):
                      continue
                  out[k] = describe(v, depth + 1)
              return out


          def stop(stage, nodes, extra=None):
              node = nodes[WATCH]
              report = {"stage": stage, "step": S["step"], "elapsed_s": round(time.time() - S["t0"]), "bad_params": bad_params(nodes), "bad_grads": bad_params(nodes, grads=True),
                        "batch_of_this_step": S["batch"], "extra": extra, "history_last_steps": list(S["history"])[-120:]}
              save = {}
              try:
                  ids = node.gaussian_cuboid_ids.long().view(-1)
                  pos_bad = ~torch.isfinite(node.positions).all(dim=-1)
                  report["nonfinite_positions_by_track"] = torch.bincount(ids[pos_bad], minlength=int(ids.max()) + 1).tolist()
                  report["gaussians_by_track"] = torch.bincount(ids, minlength=int(ids.max()) + 1).tolist()
                  report["track_ids"] = [str(t) for t in node.cuboid_tracks.tracks_id]
                  for name, p in node.named_parameters():
                      if "tracks_delta" in name:
                          save[name] = p.detach().cpu(); save[name + ".grad"] = None if p.grad is None else p.grad.detach().cpu()
                  for name, b in node.named_buffers():
                      if "timestamps_us_ranges" in name or "cuboids_dims" in name:
                          save[name] = b.detach().cpu()
              except Exception as e:  # diagnostics must not hide the finding
                  report["diagnostic_error"] = repr(e)
              json.dump(report, open(os.path.join(OUT, "first_nonfinite.json"), "w"), indent=1, default=str)
              torch.save(save, os.path.join(OUT, "first_nonfinite.pt"))
              print("[nan_probe] FIRST NON-FINITE at step", S["step"], "stage", stage, json.dumps(report["bad_params"])[:600], flush=True)
              raise RuntimeError("NAN_PROBE_STOP")


          def install():
              from nre.models.gaussians.strategies.mcmc import MCMCStrategy

              for op in ("relocate_gaussians", "add_new_gaussians", "perturb_gaussians"):
                  original_op = getattr(MCMCStrategy, op)

                  def wrapped(self, *args, _orig=original_op, _op=op, **kwargs):
                      result = _orig(self, *args, **kwargs)
                      nodes = S["nodes"]
                      if nodes is not None and bad_params(nodes, only=WATCH):
                          stop(f"after:{_op}", nodes, {"exclude_layer_ids": list(self.config.exclude_layer_ids), "args": [a if isinstance(a, str) else type(a).__name__ for a in args]})
                      return result

                  setattr(MCMCStrategy, op, wrapped)

              original = MCMCStrategy.update_step_train_batch_end

              def update(self, epoch, global_step, batch, system, gaussians_nodes, **kwargs):
                  S["nodes"], S["step"] = gaussians_nodes, global_step
                  if not S["hooked"]:
                      S["hooked"] = True
                      cls = system.__class__
                      training_step = cls.training_step

                      def probed_training_step(sys_self, batch, *a, **k):
                          nodes = S["nodes"]
                          if nodes is not None and bad_params(nodes, only=WATCH):
                              stop("before_forward", nodes)
                          try:
                              S["batch"] = describe(batch)
                          except Exception as e:
                              S["batch"] = repr(e)
                          return training_step(sys_self, batch, *a, **k)

                      cls.training_step = probed_training_step
                      print("[nan_probe] hooks installed at step", global_step, "watching", WATCH, flush=True)
                  S["history"].append(stats(gaussians_nodes))
                  if bad_params(gaussians_nodes) or bad_params(gaussians_nodes, grads=True, only=WATCH):
                      stop("after_optimizer_step", gaussians_nodes)
                  original(self, epoch, global_step, batch, system, gaussians_nodes, **kwargs)
                  if bad_params(gaussians_nodes):
                      stop("after_global_mcmc", gaussians_nodes)
                  if global_step % 1000 == 0:
                      json.dump(list(S["history"])[-1], open(os.path.join(OUT, f"stats_{global_step:06d}.json"), "w"), indent=1)
                      print("[nan_probe] step", global_step, "finite", flush=True)
                  if global_step >= STOP_STEP:
                      json.dump({"result": "no non-finite value up to step", "step": global_step}, open(os.path.join(OUT, "no_nonfinite.json"), "w"))
                      print("[nan_probe] no non-finite value up to step", global_step, flush=True)
                      raise RuntimeError("NAN_PROBE_STOP")

              MCMCStrategy.update_step_train_batch_end = update
              print("[nan_probe] installed; stop step", STOP_STEP, flush=True)


          install()
          sys.argv = [os.environ["NAVSAFE_MODULE"]]
          runpy.run_path(os.environ["NAVSAFE_MODULE"], run_name="__main__")
          NAN_PROBE_PY
          printf '%s  %s\n' "ff894cc71a50d07762119ff482020de3c03439c936cd44c90cf815afe28a0491" /scratch/nan_probe.py | sha256sum -c -
          # Full 160k training with the read-only probe attached; it only stops the run if a non-finite value appears.
          export NAN_PROBE_DIR="$DEST/probe" NAN_PROBE_STOP_STEP=100000000
          /app/run run-script /scratch/nan_probe.py
          test ! -e "$DEST/probe/first_nonfinite.json"
          test -s "$OUTL/$C/artifacts/last.usdz"
          mkdir -p "$DEST/artifacts"
          cp -a "$OUTL/$C/artifacts/last.usdz" "$DEST/artifacts/last.usdz.copying"
          mv "$DEST/artifacts/last.usdz.copying" "$DEST/artifacts/last.usdz"
          cp -a "$OUTL/$C/config" "$DEST/"
          echo TRAIN_20S_DONE "$C" "$VARIANT"
          date -u +%FT%TZ > "$DEST/TRAIN_COMPLETE"

        env:
        - name: NGC_API_KEY
          valueFrom:
            secretKeyRef:
              name: ngc-api-key
              key: NGC_API_KEY
        - name: HYDRA_FULL_ERROR
          value: '1'
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: expandable_segments:True
        resources:
          requests:
            cpu: '4'
            memory: 48Gi
            nvidia.com/gpu: '1'
            ephemeral-storage: 80Gi
          limits:
            cpu: '4'
            memory: 48Gi
            nvidia.com/gpu: '1'
            ephemeral-storage: 80Gi
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: avl-west-vol
          mountPath: /avl-west
        - name: hugsim-storage
          mountPath: /hugsim-storage
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 24Gi
      - name: avl-west-vol
        persistentVolumeClaim:
          claimName: avl-west-vol
      - name: hugsim-storage
        persistentVolumeClaim:
          claimName: horuan-hugsim-vol
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - ry-gpu-11.sdsc.optiputer.net
                - ry-gpu-12.sdsc.optiputer.net
      tolerations:
      - effect: NoSchedule
        key: nautilus.io/reservation
        operator: Equal
        value: cogrob
      - effect: NoSchedule
        key: nautilus.io/cogrob
        operator: Exists
      initContainers:
      - name: wait-inputs
        image: nvcr.io/nvidia/nre/nre-ga@sha256:6e0caa70a9148490552520c3dde9ee665c8d094ca10b814601cb8bb306567c90
        command:
        - bash
        - -c
        args:
        - |
          set -euo pipefail
          ROOT=/avl-west/navsafe_nuplan_dense_20261006
          C=c895b062e3735053
          echo WAITING_FOR_AUDITED_20S_INPUT_AND_GPU_VALIDATION "$C"
          for i in $(seq 1 5760); do
            if test -s "$ROOT/aux/$C/ready" && test -s "$ROOT/audits_20s/$C/ready" && test -s "$ROOT/eval/legacy-smoke/c895b062e3735053s1/EVAL_COMPLETE"; then echo DEPENDENCIES_READY "$C"; exit 0; fi
            sleep 30
          done
          echo INPUT_DEPENDENCY_TIMEOUT >&2
          exit 1
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 100m
            memory: 128Mi
        volumeMounts:
        - name: avl-west-vol
          mountPath: /avl-west
  activeDeadlineSeconds: 172800
