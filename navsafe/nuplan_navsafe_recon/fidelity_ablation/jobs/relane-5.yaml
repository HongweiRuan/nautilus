        imagePullPolicy: IfNotPresent
        command:
        - /opt/nvidia/nvidia_entrypoint.sh
        - bash
        - -c
        args:
        - "set -uo pipefail\nFAILED=\nQUICK=0\n/app/internal/scripts/pycena/runtime/pycena_nrm_full.runfiles/_main/internal/scripts/pycena/runtime/pycena_run_venv_deps.venv/bin/python -c \"import torch; torch.zeros(1).cuda(); print('CUDA_OK', torch.cuda.get_device_name())\" || { echo CUDA_BROKEN; exit 1; }\nrun() {\n  local t0=$SECONDS\n  if ROOT=/avl-west/navsafe_fidelity_ablation_20261012 C=$1 LOG=$2 RECIPE=$3 bash /pipeline/train.sh; then QUICK=0; else\n    FAILED=\"$FAILED ${1:0:8}/$3\"\n    if [ $((SECONDS - t0)) -lt 600 ]; then QUICK=$((QUICK + 1)); else QUICK=0; fi\n    if [ $QUICK -ge 2 ]; then echo \"LANE_STOPPED two quick failures in a row, failed:$FAILED\"; exit 1; fi\n  fi\n}\nrun 0e272e003af65a71 2021.09.29.18.19.40_veh-28_00438_00833 step3_grounddisks\nrun 39a1ca97dca75beb 2021.09.16.19.27.01_veh-45_00472_00711 step1_one20s\nrun 771c4e378bef58e4 2021.09.16.15.12.03_veh-42_01037_01434 step1_one20s\nrun 771c4e378bef58e4 2021.09.16.15.12.03_veh-42_01037_01434 step2_8cam3m\nrun\
          \ 918b6721bcf75d38 2021.10.06.08.16.17_veh-52_00032_00170 step3_grounddisks\nrun f077a062ad9b55e9 2021.08.30.13.45.25_veh-40_00878_01104 step2_8cam3m\nrun f077a062ad9b55e9 2021.08.30.13.45.25_veh-40_00878_01104 step3_grounddisks\necho LANE_DONE failed: \"$FAILED\"\n[ -z \"$FAILED\" ]\n"
        env:
        - name: NGC_API_KEY
