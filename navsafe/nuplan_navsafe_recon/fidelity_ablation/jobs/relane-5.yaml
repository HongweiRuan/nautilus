apiVersion: batch/v1
kind: Job
metadata:
  name: navsafe-fidabl-relane-5-1014
  namespace: cogrob
  labels: &id001
    app: navsafe-fidelity-ablation
    stage: train
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  activeDeadlineSeconds: 345600
  template:
    metadata:
      labels: *id001
    spec:
      restartPolicy: Never
      imagePullSecrets:
