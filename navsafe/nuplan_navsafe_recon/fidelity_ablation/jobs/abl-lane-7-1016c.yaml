apiVersion: batch/v1
kind: Job
metadata:
  name: navsafe-fidabl-abl-7-1016c
  namespace: cogrob
  labels: &id001
    app: navsafe-fidelity-ablation
    stage: train
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  activeDeadlineSeconds: 432000
  template:
    metadata:
      labels: *id001
    spec:
      restartPolicy: Never
      imagePullSecrets:
      - name: ngc-pull
      containers:
      - name: train
        image: nvcr.io/nvidia/nre/nre-ga@sha256:6e0caa70a9148490552520c3dde9ee665c8d094ca10b814601cb8bb306567c90
        imagePullPolicy: IfNotPresent
        command:
        - /opt/nvidia/nvidia_entrypoint.sh
        - bash
        - -c
        args:
        - "set -uo pipefail\nFAILED=\nQUICK=0\n/app/internal/scripts/pycena/runtime/pycena_nrm_full.runfiles/_main/internal/scripts/pycena/runtime/pycena_run_venv_deps.venv/bin/python -c \"import torch; torch.zeros(1).cuda(); print('CUDA_OK', torch.cuda.get_device_name())\" || { echo CUDA_BROKEN; exit 1; }\nrun() {\n  local t0=$SECONDS\n  if ROOT=/avl-west/navsafe_fidelity_ablation_20261012 C=$1 LOG=$2 RECIPE=$3 bash /pipeline/train.sh; then QUICK=0; else\n    FAILED=\"$FAILED ${1:0:8}/$3\"\n    if [ $((SECONDS - t0)) -lt 180 ]; then QUICK=$((QUICK + 1)); else QUICK=0; fi\n    if [ $QUICK -ge 2 ]; then echo \"LANE_STOPPED two quick failures in a row, failed:$FAILED\"; exit 1; fi\n  fi\n}\nrun 0d5b8da00d505be0 2021.06.03.12.02.06_veh-35_01100_01227 step3_grounddisks\nrun 1c064ec24fa15900 2021.10.06.08.16.17_veh-52_01949_02501 abl_b_clock\nrun 3151813685fe5b1d 2021.09.29.14.44.26_veh-28_00528_00992 abl_c_sampling\nrun 5d2ee89308f958be 2021.10.06.08.16.17_veh-52_00922_01296 abl_c_sampling\n\
          run 7b635c8426075d70 2021.06.03.17.06.58_veh-35_02943_03220 abl_c_sampling\nrun 918b6721bcf75d38 2021.10.06.08.16.17_veh-52_00032_00170 abl_c_sampling\nrun e046e8110045541f 2021.09.16.15.47.30_veh-45_01199_01391 abl_c_sampling\necho LANE_DONE failed: \"$FAILED\"\n[ -z \"$FAILED\" ]\n"
        env:
        - name: NGC_API_KEY
          valueFrom:
            secretKeyRef:
              name: ngc-api-key
              key: NGC_API_KEY
        - name: HYDRA_FULL_ERROR
          value: '1'
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: expandable_segments:True
        resources:
          requests:
            cpu: '2'
            memory: 20Gi
            ephemeral-storage: 80Gi
            nvidia.com/gpu: '1'
          limits:
            cpu: 2400m
            memory: 24Gi
            ephemeral-storage: 80Gi
            nvidia.com/gpu: '1'
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: avl-west-vol
          mountPath: /avl-west
        - name: hugsim-storage
          mountPath: /hugsim-storage
        - name: pipeline
          mountPath: /pipeline
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 24Gi
      - name: avl-west-vol
        persistentVolumeClaim:
          claimName: avl-west-vol
      - name: hugsim-storage
        persistentVolumeClaim:
          claimName: horuan-hugsim-vol
      - name: pipeline
        configMap:
          name: navsafe-fidabl-pipeline-r5
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - ry-gpu-12.sdsc.optiputer.net
      tolerations:
      - effect: NoSchedule
        key: nautilus.io/reservation
        operator: Equal
        value: cogrob
      - effect: NoSchedule
        key: nautilus.io/cogrob
        operator: Exists
