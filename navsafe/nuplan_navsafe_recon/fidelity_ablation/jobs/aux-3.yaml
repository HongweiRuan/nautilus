apiVersion: batch/v1
kind: Job
metadata:
  name: navsafe-fidabl-aux-3-1012
  namespace: cogrob
  labels: &id001
    app: navsafe-fidelity-ablation
    stage: aux
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  activeDeadlineSeconds: 43200
  template:
    metadata:
      labels: *id001
    spec:
      restartPolicy: Never
      imagePullSecrets:
      - name: ngc-pull
      containers:
      - name: aux
        image: nvcr.io/nvidia/nre/nre-tools-ga@sha256:46d78256219a6541601fd16517c7edca3e7a6ec9634f1858f7977279bd98f9ff
        imagePullPolicy: IfNotPresent
        command:
        - /opt/nvidia/nvidia_entrypoint.sh
        - bash
        - -c
        args:
        - 'set -uo pipefail

          ROOT=/avl-west/navsafe_fidelity_ablation_20261012 C=0563edc821b6543d bash /pipeline/aux.sh || echo AUX_FAILED 0563edc821b6543d

          ROOT=/avl-west/navsafe_fidelity_ablation_20261012 C=14fe69db03425780 bash /pipeline/aux.sh || echo AUX_FAILED 14fe69db03425780

          ROOT=/avl-west/navsafe_fidelity_ablation_20261012 C=39a1ca97dca75beb bash /pipeline/aux.sh || echo AUX_FAILED 39a1ca97dca75beb

          ROOT=/avl-west/navsafe_fidelity_ablation_20261012 C=918b6721bcf75d38 bash /pipeline/aux.sh || echo AUX_FAILED 918b6721bcf75d38

          exit 0

          '
        env:
        - name: NGC_API_KEY
          valueFrom:
            secretKeyRef:
              name: ngc-api-key
              key: NGC_API_KEY
        - name: HYDRA_FULL_ERROR
          value: '1'
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: expandable_segments:True
        resources:
          requests:
            cpu: 2500m
            memory: 20Gi
            ephemeral-storage: 60Gi
            nvidia.com/gpu: '1'
          limits:
            cpu: '3'
            memory: 24Gi
            ephemeral-storage: 60Gi
            nvidia.com/gpu: '1'
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: avl-west-vol
          mountPath: /avl-west
        - name: hugsim-storage
          mountPath: /hugsim-storage
        - name: pipeline
          mountPath: /pipeline
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 24Gi
      - name: avl-west-vol
        persistentVolumeClaim:
          claimName: avl-west-vol
      - name: hugsim-storage
        persistentVolumeClaim:
          claimName: horuan-hugsim-vol
      - name: pipeline
        configMap:
          name: navsafe-fidabl-pipeline-r4
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - ry-gpu-11.sdsc.optiputer.net
      tolerations:
      - effect: NoSchedule
        key: nautilus.io/reservation
        operator: Equal
        value: cogrob
      - effect: NoSchedule
        key: nautilus.io/cogrob
        operator: Exists
