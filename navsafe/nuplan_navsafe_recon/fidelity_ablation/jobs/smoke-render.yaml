apiVersion: batch/v1
kind: Job
metadata:
  name: navsafe-fidabl-smoke-render-1012
  namespace: cogrob
  labels: &id001
    app: navsafe-fidelity-ablation
    stage: smoke
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels: *id001
    spec:
      restartPolicy: Never
      imagePullSecrets:
      - name: ngc-pull
      containers:
      - name: render
        image: nvcr.io/nvidia/nre/nre-ga@sha256:6e0caa70a9148490552520c3dde9ee665c8d094ca10b814601cb8bb306567c90
        imagePullPolicy: IfNotPresent
        command:
        - /opt/nvidia/nvidia_entrypoint.sh
        - bash
        - -c
        args:
        - 'set -euo pipefail

          ART=/avl-west/navsafe_fidelity_ablation_20261012/smoke/train/step3_grounddisks/e3e0b3d6d5ae52a1/artifacts/last.usdz SCENE=e3e0b3d6d5ae52a1 AUDIT=/avl-west/navsafe_fidelity_ablation_20261012/smoke/audit8/e3e0b3d6d5ae52a1.json OUT=/avl-west/navsafe_fidelity_ablation_20261012/smoke/render/step3_grounddisks/e3e0b3d6d5ae52a1 /app/run run-script /pipeline/render_eval.py

          ls /avl-west/navsafe_fidelity_ablation_20261012/smoke/render/step3_grounddisks/e3e0b3d6d5ae52a1/camera_pcam_f0 | wc -l

          '
        env:
        - name: NGC_API_KEY
          valueFrom:
            secretKeyRef:
              name: ngc-api-key
              key: NGC_API_KEY
        - name: HYDRA_FULL_ERROR
          value: '1'
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: expandable_segments:True
        resources:
          requests:
            cpu: '2'
            memory: 16Gi
            ephemeral-storage: 20Gi
            nvidia.com/gpu: '1'
          limits:
            cpu: '2'
            memory: 19Gi
            ephemeral-storage: 20Gi
            nvidia.com/gpu: '1'
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: avl-west-vol
          mountPath: /avl-west
        - name: hugsim-storage
          mountPath: /hugsim-storage
        - name: pipeline
          mountPath: /pipeline
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 24Gi
      - name: avl-west-vol
        persistentVolumeClaim:
          claimName: avl-west-vol
      - name: hugsim-storage
        persistentVolumeClaim:
          claimName: horuan-hugsim-vol
      - name: pipeline
        configMap:
          name: navsafe-fidabl-pipeline
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - ry-gpu-11.sdsc.optiputer.net
                - ry-gpu-12.sdsc.optiputer.net
      tolerations:
      - effect: NoSchedule
        key: nautilus.io/reservation
        operator: Equal
        value: cogrob
      - effect: NoSchedule
        key: nautilus.io/cogrob
        operator: Exists
