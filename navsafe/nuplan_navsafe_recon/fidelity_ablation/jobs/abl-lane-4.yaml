          \ 771c4e378bef58e4 2021.09.16.15.12.03_veh-42_01037_01434 abl_c_sampling\nrun 9157902936a456bf 2021.06.03.13.55.17_veh-35_02572_02855 abl_c_sampling\nrun a6b9a83019915658 2021.05.25.14.26.37_veh-27_04122_04279 abl_c_sampling\necho LANE_DONE failed: \"$FAILED\"\n[ -z \"$FAILED\" ]\n"
