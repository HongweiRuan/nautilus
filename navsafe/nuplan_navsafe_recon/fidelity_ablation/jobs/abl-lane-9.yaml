apiVersion: batch/v1
kind: Job
metadata:
  name: navsafe-fidabl-abl-9-1016b
  namespace: cogrob
  labels: &id001
    app: navsafe-fidelity-ablation
    stage: train
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  activeDeadlineSeconds: 432000
  template:
    metadata:
      labels: *id001
    spec:
      restartPolicy: Never
      imagePullSecrets:
