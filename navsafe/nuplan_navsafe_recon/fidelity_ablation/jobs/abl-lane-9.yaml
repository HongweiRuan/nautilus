        - "set -uo pipefail\nFAILED=\nQUICK=0\n/app/internal/scripts/pycena/runtime/pycena_nrm_full.runfiles/_main/internal/scripts/pycena/runtime/pycena_run_venv_deps.venv/bin/python -c \"import torch; torch.zeros(1).cuda(); print('CUDA_OK', torch.cuda.get_device_name())\" || { echo CUDA_BROKEN; exit 1; }\nrun() {\n  local t0=$SECONDS\n  if ROOT=/avl-west/navsafe_fidelity_ablation_20261012 C=$1 LOG=$2 RECIPE=$3 bash /pipeline/train.sh; then QUICK=0; else\n    FAILED=\"$FAILED ${1:0:8}/$3\"\n    if [ $((SECONDS - t0)) -lt 180 ]; then QUICK=$((QUICK + 1)); else QUICK=0; fi\n    if [ $QUICK -ge 2 ]; then echo \"LANE_STOPPED two quick failures in a row, failed:$FAILED\"; exit 1; fi\n  fi\n}\nrun 0d5b8da00d505be0 2021.06.03.12.02.06_veh-35_01100_01227 abl_c_sampling\nrun 20ec6765e35d5cd1 2021.09.29.19.02.14_veh-28_00540_00917 abl_a_base\nrun 39a1ca97dca75beb 2021.09.16.19.27.01_veh-45_00472_00711 abl_a_base\nrun 667f53ef57a95dbe 2021.09.16.13.53.10_veh-42_00077_00153 abl_a_base\nrun 7be1e4f2c85e50a8\
          \ 2021.09.16.13.53.10_veh-42_00860_01069 abl_a_base\nrun 9a6489254d5f5577 2021.08.30.13.45.25_veh-40_00784_00867 abl_a_base\nrun f077a062ad9b55e9 2021.08.30.13.45.25_veh-40_00878_01104 abl_a_base\necho LANE_DONE failed: \"$FAILED\"\n[ -z \"$FAILED\" ]\n"
        env:
        - name: NGC_API_KEY
