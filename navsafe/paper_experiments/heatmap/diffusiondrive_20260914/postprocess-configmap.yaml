    #!/usr/bin/env bash
    set -euo pipefail
    export DEBIAN_FRONTEND=noninteractive
    apt-get update -qq
    apt-get install -y -qq git curl python3-venv python3-dev libgomp1 >/dev/null
    export PATH=$HOME/.local/bin:$HOME/.cargo/bin:$PATH
    export UV_CACHE_DIR=/root/.cache/uv UV_PROJECT_ENVIRONMENT=/root/ns-venv
    for i in 1 2 3 4; do
      command -v uv >/dev/null && break
      python -m pip install --quiet --user uv 2>/dev/null || pip install --quiet --user uv 2>/dev/null || curl -LsSf https://astral.sh/uv/install.sh | sh
      hash -r
      sleep 5
    done
    REPO=/root/ns
    git clone --quiet --no-hardlinks /hugsim-storage/NexusSim "$REPO"
    git -C "$REPO" checkout --quiet 31ff7e48922962f2f19f9b2b4bce79171eccac3a
    cd "$REPO"
    uv sync --all-extras --python 3.12
    export PYTHONPATH="$REPO:$REPO/third_party/nurec_protos"
    /root/ns-venv/bin/python /cfg/recompute_diffusiondrive_mc.py /avl-west/navsafe_eval/heatmap/20260914_diffusiondrive_27x30_t0_4s /cfg/selection.json
