    import json,sys
    from pathlib import Path
    import numpy as np
    import matplotlib
    matplotlib.use('Agg')
    import matplotlib.pyplot as plt
    from matplotlib.lines import Line2D
    root=Path(sys.argv[1]);leaf,token=sys.argv[2:4]
    rows={model:[json.loads((root/f'seed{seed}'/leaf/token/'base'/model/'heatmap_episode.json').read_text()) for seed in range(30)] for model in ('diffusiondrive','diffusiondrive_simscale')}
    out=root/'figures';out.mkdir(exist_ok=True)
    for frame in (20,40):
     fig,ax=plt.subplots(figsize=(7,5));fig.subplots_adjust(bottom=.28,right=.85)
     vals=[r['states'][str(frame)]['mc_return'] for rr in rows.values() for r in rr if r['states'][str(frame)].get('mc_return') is not None]
     norm=matplotlib.colors.Normalize(min([0]+vals),max([1]+vals))
     ol=rows['diffusiondrive'][0]['states'][str(frame)]['ol_log_xy']
     for model,rr in rows.items():
      for r in rr:assert np.allclose(r['states'][str(frame)]['ol_log_xy'],ol)
     counts=[]
     for (model,rr),marker in zip(rows.items(),('o','^')):
      valid=[r['states'][str(frame)] for r in rr if r['states'][str(frame)].get('mc_return') is not None and r['states'][str(frame)]['cl_xy'] is not None]
      counts.append(len(valid))
      if valid:
       xy=np.array([v['cl_xy'] for v in valid]);ax.scatter(*xy.T,c=[v['mc_return'] for v in valid],norm=norm,cmap='viridis',marker=marker,s=36,edgecolors='white',linewidths=.5)
     ax.scatter(*ol,marker='D',s=65,facecolors='none',edgecolors='black',zorder=5)
     ax.set(xlabel='Forward x (m)',ylabel='Leftward y (m)',title=f'{leaf} | {token} | t = {frame/10:g} s')
     ax.grid(alpha=.15);ax.margins(.2)
     fig.colorbar(matplotlib.cm.ScalarMappable(norm=norm,cmap='viridis'),ax=ax,label='Future discounted ΔDS return')
     handles=[Line2D([],[],marker='D',color='black',mfc='none',ls='',label='OL: one logged state'),Line2D([],[],marker='o',color='#31878d',ls='',label=f'DiffusionDrive CL: {counts[0]}/30 valid'),Line2D([],[],marker='^',color='#31878d',ls='',label=f'DiffusionDrive-SimScale CL: {counts[1]}/30 valid')]
     fig.legend(handles=handles,loc='lower center',fontsize=8,title=f'Reference: frame 0; state: frame {frame} (+{frame/10:g} s)\n30 seeds/model; overlapping points retained; γ=0.99; terminal horizon=4 s',title_fontsize=8,frameon=True)
     for ext in ('png','svg'):fig.savefig(out/f'{leaf}_{token}_t{frame//10}.{ext}',dpi=200)
     plt.close(fig)
    print('SCENARIO_PLOTS_SAVED',leaf,token)
  recompute_diffusiondrive_mc.py: |
    import csv
    import json
    import subprocess
    import sys
    from pathlib import Path
    from types import SimpleNamespace

    import numpy as np
    from nexussim.navsafe.trace import from_eval
    from nexussim.navsafe.scoring import route, metrics

    root = Path(sys.argv[1])
    selection = json.loads(Path(sys.argv[2]).read_text())
    gamma = 0.99
    failures = []
    counts = {"validated": 0, "unvalidated": 0}

    for leaf, block in selection["leaves"].items():
        for picked in block["picked"]:
            token = picked["token"]
            data_root = picked["data_root"]
            sd = from_eval.scenario_from_arrow(data_root)
            ego_id = (sd.get("metadata", {}) or {}).get("sdc_id") or sd.get("sdc_id")
            log = np.asarray(sd["tracks"][ego_id]["state"]["position"])[:, :2]
            drivable = bool(sd.get("map_features"))
            for seed in range(30):
                for model in ("diffusiondrive", "diffusiondrive_simscale"):
                    p = root / f"seed{seed}" / leaf / token / "base" / model
                    hp = p / "heatmap_episode.json"
                    result = json.loads(hp.read_text())
                    saved = json.loads((p / "navsafe_metrics.json").read_text())
                    try:
                        warm = 0
                        end = saved["termination"]["frame"]
                        reason = saved["termination"]["reason"]
                        if reason in ("hold_satisfied", "red_light_run", "illegal_turn"):
                            raise ValueError("special terminal DS rule requires separate prefix handling")
                        ego_xy = np.load(p / "vehicle_states.npy")[:, :2]
                        pf = from_eval.read_per_frame_epdms(p)
                        rebuilt = []
                        for j, xy in enumerate(ego_xy):
                            row = pf.get(j, {})
                            contacts = []
                            if j >= warm and row.get("COLL", 0) > 0:
                                if not row.get("COLL_KIND"):
                                    raise ValueError("contact kind missing; cannot reconstruct exact penalty")
                                contacts = [{
                                    "agent_id": row.get("COLL_ID", ""),
                                    "kind": row["COLL_KIND"],
                                    "at_fault": row.get("COLL_AF", 0) > 0,
                                }]
                            rebuilt.append({
                                "phase": "scored" if j >= warm else "warmup",
                                "ego_x": float(xy[0]), "ego_y": float(xy[1]),
                                "on_drivable": not drivable or row.get("DAC", 1) >= 1,
                                "contacts": contacts,
                                "signal_state": ("red" if row["TL"] < 1 else "unknown") if "TL" in row else "",
                            })
                        run = SimpleNamespace(
                            route_xy=log, ego_xy=ego_xy, frames=rebuilt,
                            drivable_known=drivable,
                        )
                        progress = route.route_progress(run.route_xy, run.ego_xy).per_frame_pct
                        frames = run.frames[warm:end + 1]
                        if not frames:
                            raise ValueError("empty scored window")
                        pairs = {
                            (c["agent_id"], c["kind"])
                            for f in frames for c in f["contacts"] if c["at_fault"]
                        }
                        saved_contacts = {
                            c["channel"]: c["count"]
                            for c in saved["driving_score_breakdown"]["channels"]
                            if c["channel"].startswith("collisions_") and c["count"]
                        }
                        single_contact_channel = (
                            next(iter(saved_contacts))
                            if len(pairs) == 1 and sum(saved_contacts.values()) == 1 else None
                        )
                        ds = [float(progress[warm - 1]) if warm else 0.0]
                        for i in range(len(frames)):
                            prefix = frames[:i + 1]
                            infraction_counts = metrics.infractions_from_trace(prefix, at_fault_only=True)
                            if single_contact_channel and any(
                                c.get("at_fault") for f in prefix for c in f["contacts"]
                            ):
                                infraction_counts = {
                                    k: v for k, v in infraction_counts.items()
                                    if not k.startswith("collisions_")
                                }
                                infraction_counts[single_contact_channel] = 1
                            red = np.array(
                                [f.get("signal_state") == "red" for f in prefix], dtype=bool
                            )
                            infraction_counts["red_light"] = int(
                                np.sum(red & ~np.r_[False, red[:-1]])
                            )
                            penalty = 1.0
                            for channel, coef in metrics.PENALTY_COEFFICIENTS.items():
                                penalty *= coef ** infraction_counts.get(channel, 0)
                            if run.drivable_known:
                                xy = [[f["ego_x"], f["ego_y"]] for f in prefix]
                                penalty *= 1 - route.outside_route_lanes_pct(
                                    xy, [f["on_drivable"] for f in prefix]
                                ) / 100
                            completion = progress[warm + i]
                            if warm + i == end and reason == "goal_reached":
                                completion = 100.0
                            ds.append(max(0.0, float(completion * penalty)))
                        expected = saved["metrics"].get("driving_score")
                        if expected is None:
                            br = saved["driving_score_breakdown"]
                            expected = float(br["route_completion_pct"]) * float(br["penalty"])
                        gap = abs(ds[-1] - float(expected))
                        # Excluded 4 s horizons store route completion and penalty
                        # rounded in the JSON breakdown, so their product is only
                        # comparable to the reconstructed DS within half a 0.01 unit.
                        if gap > 0.0051:
                            raise ValueError(
                                f"final DS mismatch: reconstructed={ds[-1]}, expected={expected}"
                            )
                        reward = np.diff(ds)
                        ret = np.zeros(len(reward) + 1)
                        for i in range(len(reward) - 1, -1, -1):
                            ret[i] = reward[i] + gamma * ret[i + 1]
                        if abs(reward.sum() - (ds[-1] - ds[0])) >= 1e-8:
                            raise ValueError("reward telescoping check failed")
                        result["ds"] = ds
                        result["rewards"] = reward.tolist()
                        result["mc_returns"] = ret.tolist()
                        result["final_ds_error"] = gap
                        result["mc_status"] = "validated"
                        result.pop("mc_error", None)
                        for frame in (20, 40):
                            state = result["states"][str(frame)]
                            state.pop("mc_return", None)
                            if state.get("cl_xy") is not None and frame < len(ret):
                                state["mc_return"] = float(ret[frame])
                        counts["validated"] += 1
                    except Exception as exc:
                        result["mc_status"] = "unvalidated"
                        result["mc_error"] = str(exc)
                        counts["unvalidated"] += 1
                        failures.append(f"{leaf}/{token}/seed{seed}/{model}: {exc}")
                    hp.write_text(json.dumps(result, indent=2))

    for leaf, block in selection["leaves"].items():
        for picked in block["picked"]:
            subprocess.run(
                [sys.executable, "/cfg/plot_scenario.py", str(root), leaf, picked["token"]],
                check=True,
            )

    report = {"counts": counts, "failure_count": len(failures), "failures": failures}
    (root / "mc_recompute_report.json").write_text(json.dumps(report, indent=2))
    print(json.dumps(report, indent=2))
    if failures:
        raise SystemExit(1)
