# Render a shard of clips through the EVAL's own render path (gRPC), once with
# the harmonizer OFF and once ON, so FID/FVD/FDpi^k can be measured on the two
# configurations the eval pipeline can actually be run in.
#
# Why gRPC and not `nre render`: the eval renders through serve-grpc, and the
# harmonizer is a serve-grpc post-pass with no offline equivalent. Measured
# 2026-08-31 on identical scene content (Laplacian variance, no registration,
# so a pose offset cannot skew it):
#     offline `nre render`          33.4
#     gRPC direct, harmonizer OFF   32.0   <- the render path is NOT the problem
#     eval pipeline, harmonizer ON  10.9
# So the two rows worth measuring are gRPC-off and gRPC-on, and rendering them
# both here keeps every other variable (node, GPU, artifact, trajectory) fixed.
#
# render-grpc walks the training trajectory and names frames by a contiguous
# index; the offline render names them by timestamp. Verified same ORDER (grpc
# index i best-matches offline frame i, 36-37 dB aligned, vs 27-32 for i+-1),
# so position is the key the scorer maps back to manifest tokens.
#
# Placeholders: sh15-0831061119 + a manifest block of clip ids
apiVersion: batch/v1
kind: Job
metadata:
  {name: fid-grpcrender-sh15-0831061119, namespace: cogrob,
   labels: {app: fidelity_eval, stage: grpcrender, shard: "sh15-0831061119"}}
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 172800
  template:
    metadata: {labels: {app: fidelity_eval, stage: grpcrender, shard: "sh15-0831061119"}}
    spec:
      restartPolicy: Never
      imagePullSecrets: [{name: ngc-pull}]
      containers:
        - name: nre
          image: nvcr.io/nvidia/nre/nre-ga@sha256:6e0caa70a9148490552520c3dde9ee665c8d094ca10b814601cb8bb306567c90
          command: ["/opt/nvidia/nvidia_entrypoint.sh", "bash", "-c"]
          args:
            - |
              set -o pipefail
              cat > /tmp/clips.txt <<'EOF'
              926f3f8a5fff5f7ds2
              926f3f8a5fff5f7ds3
              926f3f8a5fff5f7ds4
              92c6df44cf055882s1
              92c6df44cf055882s2
              92c6df44cf055882s3
              92c6df44cf055882s4
              9311d9a2409c5224s1
              9311d9a2409c5224s2
              9311d9a2409c5224s3
              9311d9a2409c5224s4
              95495f60a1b659f3s1
              95495f60a1b659f3s2
              95495f60a1b659f3s3
              95495f60a1b659f3s4
              9605af7df76f5ba3s1
              9605af7df76f5ba3s2
              9605af7df76f5ba3s3
              9605af7df76f5ba3s4
              966b68d5d3e6595ds1
              966b68d5d3e6595ds2
              966b68d5d3e6595ds3
              966b68d5d3e6595ds4
              97146fc0e8525e75s1
              97146fc0e8525e75s2
              97146fc0e8525e75s3
              97146fc0e8525e75s4
              97dcc120f4695080s1
              97dcc120f4695080s2
              97dcc120f4695080s3
              97dcc120f4695080s4
              9869278b0f8f5061s1
              9869278b0f8f5061s2
              9869278b0f8f5061s3
              9869278b0f8f5061s4
              98ef14bbff405428s1
              98ef14bbff405428s2
              98ef14bbff405428s3
              98ef14bbff405428s4
              99a98a7ffb075389s1
              99a98a7ffb075389s2
              99a98a7ffb075389s3
              99a98a7ffb075389s4
              9a6489254d5f5577s1
              9a6489254d5f5577s2
              9a6489254d5f5577s3
              9a6489254d5f5577s4
              9ac86ade68505597s1
              9ac86ade68505597s2
              9ac86ade68505597s3
              9ac86ade68505597s4
              9b21b864f1a159e8s1
              9b21b864f1a159e8s2
              9b21b864f1a159e8s3
              9b21b864f1a159e8s4
              9d791495c47e5061s1
              9d791495c47e5061s2
              9d791495c47e5061s3
              9d791495c47e5061s4
              9e34c53444bd518cs1
              9e34c53444bd518cs2
              9e34c53444bd518cs3
              9e34c53444bd518cs4
              9e7ae0e0f04255fas1
              9e7ae0e0f04255fas2
              9e7ae0e0f04255fas3
              9e7ae0e0f04255fas4
              9ef1d618435d5e53s1
              9ef1d618435d5e53s2
              9ef1d618435d5e53s3
              9ef1d618435d5e53s4
              a0ff0b74063659a2s1
              a0ff0b74063659a2s2
              a0ff0b74063659a2s3
              a0ff0b74063659a2s4
              a12d1a61d7cc50fes1
              a12d1a61d7cc50fes2
              a12d1a61d7cc50fes3
              a12d1a61d7cc50fes4
              EOF
              CORPUS=/avl-west/navsafe_5s_500
              ROOT=/avl-west/fidelity_eval/grpc
              N=$(grep -c . /tmp/clips.txt)
              echo "[grpcrender sh15-0831061119] $N clip(s)"

              # One symlink pool for the whole shard, one server per harmonizer
              # setting. NOT one server per clip: they all bind :8080 and the
              # second cannot start while the first releases it, which makes the
              # client talk to a stale server and report "Scene not available".
              POOL=/tmp/pool; rm -rf $POOL
              for C in $(grep -v '^ *$' /tmp/clips.txt); do
                U=$CORPUS/$C/output_5cam/$C/artifacts/last.usdz
                [ -f "$U" ] && { mkdir -p $POOL/$C/artifacts; ln -sf "$U" $POOL/$C/artifacts/last.usdz; }
              done
              echo "  pool: $(ls $POOL 2>/dev/null | wc -l) clip(s)"

              ok=0; fail=0
              for HARM in off on; do
                FLAG="--no-enable-harmonizer"
                if [ "$HARM" = "on" ]; then
                  mkdir -p /avl-west/navsafe_dev/.harmonizer-cache
                  FLAG="--enable-harmonizer --harmonizer-cache /avl-west/navsafe_dev/.harmonizer-cache"
                fi
                echo "=== harmonizer=$HARM ==="
                /app/run serve-grpc --host 0.0.0.0 --renderer default --cache-size 4 \
                  $FLAG --artifact-glob "$POOL/*/artifacts/last.usdz" > /tmp/serve_$HARM.log 2>&1 &
                SPID=$!
                for _ in $(seq 1 180); do
                  kill -0 $SPID 2>/dev/null || { echo "SERVE_DIED $HARM"; tail -30 /tmp/serve_$HARM.log; break; }
                  grep -q "Available scenes" /tmp/serve_$HARM.log && break
                  sleep 5
                done
                kill -0 $SPID 2>/dev/null || { fail=$((fail+1)); continue; }
                grep -q "Available scenes" /tmp/serve_$HARM.log || { echo "NO_SCENES $HARM"; kill $SPID; fail=$((fail+1)); continue; }

                for C in $(grep -v '^ *$' /tmp/clips.txt); do
                  U=$CORPUS/$C/output_5cam/$C/artifacts/last.usdz
                  [ -f "$U" ] || continue
                  D=$ROOT/h$HARM/$C
                  if find "$D" -name '*.jp*g' 2>/dev/null | grep -q .; then ok=$((ok+1)); continue; fi
                  mkdir -p "$D"
                  if /app/run render-grpc --artifact-path "$U" --output-dir "$D" \
                       --camera-id camera_pcam_f0 --height 1080 --image-format jpeg \
                       --host localhost --port 8080 >/dev/null 2>&1; then
                    ok=$((ok+1))
                  else
                    echo "RENDER_FAIL $HARM $C"; fail=$((fail+1))
                  fi
                done
                kill $SPID 2>/dev/null; sleep 8
              done
              echo "SHARD_DONE sh15-0831061119 ok=$ok fail=$fail"
              # Both configurations are the deliverable; a shard that produced
              # only one of them has not done its job.
              a=$(find $ROOT/hoff -maxdepth 1 -mindepth 1 2>/dev/null | wc -l)
              b=$(find $ROOT/hon  -maxdepth 1 -mindepth 1 2>/dev/null | wc -l)
              echo "  clips rendered so far: hoff=$a hon=$b"
              [ "$fail" -eq 0 ] || exit 1
          env:
            - {name: NGC_API_KEY, valueFrom: {secretKeyRef: {name: ngc-api-key, key: NGC_API_KEY}}}
            - {name: HYDRA_FULL_ERROR, value: "1"}
            - {name: PYTORCH_CUDA_ALLOC_CONF, value: "expandable_segments:True"}
          resources:
            requests: {cpu: "3", memory: "24Gi", nvidia.com/gpu: "1", ephemeral-storage: 60Gi}
            limits:   {cpu: "3", memory: "24Gi", nvidia.com/gpu: "1", ephemeral-storage: 60Gi}
          volumeMounts:
            - {name: dshm, mountPath: /dev/shm}
            - {name: avl-west-vol, mountPath: /avl-west}
      volumes:
        - {name: dshm, emptyDir: {medium: Memory, sizeLimit: 12Gi}}
        - {name: avl-west-vol, persistentVolumeClaim: {claimName: avl-west-vol}}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: kubernetes.io/hostname, operator: In,
                     values: ["ry-gpu-05.sdsc.optiputer.net","ry-gpu-06.sdsc.optiputer.net",
                              "ry-gpu-07.sdsc.optiputer.net","ry-gpu-08.sdsc.optiputer.net",
                              "ry-gpu-11.sdsc.optiputer.net","ry-gpu-12.sdsc.optiputer.net"]}
      tolerations:
        - {effect: NoSchedule, key: nautilus.io/reservation, operator: Equal, value: cogrob}
        - {effect: NoSchedule, key: nautilus.io/cogrob, operator: Exists}
