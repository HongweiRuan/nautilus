# PARITY CHECK: is the gRPC render path the same picture as the offline one?
#
# The ablation the paper wants is Base vs +Harmonizer, and the harmonizer is
# reachable ONLY from serve-grpc (`--enable-harmonizer`, default OFF; the
# offline `render` subcommand has no such option at all -- verified from its
# --help under a GPU, which is required even to print help). So +Harmonizer
# must come from the gRPC path.
#
# That makes render-path a second variable. This job renders the SAME clips
# both ways with the harmonizer off, so the two can be compared pixel-wise:
#
#   equal      -> the 15,815 offline frames already ARE Base; only the
#                 +Harmonizer side needs a full render.
#   different  -> both rows must be rendered through gRPC, or the ablation
#                 confounds "harmonizer" with "which renderer".
#
# One GPU, a handful of clips. Placeholders: sh-0831043508 + a manifest of clips.
apiVersion: batch/v1
kind: Job
metadata:
  {name: fid-parity-sh-0831043508, namespace: cogrob,
   labels: {app: fidelity_eval, stage: parity, shard: "sh-0831043508"}}
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 7200
  template:
    metadata: {labels: {app: fidelity_eval, stage: parity, shard: "sh-0831043508"}}
    spec:
      restartPolicy: Never
      imagePullSecrets: [{name: ngc-pull}]
      containers:
        - name: nre
          image: nvcr.io/nvidia/nre/nre-ga@sha256:6e0caa70a9148490552520c3dde9ee665c8d094ca10b814601cb8bb306567c90
          command: ["/opt/nvidia/nvidia_entrypoint.sh", "bash", "-c"]
          args:
            - |
              set -o pipefail
              cat > /tmp/clips.txt <<'EOF'
              00185dab0ba153b9s1
              0057ce5b81c35a81s1
              02b68b9cc51f506as1
              054e4984e1b55ec9s1
              20cc0fdb7e2d5c3fs1
              2575048779565f0bs1
              EOF
              ROOT=/avl-west/fidelity_eval/parity
              CORPUS=/avl-west/navsafe_5s_500
              mkdir -p "$ROOT"

              # --- serve-grpc, harmonizer OFF (the flag defaults off; passed
              # --- explicitly so the run is self-documenting) ---
              GLOB=""
              while read -r C; do
                [ -z "${C:-}" ] && continue
                GLOB="$CORPUS/$C/output_5cam/$C/artifacts/last.usdz"
              done < /tmp/clips.txt
              echo "[parity sh-0831043508] $(grep -c . /tmp/clips.txt) clip(s)"

              for C in $(grep -v '^ *$' /tmp/clips.txt); do
                USDZ=$CORPUS/$C/output_5cam/$C/artifacts/last.usdz
                [ -f "$USDZ" ] || { echo "NO_USDZ $C"; continue; }

                # 1. offline -- byte-for-byte the command the 15,815 frames came from
                OFF=$ROOT/offline/$C
                if ! ls "$OFF/camera_pcam_f0"/*.jpg >/dev/null 2>&1; then
                  mkdir -p "$OFF"
                  /app/run render --artifact-path "$USDZ" --output-dir "$OFF" \
                    --camera-id camera_pcam_f0 --image-scale 1.0 --image-format jpg \
                    --replicate-training-views \
                    --calib-source training-sensor-poses-calib \
                    --frame-naming frame-end-timestamp || echo "OFFLINE_FAIL $C"
                fi

                # 2. gRPC, harmonizer OFF
                GRP=$ROOT/grpc_off/$C
                if ! ls "$GRP/camera_pcam_f0"/*.jpg >/dev/null 2>&1; then
                  mkdir -p "$GRP"
                  /app/run serve-grpc --host 0.0.0.0 --renderer default \
                    --no-enable-harmonizer --artifact-glob "$USDZ" \
                    > /tmp/serve_$C.log 2>&1 &
                  SPID=$!
                  for _ in $(seq 1 120); do
                    kill -0 $SPID 2>/dev/null || { echo "SERVE_DIED $C"; tail -20 /tmp/serve_$C.log; break; }
                    grep -q "Available scenes" /tmp/serve_$C.log && break
                    sleep 5
                  done
                  if kill -0 $SPID 2>/dev/null; then
                    # --height 1080 to match the offline native render; the client
                    # defaults to 300 and a resized picture is not a parity test.
                    /app/run render-grpc --artifact-path "$USDZ" --output-dir "$GRP" \
                      --camera-id camera_pcam_f0 --height 1080 --image-format jpeg \
                      --host localhost --port 8080 || echo "GRPC_FAIL $C"
                    kill $SPID 2>/dev/null; wait $SPID 2>/dev/null
                  fi
                fi
                echo "COUNTS $C offline=$(ls $OFF/camera_pcam_f0 2>/dev/null|wc -l) grpc=$(find $GRP -name '*.jpg' 2>/dev/null|wc -l)"
              done
              echo "PARITY_RENDER_DONE sh-0831043508"
          env:
            - {name: NGC_API_KEY, valueFrom: {secretKeyRef: {name: ngc-api-key, key: NGC_API_KEY}}}
          resources:
            requests: {cpu: "4", memory: "32Gi", nvidia.com/gpu: "1", ephemeral-storage: 60Gi}
            limits:   {cpu: "4", memory: "32Gi", nvidia.com/gpu: "1", ephemeral-storage: 60Gi}
          volumeMounts:
            - {name: dshm, mountPath: /dev/shm}
            - {name: avl-west-vol, mountPath: /avl-west}
      volumes:
        - {name: dshm, emptyDir: {medium: Memory, sizeLimit: 16Gi}}
        - {name: avl-west-vol, persistentVolumeClaim: {claimName: avl-west-vol}}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: kubernetes.io/hostname, operator: In,
                     values: ["ry-gpu-05.sdsc.optiputer.net","ry-gpu-06.sdsc.optiputer.net",
                              "ry-gpu-07.sdsc.optiputer.net","ry-gpu-08.sdsc.optiputer.net",
                              "ry-gpu-11.sdsc.optiputer.net","ry-gpu-12.sdsc.optiputer.net"]}
      tolerations:
        - {effect: NoSchedule, key: nautilus.io/reservation, operator: Equal, value: cogrob}
        - {effect: NoSchedule, key: nautilus.io/cogrob, operator: Exists}
