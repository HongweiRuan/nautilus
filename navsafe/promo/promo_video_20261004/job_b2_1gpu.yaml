# Batch 2, index-1 tokens, on the one free GPU of ry-gpu-08: ONE_GPU=1, so the
# harmonizer is OFF and renderer + rollout share the card. 2 CPUs.
apiVersion: batch/v1
kind: Job
metadata:
  name: navsafe-promo-vis-20261004-b2-1gpu
  namespace: cogrob
  labels: &labels
    app: navsafe-promo-vis
    navsafe-batch: promo-vis-20261004-b2-1gpu
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 28800
  ttlSecondsAfterFinished: 259200
  template:
    metadata:
      labels: *labels
    spec:
      restartPolicy: Never
      imagePullSecrets:
      - name: ngc-pull
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - ry-gpu-08.sdsc.optiputer.net
      tolerations:
      - effect: NoSchedule
        key: nautilus.io/reservation
        operator: Equal
        value: cogrob
      - effect: NoSchedule
        key: nautilus.io/cogrob
        operator: Exists
      containers:
      - name: eval
        image: nvcr.io/nvidia/nre/nre-ga@sha256:6e0caa70a9148490552520c3dde9ee665c8d094ca10b814601cb8bb306567c90
        imagePullPolicy: IfNotPresent
        command:
        - /opt/nvidia/nvidia_entrypoint.sh
        - bash
        - /cfg/run_worker.sh
        env:
        - name: JOB_COMPLETION_INDEX
          value: '1'
        - name: ONE_GPU
          value: '1'
        - name: WORKERS
          value: '2'
        - name: SEED
          value: '0'
        - name: OUTROOT
          value: /avl-west/navsafe_eval/promo_video_20261004/out_b2_noharm
        - name: DATASET
          value: /avl-west/navsafe_eval/full_test
        - name: NEXUSSIM_SHA
          value: 649ddde
        - name: CELL_TIMEOUT
          value: 90m
        - name: NGC_API_KEY
          valueFrom:
            secretKeyRef:
              name: ngc-api-key
              key: NGC_API_KEY
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: HF_TOKEN
        - name: HYDRA_FULL_ERROR
          value: '1'
        - name: ACCEPT_EULA
          value: "Y"
        - name: OMNI_KIT_ACCEPT_EULA
          value: "Y"
        - name: NAVSAFE_ASSET_BANK
          value: /avl-west/navsafe_eval/asset
        - name: NAVSAFE_GAIT_BANK
          value: /avl-west/navsafe_eval/gait_bank
        resources:
          requests: &res
            cpu: '2'
            memory: 32Gi
            ephemeral-storage: 100Gi
            nvidia.com/gpu: '1'
          limits: *res
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: cfg
          mountPath: /cfg
        - name: avl-west-vol
          mountPath: /avl-west
        - name: hugsim-storage
          mountPath: /hugsim-storage
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 24Gi
      - name: cfg
        configMap:
          name: navsafe-promo-vis-20261004-b2-1gpu-cfg
      - name: avl-west-vol
        persistentVolumeClaim:
          claimName: avl-west-vol
      - name: hugsim-storage
        persistentVolumeClaim:
          claimName: horuan-hugsim-vol
