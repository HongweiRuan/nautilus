apiVersion: batch/v1
kind: Job
metadata:
  name: navsafe-table9-summary-v2-20260924
  namespace: cogrob
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: summarize
          image: robinwangucsd/metabench:latest
          command: ["python3", "/cfg/summarize_final.py"]
          resources:
            requests: { cpu: "1", memory: "2Gi", ephemeral-storage: "1Gi" }
            limits: { cpu: "1", memory: "2Gi", ephemeral-storage: "1Gi" }
          volumeMounts:
            - { name: cfg, mountPath: /cfg }
            - { name: avl-west-vol, mountPath: /avl-west }
      volumes:
        - { name: cfg, configMap: { name: navsafe-table9-summary-v2-20260924-cfg } }
        - { name: avl-west-vol, persistentVolumeClaim: { claimName: avl-west-vol } }
