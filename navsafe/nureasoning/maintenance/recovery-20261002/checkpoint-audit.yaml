            except (OSError,UnicodeError):continue
            if 'resume_weights_only' not in s:continue
            lines=s.splitlines();print('RESUME_IMPLEMENTATION_FILE',f,flush=True)
            indices=[i for i,l in enumerate(lines) if 'resume_weights_only' in l or 'ckpt_path' in l or 'trainer.fit' in l or 'resume is' in l]
            shown=set()
            for i in indices:
             for n in range(max(0,i-7),min(len(lines),i+12)):
