apiVersion: batch/v1
kind: Job
metadata:
  name: job-bosch-metric-cache
  namespace: cogrob
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 43200
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        k8s-app: job-bosch-metric-cache
    spec:
      restartPolicy: Never
      containers:
        - name: cpu-container
          image: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime
          env:
            - name: THREADS
              value: "48"
          command: ["bash", "-lc"]
          args:
            - |
              set -o pipefail
              LOG=/hugsim-storage/bosch-summer/exp/hongwei_runs/logs/metric_cache_$(date -u +%m%d_%H%M).log
              mkdir -p $(dirname $LOG)
              bash /hugsim-storage/bosch-summer/exp/hongwei_runs/build_metric_cache.sh 2>&1 | tee $LOG
          resources:
            requests:
              cpu: "48"
              memory: "192Gi"
              ephemeral-storage: "40Gi"
            limits:
              cpu: "56"
              memory: "192Gi"
              ephemeral-storage: "60Gi"
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: avl-west-vol
              mountPath: /avl-west
            - name: closed-loop-e2e
              mountPath: /closed-loop-e2e
            - name: hugsim-storage
              mountPath: /hugsim-storage
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: "64Gi"
        - name: avl-west-vol
          persistentVolumeClaim:
            claimName: avl-west-vol
        - name: closed-loop-e2e
          persistentVolumeClaim:
            claimName: closed-loop-e2e
        - name: hugsim-storage
          persistentVolumeClaim:
            claimName: horuan-hugsim-vol
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/region
                    operator: In
                    values: ["us-west"]
