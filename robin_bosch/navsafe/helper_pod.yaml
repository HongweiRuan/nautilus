apiVersion: v1
kind: Pod
metadata:
  name: horuan-robin-helper
  namespace: cogrob
spec:
  restartPolicy: Never
  containers:
  - name: helper
    image: python:3.12-slim
    command: ["sleep", "21600"]
    resources:
      requests: {cpu: "1", memory: 4Gi}
      limits: {cpu: "1", memory: 4Gi}
    volumeMounts:
    - {name: avl-west-vol, mountPath: /avl-west}
    - {name: hugsim-storage, mountPath: /hugsim-storage}
  volumes:
  - name: avl-west-vol
    persistentVolumeClaim: {claimName: avl-west-vol}
  - name: hugsim-storage
    persistentVolumeClaim: {claimName: horuan-hugsim-vol}
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - {key: topology.kubernetes.io/region, operator: In, values: [us-west]}
