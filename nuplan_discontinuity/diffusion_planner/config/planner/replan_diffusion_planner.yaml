replan_diffusion_planner:
  _target_: diffusion_planner.planner.replan_rate_wrapper.ReplanRateWrapperPlanner
  _convert_: "all"

  replan_interval_steps: 1
  output_dir: ${oc.env:REPLAN_DISCONTINUITY_DIR,/hugsim-storage/diffusion_planner_exp/discontinuity}
  sample_interval_s: null
  max_logged_overlap_s: 2.0

  base_planner:
    _target_: diffusion_planner.planner.planner.DiffusionPlanner
    _convert_: "all"

    config:
      _target_: diffusion_planner.utils.config.Config
      _convert_: "all"

      args_file: ???

      guidance_fn: null
    ckpt_path: ???

    past_trajectory_sampling:
      _target_: nuplan.planning.simulation.trajectory.trajectory_sampling.TrajectorySampling
      _convert_: "all"

      num_poses: 20
      time_horizon: 2

    future_trajectory_sampling:
      _target_: nuplan.planning.simulation.trajectory.trajectory_sampling.TrajectorySampling
      _convert_: "all"

      num_poses: 80
      time_horizon: 8

    device: cuda
