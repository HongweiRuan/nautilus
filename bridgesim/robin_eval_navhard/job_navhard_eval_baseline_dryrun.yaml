apiVersion: batch/v1
kind: Job
metadata:
  name: job-eval-navhard-ddv2-rr-${REPLAN_RATE}-ef-${EVAL_FRAMES}-${SPLIT}-dryrun
  namespace: cogrob
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        k8s-app: job-eval-navhard-ddv2-rr-${REPLAN_RATE}-ef-${EVAL_FRAMES}-${SPLIT}-dryrun
    spec:
      restartPolicy: Never
      containers:
        - name: gpu-container
          image: robinwangucsd/metabench:latest
          imagePullPolicy: Always
          command:
            - "bash"
            - "-c"
          args:
          - |
            set -x
            chmod +x /closed-loop-e2e/run_eval.sh && 
            bash /closed-loop-e2e/run_eval_dryrun.sh \
                diffusiondrivev2 \
                /closed-loop-e2e/weights/navsimv2/DiffusionDriveV2/diffusiondrivev2_sel.ckpt \
                /closed-loop-e2e/weights/navsimv2/DiffusionDriveV2/kmeans_navsim_traj_20.npy \
                /avl-west/navsim/navhard_md_logs \
                /closed-loop-e2e/navhard-100/diffusiondrivev2 \
                ${REPLAN_RATE} \
                ${EVAL_FRAMES} \
                /closed-loop-e2e/navhard_test_split/50-${SPLIT}.txt
          resources:
            requests:
              cpu: "3"
              memory: "20Gi"
              nvidia.com/gpu: "1"
              ephemeral-storage: 100Gi
            limits:
              cpu: "4"
              memory: "24Gi"
              nvidia.com/gpu: "1"
              ephemeral-storage: 100Gi
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: avl-west-vol
              mountPath: /avl-west
            - name: closed-loop-e2e
              mountPath: /closed-loop-e2e
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
        - name: avl-west-vol
          persistentVolumeClaim:
            claimName: avl-west-vol
        - name: closed-loop-e2e
          persistentVolumeClaim:
            claimName: closed-loop-e2e
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values:
                - us-west
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-GeForce-RTX-4090
                - NVIDIA-GeForce-RTX-3090
                # - NVIDIA-RTX-A5000
                # - Quadro-RTX-6000
                # - NVIDIA-TITAN-RTX 
                # - NVIDIA-A10
                # - Tesla-V130-SXM2-32GB
                # - NVIDIA-A40
                # - NVIDIA-RTX-A6000
                # - Quadro-RTX-8000
      tolerations:
      - effect: NoSchedule
        key: nautilus.io/reservation
        operator: Equal
        value: cogrob
