apiVersion: batch/v1
kind: Job
metadata:
  name: horuan-job
spec:
  template:
    spec:
      containers:
      - name: gpu-container
        image: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-devel
        command: ["/bin/bash","-c"]
        args: ["mkdir MNIST; cd MNIST;
                wget https://raw.githubusercontent.com/pytorch/examples/main/mnist/main.py;
                python main.py --save-model;
                mv mnist_cnn.pt /tutorial"]
        volumeMounts:
        - mountPath: /tutorial
          name: horuan-volume
        resources:
          limits:
            nvidia.com/gpu: "1"
            memory: "8G"
            cpu: "4"
          requests:
            nvidia.com/gpu: "1"
            memory: "8G"
            cpu: "4"
      restartPolicy: Never
      volumes:
        - name: horuan-volume
          persistentVolumeClaim:
            claimName: horuan-volume