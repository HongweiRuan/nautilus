# CPU-only probe: list /avl-west/nuplan (read-only mount), no GPU.
apiVersion: batch/v1
kind: Job
metadata:
  name: horuan-bon-aris-ls-nuplan2
  namespace: cogrob
  labels:
    app: horuan-bon-aris-ls-nuplan2
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 7200
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: horuan-bon-aris-ls-nuplan2
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              cd /avl-west/nuplan || exit 1
              echo '### nuplan-v1.1'; ls -la nuplan-v1.1
              for d in nuplan-v1.1/*/; do case "$d" in *rendered_sensor_blobs*|*processed*) continue;; esac; echo "== $d"; ls "$d" | head -20; echo "count: $(ls "$d" | wc -l)"; done
              for d in nuplan-v1.1/splits/* nuplan-v1.1/splits/*/*; do [ -d "$d" ] && echo "SPLIT $d dbs=$(ls "$d" | grep -c '[.]db$') entries=$(ls "$d" | wc -l)"; done
              echo '### sensor_blobs top'; ls nuplan-v1.1/sensor_blobs 2>/dev/null | head -5; echo "count: $(ls nuplan-v1.1/sensor_blobs 2>/dev/null | wc -l)"
              echo '### maps'; ls -laR maps | head -60
              echo '### scripts'; ls -laR scripts | head -30
              echo '### diffusion_planner'; ls nuplan-v1.1/diffusion_planner | head -5
              echo '### processed'; ls nuplan-v1.1/processed
          resources:
            requests: {cpu: "1", memory: 1Gi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - name: avl-west-vol
              mountPath: /avl-west
              readOnly: true
      volumes:
        - name: avl-west-vol
          persistentVolumeClaim:
            claimName: avl-west-vol
      # Only these 7 RTX 3090 nodes for this project. Both PVCs are rook-cephfs (west):
      # keep the us-west region constraint for I/O (both expressions must hold).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - ry-gpu-06.sdsc.optiputer.net
                      - ry-gpu-07.sdsc.optiputer.net
                      - ry-gpu-08.sdsc.optiputer.net
                      - ry-gpu-11.sdsc.optiputer.net
                      - ry-gpu-12.sdsc.optiputer.net
                      - ry-gpu-13.sdsc.optiputer.net
                      - ry-gpu-14.sdsc.optiputer.net
                  - key: topology.kubernetes.io/region
                    operator: In
                    values: ["us-west"]
      tolerations:
        - effect: NoSchedule
          key: nautilus.io/reservation
          operator: Equal
          value: cogrob
