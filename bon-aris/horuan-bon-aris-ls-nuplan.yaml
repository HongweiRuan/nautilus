# CPU-only probe: list /avl-west/nuplan (read-only mount), no GPU.
apiVersion: batch/v1
kind: Job
metadata:
  name: horuan-bon-aris-ls-nuplan
  namespace: cogrob
  labels:
    app: horuan-bon-aris-ls-nuplan
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 7200
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: horuan-bon-aris-ls-nuplan
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              cd /avl-west/nuplan || exit 1
              echo "### top"; ls -la
              echo "### depth<=4 dirs"; find . -maxdepth 4 -type d | sort | head -300
              echo "### per-dir file counts / sizes (depth<=4)"
              for d in $(find . -mindepth 1 -maxdepth 4 -type d | sort | head -200); do n=$(ls "$d" | wc -l); echo "$n $d"; done
              echo "### db counts"; for d in $(find . -maxdepth 6 -type d | sort); do c=$(ls "$d" 2>/dev/null | grep -c '\.db$'); [ "$c" -gt 0 ] && echo "$c $d"; done
              echo "### maps"; find . -maxdepth 4 -path '*maps*' | sort | head -60
              echo "### du"; du -sh ./* 2>/dev/null
          resources:
            requests: {cpu: "1", memory: 1Gi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - name: avl-west-vol
              mountPath: /avl-west
              readOnly: true
      volumes:
        - name: avl-west-vol
          persistentVolumeClaim:
            claimName: avl-west-vol
      # Only these 7 RTX 3090 nodes for this project. Both PVCs are rook-cephfs (west):
      # keep the us-west region constraint for I/O (both expressions must hold).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - ry-gpu-06.sdsc.optiputer.net
                      - ry-gpu-07.sdsc.optiputer.net
                      - ry-gpu-08.sdsc.optiputer.net
                      - ry-gpu-11.sdsc.optiputer.net
                      - ry-gpu-12.sdsc.optiputer.net
                      - ry-gpu-13.sdsc.optiputer.net
                      - ry-gpu-14.sdsc.optiputer.net
                  - key: topology.kubernetes.io/region
                    operator: In
                    values: ["us-west"]
      tolerations:
        - effect: NoSchedule
          key: nautilus.io/reservation
          operator: Equal
          value: cogrob
