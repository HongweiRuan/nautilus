# STAGE 4 (train): 3dgut_dynamic recon (5 cameras, half-res) for one navhard half.
# CephFS-relief pattern: copy the ncore store (+ aux stores) CephFS->local /tmp in
# ONE sequential read, link aux, train ENTIRELY on local disk (per-step reads are
# local, out_dir is local), then bulk-copy the finished recon back to CephFS once.
# This is what kills the multi-hour "loading store off CephFS" startup under 70+
# concurrent trains. GPU job, reserved+public 3090. Prereq: aux. Placeholders: __SCENE__
# NOTE: out_dir is local, so a preempted/killed job loses its output (no incremental
# CephFS checkpoint) — it just re-runs from scratch on resubmit.
apiVersion: batch/v1
kind: Job
metadata: { name: navhard-train-__SCENE__, namespace: cogrob, labels: { app: navhard421, stage: train, scene: "__SCENE__" } }
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 259200
  template:
    metadata: { labels: { app: navhard421, stage: train, scene: "__SCENE__" } }
    spec:
      restartPolicy: Never
      imagePullSecrets: [{ name: ngc-pull }]
      containers:
        - name: nre-train
          image: nvcr.io/nvidia/nre/nre-ga@sha256:6e0caa70a9148490552520c3dde9ee665c8d094ca10b814601cb8bb306567c90
          command: ["/opt/nvidia/nvidia_entrypoint.sh", "bash", "-c"]
          args:
            - |
              set -e
              C=__SCENE__
              SRC=/avl-west/navhard421/$C/clips/$C
              L=/tmp/clip/$C
              OUTL=/tmp/out
              DST=/avl-west/navhard421/$C/output_5cam
              test -s $SRC/pai_$C.json || { echo "no ncore store for $C"; exit 1; }
              if [ -f $DST/$C/checkpoints/last.ckpt ]; then echo "train $C exists, skip"; exit 0; fi
              echo "[train $C] copy-in store+aux CephFS->local ($(du -sh $SRC 2>/dev/null | cut -f1)) ..."
              mkdir -p $L $OUTL && cp -a $SRC/. $L/
              # REQUIRED: link aux stores to the manifest base name pai_<scene>.aux.* (local)
              ( cd "$L" && for f in $C.aux.*.zarr.itar; do [ -e "$f" ] && ln -sf "$f" "pai_$f"; done )
              ls $L/pai_$C.aux.*.zarr.itar >/dev/null 2>&1 || echo "WARN: no aux stores for $C"
              echo "[train $C] training on local disk ..."
              /app/run --config-name=configs/apps/AV/Waymo/3dgut_dynamic.yaml \
                mode=train logger=dummy dataset.path=$L/pai_$C.json out_dir=$OUTL logger.run_id="$C" \
                dataset.aux_data=True \
                dataset.camera_ids=[camera_pcam_f0,camera_pcam_l0,camera_pcam_r0,camera_pcam_l1,camera_pcam_r1] \
                dataset.train_camera_ids=[camera_pcam_f0,camera_pcam_l0,camera_pcam_r0,camera_pcam_l1,camera_pcam_r1] \
                dataset.val_camera_ids=[camera_pcam_f0,camera_pcam_l0,camera_pcam_r0,camera_pcam_l1,camera_pcam_r1] \
                dataset.lidar_ids=[lidar_top_360fov] dataset.n_train_sample_lidar_rays=0 \
                dataset.cuboid_tracks_params.track_label_sources=[GT_ANNOTATION] \
                dataset.samplers.batch_sampler.camera_pixel_sampler.subsample=2 \
                dataset.n_val_image_subsample=2 dataset.n_train_sequential_image_subsample=2 \
                model.layers.dynamic_rigids.tracks.label_classes=[NuPlanBoxDetectionLabel.VEHICLE,NuPlanBoxDetectionLabel.BICYCLE] \
                model.layers.dynamic_deformables.tracks.label_classes=[NuPlanBoxDetectionLabel.PEDESTRIAN] \
                model.layers.dynamic_rigids.initialization.name=camera-dynamic-tracks \
                +model.layers.dynamic_rigids.initialization.camera_ids=null \
                +model.layers.dynamic_rigids.initialization.step_frame=1 \
                +model.layers.dynamic_rigids.initialization.fill_with_random_points=true \
                model.layers.dynamic_deformables.initialization.name=camera-dynamic-tracks \
                +model.layers.dynamic_deformables.initialization.camera_ids=null \
                +model.layers.dynamic_deformables.initialization.step_frame=1 \
                +model.layers.dynamic_deformables.initialization.fill_with_random_points=true
              test -f $OUTL/$C/checkpoints/last.ckpt || { echo "train produced no ckpt for $C"; exit 1; }
              echo "[train $C] copy-out recon local->CephFS ($(du -sh $OUTL/$C 2>/dev/null | cut -f1)) ..."
              mkdir -p $DST && cp -a $OUTL/$C $DST/
              test -f $DST/$C/checkpoints/last.ckpt && echo "TRAIN_DONE $C"
          env:
            - { name: NGC_API_KEY, valueFrom: { secretKeyRef: { name: ngc-api-key, key: NGC_API_KEY } } }
            - { name: HYDRA_FULL_ERROR, value: "1" }
            - { name: PYTORCH_CUDA_ALLOC_CONF, value: "expandable_segments:True" }
          resources:
            requests: { cpu: "8", memory: "48Gi", nvidia.com/gpu: "1", ephemeral-storage: 100Gi }
            limits:   { cpu: "12", memory: "64Gi", nvidia.com/gpu: "1", ephemeral-storage: 100Gi }
          volumeMounts:
            - { name: dshm, mountPath: /dev/shm }
            - { name: avl-west-vol, mountPath: /avl-west }
      volumes:
        - { name: dshm, emptyDir: { medium: Memory, sizeLimit: 24Gi } }
        - { name: avl-west-vol, persistentVolumeClaim: { claimName: avl-west-vol } }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: kubernetes.io/hostname, operator: In, values: ["ry-gpu-01.sdsc.optiputer.net","ry-gpu-02.sdsc.optiputer.net","ry-gpu-03.sdsc.optiputer.net","ry-gpu-05.sdsc.optiputer.net","ry-gpu-06.sdsc.optiputer.net"] }
                  - { key: nvidia.com/gpu.product, operator: In, values: ["NVIDIA-GeForce-RTX-3090"] }
      tolerations:
        - { effect: NoSchedule, key: nautilus.io/reservation, operator: Equal, value: cogrob }
        - { effect: NoSchedule, key: nautilus.io/cogrob, operator: Exists }
